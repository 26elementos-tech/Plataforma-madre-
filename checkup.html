<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>Check-up para médicos · Elementos Financieros</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;background:#fff;color:#111;font-size:16px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 22px 48px;min-height:100vh}
main.center{display:flex;flex-direction:column;justify-content:center;text-align:center}
.brand{margin-bottom:26px}.center .brand{display:flex;justify-content:center}
.brand img{width:74px}
.label{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#6B6B6B}
h1,h2{font-family:"Cardo","Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:400;line-height:1.12;letter-spacing:-.01em}
h1{font-size:36px;margin:8px 0 14px}h2{font-size:28px;margin:8px 0 14px}
em{font-style:italic;color:#7A7A7A}
.lead{color:#444;margin-bottom:18px}
.pts{list-style:none;text-align:left;margin:6px 0 26px;border-top:1px solid #E3E3E3}
.pts li{padding:11px 0 11px 18px;border-bottom:1px solid #E3E3E3;position:relative;font-size:15px;color:#333}
.pts li:before{content:"";position:absolute;left:0;top:22px;width:8px;height:1px;background:#111}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:0;background:#111;color:#fff;font:inherit;font-weight:600;letter-spacing:.02em;margin-top:14px;text-align:center;text-decoration:none;cursor:pointer}
.btn:disabled{background:#BDBDBD}
.btn.ghost{background:#fff;color:#111;border:1px solid #111}
.link{background:none;border:0;color:#6B6B6B;font:inherit;font-size:14px;margin-top:14px;cursor:pointer;padding:6px 0}
.note{background:#F4F4F4;border-left:2px solid #111;padding:14px 16px;margin-bottom:18px;font-size:15px}
.note a{display:inline-block;margin-top:8px;color:#111;font-weight:600}
.chk{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #E3E3E3;font-size:15px;color:#333}
.chk input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:#111}
.req{font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#111;font-weight:600;margin-left:4px}
.f{display:block;font-size:13px;color:#6B6B6B;margin-bottom:14px}
.f input,textarea,#inp{display:block;width:100%;margin-top:6px;padding:14px;border:1px solid #CFCFCF;border-radius:0;font:inherit;font-size:16px;color:#111;background:#fff}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:#111}
.bad{border-color:#B3261E!important}
.err{color:#B3261E;font-size:14px;min-height:18px;margin-top:6px}
.mod{display:flex;gap:12px;align-items:flex-start;padding:16px;border:1px solid #CFCFCF;margin-bottom:10px;cursor:pointer}
.mod.on{border-color:#111;background:#F7F7F7}
.mod input{width:20px;height:20px;accent-color:#111;margin-top:2px}
.mod b{display:block;font-family:"Cardo",Georgia,serif;font-weight:400;font-size:20px}
.mod small{color:#6B6B6B;font-size:14px}
.q .top{display:flex;justify-content:space-between;align-items:center}
.q .top .link{margin:0;font-size:22px;color:#111}
.bar{height:2px;background:#EAEAEA;margin:10px 0 34px}.bar div{height:2px;background:#111;transition:width .25s}
.qt{font-size:27px;margin-bottom:12px}
.why{background:none;border:0;font:inherit;font-size:14px;color:#6B6B6B;text-decoration:underline;text-underline-offset:3px;padding:0;margin-bottom:8px;cursor:pointer}
.whyt{font-size:15px;color:#444;background:#F4F4F4;padding:12px 14px;margin:4px 0 6px}
.opts{margin-top:22px}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;border:1px solid #CFCFCF;background:#fff;font:inherit;font-size:16px;color:#111;cursor:pointer}
.opt.on{border-color:#111;background:#111;color:#fff}
.opt.ghost{text-align:center;color:#6B6B6B;margin-top:10px}
.firma{width:190px;margin:26px auto 4px}
.quien b{display:block;font-family:"Cardo",Georgia,serif;font-weight:400;font-size:19px}
.quien span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#6B6B6B}
.quien{margin-bottom:22px}
</style></head><body>

    <h2 class="qt">${esc(p.t)}</h2>
    ${p.why?`<button class="why" id="why">¿Por qué te pregunto esto?</button><p class="whyt" id="whyt" hidden>${esc(p.why)}</p>`:""}
    <div class="opts">${campo ? `<input id="inp" ${p.num?'inputmode="numeric" placeholder="Escribe un número"':p.fecha?'type="month"':'placeholder="Escribe aquí"'} value="${esc(v||"")}">
        <button class="btn" id="ok">Continuar</button><button class="opt ghost" id="skip">${p.opcional?"No sé / prefiero no decir":"No sé"}</button>`
      : p.o.map(o=>{ const lab=o[0], val=o[1]||o[0]; return `<button class="opt ${v===val && (S.labels[id]||lab)===lab?"on":""}" data-l="${esc(lab)}" data-v="${esc(val)}">${esc(lab)}</button>`; }).join("")}
    </div>
  </main>`;
  const siguiente = () => { const L2 = lista(); const j = L2.findIndex(x=>x.id===id); if(j<L2.length-1){ S.qi = L2[j+1].id; render(); } else { S.paso="final"; render(); } };
  $("back").onclick = () => { if(i>0){ S.qi = L[i-1].id; render(); } else { S.paso = MODS_URL.length ? "datos" : "modulos"; render(); } };
  if($("why")) $("why").onclick = () => { const t=$("whyt"); t.hidden=!t.hidden; };
  document.querySelectorAll(".opt[data-v]").forEach(b=>b.onclick=()=>{
    S.r[m][p.k] = b.dataset.v; S.labels[id] = b.dataset.l; guardar();
    document.querySelectorAll(".opt").forEach(x=>x.classList.toggle("on", x===b));
    setTimeout(siguiente, 220);
  });
  if(campo){
    const inp = $("inp"); inp.focus();
    $("ok").onclick = () => { const val = inp.value.trim(); if(!val){ inp.classList.add("bad"); return; } S.r[m][p.k] = p.num ? val.replace(/[^\d.]/g,"") : val; S.labels[id]=val; siguiente(); };
    $("skip").onclick = () => { S.r[m][p.k] = ""; S.labels[id] = "No sé"; siguiente(); };
    inp.onkeydown = e => { if(e.key==="Enter") $("ok").click(); };
  }
}
function final(){
  document.body.innerHTML = `<main>${marca}
    <div class="label">Último paso</div><h2>¿Qué es lo que más te <em>preocupa</em> hoy?</h2>
    <p class="lead">Opcional. Escríbelo con tus palabras; nos ayuda a enfocar tu diagnóstico.</p>
    <textarea id="pre" placeholder="ej. No sé cómo manejar el efectivo que cobro">${esc(S.preocupacion)}</textarea>
    <p class="err" id="err"></p>
    <button class="btn" id="send">Enviar mis respuestas</button>
    <button class="link" id="back">← Revisar respuestas</button>
  </main>`;
  $("pre").oninput = e => { S.preocupacion = e.target.value; guardar(); };
  $("back").onclick = () => { const L = lista(); S.qi = L.length ? L[L.length-1].id : null; S.paso = "pregunta"; render(); };
  $("send").onclick = enviar;
}
async function enviar(){
  const b = $("send"); b.disabled = true; b.textContent = "Enviando…"; $("err").textContent = "";
  const resp = {};
  S.mods.forEach(m=>{ resp[m] = {...S.r[m]}; });
  if(resp.riesgos && resp.legal){ ["socios","numPersonal"].forEach(k=>{ if(resp.legal[k]!==undefined) resp.riesgos[k] = resp.legal[k]; }); }
  resp._etiquetas = S.labels;
  const row = {nombre:S.datos.nombre.trim().slice(0,160), whatsapp:S.datos.whatsapp.trim().slice(0,40), correo:S.datos.correo.trim().slice(0,160)||null, ciudad:S.datos.ciudad.trim().slice(0,120)||null,
    especialidad:(S.labels["fiscal.especialidad"]||null), modulos:S.mods, respuestas:resp, preocupacion:(S.preocupacion||"").slice(0,2000)||null,
    consentimiento:{expreso:true, red:!!S.cons.red, aseguradoras:!!S.cons.aseg, sinPromocion:!!S.cons.noMkt, fecha:new Date().toISOString()}, aviso_version:AVISO_VERSION, origen:(qs.get("ref")||"liga").slice(0,300)};
  try{
    const r = await fetch(SB_URL+"/rest/v1/checkups_recibidos", {method:"POST", headers:{"apikey":SB_KEY, "Authorization":"Bearer "+SB_KEY, "Content-Type":"application/json", "Prefer":"return=minimal"}, body:JSON.stringify(row)});
    if(!r.ok) throw new Error("HTTP "+r.status);
    S.enviado = true; S.paso = "gracias"; guardar(); try{ localStorage.removeItem(KEY); }catch(e){} render();
  }catch(e){
    b.disabled = false; b.textContent = "Intentar de nuevo";
    $("err").innerHTML = "No se pudo enviar. Revisa tu conexión e inténtalo otra vez; tus respuestas siguen guardadas en este teléfono.";
  }
}
function gracias(){
  const nom = ((S.datos.nombre||"").trim().split(/\s+/).find(w=>!/^(dr|dra|lic|ing|mtro|mtra)\.?$/i.test(w)))||"";
  document.body.innerHTML = `<main class="center">${marca}
    <div class="label">Listo</div>
    <h1>Gracias${nom?`, ${esc(nom)}`:""}</h1>
    <p class="lead">Recibimos tus respuestas. Voy a revisarlas personalmente y te contactaré por WhatsApp para entregarte tu diagnóstico.</p>
    <img class="firma" src="${FIRMA}" alt="">
    <div class="quien"><b>Saúl Cruz Flores</b><span>Fundador y Director General</span></div>
    <a class="btn ghost" href="https://wa.me/525580764197" target="_blank" rel="noopener">Escribirme por WhatsApp</a>
  </main>`;
}
render();

</script></body></html>
