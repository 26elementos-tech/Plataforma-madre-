<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Check-up del médico · Revisión | Elementos Financieros</title>
<style>
:root{--navy:#111111;--navy2:#222222;--gold:#8C8C8C;--gold2:#BDBDBD;--ink:#111111;--soft:#6B6B6B;--bg:#FFFFFF;--line:#E2E2E2}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
.top{background:var(--navy);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 16px}
.brand{font-size:11px;letter-spacing:.14em;color:var(--gold2)}.top h1{font-family:"Cardo",Georgia,serif;font-weight:400;font-size:22px;margin:6px 0 2px}.sub{font-size:13px;color:#C7D2DC}
.bar{height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin-top:12px}.bar div{height:4px;background:var(--gold);border-radius:2px;transition:width .2s}
main{max-width:680px;margin:0 auto;padding:16px 14px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.intro p{margin:0 0 10px}.intro ol{padding-left:20px;margin:0 0 10px}
label{display:block;font-size:14px;color:var(--soft);margin-bottom:10px}
input,textarea{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;color:var(--ink);background:#fff}
textarea{min-height:70px;resize:vertical}input.err{border-color:#B3261E}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:0;font:inherit;font-weight:600;margin:8px 0;cursor:pointer}
.btn.primary{background:var(--navy);color:#fff}.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}.btn:disabled{opacity:.6}
.nav{display:flex;gap:10px}.nav .btn{flex:1}.nav .btn.primary{flex:2}
.muted{color:var(--soft);font-size:14px}.center{text-align:center}
.qt{font-weight:600;margin-bottom:8px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
.opt.on{border-color:var(--navy);background:#F2F2F2;font-weight:600}.dot{width:10px;height:10px;border-radius:50%;flex:none}
.inp{margin:0 0 6px}
.rev{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rev-l{font-size:12px;color:var(--soft);width:100%}
.pill{display:inline-block;padding:6px 11px;border-radius:999px;font-size:13px;border:1px solid var(--line);cursor:pointer;user-select:none;background:#fff}
.pill.si.on{background:#2E7D4F;border-color:#2E7D4F;color:#fff}.pill.quitar.on{background:#B3261E;border-color:#B3261E;color:#fff}.pill.ajustar.on{background:#B8860B;border-color:#B8860B;color:#fff}
.intro .pill{cursor:default}.intro .pill.si{color:#2E7D4F}.intro .pill.quitar{color:#B3261E}.intro .pill.ajustar{color:#B8860B}
.rev-c{width:100%;min-height:56px;margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.kl{font-size:12px;color:var(--soft)}.kv{font-weight:700;margin-top:4px;font-size:14px}
h2{font-family:Georgia,serif;font-weight:400;font-size:19px;margin:0 0 8px;color:var(--navy)}h3{font-size:14px;margin:12px 0 4px}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.li{font-size:14px;padding:3px 0}
</style>

const finN = v => {
  if(v===null||v===undefined||v==="") return null;
  let t = String(v).toLowerCase().replace(/,/g,"").trim();
  const mult = /\bmill(ó|o)n|\bmdp\b/.test(t) ? 1e6 : (/\bmil\b|\bk\b/.test(t) ? 1000 : 1);
  const nums = (t.match(/\d+(\.\d+)?/g)||[]).map(Number);
  if(!nums.length) return null;
  // Un rango ("80000 a 100000", "80-100 mil") se toma como su punto medio
  const n = (nums.length>=2 && /\d\s*(a|-|–|y|al)\s*\$?\d/.test(t)) ? (nums[0]+nums[1])/2 : nums[0];
  const r = n*mult; return isFinite(r) ? r : null;
};

function finPdfBase(titulo, sub){
  const {jsPDF} = window.jspdf; const doc = new jsPDF({unit:"pt", format:"letter"});
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight(), margin = 48, maxW = pageW - margin*2;
  const ctx = {doc, pageW, pageH, margin, maxW, y:margin, NAVY:[17,17,17], INK:[17,17,17], SOFT:[90,90,90], RED:[179,38,30], GOLD:[184,134,11], GREEN:[46,125,79]};
  ctx.hex = h=>{ const n=parseInt(h.replace("#",""),16); return [(n>>16)&255,(n>>8)&255,n&255]; };
  ctx.checkBreak = need=>{ if(ctx.y+need > pageH-margin){ doc.addPage(); ctx.y=margin; } };
  ctx.body = (t,o)=>{ o=o||{}; doc.setFont("helvetica",o.bold?"bold":"normal"); doc.setFontSize(o.size||11); doc.setTextColor(...(o.color||ctx.INK));
    doc.splitTextToSize(String(t||""), maxW-(o.indent||0)).forEach(l=>{ ctx.checkBreak(o.lh||15); doc.text(l, margin+(o.indent||0), ctx.y); ctx.y+=o.lh||15; }); };
  ctx.heading = t=>{ ctx.checkBreak(48); ctx.y+=6; doc.setFillColor(...ctx.NAVY); doc.roundedRect(margin, ctx.y-14, maxW, 24, 5, 5, "F"); doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(255,255,255); doc.text(t, margin+12, ctx.y+2); ctx.y+=24; };
  ctx.header = (t, cliente)=>{ doc.setFillColor(...ctx.NAVY); doc.rect(0,0,pageW,110,"F"); try{ doc.addImage(LOGO_MARK_B64,"PNG",pageW-margin-40,14,44,44); }catch(e){}
    doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.setTextColor(255,255,255); doc.text(t, margin, 52);
    doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(220,220,220); doc.text(cliente, margin, 74);
    doc.setFontSize(10); doc.setTextColor(200,200,200); doc.text("Elaborado por: Saúl Cruz Flores | Elementos Financieros", margin, 92); ctx.y = 138; };
  ctx.kpis = (items)=>{ const cw=(maxW-20)/3; let col=0; ctx.checkBreak(84);
    items.forEach(([t,v,s,c],i)=>{ if(col===3){ col=0; ctx.y+=84; ctx.checkBreak(84); } const x=margin+col*(cw+10);
      doc.setFillColor(245,245,245); doc.roundedRect(x, ctx.y, cw, 74, 6, 6, "F");
      doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...ctx.SOFT); doc.splitTextToSize(t.toUpperCase(), cw-20).slice(0,2).forEach((l,j)=>doc.text(l, x+10, ctx.y+15+j*10));
      doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.setTextColor(...(c||ctx.NAVY)); doc.text(v, x+10, ctx.y+48);
      if(s){ doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...ctx.INK); doc.text(doc.splitTextToSize(s, cw-20)[0], x+10, ctx.y+64); } col++; });
    ctx.y += 92; };
  ctx.row = (a,b,bold)=>{ ctx.checkBreak(18); doc.setFont("helvetica",bold?"bold":"normal"); doc.setFontSize(10.5); doc.setTextColor(...ctx.INK);
    doc.text(doc.splitTextToSize(a, maxW-150)[0], margin, ctx.y); doc.text(b, pageW-margin, ctx.y, {align:"right"}); ctx.y+=6; doc.setDrawColor(232,232,228); doc.line(margin, ctx.y, pageW-margin, ctx.y); ctx.y+=12; };
  ctx.save = async (fileName)=>{ const blob = doc.output("blob");
    try{ const file = new File([blob], fileName, {type:"application/pdf"}); if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:fileName}); return; } }catch(e){}
    const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href=url; a.download=fileName; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 30000); };
  return ctx;
}
function drawPortadaPdf(doc, {titulo, cliente, detalle, subtitulo, detalle2}){
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
  const NAVY=[17,17,17], GOLD=[150,150,150], SOFT=[107,107,107];
  doc.setFillColor(255,255,255); doc.rect(0,0,pageW,pageH,"F");
  const logoW = 210, logoH = logoW*995/800;
  try{ doc.addImage(LOGO_FULL_B64, "PNG", (pageW-logoW)/2, 96, logoW, logoH); }
  catch(err){ console.warn("No se pudo dibujar el logo de portada:", err); }
  let y = 96 + logoH + 52;
  doc.setDrawColor(...GOLD); doc.setLineWidth(0.8); doc.line(pageW/2-40, y, pageW/2+40, y); doc.setLineWidth(1);
  y += 38;
  doc.setFont("helvetica","bold"); doc.setFontSize(21); doc.setTextColor(...NAVY);
  doc.splitTextToSize(titulo||"", pageW-140).forEach(l=>{ doc.text(l, pageW/2, y, {align:"center"}); y+=26; });
  if(subtitulo){ doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(...SOFT); doc.text(subtitulo, pageW/2, y, {align:"center"}); y+=20; }
  y += 14;
  doc.setFont("helvetica","normal"); doc.setFontSize(15); doc.setTextColor(17,17,17);
  doc.splitTextToSize(cliente||"(sin nombre)", pageW-140).forEach(l=>{ doc.text(l, pageW/2, y, {align:"center"}); y+=20; });
  if(detalle){ doc.setFontSize(10.5); doc.setTextColor(...SOFT); doc.text(detalle, pageW/2, y+4, {align:"center"}); y+=18; }
  if(detalle2){ doc.setFontSize(10.5); doc.setTextColor(...SOFT); doc.splitTextToSize(detalle2, pageW-140).forEach(l=>{ doc.text(l, pageW/2, y+4, {align:"center"}); y+=14; }); }
  doc.setFillColor(...NAVY); doc.rect(0, pageH-64, pageW, 64, "F");
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(200,200,200);
  doc.text("Elaborado por: Saúl Cruz Flores | Elementos Financieros", pageW/2, pageH-38, {align:"center"});
  doc.setFontSize(8); doc.setTextColor(170,170,170);
  doc.text("Documento confidencial, preparado para uso exclusivo del cliente.", pageW/2, pageH-24, {align:"center"});
  doc.addPage();
}

    {k:"rcFamiliar", t:"RC familiar o privada (daños que él o su familia causen a terceros fuera del trabajo)", o:[["Tiene","v"],["No tiene","a"],["No sabe","a"]]},
    {k:"polizasNombre", t:"Cada póliza está a nombre de quien es dueño del bien o de la actividad (clínica o médico)", o:[["Sí","v"],["No","a"],["No sabe","a"]]},
    {k:"revisionAnual", t:"Revisa sus seguros cada año con un asesor", o:[["Sí","v"],["No","a"]]},
  ]},
];
const RIE_DOCS = [
  {k:"polizas", t:"Carátulas y condiciones generales de las pólizas vigentes"},
  {k:"recibos", t:"Recibos de pago de las primas"},
  {k:"siniestros", t:"Reclamaciones o siniestros previos (si hay)", si:d=>d.rcSiniestros==="Sí"},
];
const RIE_SEGUROS = [
  {k:"rc", t:"RC profesional médica"}, {k:"rcEstab", t:"RC general del establecimiento"},
  {k:"danos", t:"Incendio y daños"}, {k:"equipoElec", t:"Equipo electrónico y médico"}, {k:"robo", t:"Robo y asalto"},
  {k:"interrupcion", t:"Interrupción del negocio"}, {k:"personaClave", t:"Persona clave"}, {k:"intersocios", t:"Intersocios", si:RIE_SOCIOS},
  {k:"ciber", t:"Ciberseguro"}, {k:"fidelidad", t:"Fidelidad de empleados", si:RIE_EMPLEADOS},
  {k:"gmmColectivo", t:"GMM colectivo del equipo", si:RIE_EMPLEADOS}, {k:"vidaGrupo", t:"Vida de grupo del equipo", si:RIE_EMPLEADOS},
  {k:"autosClinica", t:"Autos de la clínica"}, {k:"casa", t:"Casa habitación"}, {k:"autosPersonales", t:"Autos personales"}, {k:"rcFamiliar", t:"RC familiar"},
];
function rieExtras(d){
  const ex = [];
  if(d.rc==="Tiene" && d.rcVigencia && d.rcVigencia < new Date().toISOString().slice(0,10)) ex.push({grupo:"Responsabilidad civil", t:"La póliza de RC profesional está vencida", nivel:"r"});
  if(RIE_SOCIOS(d) && d.intersocios!=="Tiene" && d.compraventaSocios && d.compraventaSocios!=="Sí, con fondeo (seguro)") ex.push({grupo:"Continuidad del negocio", t:"Socios sin acuerdo de compraventa fondeado por seguro intersocios", nivel:"r"});
  return ex;
}
/* ========================= Check-up del médico · versión de revisión =========================
   Página independiente: no se conecta a la Plataforma Madre ni guarda nada en línea.
   Lo capturado vive solo en este navegador (para no perderlo si se cierra) y sale en el PDF. */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BLOQUES = [
  {id:"fiscal", nombre:"Fiscal", icon:"🧾", grupos:[...FIS_GRUPOS, FIS_PERFIL], docs:FIS_DOCS, sinGlobal:["contador","perfil2027"]},
  {id:"legal", nombre:"Legal", icon:"⚖️", grupos:LEG_GRUPOS.filter(g=>g.id!=="seguros"), docs:LEG_DOCS.filter(x=>x.k!=="polizas"), sinGlobal:[]},
  {id:"riesgos", nombre:"Riesgos y seguros", icon:"🛡️", grupos:RIE_GRUPOS, docs:RIE_DOCS, sinGlobal:[]},
];
const PASOS = [];
BLOQUES.forEach(b=>{ b.grupos.forEach(g=>PASOS.push({b, g})); PASOS.push({b, docs:true}); });
const COLOR = {v:"#2E7D4F", a:"#B8860B", r:"#B3261E", n:"#8B96A0", x:"#C9CDD2"};
const LABEL = {v:"En orden", a:"Atención", r:"Riesgo", n:"Informativo", x:"Sin dato"};
const VEREDICTO = {si:"Vale la pena", quitar:"Quitar", ajustar:"Ajustar"};
const KEY = "checkup-medico-revision-v1";
const hoyLocal = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
let S = cargar();
function nuevo(){ return {meta:{revisor:"", despacho:"", caso:"", fecha:hoyLocal()}, d:{}, rev:{}, falta:{}, comentarioFinal:"", paso:-1}; }
function cargar(){ try{ const x = JSON.parse(localStorage.getItem(KEY)||"null"); if(x && x.d) return x; }catch(e){} return nuevo(); }
function guardar(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $ = id => document.getElementById(id);
const visible = p => !p.si || p.si(S.d);
const evaluable = p => !p.num && !p.txt && !p.sup && visible(p);

/* ------------------------- Cálculo ------------------------- */
function peor(nv){ nv = nv.filter(n=>n!=="n"); if(!nv.length) return "n"; return nv.includes("r") ? "r" : nv.includes("a") ? "a" : nv.every(n=>n==="x") ? "x" : nv.includes("x") ? "a" : "v"; }
function calcular(){
  return BLOQUES.map(b=>{
    const grupos = b.grupos.map(g=>{
      const items = g.preguntas.filter(evaluable).map(p=>{ const op = (p.o||[]).find(o=>o[0]===S.d[p.k]); return {p, resp:S.d[p.k]||"", nivel: op ? op[1] : "x"}; });
      return {g, items, nivel: peor(items.map(i=>i.nivel))};
    });
    const extras = b.id==="riesgos" ? rieExtras(S.d) : [];
    const global = peor(grupos.filter(x=>!b.sinGlobal.includes(x.g.id)).map(x=>x.nivel).concat(extras.map(e=>e.nivel)));
    const lista = n => grupos.flatMap(x=>x.items.filter(i=>i.nivel===n).map(i=>({grupo:x.g.nombre, t:i.p.t, resp:i.resp}))).concat(extras.filter(e=>e.nivel===n).map(e=>({grupo:e.grupo, t:e.t, resp:""})));
    return {b, grupos, global, riesgos:lista("r"), atencion:lista("a")};
  });
}
function todasLasPreguntas(){
  const out = [];
  BLOQUES.forEach(b=>{
    b.grupos.forEach(g=>g.preguntas.filter(p=>!p.sup).forEach(p=>out.push({key:b.id+"."+p.k, bloque:b.nombre, grupo:g.nombre, t:p.t, aplica:visible(p)})));
    b.docs.forEach(dd=>out.push({key:b.id+".doc."+dd.k, bloque:b.nombre, grupo:"Documentos que se piden", t:dd.t, aplica:!dd.si || dd.si(S.d)}));
  });
  return out;
}

/* ------------------------- Pantallas ------------------------- */
function render(){ guardar(); if(S.paso < 0) return inicio(); if(S.paso >= PASOS.length) return resultado(); paso(); }
function topbar(titulo, sub){
  const pct = S.paso<0 ? 0 : Math.min(100, Math.round(100*(S.paso+1)/(PASOS.length+1)));
  return `<header class="top"><div class="brand">ELEMENTOS FINANCIEROS · CHECK-UP DEL MÉDICO</div><h1>${esc(titulo)}</h1>${sub?`<div class="sub">${esc(sub)}</div>`:""}
    <div class="bar"><div style="width:${pct}%"></div></div></header>`;
}
function inicio(){
  const m = S.meta;
  document.body.innerHTML = topbar("Fiscal, legal y riesgos", "Versión de revisión para especialista") + `
  <main>
    <div class="card intro">
      <p><b>Gracias por revisar este check-up.</b> Es la versión que aplicamos a médicos para tener su panorama fiscal, legal y de seguros antes de sentarse con su especialista.</p>
      <p>Le pedimos dos cosas en cada pregunta:</p>
      <ol><li><b>Respóndala</b> como lo haría un médico (un caso real o uno típico).</li>
      <li><b>Califíquela:</b> <span class="pill si">Vale la pena</span> <span class="pill quitar">Quitar</span> <span class="pill ajustar">Ajustar</span>. Si elige quitar o ajustar, díganos por qué o cómo la redactaría.</li></ol>
      <p>Al final de cada sección puede sugerir preguntas que falten. Al terminar se genera un PDF con el diagnóstico y su revisión, para que nos lo comparta.</p>
      <p class="muted">Nada se guarda en internet: lo capturado se queda solo en este dispositivo hasta que genere el PDF.</p>
    </div>
    <div class="card">
      <label>Su nombre<input id="m-revisor" value="${esc(m.revisor)}" placeholder="Lic. …"></label>
      <label>Despacho o firma (opcional)<input id="m-despacho" value="${esc(m.despacho)}"></label>
      <label>Caso que va a responder<input id="m-caso" value="${esc(m.caso)}" placeholder="ej. Médico estético, persona física, CDMX"></label>
    </div>
    <button class="btn primary" id="go">${Object.keys(S.d).length || Object.keys(S.rev).length ? "Continuar donde se quedó →" : "Empezar →"}</button>
    ${Object.keys(S.d).length || Object.keys(S.rev).length ? `<button class="btn ghost" id="reset">Empezar de nuevo (borra lo capturado)</button>` : ""}
  </main>`;
  const leer = () => { m.revisor=$("m-revisor").value.trim(); m.despacho=$("m-despacho").value.trim(); m.caso=$("m-caso").value.trim(); guardar(); };
  ["m-revisor","m-despacho","m-caso"].forEach(id=>$(id).oninput=leer);
  $("go").onclick = () => { leer(); if(!m.revisor){ $("m-revisor").focus(); $("m-revisor").classList.add("err"); return; } S.paso = S.pasoGuardado>0 ? S.pasoGuardado : 0; render(); scrollTo(0,0); };
  if($("reset")) $("reset").onclick = () => { if(confirm("¿Borrar todo lo capturado y empezar de nuevo?")){ S = nuevo(); render(); } };
}
function revisionHtml(key){
  const r = S.rev[key] || {};
  return `<div class="rev" data-key="${esc(key)}"><span class="rev-l">¿Vale la pena?</span>
    ${Object.entries(VEREDICTO).map(([k,l])=>`<span class="pill ${k} ${r.v===k?"on":""}" data-v="${k}">${l}</span>`).join("")}
    <textarea class="rev-c" placeholder="${r.v==="quitar"?"¿Por qué quitarla?":"¿Cómo la redactaría o qué le cambiaría?"}" style="display:${r.v&&r.v!=="si"?"block":"none"}">${esc(r.c||"")}</textarea></div>`;
}
function ligarRevision(root){
  root.querySelectorAll(".rev").forEach(box=>{
    const key = box.dataset.key, ta = box.querySelector(".rev-c");
    box.querySelectorAll(".pill").forEach(pl=>pl.onclick=()=>{
      const r = S.rev[key] = S.rev[key] || {}; r.v = r.v===pl.dataset.v ? "" : pl.dataset.v;
      box.querySelectorAll(".pill").forEach(x=>x.classList.toggle("on", x.dataset.v===r.v));
      ta.style.display = r.v && r.v!=="si" ? "block" : "none"; ta.placeholder = r.v==="quitar" ? "¿Por qué quitarla?" : "¿Cómo la redactaría o qué le cambiaría?";
      guardar();
    });
    ta.oninput = () => { (S.rev[key] = S.rev[key] || {}).c = ta.value; guardar(); };
  });
}
function paso(){
  const {b, g, docs} = PASOS[S.paso];
  const n = S.paso+1, tot = PASOS.length;
  document.body.innerHTML = topbar(docs ? "Documentos que se le piden" : g.nombre, `${b.icon} ${b.nombre} · paso ${n} de ${tot}`) + `
    <main><p class="muted">${docs ? "Esta es la lista de documentos que se le pide al médico para el especialista. Califique si cada uno vale la pena pedirlo." : "Responda como lo haría un médico y califique cada pregunta. Las que dependen de otra respuesta aparecen solas."}</p>
    <div id="form"></div>
    <div class="card"><label>¿Falta alguna pregunta en esta sección?<textarea id="falta" placeholder="Escriba la pregunta que agregaría y por qué">${esc(S.falta[(docs?"docs-":"")+b.id+"."+(docs?"":g.id)]||"")}</textarea></label></div>
    <div class="nav">${S.paso>0?`<button class="btn ghost" id="prev">← Anterior</button>`:`<button class="btn ghost" id="home">← Inicio</button>`}<button class="btn primary" id="next">${S.paso===tot-1?"Ver diagnóstico →":"Siguiente →"}</button></div></main>`;
  const form = $("form");
  const pintar = () => {
    form.innerHTML = "";
    if(docs){
      b.docs.forEach(dd=>{ if(dd.si && !dd.si(S.d)) return;
        const c = document.createElement("div"); c.className="card q"; c.innerHTML = `<div class="qt">${esc(dd.t)}</div>${revisionHtml(b.id+".doc."+dd.k)}`; form.appendChild(c); });
    } else {
      g.preguntas.filter(p=>!p.sup && visible(p)).forEach(p=>{
        const c = document.createElement("div"); c.className="card q"; const v = S.d[p.k];
        let campo;
        if(p.num || p.txt) campo = `<input class="inp" data-k="${p.k}" value="${esc(v||"")}" ${p.num?'inputmode="decimal" placeholder="ej. 500000"':'placeholder="Escriba aquí"'}>`;
        else campo = p.o.map(([val,nv])=>`<div class="opt ${v===val?"on":""}" data-k="${p.k}" data-val="${esc(val)}"><span class="dot" style="background:${COLOR[nv]}"></span><span>${esc(val)}</span></div>`).join("");
        c.innerHTML = `<div class="qt">${esc(p.t)}</div>${campo}${revisionHtml(b.id+"."+p.k)}`;
        form.appendChild(c);
      });
      form.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
        const k=o.dataset.k; S.d[k] = S.d[k]===o.dataset.val ? "" : o.dataset.val; guardar();
        const y = scrollY; pintar(); scrollTo(0,y);
      });
      form.querySelectorAll(".inp").forEach(i=>i.oninput=()=>{ S.d[i.dataset.k]=i.value; guardar(); });
      form.querySelectorAll(".inp").forEach(i=>i.onchange=()=>{ const y=scrollY; pintar(); scrollTo(0,y); });
    }
    ligarRevision(form);
  };
  pintar();
  $("falta").oninput = e => { S.falta[(docs?"docs-":"")+b.id+"."+(docs?"":g.id)] = e.target.value; guardar(); };
  const mover = d => { S.paso += d; S.pasoGuardado = S.paso; render(); scrollTo(0,0); };
  if($("prev")) $("prev").onclick = () => mover(-1);
  if($("home")) $("home").onclick = () => { S.paso=-1; render(); };
  $("next").onclick = () => mover(1);
}
function resumenRevision(){
  const qs = todasLasPreguntas(); const c = {si:0, quitar:0, ajustar:0, sin:0};
  qs.forEach(q=>{ const v = (S.rev[q.key]||{}).v; if(v) c[v]++; else if(q.aplica) c.sin++; });
  return {qs, c};
}
function resultado(){
  const R = calcular(); const {c} = resumenRevision();
  document.body.innerHTML = topbar("Diagnóstico", S.meta.caso || "Caso de revisión") + `<main>
    <div class="kpis">${R.map(x=>`<div class="kpi"><div class="kl">${x.b.icon} ${esc(x.b.nombre)}</div><div class="kv" style="color:${COLOR[x.global]}">● ${LABEL[x.global]}</div></div>`).join("")}</div>
    ${R.map(x=>`<div class="card"><h2>${x.b.icon} ${esc(x.b.nombre)}</h2>
      ${x.grupos.map(gr=>`<div class="row"><span>${esc(gr.g.nombre)}</span><b style="color:${COLOR[gr.nivel]}">● ${LABEL[gr.nivel]}</b></div>`).join("")}
      ${x.riesgos.length?`<h3 style="color:${COLOR.r}">En riesgo</h3>${x.riesgos.map(i=>`<div class="li">${esc(i.t)}${i.resp?` — <i>${esc(i.resp)}</i>`:""}</div>`).join("")}`:""}
      ${x.atencion.length?`<h3 style="color:${COLOR.a}">Requiere atención</h3>${x.atencion.map(i=>`<div class="li">${esc(i.t)}${i.resp?` — <i>${esc(i.resp)}</i>`:""}</div>`).join("")}`:""}
    </div>`).join("")}
    <div class="card"><h2>Su revisión</h2>
      <div class="row"><span>Vale la pena</span><b>${c.si}</b></div><div class="row"><span>Quitar</span><b>${c.quitar}</b></div>
      <div class="row"><span>Ajustar</span><b>${c.ajustar}</b></div><div class="row"><span>Sin calificar</span><b>${c.sin}</b></div>
      <label style="margin-top:10px">Comentario general (opcional)<textarea id="cf" placeholder="¿Qué le cambiaría al check-up en general? ¿Le sirve este panorama para sentarse con el médico?">${esc(S.comentarioFinal)}</textarea></label>
    </div>
    <button class="btn primary" id="pdf">Descargar PDF</button>
    <div class="nav"><button class="btn ghost" id="back">← Regresar a las preguntas</button></div>
    <p class="muted center">Respuestas declarativas. El semáforo es una referencia para la conversación con el especialista; no es una opinión legal ni fiscal.</p>
  </main>`;
  $("cf").oninput = e => { S.comentarioFinal = e.target.value; guardar(); };
  $("back").onclick = () => { S.paso = PASOS.length-1; render(); scrollTo(0,0); };
  $("pdf").onclick = async () => { const bt=$("pdf"); bt.disabled=true; bt.textContent="Generando…"; try{ await pdf(R); } catch(e){ alert("No se pudo generar el PDF: "+e.message); } bt.disabled=false; bt.textContent="Descargar PDF"; };
}

/* ------------------------- PDF ------------------------- */
async function esperarJsPdf(){ for(let i=0;i<60 && !window.jspdf;i++) await new Promise(r=>setTimeout(r,250)); if(!window.jspdf) throw new Error("el generador de PDF no cargó; revise su conexión y vuelva a intentar"); }
async function pdf(R){
  await esperarJsPdf();
  const c = finPdfBase(); const {doc} = c; const m = S.meta;
  const caso = m.caso || "Caso de revisión";
  drawPortadaPdf(doc, {titulo:"Check-up fiscal, legal y de riesgos del médico", subtitulo:"Versión de revisión para especialista", cliente:caso, detalle:`Revisó: ${m.revisor}${m.despacho?` · ${m.despacho}`:""}`, detalle2:`Fecha: ${m.fecha}`});
  c.header("Diagnóstico", caso);
  c.kpis(R.map(x=>[x.b.nombre, LABEL[x.global], `${x.riesgos.length} en riesgo · ${x.atencion.length} en atención`, c.hex(COLOR[x.global])]));
  c.body("Respuestas declarativas, capturadas por el especialista para revisar el check-up. El semáforo es una referencia para la conversación con el médico: no es una opinión legal ni fiscal, y el de Riesgos y seguros es un criterio de prudencia, no una obligación legal.", {size:9, color:c.SOFT, lh:12});
  c.y += 6;
  R.forEach(x=>{
    c.heading(`${x.b.nombre}`);
    x.grupos.forEach(gr=>c.row(gr.g.nombre, LABEL[gr.nivel]));
    if(x.riesgos.length){ c.y+=4; c.body("En riesgo", {bold:true, color:c.RED}); x.riesgos.forEach(i=>c.body(`• ${i.t}${i.resp?` — ${i.resp}`:""}`, {size:10, indent:8, lh:13})); }
    if(x.atencion.length){ c.y+=4; c.body("Requiere atención", {bold:true, color:c.GOLD}); x.atencion.forEach(i=>c.body(`• ${i.t}${i.resp?` — ${i.resp}`:""}`, {size:10, indent:8, lh:13})); }
    if(x.b.id==="riesgos"){
      c.y+=6; c.body("Mapa de seguros", {bold:true, color:c.NAVY});
      RIE_SEGUROS.filter(s=>!s.si || s.si(S.d)).forEach(s=>c.row(s.t, S.d[s.k]||"Sin dato"));
      const datos = [["Aseguradora del RC","rcAseguradora"],["Suma asegurada del RC","rcSuma"],["Vigencia del RC","rcVigencia"],["Asegurado desde","rcRetro"],["Valor de equipos y mobiliario","valorEquipos"]].filter(([,k])=>S.d[k]);
      if(datos.length){ c.y+=4; datos.forEach(([l,k])=>c.row(l, k==="rcSuma"||k==="valorEquipos" ? finM(finN(S.d[k])) : String(S.d[k]))); }
    }
    c.y += 8;
  });
  // Revisión
  const {qs, c:cnt} = resumenRevision();
  doc.addPage(); c.y = c.margin;
  c.heading("Revisión de las preguntas");
  c.kpis([["Vale la pena", String(cnt.si), "", c.GREEN], ["Quitar", String(cnt.quitar), "", c.RED], ["Ajustar", String(cnt.ajustar), "", c.GOLD]]);
  if(cnt.sin) c.body(`${cnt.sin} sin calificar.`, {size:9.5, color:c.SOFT});
  const conCom = v => qs.filter(q=>(S.rev[q.key]||{}).v===v);
  [["quitar","Preguntas que propone quitar", c.RED], ["ajustar","Preguntas que propone ajustar", c.GOLD]].forEach(([v,tit,col])=>{
    const l = conCom(v); if(!l.length) return;
    c.y+=6; c.body(tit, {bold:true, color:col});
    l.forEach(q=>{ c.body(`• [${q.bloque} · ${q.grupo}] ${q.t}`, {size:10, indent:8, lh:13}); const cm=(S.rev[q.key].c||"").trim(); if(cm) c.body(`Comentario: ${cm}`, {size:9.5, indent:20, lh:12, color:c.SOFT}); });
  });
  const faltas = Object.entries(S.falta).filter(([,t])=>t && t.trim());
  if(faltas.length){
    c.y+=6; c.body("Preguntas que sugiere agregar", {bold:true, color:c.NAVY});
    faltas.forEach(([k,t])=>{ const docs = k.startsWith("docs-"); const [bid,gid] = k.replace("docs-","").split("."); const b = BLOQUES.find(x=>x.id===bid); const g = b && b.grupos.find(x=>x.id===gid);
      c.body(`• [${b?b.nombre:bid} · ${docs?"Documentos":(g?g.nombre:gid)}] ${t.trim()}`, {size:10, indent:8, lh:13}); });
  }
  if((S.comentarioFinal||"").trim()){ c.y+=6; c.body("Comentario general", {bold:true, color:c.NAVY}); c.body(S.comentarioFinal.trim(), {size:10, lh:13}); }
  c.y+=10; c.heading("Detalle: cada pregunta y su calificación");
  let ultimo = "";
  qs.forEach(q=>{
    const cab = `${q.bloque} · ${q.grupo}`; if(cab!==ultimo){ c.y+=4; c.body(cab, {bold:true, size:10, color:c.NAVY}); ultimo = cab; }
    const v = (S.rev[q.key]||{}).v; c.row(q.t, v ? VEREDICTO[v] : (q.aplica ? "Sin calificar" : "No apareció en este caso"));
  });
  c.y+=8; c.body("Documento de trabajo preparado por Elementos Financieros para validar su check-up con especialistas. Confidencial.", {size:8.5, color:c.SOFT, lh:11});
  const slug = (m.revisor||"especialista").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30);
  await c.save(`REVISION-CHECKUP-MEDICO-${slug}-${m.fecha}.pdf`);
}
render();

</script>
</body></html>
