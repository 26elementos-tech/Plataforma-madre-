      <h1 style="font-size:19px">${DASH_VER_ARCHIVADOS ? "Archivados" : "Expedientes"}</h1>
      <p class="sub">${esc(state.profile?.nombre_completo||"")} · <span class="pill">${esc(state.profile?.rol||"")}</span></p>
    </div>
    <div class="content" id="dash-content">
      <div class="center-screen"><div class="spinner"></div></div>
    </div>
  `;
  document.getElementById("btn-logout").onclick = handleLogout;

  const { data: todos, error, fromCache } = await cachedRead("dashboard:expedientes", ()=>sb.from("expedientes").select("*").order("updated_at", {ascending:false}));
  const c = document.getElementById("dash-content");
  if(error){ c.innerHTML = `<div class="err">No se pudieron cargar los expedientes: ${esc(error.message)}</div>`; return; }
  const activos = (todos||[]).filter(e=>!e.archivado_at);
  const archivados = (todos||[]).filter(e=>e.archivado_at);
  const base = DASH_VER_ARCHIVADOS ? archivados : activos;

  c.innerHTML = `
    ${DASH_VER_ARCHIVADOS ? "" : `<button class="action-btn" id="btn-new-exp"><span>+ Nuevo expediente</span><span>→</span></button>`}
    ${base.length > 3 ? `<input type="search" id="dash-search" placeholder="Buscar expediente…" value="${esc(DASH_BUSQUEDA)}" style="margin:4px 0 12px">` : ""}
    <div id="exp-list"></div>
    <button class="btn-link" id="btn-toggle-arch" style="display:block;margin:18px auto 0">
      ${DASH_VER_ARCHIVADOS ? "← Volver a expedientes activos" : `Ver archivados${archivados.length?` (${archivados.length})`:""}`}
    </button>
  `;
  const bNew = document.getElementById("btn-new-exp");
  if(bNew) bNew.onclick = showNewExpedienteForm;
  document.getElementById("btn-toggle-arch").onclick = () => { DASH_VER_ARCHIVADOS = !DASH_VER_ARCHIVADOS; DASH_BUSQUEDA = ""; renderDashboard(); };

  const list = document.getElementById("exp-list");
  const pintar = () => {
    const q = DASH_BUSQUEDA.trim().toLowerCase();
    const filtrados = q ? base.filter(e=>(e.nombre_expediente||"").toLowerCase().includes(q)) : base;
    list.innerHTML = "";
    if(!filtrados.length){
      list.innerHTML = `<div class="empty-note">${DASH_VER_ARCHIVADOS ? "No hay expedientes archivados." : (q ? "Ningún expediente coincide con la búsqueda." : "Aún no hay expedientes. Crea el primero.")}</div>`;
      return;
    }
    filtrados.forEach(e=>{
      const div = document.createElement("div");
      div.className = "hub-card";
      const fecha = DASH_VER_ARCHIVADOS ? `Archivado ${new Date(e.archivado_at).toLocaleDateString('es-MX')}` : `Actualizado ${new Date(e.updated_at).toLocaleDateString('es-MX')}`;

        <span data-exp-menu style="padding:6px 10px;color:var(--ink-soft);font-size:18px;cursor:pointer">⋯</span>
        <div class="hc-arrow">→</div>
      `;
      div.onclick = () => go("expediente", {currentExpediente: e});
      div.querySelector("[data-exp-menu]").addEventListener("click", (ev)=>{ ev.stopPropagation(); openExpedienteMenu(e); });

/* Archivar = borrado lógico. Oculta el expediente de la lista pero conserva TODO
   (evaluaciones, fotos, contratos, historial) y se puede restaurar. No hay borrado
   físico: las fotos en Storage quedarían huérfanas y los contratos lo impedirían. */
async function openExpedienteMenu(e){
  const archivado = !!e.archivado_at;
  const opciones = archivado
    ? [{v:"abrir", label:"Abrir"}, {v:"restaurar", label:"↩︎ Restaurar a activos"}]
    : [{v:"abrir", label:"Abrir"}, {v:"renombrar", label:"Cambiar nombre"}, {v:"archivar", label:"🗄 Archivar (quitar de la lista)"}];
  const chosen = await askChoice(e.nombre_expediente, opciones, o=>o.label);
  if(!chosen) return;
  if(chosen.v==="abrir"){ go("expediente", {currentExpediente: e}); return; }
  if(!navigator.onLine){ showError("Esta acción necesita conexión."); return; }
  if(chosen.v==="renombrar"){
    const nuevo = await askText("Cambiar nombre", "Nuevo nombre", e.nombre_expediente||"");
    if(!nuevo || !nuevo.trim()) return;
    const { error } = await sb.from("expedientes").update({nombre_expediente: nuevo.trim()}).eq("id", e.id);
    if(error){ showError("No se pudo cambiar el nombre: " + error.message); return; }
  }
  if(chosen.v==="archivar"){
    const ok = await askChoice(`¿Archivar "${e.nombre_expediente}"? Deja de aparecer en tu lista, pero no se borra nada: sus check-ups, fotos y contratos se conservan y lo puedes restaurar cuando quieras.`,
      [{v:"si", label:"Sí, archivar"}, {v:"no", label:"Cancelar"}], o=>o.label);
    if(!ok || ok.v!=="si") return;
    const { error } = await sb.from("expedientes").update({archivado_at: new Date().toISOString(), archivado_por: state.profile?.id || null}).eq("id", e.id);
    if(error){ showError("No se pudo archivar: " + error.message); return; }
  }
  if(chosen.v==="restaurar"){
    const { error } = await sb.from("expedientes").update({archivado_at: null, archivado_por: null}).eq("id", e.id);
    if(error){ showError("No se pudo restaurar: " + error.message); return; }
  }
  renderDashboard();
}

function showNewExpedienteForm(){
  const sheet = openModal(`
    <h3>Nuevo expediente</h3>
    <label>Nombre del expediente</label>
    <input type="text" id="m-input" placeholder='Ej. "Dr. Pérez — Piel Perfecta CDMX"'>
    <button class="btn btn-primary" id="m-ok" style="width:100%;margin-top:16px">Crear</button>
  `);
  const input = sheet.querySelector("#m-input");
  setTimeout(()=>input.focus(), 50);
  sheet.querySelector("#m-ok").onclick = () => {
    const nombre = input.value.trim();
    if(!nombre) return;
    closeModal();
    createExpediente(nombre);
  };
}

async function createExpediente(nombre){
  const { data, error } = await sb.from("expedientes")
    .insert({ nombre_expediente: nombre, owner_id: state.profile.id })
    .select().single();
  if(error){ showError("No se pudo crear el expediente: " + error.message); return; }
  go("exp-datos", {currentExpediente: data});
}


/* ------------------------- Datos del establecimiento (como en V3) -------------------------
   Se capturan UNA vez por expediente (expedientes.datos_establecimiento) y los usan todos los
   check-ups: el estado alimenta Protección Civil y el PDF los muestra en portada y encabezado. */
const EST_CAMPOS = [
  {k:"nombreComercial", l:"Nombre comercial", req:true},
  {k:"razonSocial", l:"Razón social"},

async function getDatosEst(expedienteId){

}
function datosEstCompletos(d){ return !!(d && d.nombreComercial && d.estado); }
function datosEstLineas(d){
  d = d || {}; const out = [];
  if(d.razonSocial) out.push("Razón social: " + d.razonSocial);
  const dom = [d.domicilio, d.municipio, d.estado].filter(Boolean).join(", ");
  if(dom) out.push("Domicilio: " + dom);
  if(d.responsableSanitario) out.push("Responsable sanitario: " + d.responsableSanitario + (d.cedulaProfesional ? " · Cédula " + d.cedulaProfesional : ""));
  if(d.propietario) out.push("Propietario: " + d.propietario);
  const cont = [d.telefono, d.correo].filter(Boolean).join(" · ");
  if(cont) out.push("Contacto: " + cont);
  return out;
}

/* ------------------------------- Catálogos (una sola carga) ------------------------------- */
async function ensureCatalogs(){
  if(state.catalogs) return state.catalogs;
  const [rolPersona, rolOrg, tipoOrg] = await Promise.all([
    cachedRead("cat:rolPersona", ()=>sb.from("tipos_rol_persona").select("*").order("nombre")),
    cachedRead("cat:rolOrg", ()=>sb.from("tipos_rol_organizacion").select("*").order("nombre")),
    cachedRead("cat:tipoOrg", ()=>sb.from("tipos_organizacion").select("*").order("nombre")),
  ]);
  state.catalogs = {
    rolPersona: rolPersona.data||[], rolOrg: rolOrg.data||[], tipoOrg: tipoOrg.data||[],
  };
  return state.catalogs;
}

/* ------------------------------- Detalle de expediente ------------------------------- */
/* Menú de una evaluación desde la lista del expediente: abrir, editar fecha, o
   eliminar. Eliminar es en cascada real (respuestas, hallazgos, evidencias y
   snapshot se borran solos -- ya configurado a nivel de base de datos), salvo si
   es una evaluación base con una visita de seguimiento ligada, que se bloquea
   para no dejar esa visita huérfana. */
async function openEvaluacionMenu(ev, onChange){
  const opciones = [
    {v:"abrir", label:"Abrir"},
    {v:"fecha", label:"Editar fecha de visita"},
    {v:"eliminar", label:"🗑 Eliminar"},
  ];
  const chosen = await askChoice(ev.fecha_visita||"(sin fecha)", opciones, o=>o.label);
  if(!chosen) return;
  if(chosen.v==="abrir"){
    const esSeg = ev.tipo_visita==="seguimiento";
    const importada = ev.importado==="true";
    if(esSeg) go("seguimiento-visita", {currentEvaluacion:{id:ev.id}});
    else if(importada) go("diagnostico-evaluacion", {currentEvaluacion:{id:ev.id, expediente_id:ev.expediente_id, fecha_visita:ev.fecha_visita, nivel_checkup:ev.nivel_checkup, estatus:ev.estatus, tipo_visita:ev.tipo_visita}});
    else go("resumen-evaluacion", {currentEvaluacion:{id:ev.id}});
    return;
  }
  if(chosen.v==="fecha"){
    const nueva = await askText("Fecha de visita", "AAAA-MM-DD", ev.fecha_visita||"");
    if(!nueva) return;
    const { error } = await sb.from("evaluaciones").update({fecha_visita: nueva}).eq("id", ev.id);
    if(error){ showError("No se pudo actualizar la fecha: " + error.message); return; }
    onChange();
  }
  if(chosen.v==="eliminar"){
    const confirmado = await askChoice(
      "¿Eliminar esta evaluación? Se borran también sus respuestas, hallazgos, fotos y PDF generado -- no se puede deshacer.",
      [{v:"si", label:"Sí, eliminar"}, {v:"no", label:"Cancelar"}], o=>o.label);
    if(!confirmado || confirmado.v!=="si") return;
    const { error } = await sb.from("evaluaciones").delete().eq("id", ev.id);
    if(error){
      const msg = /evaluacion_base_id|foreign key/i.test(error.message)
        ? "No se puede eliminar: tiene una visita de seguimiento ligada a ella. Elimina primero esa visita de seguimiento."
        : "No se pudo eliminar: " + error.message;
      showError(msg);
      return;
    }
    onChange();
  }
}

/* ------------------------------- Panel del expediente -------------------------------
   Tres pestañas: REGULATORIO (COFEPRIS / STPS / Protección Civil, cada uno con sus
   propias evaluaciones), CLÍNICA (procesos internos: procesos, finanzas, fiscalidad,
   escalabilidad -- Fase 4/5, todavía no construidos) y PATRIMONIO (árbol financiero
   del médico -- fases posteriores). Contratos y servicios quedan abajo, siempre visibles.
   Las evaluaciones se clasifican por evaluaciones.area_id (lo calcula el trigger del
   servidor); si viene vacío (creada sin señal y aún sin sincronizar) se usa el
   servicio contratado como respaldo. Nada se recalcula ni se mueve en la base de datos. */
let EXP_TAB = "regulatorio";
const EXP_OPEN = {};
const REG_AREAS = [
  {codigo:"cofepris", nombre:"COFEPRIS", icon:"⚕️", sub:"Regulación sanitaria"},
  {codigo:"stps", nombre:"STPS", icon:"🦺", sub:"Seguridad y obligaciones laborales"},
  {codigo:"proteccion_civil", nombre:"Protección Civil", icon:"🧯", sub:"Programa interno / carta de corresponsabilidad"},
];
const SERV_TO_AREA = {cofepris_checkup:"cofepris", stps_checkup:"stps", proteccion_civil_checkup:"proteccion_civil"};
const CLINICA_MODS = [
  {nombre:"Procesos", sub:"Operación interna, flujos, roles y controles", fase:"Fase 4"},
  {nombre:"Finanzas", sub:"Ingresos, costos, márgenes, flujo de efectivo", fase:"Fase 4"},
  {nombre:"Fiscalidad", sub:"Régimen, cumplimiento y eficiencia fiscal", fase:"Fase 4"},
  {nombre:"Escalabilidad", sub:"Capacidad, crecimiento y expansión", fase:"Fase 5"},
];
const PATRIMONIO_MODS = [
  {nombre:"Árbol financiero familiar", sub:"Mapa del médico: familia, clínica, activos y relaciones", fase:"Fase 6"},
  {nombre:"Protección", sub:"Seguros de vida, gastos médicos, responsabilidad civil", fase:"Fase 10"},
  {nombre:"Inversiones y liquidez", sub:"Activos, liquidez y portafolio", fase:"Fase 10"},
  {nombre:"Sucesión", sub:"Continuidad familiar y patrimonial", fase:"Fase 10"},
];

async function renderExpediente(){
  const exp = state.currentExpediente;
  $app.innerHTML = `
    <div class="topbar">
      <div class="topbar-row">
        <button class="back-btn" id="btn-back">←</button>
        <div style="flex:1"><p class="brand">EXPEDIENTE</p><h1 style="font-size:18px">${esc(exp.nombre_expediente||"")}</h1></div>
      </div>
    </div>
    <div class="content" id="exp-content"><div class="center-screen"><div class="spinner"></div></div></div>
  `;
  document.getElementById("btn-back").onclick = () => go("dashboard");

  await ensureCatalogs();

  const [serviciosRes, evalsRes] = await Promise.all([
    cachedRead("exp:"+exp.id+":servicios", ()=>sb.from("servicios_contratados").select("id, estatus, servicio:servicios_catalogo(nombre,codigo)").eq("expediente_id", exp.id)),
    cachedRead("exp:"+exp.id+":evaluaciones_v2", ()=>sb.from("evaluaciones").select("id, expediente_id, estatus, fecha_visita, nivel_checkup, tipo_visita, evaluacion_base_id, servicio_contratado_id, area:areas(codigo), importado:facts->>importado_v3").eq("expediente_id", exp.id)),
  ]);

  const c = document.getElementById("exp-content");
  const err = serviciosRes.error || evalsRes.error;
  if(err){ c.innerHTML = `<div class="err">Error al cargar el expediente: ${esc(err.message)}</div>`; return; }
  const fromCache = serviciosRes.fromCache || evalsRes.fromCache;
  const expRow = await getExpedienteRow(exp.id);
  if(expRow){ Object.assign(exp, expRow); state.currentExpediente = exp; const h1 = document.querySelector(".topbar h1"); if(h1) h1.textContent = exp.nombre_expediente||""; }
  const dEst = exp.datos_establecimiento || {};
  const servicios = (serviciosRes.data||[]);
  const servArea = {};
  servicios.forEach(s=>{ servArea[s.id] = SERV_TO_AREA[s.servicio?.codigo] || null; });
  const evals = (evalsRes.data||[]).slice().sort((a,b)=>(b.fecha_visita||"").localeCompare(a.fecha_visita||""));
  const areaOf = ev => ev.area?.codigo || servArea[ev.servicio_contratado_id] || null;
  const porArea = {cofepris:[], stps:[], proteccion_civil:[], otras:[]};
  evals.forEach(ev=>{ const a = areaOf(ev); (porArea[a] || porArea.otras).push(ev); });

  const tabBtn = (k, label) => `<button class="exp-tab ${EXP_TAB===k?"active":""}" data-tab="${k}">${label}</button>`;
  c.innerHTML = `
    ${fromCache ? `<div class="empty-note" style="margin-bottom:14px">📴 Mostrando datos guardados en este dispositivo (sin conexión) — puede no reflejar cambios hechos desde otro lugar.</div>` : ""}
    ${datosEstCompletos(dEst)
      ? `<div class="card" id="est-card" style="cursor:pointer;padding:12px 14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div style="min-width:0"><div class="area-name" style="font-size:15px">${esc(dEst.nombreComercial)}</div><div class="area-sub">${esc([dEst.municipio, dEst.estado].filter(Boolean).join(", "))}${dEst.responsableSanitario?" · Resp. "+esc(dEst.responsableSanitario):""}</div></div><span class="muted small">Editar ›</span></div></div>`
      : `<div class="card" id="est-card" style="cursor:pointer;border-color:var(--gold-500);background:var(--gold-100)"><b>⚠️ Completa los datos del establecimiento</b><div class="muted small" style="margin-top:4px">Domicilio, estado, responsable sanitario… Se usan en todos los check-ups y en el PDF.</div></div>`}
    <div class="exp-tabs">${tabBtn("regulatorio","Regulatorio")}${tabBtn("clinica","Clínica")}${tabBtn("patrimonio","Patrimonio")}</div>
    <div id="exp-tab-body"></div>
    <div class="card" style="margin-top:22px">
      <div class="section-title">Servicios contratados</div>
      <div id="servicios-list"></div>
      <div class="section-title" style="margin-top:18px">Contratación</div>
      <p class="muted small" style="margin:0 0 10px">Contrato firmado por cada check-up o servicio, cuando aplique -- algunos clientes pagan en efectivo.</p>
      <div id="contratos-list"></div>
      <label class="btn btn-ghost" id="btn-add-contrato" style="margin-top:10px;display:block;text-align:center;cursor:pointer">
        + Subir contrato
        <input type="file" id="input-contrato" accept="image/*,application/pdf" style="display:none">
      </label>
    </div>
  `;
  document.getElementById("est-card").onclick = () => go("exp-datos", {currentExpediente: exp});
  c.querySelectorAll(".exp-tab").forEach(b=> b.onclick = () => { EXP_TAB = b.dataset.tab; renderExpediente(); });

  // Avance de visitas de seguimiento (cuántas correcciones ya están verificadas)
  const segIds = evals.filter(e=>e.tipo_visita==="seguimiento").map(e=>e.id);
  const avance = {};
  if(EXP_TAB==="regulatorio" && segIds.length){
    const segRes = await cachedRead("exp:"+exp.id+":seg_avance", ()=>sb.from("hallazgos").select("evaluacion_id,estatus_accion,hallazgo_previo_id").in("evaluacion_id", segIds));
    (segRes.data||[]).filter(h=>h.hallazgo_previo_id).forEach(h=>{
      const a = (avance[h.evaluacion_id] = avance[h.evaluacion_id] || {ok:0,total:0});
      a.total++; if(h.estatus_accion==="verificado"||h.estatus_accion==="corregido") a.ok++;
    });
  }

  const body = document.getElementById("exp-tab-body");
  if(EXP_TAB==="regulatorio") renderTabRegulatorio(body, exp, porArea, avance);
  else if(EXP_TAB==="clinica") await renderTabClinica(body, exp);
  else body.innerHTML = renderModulosProximos("Patrimonio del médico", "Del negocio a la familia: protección, inversiones y continuidad.", PATRIMONIO_MODS);

  const sList = document.getElementById("servicios-list");
  sList.innerHTML = servicios.length ? "" : `<div class="empty-note">Sin servicios contratados todavía.</div>`;
  const DEP_TAG = {cofepris_checkup:"COFEPRIS", stps_checkup:"STPS", proteccion_civil_checkup:"Protección Civil"};
  servicios.forEach(s=>{
    const row = document.createElement("div");
    row.className = "small-row";
    const tag = DEP_TAG[s.servicio?.codigo];
    row.innerHTML = `<span>${tag?`<span class="dep-tag">${esc(tag)}</span> `:""}${esc(s.servicio?.nombre||"")}</span><span class="muted">${esc(s.estatus)}</span>`;
    sList.appendChild(row);
  });

  const cList = document.getElementById("contratos-list");
  renderContratosList(cList, exp.id, servicios);
  document.getElementById("input-contrato").addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    e.target.value = "";
    if(!file) return;
    if(!navigator.onLine){ showError("Subir un contrato necesita conexión. Puedes intentarlo de nuevo cuando tengas señal."); return; }
    let servicioId = null;
    if(servicios.length === 1){
      servicioId = servicios[0].id;
    } else if(servicios.length > 1){
      const opts = [{id:null, label:"Sin servicio específico"}, ...servicios.map(s=>({id:s.id, label:s.servicio?.nombre||"(servicio)"}))];
      const chosen = await askChoice("¿A qué servicio corresponde este contrato?", opts, o=>o.label);
      servicioId = chosen ? chosen.id : null;
    }
    try{
      await uploadContrato(exp.id, file, servicioId);
      renderContratosList(cList, exp.id, servicios);
    }catch(err){ showError("No se pudo subir el contrato: " + (err&&err.message?err.message:err)); }
  });
}

function renderTabRegulatorio(body, exp, porArea, avance){
  const areas = REG_AREAS.slice();
  if(porArea.otras.length) areas.push({codigo:"otras", nombre:"Sin clasificar", icon:"📁", sub:"Evaluaciones aún sin área (se acomodan al sincronizar)"});
  body.innerHTML = `<p class="muted small" style="margin:2px 0 12px">Cumplimiento ante autoridades. Cada dependencia lleva sus propias evaluaciones.</p>`;
  areas.forEach(ar=>{
    const lista = porArea[ar.codigo] || [];
    const ultima = lista[0];
    const abierto = EXP_OPEN[ar.codigo] ?? false;
    const card = document.createElement("div");
    card.className = "card area-card";
    card.innerHTML = `
      <div class="area-head">
        <div class="area-icon">${ar.icon}</div>
        <div style="flex:1;min-width:0">
          <div class="area-name">${esc(ar.nombre)}</div>
          <div class="area-sub">${lista.length ? `${lista.length} evaluaci${lista.length===1?"ón":"ones"} · última ${esc(ultima.fecha_visita||"(sin fecha)")}` : esc(ar.sub)}</div>
        </div>
        <div class="area-chev">${abierto?"▾":"▸"}</div>
      </div>
      <div class="area-body" style="display:${abierto?"block":"none"}">
        <div class="area-evals"></div>
        ${ar.codigo==="otras" ? "" : `<button class="action-btn btn-new" style="margin-top:10px;margin-bottom:0"><span>+ Nueva evaluación ${esc(ar.nombre)}</span><span>→</span></button>`}
        ${(ar.codigo!=="otras" && lista.length) ? `<button class="action-btn btn-seg" style="margin-top:10px;margin-bottom:0;background:var(--navy-800)"><span>↻ Visita de seguimiento</span><span>→</span></button>` : ""}
      </div>`;
    card.querySelector(".area-head").onclick = () => { EXP_OPEN[ar.codigo] = !abierto; renderTabRegulatorio(body, exp, porArea, avance); };
    const eList = card.querySelector(".area-evals");
    if(!lista.length) eList.innerHTML = `<div class="empty-note">Sin evaluaciones todavía.</div>`;
    lista.forEach(ev=>{
      const esSeg = ev.tipo_visita==="seguimiento";
      const a = avance[ev.id];
      const importada = ev.importado==="true";
      const row = document.createElement("div");
      row.className = "small-row";
      row.style.cursor = "pointer";
      row.innerHTML = `<span>${ev.fecha_visita||"(sin fecha)"} · ${esSeg?"Seguimiento":(importada?"Evaluación inicial (V3)":"Evaluación inicial")}${esSeg&&a?` — ${a.ok} de ${a.total} corregidos`:""}</span><span style="display:flex;align-items:center;gap:8px"><span class="muted">${esc(ev.estatus)}</span><span class="ev-menu-btn" data-ev-menu style="padding:4px 8px;cursor:pointer">⋯</span></span>`;
      row.onclick = () => esSeg ? go("seguimiento-visita", {currentEvaluacion:{id:ev.id}})
        : importada ? go("diagnostico-evaluacion", {currentEvaluacion:{id:ev.id, expediente_id:ev.expediente_id, fecha_visita:ev.fecha_visita, nivel_checkup:ev.nivel_checkup, estatus:ev.estatus, tipo_visita:ev.tipo_visita}})
        : go("resumen-evaluacion", {currentEvaluacion:{id:ev.id}});
      row.querySelector("[data-ev-menu]").addEventListener("click",(e)=>{
        e.stopPropagation();
        openEvaluacionMenu(ev, () => renderExpediente());
      });
      eList.appendChild(row);
    });
    const bNew = card.querySelector(".btn-new");
    if(bNew) bNew.onclick = () => {
      if(ar.codigo==="cofepris") startWizardEval(exp.id);
      else if(ar.codigo==="stps") startWizardEvalSTPS(exp.id);
      else if(ar.codigo==="proteccion_civil") startWizardEvalPC(exp.id);
    };
    const bSeg = card.querySelector(".btn-seg");
    if(bSeg) bSeg.onclick = () => iniciarVisitaSeguimiento(exp, lista);
    body.appendChild(card);
  });
}

async function showAddPersonaForm(expedienteId){
  const nombre = await askText("Nueva persona", "Nombre completo", "Nombre y apellido");
  if(!nombre) return;
  const rol = await askChoice("Rol de esta persona", state.catalogs.rolPersona, r=>r.nombre);
  if(!rol) return;

  const { data: persona, error: e1 } = await sb.from("personas").insert({ nombre_completo: nombre }).select().single();
  if(e1){ showError("No se pudo crear la persona: " + e1.message); return; }
  const { error: e2 } = await sb.from("expediente_personas").insert({
    expediente_id: expedienteId, persona_id: persona.id, rol_id: rol.id
  });
  if(e2){ showError("No se pudo vincular la persona: " + e2.message); return; }
  render();
}

async function showAddOrgForm(expedienteId){
  const nombre = await askText("Nueva organización", "Nombre comercial", "Nombre de la clínica/consultorio");
  if(!nombre) return;
  const tipo = await askChoice("Tipo de organización", state.catalogs.tipoOrg, t=>t.nombre);

  const { data: org, error: e1 } = await sb.from("organizaciones").insert({
    nombre_comercial: nombre, tipo_organizacion_id: tipo.id
  }).select().single();
  if(e1){ showError("No se pudo crear la organización: " + e1.message); return; }
  const { error: e2 } = await sb.from("expediente_organizaciones").insert({
    expediente_id: expedienteId, organizacion_id: org.id, rol_id: rol.id
  });

  render();

async function finishWizardEvalSTPS(){
  const w = state.wizard;
  const btn = document.getElementById("btn-next");
  if(btn){ btn.disabled = true; btn.textContent = "Creando evaluación..."; }

  const facts = { servicios: w.servicios, usaMaquinaria: w.usaMaquinaria, manejaQuimicos: w.manejaQuimicos };

  // Resolver servicio_contratado stps_checkup -- mismo patrón offline-safe que COFEPRIS.
  let stpsScId = null;
  if(navigator.onLine){
    const { data: sc, error: scErr } = await sb.from("servicios_contratados")
      .select("id, servicio:servicios_catalogo(codigo)").eq("expediente_id", w.expedienteId);
    if(scErr){ showError("Error al leer servicios contratados: " + scErr.message); return; }
    const existing = (sc||[]).find(s => s.servicio?.codigo === "stps_checkup");
    if(existing){ stpsScId = existing.id; }
    else {
      const { data: servicio, error: e1 } = await sb.from("servicios_catalogo").select("id").eq("codigo","stps_checkup").single();
      if(e1){ showError("No se encontró el servicio STPS en el catálogo: " + e1.message); return; }
      stpsScId = newId();
      await persistEntity("servicios_contratados", stpsScId, "CREATE",
        { expediente_id: w.expedienteId, servicio_id: servicio.id, nivel: w.nivelCheckup, estatus: "activo" });
    }
    await idbPut(STORE_KV, {key:"stpsSc:"+w.expedienteId, value:stpsScId});
  } else {
    const cached = await idbGet(STORE_KV, "stpsSc:"+w.expedienteId);
    stpsScId = cached && cached.value;
    if(!stpsScId){
      showError("Necesitas conexión al menos una vez para crear la primera evaluación STPS de este expediente. Ya con eso, las siguientes funcionan sin señal.");
      if(btn){ btn.disabled=false; btn.textContent="Calcular aplicabilidad"; }
      return;
    }
  }

  const evaluacionId = newId();
  const evaluacion = {
    id: evaluacionId, expediente_id: w.expedienteId, servicio_contratado_id: stpsScId,
    tipo_establecimiento: null, servicios_prestados: facts.servicios, facts: facts,
    nivel_checkup: w.nivelCheckup, fecha_visita: new Date().toISOString().slice(0,10), evaluador_id: state.profile.id,
    estatus: "en_proceso", area_id: null,
  };
  const evRes = await persistEntity("evaluaciones", evaluacionId, "CREATE", evaluacion);
  if(evRes.error){ showError("No se pudo crear la evaluación: " + evRes.error.message); return; }

  if(navigator.onLine && !evRes.queued){
    const { error: snapErr } = await sb.rpc("crear_snapshot_evaluacion", { p_evaluacion_id: evaluacionId });
    if(snapErr){ showError("La evaluación se creó, pero no se pudo calcular su universo regulatorio: " + snapErr.message); return; }
    const { count: snapCount, error: verifyErr } = await sb.from("evaluacion_criterios_snapshot")
      .select("id", {count:"exact", head:true}).eq("evaluacion_id", evaluacionId);
    if(verifyErr || !snapCount){
      showError("La evaluación se creó, pero el universo regulatorio quedó vacío o no se pudo verificar" + (verifyErr?(": "+verifyErr.message):"") + ". Revisa antes de continuar.");
      return;
    }
  } else {
    await queueOperation("rpc:crear_snapshot_evaluacion", evaluacionId, "CREATE", {p_evaluacion_id: evaluacionId});
  }

  state.wizard = null;
  go("resumen-evaluacion", {currentEvaluacion: evaluacion});
}
