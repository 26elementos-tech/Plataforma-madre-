  regimen:{q:"¿Con qué régimen está dada de alta la clínica ante el SAT?", ej:"Si no lo sabe, el contador lo sabe; puedes marcar «No sabe»."},
  cuentasSeparadas:{q:"¿La clínica tiene su propia cuenta de banco, separada de la personal del doctor?", ej:"«En parte»: hay cuenta de la clínica, pero se pagan cosas personales con ella o al revés."},
};
const finM = n => (n===null||!isFinite(n)) ? "—" : (n<0?"-":"") + "$" + Math.round(Math.abs(n)).toLocaleString("es-MX");
const finP = n => (n===null||!isFinite(n)) ? "—" : (Math.round(n*10)/10) + "%";

function finCalcular(datos, sup){
  const d = datos||{}, S = {...FIN_SUPUESTOS_DEF}; Object.entries(sup||{}).forEach(([k,v])=>{ const n=finN(v); if(n!==null) S[k]=n; });
  const N = k => finN(d[k]) || 0;
  const trats = (d.tratamientos||[]).filter(t=>t && t.nombre && finN(t.precio));
  const tr = trats.map(t=>{ const p=finN(t.precio)||0, q=finN(t.cantidad)||0, c=finN(t.costo)||0;
    return {nombre:t.nombre, precio:p, cantidad:q, costo:c, venta:p*q, insumo:c*q, contribucion:(p-c)*q, margen:p? (p-c)/p*100 : null}; });
  const ventaTrats = tr.reduce((s,t)=>s+t.venta,0), insumoTrats = tr.reduce((s,t)=>s+t.insumo,0);
  const venta = finN(d.venta) || ventaTrats;
  const ingresos = venta + N("otrosIngresos");
  const pctInsumo = ventaTrats ? insumoTrats/ventaTrats : null;
  const insumos = pctInsumo!==null ? venta*pctInsumo : 0;
  const comisiones = venta * (N("pctTarjeta")/100) * (N("comisionTerminal")/100);
  const fijosKeys = ["renta","nomina","honorarios","servicios","software","publicidad","mantenimiento","otrosGastos"];
  const fijos = fijosKeys.reduce((s,k)=>s+N(k),0);
  const utilidad = ingresos - insumos - comisiones - fijos;
  const pagoDeudas = N("pagoDeudas");
  const flujoDeudas = utilidad - pagoDeudas;
  const retiro = N("retiro");
  const sobrante = flujoDeudas - retiro;
  const margenContrib = venta ? (1 - (insumos+comisiones)/venta) : null;
  const equilibrio = (margenContrib && margenContrib>0) ? (fijos + pagoDeudas - N("otrosIngresos"))/margenContrib : null;
  const horasMes = N("horasSemana") * 4.33;
  const ventaHora = horasMes ? venta/horasMes : null, ingresoHora = horasMes ? (retiro)/horasMes : null;
  const utilidadAnual = utilidad*12;
  const valor = utilidadAnual>0 ? utilidadAnual*S.multiplo : null;
  const valorIndep = utilidadAnual>0 ? utilidadAnual*S.multiploIndependiente : null;
  const reserva = (fijos + pagoDeudas) * S.mesesReserva;
  const saldo = N("saldoCuentas");
  const excesoLiquidez = Math.max(0, saldo - reserva);
  const ventaEfectivo = venta * N("pctEfectivo")/100;
  const pctDep = finN(d.pctEfectivoDeposita);
  const efectivoNoDepMes = pctDep===null ? null : ventaEfectivo * (1 - pctDep/100);
  const efectivoFuera = N("efectivoFuera");
  const exceso = excesoLiquidez + efectivoFuera;
  const costoOportunidad = exceso * S.rendimientoRef/100;
  const proy = ["gCons","gBase","gOpt"].map(g=>{
    const tasa = S[g]/100; const anios = [1,2,3].map(a=>{
      const v = venta*Math.pow(1+tasa,a-1); const ins = pctInsumo!==null? v*pctInsumo:0; const com = v*(N("pctTarjeta")/100)*(N("comisionTerminal")/100);
      const u = (v + N("otrosIngresos") - ins - com - fijos)*12; return {anio:a, venta:v*12, utilidad:u, sobrante:u - (pagoDeudas+retiro)*12}; });
    return {g, tasa:S[g], anios, acumulado3: anios.reduce((s,x)=>s+x.sobrante,0)}; });
  const banderas = [];
  const pf = finN(d.pctFacturado);
  if(pf!==null && pf<100) banderas.push({t:"Venta sin facturar", det:`Se factura aprox. ${pf}% de la venta; ${finM(venta*(1-pf/100))} al mes quedan sin CFDI.`, nivel:"alto"});
  if(efectivoNoDepMes && efectivoNoDepMes>0) banderas.push({t:"Efectivo de cobros no bancarizado", det:`Aprox. ${finM(efectivoNoDepMes)} al mes de cobros en efectivo no se depositan.`, nivel:"alto"});
  if(efectivoFuera>0) banderas.push({t:"Efectivo acumulado fuera del banco", det:`Aprox. ${finM(efectivoFuera)} fuera del sistema bancario.`, nivel:"alto"});
  if(d.formaPago==="Retira sin comprobante") banderas.push({t:"Retiro del médico sin comprobante", det:"El médico retira dinero de la clínica sin un esquema fiscal definido.", nivel:"alto"});
  if(d.cuentasSeparadas && d.cuentasSeparadas!=="Sí") banderas.push({t:"Cuentas de la clínica y del médico mezcladas", det:`Separación de cuentas: ${d.cuentasSeparadas}.`, nivel:"medio"});
  if(d.regimen==="No sabe" || !d.regimen) banderas.push({t:"Régimen fiscal no identificado", det:"La clínica no tiene claro con qué régimen opera.", nivel:"medio"});
  if(retiro && sobrante<0) banderas.push({t:"Retiro mayor a lo que deja la clínica", det:`Después de gastos y deudas, el retiro deja un faltante de ${finM(-sobrante)} al mes.`, nivel:"alto"});
  const estrella = tr.slice().sort((a,b)=>b.contribucion-a.contribucion)[0] || null;
  const volumen = tr.slice().sort((a,b)=>b.cantidad-a.cantidad)[0] || null;
  return {S, tr, venta, ingresos, insumos, comisiones, fijos, utilidad, pagoDeudas, flujoDeudas, retiro, sobrante, margenContrib, equilibrio,
    ventaHora, ingresoHora, utilidadAnual, valor, valorIndep, reserva, saldo, excesoLiquidez, ventaEfectivo, efectivoNoDepMes, efectivoFuera,
    exceso, costoOportunidad, proy, banderas, estrella, volumen, margenUtil: ingresos ? utilidad/ingresos*100 : null};
}

/* ------------------------- Pestaña Clínica: tarjeta Finanzas ------------------------- */
async function renderCardFinanzas(container, exp){
  const card = document.createElement("div");
  card.className = "card area-card";
  card.innerHTML = `<div class="area-head" style="cursor:default"><div class="area-icon">📊</div>
    <div style="flex:1;min-width:0"><div class="area-name">Finanzas</div><div class="area-sub">Diagnóstico financiero · reporte al médico y al fiscalista</div></div></div>
    <div class="area-body"><div id="fin-list"><div class="muted small">Cargando…</div></div>
    <button class="action-btn" id="btn-fin-new" style="margin-top:10px;margin-bottom:0"><span>+ Nuevo diagnóstico financiero</span><span>→</span></button></div>`;
  container.appendChild(card);
  card.querySelector("#btn-fin-new").onclick = () => finIniciar(exp);
  const list = card.querySelector("#fin-list");
  if(!navigator.onLine){ list.innerHTML = `<div class="empty-note">Sin conexión.</div>`; return; }
  const { data, error } = await sb.from("evaluaciones_financieras").select("*").eq("expediente_id", exp.id).is("anulado_at", null).order("fecha",{ascending:false});
  if(error){ list.innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
  list.innerHTML = (data||[]).length ? "" : `<div class="empty-note">Sin diagnósticos financieros todavía.</div>`;
  (data||[]).forEach(ev=>{
    const r = finCalcular(ev.datos, ev.supuestos);
    const row = document.createElement("div"); row.className="small-row"; row.style.cursor="pointer";
    row.innerHTML = `<span>${esc(ev.fecha)} · ${ev.estatus==="completada"?"Completado":"En captura"}</span><span style="font-weight:600">${finM(r.utilidad)}/mes</span>`;
    row.onclick = () => { state.finEval = {...ev, expediente_nombre: exp.nombre_expediente, secIdx:0}; go(ev.estatus==="completada" ? "fin-resultado" : "fin-wizard"); };
    list.appendChild(row);
  });
}
async function finIniciar(exp){
  const datos = {tratamientos:[]};
  try{
    const { data } = await sb.from("evaluaciones_operativas").select("respuestas").eq("expediente_id", exp.id).is("anulado_at", null).order("fecha_visita",{ascending:false}).limit(1);
    const eco = data && data[0] && data[0].respuestas && data[0].respuestas.__eco;
    if(eco){ if(eco.venta) datos.venta = eco.venta; if(eco.publicidad) datos.publicidad = eco.publicidad; }
  }catch(e){}
  state.finEval = {id:null, expediente_id:exp.id, expediente_nombre:exp.nombre_expediente, fecha:new Date().toISOString().slice(0,10), estatus:"borrador", datos, supuestos:{...FIN_SUPUESTOS_DEF}, secIdx:0};
  go("fin-wizard");
}
async function finGuardar(ev, estatus){
  if(!navigator.onLine) return {ok:false, offline:true};
  const row = {expediente_id:ev.expediente_id, fecha:ev.fecha, datos:ev.datos, supuestos:ev.supuestos, version_modelo:FIN_VERSION, estatus: estatus||ev.estatus||"borrador"};
  if(row.estatus==="completada"){ const r = finCalcular(ev.datos, ev.supuestos); row.resultado = {utilidad:r.utilidad, valor:r.valor, exceso:r.exceso, banderas:r.banderas.map(b=>b.t)}; }
  const res = ev.id ? await sb.from("evaluaciones_financieras").update(row).eq("id", ev.id).select("id").single()
                    : await sb.from("evaluaciones_financieras").insert(row).select("id").single();
  if(res.error) return {ok:false, error:res.error};
  ev.id = res.data.id; ev.estatus = row.estatus; return {ok:true};
}

  const prev = document.getElementById("fin-prev"); if(prev) prev.onclick = async ()=>{ await guardar(); ev.secIdx--; go("fin-wizard"); };
  document.getElementById("fin-next").onclick = async ()=>{ await guardar(); if(ev.secIdx<total-1){ ev.secIdx++; go("fin-wizard"); } else go("fin-resultado"); };

/* ------------------------- PDFs ------------------------- */
function finPdfBase(titulo, sub){
  const {jsPDF} = window.jspdf; const doc = new jsPDF({unit:"pt", format:"letter"});
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight(), margin = 48, maxW = pageW - margin*2;
  const ctx = {doc, pageW, pageH, margin, maxW, y:margin, NAVY:[17,17,17], INK:[17,17,17], SOFT:[90,90,90], RED:[179,38,30], GOLD:[184,134,11], GREEN:[46,125,79]};
  ctx.hex = h=>{ const n=parseInt(h.replace("#",""),16); return [(n>>16)&255,(n>>8)&255,n&255]; };

const FIS_DOCS = [
  {k:"csf", t:"Constancia de situación fiscal (reciente)"},
  {k:"opinion", t:"Opinión de cumplimiento del SAT (reciente)"},
  {k:"mensuales", t:"Acuses de declaraciones mensuales de los últimos 12 meses"},
  {k:"anual", t:"Declaración anual del último ejercicio y su acuse"},
  {k:"emitidos", t:"Facturas emitidas de los últimos 12 meses (XML o reporte)"},

  {k:"acta", t:"Acta constitutiva y poderes (si es persona moral)"},
  {k:"sat", t:"Requerimientos o cartas invitación del SAT recibidos (si hay)"},
];
const FIS_COLOR = {v:"#2E7D4F", a:"#B8860B", r:"#B3261E", n:"#8E8E8E", x:"#C9CDD2"};
const FIS_LABEL = {v:"En orden", a:"Atención", r:"Riesgo", n:"No aplica", x:"Sin dato"};

function fisCalcular(datos){
  const d = datos||{};
  const grupos = FIS_GRUPOS.map(g=>{
    const items = g.preguntas.map(p=>{ const op = p.o.find(o=>o[0]===d[p.k]); return {p, resp: d[p.k]||"", nivel: op ? op[1] : "x"}; });
    const niveles = items.map(i=>i.nivel).filter(n=>n!=="n");
    const nivel = niveles.includes("r") ? "r" : niveles.includes("a") ? "a" : niveles.every(n=>n==="x") ? "x" : niveles.includes("x") ? "a" : "v";
    return {g, items, nivel};
  });
  const sinContador = grupos.find(x=>x.g.id==="contador");
  const fiscales = grupos.filter(x=>x.g.id!=="contador").map(x=>x.nivel);
  const global = fiscales.includes("r") ? "r" : fiscales.includes("a") ? "a" : fiscales.every(n=>n==="x") ? "x" : "v";
  const riesgos = grupos.flatMap(x=>x.items.filter(i=>i.nivel==="r").map(i=>({grupo:x.g.nombre, t:i.p.t, resp:i.resp})));
  const atencion = grupos.flatMap(x=>x.items.filter(i=>i.nivel==="a").map(i=>({grupo:x.g.nombre, t:i.p.t, resp:i.resp})));
  return {grupos, global, contador: sinContador.nivel, riesgos, atencion};
}

  const datos = {};
  try{
    const { data } = await sb.from("evaluaciones_financieras").select("datos").eq("expediente_id", exp.id).is("anulado_at", null).order("fecha",{ascending:false}).limit(1);
    const f = data && data[0] && data[0].datos;
    if(f){
      if(f.regimen){ datos.regimen = f.regimen; datos.operaComo = /RESICO persona física/.test(f.regimen) ? "RESICO persona física" : /actividad profesional/.test(f.regimen) ? "Persona física – actividad profesional" : /moral/.test(f.regimen) ? "Persona moral" : undefined; }
      const mapPago = {"Sueldo / nómina":"Sueldo / nómina","Honorarios facturados":"Honorarios facturados","Retira sin comprobante":"Retira sin comprobante","Dividendos":"Dividendos","No sabe":"No sabe"};
      if(f.formaPago) datos.pagoMedico = mapPago[f.formaPago];
      if(f.cuentasSeparadas) datos.separadas = f.cuentasSeparadas;
      const pf = finN(f.pctFacturado); if(pf!==null) datos.facturaCobros = pf>=95 ? "Siempre" : pf>=40 ? "Solo si la piden" : "Casi nunca";
    }
  }catch(e){}
  if(esPerfilFisio(exp.nombre_expediente) && !datos.especialidad) datos.especialidad = "Fisioterapia / rehabilitación";
  state.fisEval = {id:null, expediente_id:exp.id, expediente_nombre:exp.nombre_expediente, fecha:new Date().toISOString().slice(0,10), estatus:"borrador", datos, documentos:{}, fiscalista:"", pendientes:[], secIdx:0};
  go("fis-wizard");
}
async function fisGuardar(ev, estatus){
  if(!navigator.onLine) return {ok:false, offline:true};
  const row = {expediente_id:ev.expediente_id, fecha:ev.fecha, datos:ev.datos, documentos:ev.documentos, fiscalista:ev.fiscalista||null, pendientes:ev.pendientes||[], estatus: estatus||ev.estatus||"borrador"};
  if(row.estatus==="completada"){ const r = fisCalcular(ev.datos); row.resultado = {global:r.global, contador:r.contador, riesgos:r.riesgos.length}; }
  const res = ev.id ? await sb.from("evaluaciones_fiscales").update(row).eq("id", ev.id).select("id").single()
                    : await sb.from("evaluaciones_fiscales").insert(row).select("id").single();
  if(res.error) return {ok:false, error:res.error};
  ev.id = res.data.id; ev.estatus = row.estatus; return {ok:true};
}

/* =====================================================================================
   FASE 4 · CLÍNICA · LEGAL Y RIESGOS (leg-v1) — completa el esqueleto: sobre qué está parada la
   clínica y qué la protege. Preguntas condicionales (socios, empleados, paquetes, local rentado...).
   Entregables: Mapa de riesgos y protección (médico), paquete confidencial para el abogado de la Red,
   ficha de suscripción de seguros (interna) y seguimiento. No emite opinión legal.
   Niveles: v = en orden, a = atención, r = riesgo, n = no aplica.
   ===================================================================================== */
const LEG_SOCIOS = d => d.socios==="Sí, tiene socios";
const LEG_EMPLEADOS = d => (finN(d.numPersonal)||0) > 0;
const LEG_MORAL = d => d.tipoPersona==="Persona moral";
const LEG_RENTA = d => d.local && d.local!=="Propio";
const LEG_GRUPOS = [
  {id:"estructura", nombre:"Estructura y representación", preguntas:[
    {k:"tipoPersona", t:"La clínica opera como", o:[["Persona física","v"],["Persona moral","v"],["No sabe","r"]]},
    {k:"socios", t:"¿Tiene socios?", o:[["No, es solo el médico","v"],["Sí, tiene socios","v"]]},
    {k:"numSocios", t:"Número de socios (incluido el médico)", num:true, si:LEG_SOCIOS},
    {k:"acuerdoSocios", t:"Acuerdo de socios", si:LEG_SOCIOS, o:[["Por escrito y actualizado","v"],["Por escrito, pero desactualizado","a"],["Solo de palabra","r"],["No hay","r"]]},
    {k:"actas", t:"Acta constitutiva y asambleas", si:LEG_MORAL, o:[["Al día","v"],["Desactualizadas","a"],["No sabe","a"]]},
    {k:"poderes", t:"Representante legal y poderes", o:[["El médico firma por sí mismo (persona física)","v"],["Hay representante con poder vigente","v"],["El poder no está vigente o no se sabe","a"],["Nadie tiene poder para firmar","r"]]},
  ]},
  {id:"local", nombre:"Local y permisos", preguntas:[
    {k:"local", t:"El local es", o:[["Propio","v"],["Rentado","v"],["Prestado o de un familiar","a"],["Dentro de hospital o plaza médica","v"]]},
    {k:"contratoLocal", t:"Contrato del local", si:LEG_RENTA, o:[["Por escrito, vigencia mayor a 2 años","v"],["Por escrito, vence en menos de 2 años","a"],["Vencido o solo de palabra","r"]]},
    {k:"revisadoLocal", t:"El contrato del local fue revisado por un abogado", si:LEG_RENTA, o:[["Sí","v"],["No","a"]]},
    {k:"inversionLocal", t:"Invirtió en remodelación o adecuaciones importantes", si:LEG_RENTA, o:[["Sí","a"],["No","v"]]},
    {k:"usoSuelo", t:"Uso de suelo para servicios médicos", o:[["Sí","v"],["No","r"],["No sabe","a"]]},
    {k:"municipal", t:"Licencia o aviso de funcionamiento municipal (alcaldía o municipio)", o:[["Sí","v"],["No","r"],["No sabe","a"]]},
  ]},
  {id:"contratos", nombre:"Contratos y personal", preguntas:[
    {k:"numPersonal", t:"Personas que trabajan en la clínica además del médico", num:true},
    {k:"externos", t:"Médicos o aplicadores externos", o:[["No hay","n"],["Sí, con contrato por escrito","v"],["Sí, sin contrato","r"]]},
    {k:"honorariosRiesgo", t:"Personal pagado por honorarios que trabaja con horario fijo y en exclusiva", si:LEG_EMPLEADOS, o:[["No","v"],["Sí, algunos","a"],["Sí, la mayoría","r"]]},
    {k:"confidencialidad", t:"El personal firmó acuerdo de confidencialidad", si:LEG_EMPLEADOS, o:[["Todos","v"],["Algunos","a"],["Nadie","r"]]},
    {k:"proveedores", t:"Contratos con proveedores clave (RPBI, mantenimiento, software)", o:[["Todos por escrito","v"],["Algunos","a"],["Ninguno","r"]]},
    {k:"leasing", t:"Equipos en arrendamiento o a crédito", o:[["No","n"],["Sí, contrato revisado","v"],["Sí, sin revisar","a"]]},
  ]},
  {id:"pacientes", nombre:"Pacientes, datos e imagen", preguntas:[
    {k:"paquetes", t:"Vende paquetes o cobra anticipos", o:[["No","v"],["Sí","v"]]},
    {k:"terminos", t:"Términos de paquetes y anticipos", si:d=>d.paquetes==="Sí", o:[["Por escrito y firmados por el paciente","v"],["Solo verbales","r"],["No hay","r"]]},
    {k:"reembolsos", t:"Política de cancelación y reembolso", si:d=>d.paquetes==="Sí", o:[["Por escrito y visible","v"],["Caso por caso","a"],["No hay","r"]]},
    {k:"privacidad", t:"Aviso de privacidad", o:[["Actualizado y a la vista","v"],["Genérico o desactualizado","a"],["No tiene","r"]]},

    {k:"arco", t:"Procedimiento si un paciente pide sus datos o que se borren", o:[["Existe","v"],["No existe","a"]]},

  ]},

    {k:"marca", t:"Marca de la clínica ante el IMPI", o:[["Registrada a nombre del médico o la clínica","v"],["En trámite","a"],["No registrada","r"],["No sabe","a"]]},

    {k:"dominio", t:"Dominio de la página web", o:[["A nombre del médico o la clínica","v"],["A nombre de un tercero","r"],["No tiene página","n"]]},

  ]},

    {k:"quejas", t:"Quejas (CONAMED, Profeco, comisión estatal) en los últimos 5 años", o:[["Ninguna","v"],["Sí, resueltas","a"],["Sí, en curso","r"]]},
    {k:"demandas", t:"Demandas civiles o penales", o:[["Ninguna","v"],["Sí, resueltas","a"],["Sí, en curso","r"]]},
    {k:"laborales", t:"Demandas laborales", si:LEG_EMPLEADOS, o:[["Ninguna","v"],["Sí, resueltas","a"],["Sí, en curso","r"]]},
  ]},
  {id:"continuidad", nombre:"Continuidad legal", preguntas:[
    {k:"sucesionClinica", t:"Si el médico falta, está definido quién se queda con la clínica y cómo sigue", o:[["Sí, por escrito","v"],["Se ha platicado","a"],["No","r"]]},
    {k:"compraventaSocios", t:"Acuerdo de compraventa entre socios ante fallecimiento o invalidez", si:LEG_SOCIOS, o:[["Sí, con fondeo (seguro)","v"],["Sí, sin fondeo","a"],["No","r"]]},
  ]},
];
const LEG_DOCS = [
  {k:"acta", t:"Acta constitutiva, asambleas y poderes", si:LEG_MORAL},
  {k:"acuerdo", t:"Acuerdo de socios", si:LEG_SOCIOS},
  {k:"arrendamiento", t:"Contrato de arrendamiento del local", si:LEG_RENTA},
  {k:"municipal", t:"Uso de suelo y licencia o aviso municipal"},
  {k:"externos", t:"Contratos con médicos y aplicadores externos", si:d=>d.externos && d.externos!=="No hay"},
  {k:"proveedores", t:"Contratos con proveedores y arrendamientos de equipo"},
  {k:"laboral", t:"Contratos y acuerdos de confidencialidad del personal", si:LEG_EMPLEADOS},
  {k:"paquetes", t:"Términos de paquetes y política de reembolsos", si:d=>d.paquetes==="Sí"},
  {k:"privacidad", t:"Aviso de privacidad y formatos de consentimiento de imagen"},
  {k:"marca", t:"Título o solicitud de registro de marca"},
  {k:"contingencias", t:"Documentos de quejas o demandas", si:d=>["quejas","demandas","laborales"].some(k=>d[k] && d[k]!=="Ninguna")},
];

function legCalcular(datos){
  const d = datos||{};
  const grupos = LEG_GRUPOS.map(g=>{
    const items = g.preguntas.filter(p=>!p.sup && !p.num && !p.txt && (!p.si || p.si(d))).map(p=>{ const op = (p.o||[]).find(o=>o[0]===d[p.k]); return {p, resp:d[p.k]||"", nivel: op ? op[1] : "x"}; });
    const nv = items.map(i=>i.nivel).filter(n=>n!=="n");
    const nivel = !nv.length ? "n" : nv.includes("r") ? "r" : nv.includes("a") ? "a" : nv.every(n=>n==="x") ? "x" : nv.includes("x") ? "a" : "v";
    return {g, items, nivel};
  });
  // reglas cruzadas
  const extras = [];
  if(LEG_RENTA(d) && d.inversionLocal==="Sí" && d.contratoLocal && d.contratoLocal!=="Por escrito, vigencia mayor a 2 años") extras.push({grupo:"Local y permisos", t:"Inversión importante en un local con contrato corto o débil", nivel:"r"});
  const brechaRC = null; // Los seguros ahora viven en el módulo Riesgos y seguros
  const nivelesFrentes = grupos.map(x=>x.nivel).concat(extras.map(e=>e.nivel));
  const global = nivelesFrentes.includes("r") ? "r" : nivelesFrentes.includes("a") ? "a" : nivelesFrentes.every(n=>n==="x"||n==="n") ? "x" : "v";
  const riesgos = grupos.flatMap(x=>x.items.filter(i=>i.nivel==="r").map(i=>({grupo:x.g.nombre, t:i.p.t, resp:i.resp}))).concat(extras.filter(e=>e.nivel==="r").map(e=>({grupo:e.grupo, t:e.t, resp:""})));
  const atencion = grupos.flatMap(x=>x.items.filter(i=>i.nivel==="a").map(i=>({grupo:x.g.nombre, t:i.p.t, resp:i.resp}))).concat(extras.filter(e=>e.nivel==="a").map(e=>({grupo:e.grupo, t:e.t, resp:""})));
  const seguros = [];
  return {grupos, extras, global, riesgos, atencion, brechaRC, seguros};
}

/* ------------------------- Tarjeta en Clínica ------------------------- */
async function renderCardLegal(container, exp){
  const card = document.createElement("div");
  card.className = "card area-card";
  card.innerHTML = `<div class="area-head" style="cursor:default"><div class="area-icon">⚖️</div>
    <div style="flex:1;min-width:0"><div class="area-name">Legal</div><div class="area-sub">Estructura, local, contratos, pacientes, marca y contingencias</div></div></div>
    <div class="area-body"><div id="leg-list"><div class="muted small">Cargando…</div></div>
    <button class="action-btn" id="btn-leg-new" style="margin-top:10px;margin-bottom:0"><span>+ Nuevo check-up legal</span><span>→</span></button></div>`;
  container.appendChild(card);
  card.querySelector("#btn-leg-new").onclick = () => legIniciar(exp);
  const list = card.querySelector("#leg-list");
  if(!navigator.onLine){ list.innerHTML = `<div class="empty-note">Sin conexión.</div>`; return; }
  const { data, error } = await sb.from("evaluaciones_legales").select("*").eq("expediente_id", exp.id).is("anulado_at", null).order("fecha",{ascending:false});
  if(error){ list.innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
  list.innerHTML = (data||[]).length ? "" : `<div class="empty-note">Sin check-ups legales todavía.</div>`;
  (data||[]).forEach(ev=>{
    const r = legCalcular(ev.datos); const pend = ev.pendientes||[];
    const row = document.createElement("div"); row.className="small-row"; row.style.cursor="pointer";
    row.innerHTML = `<span>${esc(ev.fecha)}${pend.length?` · ${pend.filter(x=>x.estatus==="Resuelto").length}/${pend.length} resueltos`:""}</span><span style="font-weight:600;color:${FIS_COLOR[r.global]}">● ${FIS_LABEL[r.global]}</span>`;
    row.onclick = () => { state.legEval = {...ev, expediente_nombre: exp.nombre_expediente, secIdx:0}; go(ev.estatus==="completada" ? "leg-resultado" : "leg-wizard"); };
    list.appendChild(row);
  });
}
async function legIniciar(exp){
  const datos = {};
  try{
    const [fis, op] = await Promise.all([
      sb.from("evaluaciones_fiscales").select("datos").eq("expediente_id", exp.id).is("anulado_at", null).order("fecha",{ascending:false}).limit(1),
      sb.from("evaluaciones_financieras").select("datos").eq("expediente_id", exp.id).is("anulado_at", null).order("fecha",{ascending:false}).limit(1),
    ]);
    const reg = fis.data?.[0]?.datos?.regimen || op.data?.[0]?.datos?.regimen;
    if(reg) datos.tipoPersona = /moral/i.test(reg) ? "Persona moral" : /física/i.test(reg) ? "Persona física" : undefined;
    if(datos.tipoPersona==="Persona física") datos.poderes = "El médico firma por sí mismo (persona física)";
  }catch(e){}
  state.legEval = {id:null, expediente_id:exp.id, expediente_nombre:exp.nombre_expediente, fecha:new Date().toISOString().slice(0,10), estatus:"borrador", datos, documentos:{}, abogado:"", pendientes:[], secIdx:0};
  go("leg-wizard");
}
async function legGuardar(ev, estatus){
  if(!navigator.onLine) return {ok:false, offline:true};
  const row = {expediente_id:ev.expediente_id, fecha:ev.fecha, datos:ev.datos, documentos:ev.documentos, abogado:ev.abogado||null, pendientes:ev.pendientes||[], estatus: estatus||ev.estatus||"borrador"};
  if(row.estatus==="completada"){ const r = legCalcular(ev.datos); row.resultado = {global:r.global, riesgos:r.riesgos.length, segurosFaltantes:r.seguros.filter(s=>s.falta).map(s=>s.k)}; }
  const res = ev.id ? await sb.from("evaluaciones_legales").update(row).eq("id", ev.id).select("id").single()
                    : await sb.from("evaluaciones_legales").insert(row).select("id").single();
  if(res.error) return {ok:false, error:res.error};
  ev.id = res.data.id; ev.estatus = row.estatus; return {ok:true};
}

/* ------------------------- Captura ------------------------- */
function renderLegWizard(){
  const ev = state.legEval; if(!ev){ go("dashboard"); return; }
  const total = LEG_GRUPOS.length + 1, esDocs = ev.secIdx === LEG_GRUPOS.length;
  const g = esDocs ? null : LEG_GRUPOS[ev.secIdx]; const d = ev.datos;
  $app.innerHTML = `
    <div class="topbar"><div class="topbar-row"><button class="back-btn" id="btn-back">←</button>
      <div style="flex:1"><p class="brand">LEGAL · ${ev.secIdx+1} DE ${total}</p><h1 style="font-size:18px">${esDocs?"Documentos para el abogado":esc(g.nombre)}</h1></div></div>
      <div style="height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin-top:10px"><div style="height:4px;width:${Math.round(100*(ev.secIdx+1)/total)}%;background:var(--gold-500);border-radius:2px"></div></div></div>
    <div class="content">
      <p class="muted small" style="margin:0 0 10px">${esDocs ? "Marca qué te entregó el médico (copias)." : "Las preguntas se ajustan según las respuestas: socios, personal, local, paquetes."}</p>
      <div id="leg-form"></div>
      <div id="leg-note" class="muted small" style="text-align:center;margin:6px 0 10px"></div>
      <div style="display:flex;gap:10px">${ev.secIdx>0?`<button class="btn btn-ghost" id="leg-prev" style="flex:1">← Anterior</button>`:""}
        <button class="btn btn-primary" id="leg-next" style="flex:2">${ev.secIdx===total-1?"Ver resultado →":"Siguiente →"}</button></div>
    </div>`;
  const form = document.getElementById("leg-form");
  const pintar = () => {
    form.innerHTML = "";
    if(esDocs){
      LEG_DOCS.filter(dd=>!dd.si || dd.si(d)).forEach(dd=>{
        const card = document.createElement("div"); card.className="card"; card.style.padding="12px";
        const cur = ev.documentos[dd.k]||"";
        card.innerHTML = `<div style="font-weight:500;margin-bottom:8px">${esc(dd.t)}</div><div class="chip-grid">${["Entregado","Pendiente","No aplica"].map(o=>`<span class="chip ${cur===o?"selected":""}" data-o="${o}">${o}</span>`).join("")}</div>`;
        card.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{ ev.documentos[dd.k]=ch.dataset.o; card.querySelectorAll(".chip").forEach(x=>x.classList.toggle("selected",x===ch)); });
        form.appendChild(card);
      });
      return;
    }
    g.preguntas.filter(p=>!p.si || p.si(d)).forEach(p=>{
      const card = document.createElement("div"); card.className="card"; card.style.padding="12px";
      if(p.num || p.txt){
        card.innerHTML = `<div style="font-weight:500;margin-bottom:8px">${esc(p.t)}</div><input type="text" ${p.num?'inputmode="decimal"':""} value="${esc(d[p.k]??"")}">${p.sup?`<p class="muted small" style="margin:6px 0 0">Supuesto tuyo: el reporte compara la suma del médico contra este parámetro.</p>`:""}`;
        card.querySelector("input").addEventListener("change", e=>{ d[p.k] = e.target.value.trim(); pintar(); });
      } else {
        card.innerHTML = `<div style="font-weight:500;margin-bottom:8px">${esc(p.t)}</div>` + p.o.map(([val,n])=>`<div class="op-opt ${d[p.k]===val?"selected":""}" data-val="${esc(val)}"><span class="op-lvl" style="background:${FIS_COLOR[n]}">●</span><span>${esc(val)}</span></div>`).join("");
        card.querySelectorAll(".op-opt").forEach(o=>o.onclick=()=>{ d[p.k] = o.dataset.val; pintar(); });
      }
      form.appendChild(card);
    });
  };
  pintar();
  const guardar = async () => { const r = await legGuardar(ev); if(!r.ok){ const n=document.getElementById("leg-note"); if(n) n.textContent = r.offline ? "📴 Sin conexión: se guardará al recuperar señal." : "No se pudo guardar: "+(r.error?.message||""); } };
  document.getElementById("btn-back").onclick = async () => { await guardar(); go("expediente", {currentExpediente:{id:ev.expediente_id, nombre_expediente:ev.expediente_nombre}}); };
  const prev = document.getElementById("leg-prev"); if(prev) prev.onclick = async ()=>{ await guardar(); ev.secIdx--; go("leg-wizard"); };
  document.getElementById("leg-next").onclick = async ()=>{ await guardar(); if(ev.secIdx<total-1){ ev.secIdx++; go("leg-wizard"); } else go("leg-resultado"); };
}

      <div style="flex:1"><p class="brand">LEGAL</p><h1 style="font-size:18px">${esc(ev.expediente_nombre||"")}</h1></div></div></div>

        <label class="small muted" style="margin-top:8px">Abogado de la Red asignado</label>

      <div class="card"><div class="section-title">Seguimiento del abogado (${pend.filter(x=>x.estatus==="Resuelto").length}/${pend.length} resueltos)</div>
        <div id="leg-pend"></div>
        <button class="btn btn-ghost" id="leg-add-pend" style="margin-top:8px">+ Agregar pendiente</button>

      <div id="leg-note" class="muted small" style="text-align:center;margin:6px 0 10px"></div>
      ${ev.estatus!=="completada"?`<button class="action-btn" id="leg-complete"><span>✓ Marcar como completado</span><span>→</span></button>`:""}
      <button class="action-btn" id="leg-pdf-med" style="background:var(--navy-800)"><span>⚖️ Mapa legal (médico)</span><span>→</span></button>
      <button class="action-btn" id="leg-pdf-abo" style="background:#3A3A3A"><span>🔒 Paquete para el abogado (PDF)</span><span>→</span></button>
      <button class="btn btn-ghost" id="leg-edit" style="margin-top:4px">Editar respuestas y documentos</button>
    </div>`;
  const guardar = async () => { const x = await legGuardar(ev); const n = document.getElementById("leg-note"); if(n) n.textContent = x.ok ? "Guardado." : (x.offline ? "📴 Sin conexión." : "No se pudo guardar."); };
  document.getElementById("leg-abogado").addEventListener("change", e=>{ ev.abogado = e.target.value.trim(); guardar(); });
  const pl = document.getElementById("leg-pend"); const EST = ["Pendiente","En proceso","Resuelto"];
  pend.forEach((x,i)=>{
    const row = document.createElement("div"); row.className="small-row"; row.style.display="block";
    row.innerHTML = `<div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(x.tarea)}</span><span class="muted small">${esc(x.fecha||"")}</span></div>

    row.querySelectorAll("[data-e]").forEach(ch=>ch.onclick=async()=>{ x.estatus=ch.dataset.e; await guardar(); renderLegResultado(); });

function rieExtras(d){
  const ex = [];
  if(d.rc==="Tiene" && d.rcVigencia && d.rcVigencia < new Date().toISOString().slice(0,10)) ex.push({grupo:"Responsabilidad civil", t:"La póliza de RC profesional está vencida", nivel:"r"});
  if(RIE_SOCIOS(d) && d.intersocios!=="Tiene" && d.compraventaSocios && d.compraventaSocios!=="Sí, con fondeo (seguro)") ex.push({grupo:"Continuidad del negocio", t:"Socios sin acuerdo de compraventa fondeado por seguro intersocios", nivel:"r"});

/* =========================== RIESGOS Y SEGUROS (módulo propio) ===========================
   Separado de Legal. Todo tipo de seguro excepto vida y GMM personales del médico.
   El semáforo es criterio de prudencia de Elementos Financieros, no obligación legal. */
const RIE_CONTEXTO = {id:"contexto", nombre:"Contexto", preguntas:[
  {k:"socios", t:"¿Tiene socios?", o:[["No, es solo el médico","n"],["Sí, tiene socios","n"]]},
  {k:"numPersonal", t:"Personas que trabajan en la clínica además del médico", num:true},
]};
const RIE_GRUPOS_PM = [RIE_CONTEXTO, ...RIE_GRUPOS];
function rieCalcular(datos){
  const d = datos||{};
  const grupos = RIE_GRUPOS.map(g=>{
    const items = g.preguntas.filter(p=>!p.num && !p.txt && (!p.si || p.si(d))).map(p=>{ const op = (p.o||[]).find(o=>o[0]===d[p.k]); return {p, resp:d[p.k]||"", nivel: op ? op[1] : "x"}; });
    const nv = items.map(i=>i.nivel).filter(n=>n!=="n");
    const nivel = !nv.length ? "n" : nv.includes("r") ? "r" : nv.includes("a") ? "a" : nv.every(n=>n==="x") ? "x" : nv.includes("x") ? "a" : "v";
    return {g, items, nivel};
  });
  const extras = rieExtras(d);
  const ref = finN(d.rcReferencia), suma = finN(d.rcSuma);
  const brechaRC = (d.rc==="Tiene" && ref && suma!==null && suma<ref) ? ref - suma : null;
  if(brechaRC) extras.push({grupo:"Responsabilidad civil", t:`Suma asegurada de RC por debajo de la referencia (faltan ${finM(brechaRC)})`, nivel:"a"});
  const niv = grupos.map(x=>x.nivel).concat(extras.map(e=>e.nivel));
  const global = niv.includes("r") ? "r" : niv.includes("a") ? "a" : niv.every(n=>n==="x"||n==="n") ? "x" : "v";
  const lista = n => grupos.flatMap(x=>x.items.filter(i=>i.nivel===n).map(i=>({grupo:x.g.nombre, t:i.p.t, resp:i.resp}))).concat(extras.filter(e=>e.nivel===n).map(e=>({grupo:e.grupo, t:e.t, resp:""})));
  const seguros = RIE_SEGUROS.filter(s=>!s.si || s.si(d)).map(s=>({...s, estado: d[s.k]||"Sin dato", falta: d[s.k]!=="Tiene" && !/^No (hay|tiene auto|tiene equipos)/.test(d[s.k]||"")}));
  return {grupos, extras, global, riesgos:lista("r"), atencion:lista("a"), brechaRC, seguros};
}

/* Hereda lo que ya se capturó: socios y personal del check-up legal, y los seguros que antes vivían ahí. */
const RIE_DESDE_LEGAL = ["socios","numPersonal","compraventaSocios","rc","rcAseguradora","rcSuma","rcVigencia","rcPersonal","rcDefensa","rcRetro","rcSiniestros","rcEstab","danos","valorEquipos","interrupcion","personaClave","intersocios","gmmColectivo","vidaGrupo","rcReferencia"];
async function rieIniciar(exp){

async function rieGuardar(ev, estatus){

/* =========================== CHECK-UPS RECIBIDOS (autodiagnóstico de clientes) ===========================
   El médico contesta la liga checkup.html desde su celular; las respuestas caen en checkups_recibidos.
   Aquí se revisan y se convierten en check-ups Fiscal / Legal / Riesgos de un expediente, sin recapturar. */
const LIGA_CLIENTES = "https://26elementos-tech.github.io/Plataforma-madre-/checkup.html";
const REC_MOD = {fiscal:"Fiscal", legal:"Legal", riesgos:"Riesgos y seguros"};
const REC_EXTRA = {efectivoPct:"Parte de los cobros en efectivo", efectivoDestino:"Qué hace con el efectivo"};
function recPregunta(mod, k){
  if(REC_EXTRA[k]) return REC_EXTRA[k];
  const G = mod==="fiscal" ? [...FIS_GRUPOS, FIS_PERFIL] : mod==="legal" ? LEG_GRUPOS : RIE_GRUPOS_PM;
  for(const g of G){ const p = g.preguntas.find(x=>x.k===k); if(p) return p.t; }
  return k;
}
function recCalcular(mod, d){ return mod==="fiscal" ? fisCalcular(d||{}) : mod==="legal" ? legCalcular(d||{}) : rieCalcular(d||{}); }
async function renderRecibidos(container){

/* ------------------------- Spa: clasificación automática por servicios -------------------------
   Si se elige "Spa", la herramienta pregunta qué se hace en las cabinas. Si hay servicios médicos
   (aparatología, inyectables, peelings médicos), reclasifica como clínica de medicina estética
   no quirúrgica (+ aparatología) y deja un hallazgo automático. */
const SPA_SERVICIOS = [
  {s:"Masajes", m:false}, {s:"Faciales con cosméticos", m:false}, {s:"Depilación con cera", m:false},
  {s:"Envolturas y exfoliación corporal", m:false}, {s:"Manicure y pedicure", m:false},
  {s:"Aparatología corporal de uso cosmético (cavitación, radiofrecuencia, vacumterapia, presoterapia)", m:false},
  {s:"Depilación láser o IPL", m:true, ap:true, sv:["Depilación láser","Láser dermatológico"]},
  {s:"Radiofrecuencia de grado médico", m:true, ap:true, sv:["Radiofrecuencia"]},
  {s:"HIFU (ultrasonido focalizado)", m:true, ap:true, sv:["Tratamientos faciales"]},
  {s:"Criolipólisis de grado médico", m:true, ap:true, sv:["Tratamientos corporales"]},
  {s:"Cavitación de grado médico", m:true, ap:true, sv:["Tratamientos corporales"]},
  {s:"Láser facial o dermatológico", m:true, ap:true, sv:["Láser dermatológico"]},
  {s:"Hidrafacial o microdermoabrasión con equipo", m:true, ap:true, sv:["Hidrafacial"]},
  {s:"Microneedling o dermapen", m:true, sv:["Microneedling"]},
  {s:"Peelings químicos", m:true, sv:["Peelings"]},
  {s:"Mesoterapia o inyectables", m:true, sv:["Mesoterapia","Inyectables"]},
  {s:"Toxina botulínica", m:true, sv:["Toxina botulínica"]},
  {s:"Rellenos (ácido hialurónico)", m:true, sv:["Ácido hialurónico"]},
];
function spaClasificar(w){
  const sel = SPA_SERVICIOS.filter(x=>(w.spaServicios||[]).includes(x.s));
  const medicos = sel.filter(x=>x.m);
  const out = {medico: medicos.length>0, aparatologia: medicos.some(x=>x.ap), servicios: [...new Set(medicos.flatMap(x=>x.sv||[]))], medicosLista: medicos.map(x=>x.s)};
  return out;
}
function spaAplicarClasificacion(w){
  const r = spaClasificar(w);
  w.spaAuto = w.spaAuto || {tipos:[], servicios:[]};
  // quitar lo que la clasificación anterior agregó
  w.tipoEstablecimiento = w.tipoEstablecimiento.filter(t=>!w.spaAuto.tipos.includes(t));
  w.servicios = w.servicios.filter(s=>!w.spaAuto.servicios.includes(s));
  const tipos = [];
  if(r.medico && !w.tipoEstablecimiento.includes("clinica_estetica_no_qx")) tipos.push("clinica_estetica_no_qx");
  if(r.aparatologia && !w.tipoEstablecimiento.includes("aparatologia")) tipos.push("aparatologia");
  const servicios = r.servicios.filter(s=>!w.servicios.includes(s));
  w.tipoEstablecimiento.push(...tipos); w.servicios.push(...servicios);
  w.spaAuto = {tipos, servicios};
  w.spaTriage = {servicios: w.spaServicios||[], medico: r.medico, aparatologia: r.aparatologia, medicosLista: r.medicosLista, avisoMedico: w.spaAvisoMedico||""};
  return r;
}

function expaPlantillas(ev){
  const f = ev.facts || {}; const T = f.tipoEstablecimiento||[]; const S = f.servicios||[];
  const estS = ["Toxina botulínica","Ácido hialurónico","Bioestimuladores","Skinboosters","Mesoterapia","Microneedling","Peelings","Radiofrecuencia","Depilación láser","Láser dermatológico","Inyectables"];
  const dental = T.includes("dental") || S.some(s=>["Consulta odontológica","Procedimientos odontológicos","Cirugía dental","Restauraciones con amalgama"].includes(s));
  const medico = T.some(t=>["consultorio_general","consultorio_especialidad","clinica_estetica_no_qx","clinica_estetica_invasiva","establecimiento_quirurgico","hospital","quirofano"].includes(t)) || S.some(s=>estS.includes(s)||["Consulta general","Consulta de especialidad","Valoración médica","Cirugía estética"].includes(s));
  const estetica = T.includes("clinica_estetica_no_qx") || T.includes("clinica_estetica_invasiva") || S.some(s=>estS.includes(s));
  const quir = T.some(t=>["establecimiento_quirurgico","hospital","quirofano","clinica_estetica_invasiva"].includes(t)) || S.some(s=>["Cirugía estética","Cirugía ambulatoria","Procedimientos bajo anestesia"].includes(s)) || f.anestesiaSedacion==="si";
  const out = [];
  if(medico) out.push("base"); if(estetica) out.push("estetica"); if(dental) out.push("dental"); if(quir) out.push("quirurgico");
  if(dental && !medico) out.push("base_formal"); // dentista solo: formalidades de NOM-004 aplicables
  return out;
}
function expaItems(ev){
  const pl = expaPlantillas(ev); const items = [];
  pl.forEach(p=>{
    if(p==="base_formal") EXPA_ITEMS.base.items.filter(i=>["b8","b9","b11","b12"].includes(i.k)).forEach(i=>items.push({...i, grupo:"Formalidades (NOM-004)"}));
    else EXPA_ITEMS[p].items.forEach(i=>items.push({...i, grupo:EXPA_ITEMS[p].label}));
  });
  return items;
}
function expaResumen(items, exps){
  return items.map(it=>{
    const vals = exps.map(e=>(e.r||{})[it.k]).filter(v=>v==="si"||v==="no");
    const no = vals.filter(v=>v==="no").length;
    return {...it, evaluados: vals.length, fallan: no};
  });
}

async function generarPdfExpAudit(ev, items, exps){

  const c = finPdfBase(); const {doc} = c;
  drawPortadaPdf(doc, {titulo:"Auditoría de expedientes clínicos", subtitulo:"Resultado de la muestra y guía de llenado", cliente:clinica, detalle:`Visita: ${ev.fecha_visita||"—"} · ${exps.length} expediente(s) revisado(s)`, detalle2:[datosEst.municipio, datosEst.estado].filter(Boolean).join(", ")});
  c.header("Auditoría de expedientes clínicos", clinica);
  c.body(`Se revisó una muestra de ${pl(exps.length,"expediente","expedientes")}; para proteger a los pacientes solo aparecen su folio o iniciales. Para cada elemento se indica en cuántos expedientes falla. La sección final es la guía de llenado que debe seguir todo expediente de este establecimiento.`, {size:10.5, lh:15}); c.y+=6;
  const fallan = res.filter(x=>x.fallan);
  c.heading(`Lo que falla (${fallan.length})`);
  if(fallan.length) fallan.sort((a,b)=>(a.rec-b.rec) || (b.fallan/b.evaluados - a.fallan/a.evaluados)).forEach(x=>{ c.row(x.t + (x.rec?" (recomendado)":""), `${x.fallan} de ${x.evaluados}`, x.fallan===x.evaluados && !x.rec); if(x.p) c.body("Cómo se corrige: "+x.p, {size:9, indent:10, color:c.SOFT, lh:11}); });
  else c.body("En la muestra revisada no se encontraron fallas.", {size:10.5});
  c.heading("Detalle por expediente");
  exps.forEach(e=>{ const no = items.filter(it=>(e.r||{})[it.k]==="no"); c.body(`${expaRefPrivada(e.ref)}: ${no.length ? no.length+" elemento(s) faltante(s)" : "sin fallas"}`, {bold:true, size:10.5}); no.forEach(it=>c.body("•  "+it.t, {size:9.5, indent:10, lh:12})); c.y+=3; });
  c.heading("Guía de llenado");
  [...new Set(items.map(i=>i.grupo))].forEach(g=>{
    c.body(g, {bold:true, size:11, color:c.NAVY});
    items.filter(i=>i.grupo===g).sort((a,b)=>(a.rec?1:0)-(b.rec?1:0)).forEach(i=>{ c.body(`[  ]  ${i.t}${i.rec?" (recomendado)":" (obligatorio)"}`, {size:10, indent:6, lh:13}); if(i.p) c.body(i.p, {size:8.5, indent:22, lh:11}); c.body(i.f, {size:8, indent:22, color:c.SOFT, lh:10}); });
    c.y+=4;
  });
  c.body("Conservación: todo expediente debe guardarse al menos 5 años desde el último acto médico (NOM-004, 5.4).", {size:9.5, color:c.SOFT, lh:12});
  c.y+=6; c.body("Auditoría preventiva sobre una muestra; no sustituye una verificación de la autoridad. Los datos de pacientes no se registran en la plataforma.", {size:8.5, color:c.SOFT, lh:11});
  await c.save(`AUDITORIA-EXPEDIENTES-${carpetaSlug(clinica,4)}-${ev.fecha_visita||""}.pdf`);
}

  if(efectivoSinBanco) motivosReg.push("efectivo de cobros sin depositar");
  if(motivosReg.length) ops.push({k:"reg", prio:"alta", titulo:"Ponerse al corriente sin multas ni recargos",
    medico:"Puede poner en orden sus impuestos pendientes pagando lo que debe, sin multas ni recargos encima.",
    fiscalista:`Evaluar regularización con reducción de multas y recargos (créditos de 2025 y anteriores). Motivos: ${motivosReg.join(", ")}.`});
  if(pf && hasta5) ops.push({k:"resico", prio:"alta", titulo:"Podría pagar menos impuestos en RESICO",
    medico:"Por sus ingresos, podría cambiarse a un régimen simplificado y pagar bastante menos impuesto, dentro de la ley.",
    fiscalista:`Persona física con actividad profesional y ingresos ${String(d.ingresosRango).toLowerCase()}: evaluar RESICO PF con límite propuesto de $5 MDP.`});
  if((pf && hasta5 || d.operaComo === "RESICO persona física") && (estetico || d.iva !== "Sí, lo revisó con su contador")) ops.push({k:"iva", prio:"media", titulo:"Revisar el IVA de sus tratamientos",
    medico:"Conviene revisar si sus tratamientos causan IVA y si le conviene la nueva opción simplificada.",
    fiscalista:"Revisar qué servicios están gravados (tratamientos estéticos) y evaluar la opción de IVA al 7% sobre contraprestaciones gravadas cobradas en RESICO."});
  if(d.extranjero === "Sí") ops.push({k:"repat", prio:"media", titulo:"Traer a México recursos del extranjero con impuesto reducido",
    medico:"Si tiene dinero fuera de México, podría traerlo pagando un impuesto menor al normal.",
    fiscalista:"Evaluar el régimen temporal de repatriación al 7.5% (recursos en el extranjero al 8-sep-2026, retorno a más tardar el 31-dic-2027)."});
  const motivosDisc = [];
  if(d.pagoMedico === "Retira sin comprobante") motivosDisc.push("retiro sin comprobante");
  if(efectivoSinBanco) motivosDisc.push("efectivo sin depositar");
  if(d.separadas === "No") motivosDisc.push("cuentas personales y de la clínica mezcladas");
  if(motivosDisc.length) ops.push({k:"disc", prio:"alta", titulo:"Riesgo de que el SAT cobre sobre gastos no justificados",
    medico:"Si sus gastos no cuadran con lo que declara, el SAT puede cobrarle impuestos sobre la diferencia. Hoy es el mejor momento para ordenarlo.",
    fiscalista:`Riesgo de discrepancia fiscal (art. 91 LISR). Motivos: ${motivosDisc.join(", ")}.`});
  const orden = {alta:0, media:1};
  return ops.sort((a,b)=>orden[a.prio]-orden[b.prio]);
}
async function ultFinanzas(expId){
  try{ const { data } = await sb.from("evaluaciones_financieras").select("*").eq("expediente_id", expId).is("anulado_at", null).order("fecha",{ascending:false}).limit(1); return data && data[0] ? finCalcular(data[0].datos, data[0].supuestos) : null; }
  catch(e){ return null; }
}
/* Sección para los PDF (médico y fiscalista) */
async function pdfSeccion2027(c, ev, modo){
  const est = await getEstado2027(); const f = await ultFinanzas(ev.expediente_id);
  const ops = fisOportunidades2027(ev.datos, f);
  c.heading(modo==="medico" ? "2027: lo que le conviene" : "6. Oportunidades y riesgos 2027");
  if(!ops.length){ c.body(modo==="medico" ? "Con lo que nos compartió, no detectamos oportunidades especiales para 2027. Aun así, conviene revisar su caso con un especialista." : "Sin oportunidades detectadas con los datos capturados.", {size:10.5}); }
  ops.forEach(o=>{ c.body(`${o.prio==="alta"?"●":"○"}  ${o.titulo}`, {bold:true, size:11, color:o.prio==="alta"?c.RED:c.GOLD}); c.body(modo==="medico" ? o.medico : o.fiscalista, {size:10.5, lh:14}); c.y += 4; });
  if(modo!=="medico"){ const d = ev.datos||{}; c.body(`Perfil: ${d.especialidad||"—"} · ingresos ${d.ingresosRango||"—"} · ${d.operaComo||"—"} · extranjero: ${d.extranjero||"—"}`, {size:9.5, color:c.SOFT, lh:12}); }
  c.body(etiqueta2027(est) + ". Cada caso lo debe revisar un especialista fiscal.", {size:8.5, color:c.SOFT, lh:11});
}
/* Radar 2027: a quién llamar primero + validación de la hipótesis de exceso de efectivo */
async function renderRadar2027(){
  if(!esAdmin()){ go("dashboard"); return; }
  $app.innerHTML = `<div class="topbar"><div class="topbar-row"><button class="back-btn" id="btn-back">←</button>
    <div style="flex:1"><p class="brand">RADAR 2027</p><h1 style="font-size:18px">Oportunidades fiscales</h1></div></div></div>
    <div class="content"><div id="rd"><div class="muted small">Cargando…</div></div></div>`;
  document.getElementById("btn-back").onclick = () => go("dashboard");
  if(!navigator.onLine){ document.getElementById("rd").innerHTML = `<div class="empty-note">El Radar necesita conexión.</div>`; return; }
  const est = await getEstado2027();
  const [{ data: exps }, { data: fis }, { data: fins }] = await Promise.all([
    sb.from("expedientes").select("id,nombre_expediente").is("archivado_at", null),
    sb.from("evaluaciones_fiscales").select("*").is("anulado_at", null).order("fecha",{ascending:false}),
    sb.from("evaluaciones_financieras").select("*").is("anulado_at", null).order("fecha",{ascending:false})]);
  const ultimo = (arr) => { const m = {}; (arr||[]).forEach(r=>{ if(!m[r.expediente_id]) m[r.expediente_id] = r; }); return m; };
  const F = ultimo(fis), FN = ultimo(fins);
  const filas = (exps||[]).filter(e=>F[e.id]).map(e=>{
    const f = FN[e.id] ? finCalcular(FN[e.id].datos, FN[e.id].supuestos) : null;
    const d = F[e.id].datos || {}; const ops = fisOportunidades2027(d, f);
    return {e, d, f, ops, score: ops.filter(o=>o.prio==="alta").length*2 + ops.filter(o=>o.prio==="media").length};
  }).sort((a,b)=>b.score-a.score);
  const sinFis = (exps||[]).filter(e=>!F[e.id]).length;
  // Validación de hipótesis por especialidad
  const porEsp = {};
  filas.forEach(r=>{ const k = r.d.especialidad || "Sin especialidad"; porEsp[k] = porEsp[k] || {n:0, conExceso:0, suma:0};
    porEsp[k].n++; if(r.f && r.f.exceso>0){ porEsp[k].conExceso++; porEsp[k].suma += r.f.exceso; } });
  const rd = document.getElementById("rd");
  rd.innerHTML = `
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div><div class="section-title" style="margin:0">Estado de las reglas</div><div class="small" style="margin-top:4px">${esc(etiqueta2027(est))}</div></div>
      <button class="btn btn-ghost" id="rd-toggle" style="white-space:nowrap">${est==="aprobado"?"Marcar como propuesta":"Marcar como aprobado"}</button></div></div>
    <div class="card"><div class="section-title">A quién llamar primero</div>
      ${filas.length ? filas.map(r=>`<div class="small-row" style="display:block;cursor:pointer" data-exp="${r.e.id}">
        <div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(r.e.nombre_expediente)}</b><span class="small" style="color:${r.score>=4?"#B3261E":r.score>=2?"#B8860B":"#2E7D4F"}">${r.ops.length} oportunidad(es)</span></div>
        <div class="muted small">${esc(r.d.especialidad||"Sin especialidad")} · ${esc(r.d.ingresosRango||"ingresos sin dato")}${r.f && r.f.exceso>0?` · exceso de efectivo ${finM(r.f.exceso)}`:""}</div>
        ${r.ops.length?`<div class="small" style="margin-top:4px">${r.ops.map(o=>`${o.prio==="alta"?"●":"○"} ${esc(o.titulo)}`).join("<br>")}</div>`:""}</div>`).join("") : `<div class="empty-note">Aún no hay check-ups fiscales. Haz el de cada cliente para que aparezca aquí.</div>`}
      ${sinFis?`<p class="muted small" style="margin:8px 0 0">${sinFis} expediente(s) sin check-up fiscal todavía.</p>`:""}</div>
    <div class="card"><div class="section-title">Validación: exceso de efectivo por especialidad</div>
      ${Object.keys(porEsp).length ? Object.entries(porEsp).map(([k,v])=>`<div class="small-row"><span>${esc(k)} (${v.n})</span><span class="muted small">${v.conExceso} con exceso · promedio ${v.conExceso?finM(v.suma/v.conExceso):"—"}</span></div>`).join("") : `<div class="muted small">Se llenará conforme hagas check-ups fiscales y diagnósticos financieros.</div>`}</div>`;
  rd.querySelectorAll("[data-exp]").forEach(el=>el.onclick=()=>{ const e = (exps||[]).find(x=>x.id===el.dataset.exp); EXP_TAB = "clinica"; go("expediente", {currentExpediente: e}); });
  document.getElementById("rd-toggle").onclick = async () => {
    const nuevo = est === "aprobado" ? "propuesta" : "aprobado";
    const { error } = await sb.from("config_plataforma").upsert({clave:"reglas_2027", valor:{estado:nuevo}, updated_at:new Date().toISOString()});
    if(error){ showError("No se pudo cambiar: " + error.message); return; }
    REGLAS_2027 = nuevo; renderRadar2027();
  };
}
