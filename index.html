/* ------------------------------- Offline — Punto 1: IDs locales + idempotencia -------------------------------
   Toda entidad nueva (hallazgo, elemento de inventario, evidencia, evaluación) recibe su
   UUID definitivo en el dispositivo (crypto.randomUUID()) ANTES de cualquier llamada a
   Supabase. Ese mismo UUID es el id final tanto local como remoto -- nunca se sustituye.
   La cola es única, con estado por operación (PENDING/SYNCING/SYNCED/ERROR) y reintentos
   seguros. La idempotencia real la da Postgres (upsert con onConflict=id,
   ignoreDuplicates=true contra la PRIMARY KEY existente) -- no es solo lógica de JS: si
   la misma operación se reenvía, el propio servidor la reconoce como ya existente.
   Fotos: el archivo se guarda completo en IndexedDB si no hay señal, y se comprime/sube
   hasta que la evidencia (ya con su UUID) pueda sincronizarse.
   Fuera de este punto todavía: abrir un expediente nunca antes cargado sin conexión, y
   cerrar una evaluación sin señal -- quedan para el siguiente punto del diseño offline. */
function newId(){ return crypto.randomUUID(); }

const OFFLINE_DB = "plataforma_madre_offline", OFFLINE_DB_VERSION = 2;
const STORE_QUEUE = "queue", STORE_BLOBS = "blobs", STORE_KV = "kv";
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(OFFLINE_DB, OFFLINE_DB_VERSION);
    req.onupgradeneeded = (ev)=>{
      const db = req.result;
      if(db.objectStoreNames.contains("queue") && ev.oldVersion < 2){
        db.deleteObjectStore("queue"); // esquema anterior (Etapa 6), incompatible -- sin datos reales de cliente todavía
      }
      const qs = db.createObjectStore(STORE_QUEUE, {keyPath:"operation_id"});
      qs.createIndex("by_entity", ["entity","entity_id"], {unique:false});
      qs.createIndex("by_status", "status", {unique:false});
      if(!db.objectStoreNames.contains(STORE_BLOBS)) db.createObjectStore(STORE_BLOBS, {keyPath:"id"});
      if(!db.objectStoreNames.contains(STORE_KV)) db.createObjectStore(STORE_KV, {keyPath:"key"});
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
function idbTx(storeName, mode){
  return idbOpen().then(db=>db.transaction(storeName, mode).objectStore(storeName));
}
async function idbPut(storeName, value){
  const store = await idbTx(storeName, "readwrite");
  return new Promise((resolve,reject)=>{ const r=store.put(value); r.onsuccess=()=>resolve(value); r.onerror=()=>reject(r.error); });
}
async function idbGet(storeName, key){
  const store = await idbTx(storeName, "readonly");
  return new Promise((resolve,reject)=>{ const r=store.get(key); r.onsuccess=()=>resolve(r.result||null); r.onerror=()=>reject(r.error); });
}
async function idbDeleteKey(storeName, key){
  const store = await idbTx(storeName, "readwrite");
  return new Promise((resolve,reject)=>{ const r=store.delete(key); r.onsuccess=()=>resolve(); r.onerror=()=>reject(r.error); });
}
async function idbGetAllQueue(){
  const store = await idbTx(STORE_QUEUE, "readonly");
  return new Promise((resolve,reject)=>{ const r=store.getAll(); r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error); });
}
async function idbFindPendingByEntity(entity, entityId){
  const all = await idbGetAllQueue();
  return all.find(e=>e.entity===entity && e.entity_id===entityId && (e.status==="PENDING"||e.status==="ERROR") && e.operation_type!=="DELETE") || null;
}

/* --------- Punto 8: compactación segura de UPDATE repetidos sobre lo mismo aún no sincronizado --------- */
async function queueOperation(entity, entityId, operationType, payload){
  const existing = await idbFindPendingByEntity(entity, entityId);
  const now = new Date().toISOString();
  if(existing && operationType!=="DELETE"){
    // Ya hay una operación pendiente para esta misma entidad (CREATE o UPDATE): se
    // funde el payload nuevo sobre el existente y se manda UNA sola vez, con todos los
    // campos acumulados -- nunca se pierden cambios, nunca se duplica la operación.
    existing.payload = {...existing.payload, ...payload};
    existing.updated_at = now;
    existing.status = "PENDING"; existing.last_error = null;
    await idbPut(STORE_QUEUE, existing);
    return existing;
  }
  const entry = {
    operation_id: newId(), entity, entity_id: entityId, operation_type: operationType,
    payload, created_at: now, updated_at: now,
    status: "PENDING", retry_count: 0, last_error: null, last_attempt_at: null,
  };
  await idbPut(STORE_QUEUE, entry);
  return entry;
}

// Único punto de escritura para entidades con id propio (hallazgos, colecciones_items,
// registros_unicos, evaluaciones, evidencias). El id SIEMPRE llega ya generado por el
// llamador (newId()) -- esta función nunca inventa uno nuevo, nunca lo reemplaza.
async function persistEntity(entity, entityId, operationType, payload){
  if(navigator.onLine){
    try{
      let res;
      if(operationType==="CREATE") res = await sb.from(entity).upsert({...payload, id:entityId}, {onConflict:"id", ignoreDuplicates:true});
      else if(operationType==="UPDATE") res = await sb.from(entity).update(payload).eq("id", entityId);
      else res = await sb.from(entity).delete().eq("id", entityId); // DELETE ya es idempotente por sí solo
      if(res.error) throw res.error;
      return {ok:true};
    }catch(err){
      if(err && err.message && /network|fetch|Failed to fetch/i.test(err.message)){
        await queueOperation(entity, entityId, operationType, payload);
        updateOfflineBanner();
        return {ok:false, queued:true};
      }
      return {ok:false, error:err}; // error real (permisos, validación) -- no se encola, no se reintenta solo
    }
  } else {
    await queueOperation(entity, entityId, operationType, payload);
    updateOfflineBanner();
    return {ok:true, queued:true};
  }
}

// Compatibilidad con lo ya existente en respuestas_criterio (llave natural
// evaluacion_id+criterio_id, ya idempotente por su propio UNIQUE -- no necesita id de
// cliente) y con cualquier operación sin id propio (ej. update por eqCol/eqVal).
async function persist(table, method, payload, eqCol, eqVal, onConflict){
  if(navigator.onLine){
    try{
      let res;
      if(method==="upsert") res = await sb.from(table).upsert(payload, {onConflict});
      else if(method==="update") res = await sb.from(table).update(payload).eq(eqCol, eqVal);
      else res = await sb.from(table).insert(payload);
      if(res.error) throw res.error;
      return {ok:true, data:res.data};
    }catch(err){
      if(err && err.message && /network|fetch|Failed to fetch/i.test(err.message)){
        await queueOperation(table, (payload&&payload.id)||`${eqCol}:${eqVal}`, method==="upsert"?"CREATE":"UPDATE", payload);
        updateOfflineBanner();
        return {ok:false, queued:true};
      }
      return {ok:false, error:err};
    }
  } else {
    await queueOperation(table, (payload&&payload.id)||`${eqCol}:${eqVal}`, method==="upsert"?"CREATE":"UPDATE", payload);
    updateOfflineBanner();
    return {ok:true, queued:true};
  }
}

/* --------- Punto 7: orden de sincronización por dependencia, sin grafo explícito ---------
   Varias pasadas sobre la cola: una operación cuyo padre (evaluacion_id/hallazgo_id/etc.)
   todavía no existe en Supabase falla por FK y se reintenta en la SIGUIENTE pasada de
   este mismo flush -- así entidades hijas (evidencias) esperan a sus padres (hallazgos)
   sin necesitar saber de antemano el orden exacto. */
async function flushOfflineQueue(){
  const MAX_PASSES = 4, MAX_RETRIES_BEFORE_ERROR = 8;
  for(let pass=0; pass<MAX_PASSES; pass++){
    const pending = (await idbGetAllQueue()).filter(e=>e.status==="PENDING");
    if(!pending.length) break;
    let advancedThisPass = false;
    for(const entry of pending){
      entry.status = "SYNCING"; entry.last_attempt_at = new Date().toISOString();
      await idbPut(STORE_QUEUE, entry);
      try{
        let ok;
        if(entry.entity === "evidencias_blob"){ ok = await syncBlobEvidencia(entry); }
        else if(entry.entity === "rpc:crear_snapshot_evaluacion"){
          const { error } = await sb.rpc("crear_snapshot_evaluacion", entry.payload);
          if(error) throw error; // si la evaluación aún no existe en Supabase, falla y se reintenta en la siguiente pasada
          ok = true;
        }
        else {
          let res;
          if(entry.operation_type==="CREATE") res = await sb.from(entry.entity).upsert({...entry.payload, id:entry.entity_id}, {onConflict:"id", ignoreDuplicates:true});
          else if(entry.operation_type==="UPDATE") res = await sb.from(entry.entity).update(entry.payload).eq("id", entry.entity_id);
          else res = await sb.from(entry.entity).delete().eq("id", entry.entity_id);
          if(res.error) throw res.error;
          ok = true;
        }
        if(ok){ await idbDeleteKey(STORE_QUEUE, entry.operation_id); advancedThisPass = true; }
      }catch(err){
        entry.retry_count = (entry.retry_count||0) + 1;
        entry.last_error = (err && err.message) || String(err);
        entry.status = entry.retry_count >= MAX_RETRIES_BEFORE_ERROR ? "ERROR" : "PENDING";
        await idbPut(STORE_QUEUE, entry);
        // Un error de red detiene todo el flush (probablemente se volvió a caer la señal);
        // un error de FK/validación solo detiene ESA entrada, las demás siguen su pasada.
        if(err && err.message && /network|fetch|Failed to fetch/i.test(err.message)){
          updateOfflineBanner(); return;
        }
      }
    }
    if(!advancedThisPass) break; // nada avanzó en esta pasada -- reintentar más no ayuda ahora
  }
  updateOfflineBanner();
}

async function updateOfflineBanner(){
  let bar = document.getElementById("offline-banner");
  const all = await idbGetAllQueue();
  const pending = all.filter(e=>e.status==="PENDING"||e.status==="SYNCING").length;
  const errored = all.filter(e=>e.status==="ERROR").length;
  const offline = !navigator.onLine;
  if(!offline && pending===0 && errored===0){ if(bar) bar.remove(); return; }
  if(!bar){ bar = document.createElement("div"); bar.id = "offline-banner"; document.body.appendChild(bar); }
  bar.className = offline ? "offline-bar off" : (errored ? "offline-bar err" : "offline-bar syncing");
  bar.textContent = offline
    ? `Sin conexión — tus cambios se guardan en este dispositivo${pending?` (${pending} pendiente${pending>1?"s":""})`:""}`
    : errored ? `${errored} cambio${errored>1?"s":""} con error de sincronización — toca para ver`
    : `Sincronizando ${pending} cambio${pending>1?"s":""} pendiente${pending>1?"s":""}…`;
  bar.onclick = errored ? showSyncErrors : null;
}
async function showSyncErrors(){
  const all = await idbGetAllQueue();
  const errs = all.filter(e=>e.status==="ERROR");
  if(!errs.length) return;
  const sheet = openModal(`<h3>Errores de sincronización</h3>${errs.map(e=>`
    <div class="crit-card"><div class="crit-req">${esc(e.entity)} · ${esc(e.operation_type)}</div>
    <div class="crit-meta">${esc(e.last_error||"")}</div>
    <div class="crit-meta">Intentos: ${e.retry_count}</div></div>`).join("")}
    <button class="btn btn-ghost" id="m-ok" style="width:100%;margin-top:10px">Cerrar</button>`);
  sheet.querySelector("#m-ok").onclick = closeModal;
}
/* --------- Lectura offline (siguiente punto del diseño) ---------
   Caché de lo último leído con éxito, por clave. Con señal: lee de Supabase y guarda
   copia. Sin señal (o si la red falla a medio camino): usa la copia guardada, si existe.
   Cubre expediente, evaluación (snapshot/respuestas/hallazgos) y catálogos pequeños --
   NO cubre colecciones/registros únicos todavía (alcance explícito de este punto). */
// Mantiene la caché consistente justo después de una escritura offline -- sin esto,
// agregar/editar/borrar algo sin señal seguiría mostrando la copia vieja hasta la
// siguiente vez que hubiera red para releer.
async function patchCache(cacheKey, mutatorFn){
  const existing = await idbGet(STORE_KV, "cache:"+cacheKey);
  const updated = mutatorFn(existing ? existing.value : null);
  await idbPut(STORE_KV, {key:"cache:"+cacheKey, value:updated, cachedAt: existing?existing.cachedAt:Date.now()});
}

async function cachedRead(cacheKey, queryFn){
  if(navigator.onLine){
    try{
      const result = await queryFn();
      if(!result.error){ await idbPut(STORE_KV, {key:"cache:"+cacheKey, value:result.data, cachedAt:Date.now()}); return result; }
      throw result.error;
    }catch(err){ /* cae a caché abajo, sea por red o por error real */ }
  }
  const cached = await idbGet(STORE_KV, "cache:"+cacheKey);
  if(cached) return {data:cached.value, error:null, fromCache:true, cachedAt:cached.cachedAt};
  return {data:null, error:{message:"Sin conexión y sin datos guardados en este dispositivo todavía para esto — necesitas abrirlo una vez con señal."}};
}

window.addEventListener("online", ()=>{ updateOfflineBanner(); flushOfflineQueue(); });
window.addEventListener("offline", updateOfflineBanner);
setInterval(()=>{ if(navigator.onLine) flushOfflineQueue(); }, 20000);

const $app = document.getElementById("app");
function esc(s){ return (s==null?"":String(s)).replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function go(screen, extra){ document.querySelectorAll(".fab-flag").forEach(x=>x.remove()); state.screen = screen; Object.assign(state, extra||{}); render(); window.scrollTo(0,0); saveResume(); }

/* ------------------------- Perfil fisioterapia (solo Fiscal y Legal) -------------------------
   Si el expediente es de una clínica de fisioterapia, el check-up fiscal y el legal se muestran
   con su lenguaje (titular en vez de médico, terapeutas externos, IVA de fisioterapia, RC de
   fisioterapia). Solo cambia el texto que se ve y el PDF; las respuestas se guardan igual,
   así que los cálculos y los demás expedientes siguen la ruta normal. */
function esPerfilFisio(nombre){ return /fisioterap/i.test(nombre||""); }
function perfilFisioActual(){
  const sc = state.screen||"";
  if(/^fis-/.test(sc)) return esPerfilFisio(state.fisEval && state.fisEval.expediente_nombre);
  if(/^leg-/.test(sc)) return esPerfilFisio(state.legEval && state.legEval.expediente_nombre);
  if(/^rie-/.test(sc)) return esPerfilFisio(state.rieEval && state.rieEval.expediente_nombre);
  return false;
}
const FISIO_TXT = [
  ["Tiene claro si sus tratamientos estéticos causan IVA", "Tiene claro si sus servicios de fisioterapia causan IVA (solo están exentos los que requieren título de médico, LIVA art. 15-XIV)"],
  ["(tratamientos estéticos)", "(fisioterapia: exenta solo si requiere título de médico, LIVA art. 15-XIV; validar con el contador)"],
  ["tratamiento del IVA en servicios estéticos", "tratamiento del IVA en los servicios de fisioterapia"],
  ["Uso de suelo para servicios médicos", "Uso de suelo para servicios de salud"],
  ["Contratos con médicos, aplicadores y proveedores", "Contratos con terapeutas externos y proveedores"],
  ["Contratos con médicos y aplicadores externos", "Contratos con terapeutas y especialistas externos"],
  ["Médicos o aplicadores externos", "Terapeutas o especialistas externos"],
  ["responsabilidad civil profesional médica", "responsabilidad civil profesional (fisioterapia)"],
  ["Responsabilidad civil profesional médica", "Responsabilidad civil profesional (fisioterapia)"],
  ["El RC cubre procedimientos estéticos", "El RC cubre fisioterapia y rehabilitación"],
  [" (incluidos los estéticos, si los hace)", ""],
  ["RC profesional médica", "RC profesional (fisioterapia)"],
  ["Cubre estéticos", "Cubre fisioterapia"],
  ["procedimientos estéticos", "tratamientos de fisioterapia y rehabilitación"],
  ["tratamientos estéticos", "tratamientos de fisioterapia"],
];
function adFisio(t){
  if(typeof t !== "string" || !t) return t;
  FISIO_TXT.forEach(([a,b])=>{ if(t.indexOf(a)>=0 && t.indexOf(b)<0) t = t.split(a).join(b); });
  return t.replace(/\b(el|del|al|El|Del|Al) médico\b/g, "$1 titular");
}
function aplicarFisioDom(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  while((n = w.nextNode())){ const v = n.nodeValue, nv = adFisio(v); if(nv !== v) n.nodeValue = nv; }
}
(function(){
  let pend = false;
  new MutationObserver(()=>{
    if(pend || !perfilFisioActual()) return; pend = true;
    Promise.resolve().then(()=>{ pend = false; if(perfilFisioActual()) aplicarFisioDom($app); });
  }).observe($app, {childList:true, subtree:true, characterData:true});
})();
function fisioPdf(c, ev){
  if(!ev || !esPerfilFisio(ev.expediente_nombre)) return c;
  const doc = c.doc, t0 = doc.text.bind(doc), s0 = doc.splitTextToSize.bind(doc);
  const ad = x => Array.isArray(x) ? x.map(adFisio) : adFisio(x);
  doc.text = function(txt, ...r){ return t0(ad(txt), ...r); };
  doc.splitTextToSize = function(txt, ...r){ return s0(ad(txt), ...r); };
  return c;
}

/* ------------------------- Retomar donde te quedaste -------------------------
   Si la app se cierra (el visor la descarga de memoria, se bloquea el teléfono), al volver
   a entrar ofrece regresar a la misma pantalla con lo que ya habías capturado del wizard.
   Se guarda en este dispositivo en cada cambio de pantalla, cada 3 segundos y al salir. */
const RESUME_KEY = "pm-retomar-v1";
const RESUME_LABEL = {"wizard-eval":"Nueva evaluación COFEPRIS","wizard-eval-stps":"Nueva evaluación STPS","wizard-eval-pc":"Nueva evaluación Protección Civil","op-wizard":"Check-up Operativo","op-resultado":"Resultado del Check-up Operativo","expediente":"Expediente"};
function saveResume(){
  try{
    if(["loading","login"].includes(state.screen)) return;
    if(state.screen==="dashboard"){ if(state._resumeAsked) localStorage.removeItem(RESUME_KEY); return; }
    const snap = {t:Date.now(), uid:state.session?.user?.id||null, screen:state.screen,
      currentExpediente: state.currentExpediente ? {id:state.currentExpediente.id, nombre_expediente:state.currentExpediente.nombre_expediente} : null,
      currentEvaluacion: state.currentEvaluacion || null, wizard: state.wizard || null, opEval: state.opEval || null,
      expTab: (typeof EXP_TAB!=="undefined") ? EXP_TAB : null};
    localStorage.setItem(RESUME_KEY, JSON.stringify(snap));
  }catch(e){ /* sin espacio o dato no serializable: no bloquea la app */ }
}
setInterval(saveResume, 3000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden"){ try{ document.activeElement && document.activeElement.blur && document.activeElement.blur(); }catch(e){} saveResume(); } });
window.addEventListener("pagehide", saveResume);
async function offerResume(){
  if(state._resumeAsked) return false; state._resumeAsked = true;
  let snap = null; try{ snap = JSON.parse(localStorage.getItem(RESUME_KEY)||"null"); }catch(e){}
  if(!snap || !snap.screen || Date.now()-snap.t > 24*3600*1000) return false;
  if(snap.uid && state.session?.user?.id && snap.uid !== state.session.user.id) return false;
  const label = (RESUME_LABEL[snap.screen] || "La pantalla donde estabas") + (snap.currentExpediente?.nombre_expediente ? ` · ${snap.currentExpediente.nombre_expediente}` : (snap.opEval?.expediente_nombre ? ` · ${snap.opEval.expediente_nombre}` : ""));
  const c = await askChoice(`¿Retomar donde te quedaste?\n${label}`, [{v:1,label:"Sí, retomar"},{v:0,label:"No, ir al inicio"}], o=>o.label);
  if(!c || !c.v){ localStorage.removeItem(RESUME_KEY); return false; }
  if(snap.expTab && typeof EXP_TAB!=="undefined") EXP_TAB = snap.expTab;
  go(snap.screen, {currentExpediente:snap.currentExpediente, currentEvaluacion:snap.currentEvaluacion, wizard:snap.wizard, opEval:snap.opEval});
  return true;
}

/* ------------------------- Modal genérico (reemplaza prompt/alert) -------------------------
   Quick Look (la vista previa de Archivos en iOS) no ejecuta prompt()/alert() de forma
   confiable -- por eso toda entrada de datos usa hojas modales propias, no diálogos nativos. */
function closeModal(){ const bd=document.getElementById("modal-backdrop"); if(bd) bd.remove(); }
function openModal(innerHtml){

  bd.className = "modal-backdrop"; bd.id = "modal-backdrop";

  bd.addEventListener("click",(e)=>{ if(e.target===bd) closeModal(); });

}
function askText(title, label, placeholder){

function askChoice(title, options, labelFn){

/* --------------------------- Sesión / AuthGuard --------------------------- */
/* El perfil se guarda en el teléfono: sin señal se usa la copia, y un error de red
   NUNCA dispara el flujo de "crear cuenta" (eso solo pasa si de verdad no existe). */
const PERFIL_KEY = "pm-perfil-v1";
function cachedProfile(userId){ try{ const p = JSON.parse(localStorage.getItem(PERFIL_KEY)||"null"); return (p && p.id===userId) ? p : null; }catch(e){ return null; } }
async function loadProfile(userId){
  let data = null, error = null;
  try{ ({ data, error } = await sb.from("profiles").select("*").eq("id", userId).maybeSingle()); }catch(e){ error = e; }
  if(error){ console.error("Error cargando profile:", error); return cachedProfile(userId) || undefined; }
  if(data){ try{ localStorage.setItem(PERFIL_KEY, JSON.stringify(data)); }catch(e){} }
  return data;
}
/* Sesión guardada por Supabase en este teléfono (para abrir sin señal aunque el token haya vencido). */
function storedAuthUser(){
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(/^sb-.*-auth-token$/.test(k)){ const v = JSON.parse(localStorage.getItem(k)||"null"); const u = v?.user || v?.currentSession?.user; if(u && u.id) return u; }
    }
  }catch(e){}
  return null;
}
function offlineSessionFallback(){
  if(navigator.onLine) return false;
  const u = storedAuthUser(); const p = u && cachedProfile(u.id);
  if(!u || !p) return false;
  state.session = {user:u, offline:true}; state.profile = p;
  return true;
}

// Crea la fila de perfil si hay sesion pero todavia no existe (pasa cuando el
// proyecto exige confirmar correo: signUp() no deja sesion activa de inmediato,
// asi que el perfil se crea aqui, la primera vez que hay sesion real).
let pendingSignupName = "";
async function ensureProfile(session){
  let profile = await loadProfile(session.user.id);
  if(profile) return profile;
  if(profile===undefined){ state.authError = navigator.onLine ? "No se pudo cargar tu perfil. Revisa tu conexión e intenta de nuevo." : "Sin conexión. Abre la app una vez con señal para dejarla lista sin conexión."; return null; }
  const nombre = pendingSignupName || (await askText("Bienvenido", "Para terminar de crear tu cuenta, escribe tu nombre completo", "Tu nombre")) || "Sin nombre";
  pendingSignupName = "";
  const { error: e1 } = await sb.from("profiles").insert({ id: session.user.id, nombre_completo: nombre, rol: "admin" });
  if(e1){
    const { error: e2 } = await sb.from("profiles").insert({ id: session.user.id, nombre_completo: nombre, rol: "especialista" });
    if(e2){ state.authError = "No se pudo crear tu perfil: " + e2.message; return null; }
  }
  return await loadProfile(session.user.id);
}

sb.auth.onAuthStateChange(async (event, session) => {
  state.session = session;
  if(session){
    state.profile = await ensureProfile(session);
    if(state.screen === "loading" || state.screen === "login"){
      go(state.profile ? "dashboard" : "login");
      if(state.profile){ offerResume(); quizasCrearContrasena(); }
    } else {
      render();
    }
  } else {
    if(event!=="SIGNED_OUT" && offlineSessionFallback()){ if(state.screen==="loading"||state.screen==="login") go("dashboard"); return; }
    state.profile = null;
    go("login");
  }
});

async function initSession(){
  let data = {session:null};
  try{ ({ data } = await sb.auth.getSession()); }catch(e){ data = {session:null}; }
  if(!data.session && offlineSessionFallback()){ go("dashboard"); offerResume(); return; }
  if(data.session){
    state.session = data.session;
    state.profile = await ensureProfile(data.session);
    go(state.profile ? "dashboard" : "login");
    if(state.profile){ offerResume(); quizasCrearContrasena(); }
  } else {
    go("login");
  }
}

async function handleLogin(){
  const email = document.getElementById("f-email").value.trim();
  const password = document.getElementById("f-password").value;
  if(!email || !password){ state.authError = "Correo y contraseña son obligatorios."; return render(); }
  const btn = document.getElementById("btn-submit"); btn.disabled = true; btn.textContent = "Entrando...";
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ state.authError = error.message; return render(); }
  // onAuthStateChange se encarga de cargar el perfil y navegar
}

async function handleSignup(){
  const nombre = document.getElementById("f-nombre").value.trim();
  const email = document.getElementById("f-email").value.trim();
  const password = document.getElementById("f-password").value;
  if(!nombre || !email || !password){ state.authError = "Todos los campos son obligatorios."; return render(); }
  if(password.length < 6){ state.authError = "La contraseña debe tener al menos 6 caracteres."; return render(); }
  const btn = document.getElementById("btn-submit"); btn.disabled = true; btn.textContent = "Creando cuenta...";
  state.authError = "";

  const { data, error } = await sb.auth.signUp({ email, password });
  if(error){ state.authError = error.message; return render(); }

  if(!data.session){
    // Confirmación de correo activada en el proyecto: no hay sesión todavía.
    // El perfil se creará solo, con este mismo nombre, en cuanto inicie sesión
    // por primera vez después de confirmar (ver ensureProfile).
    pendingSignupName = nombre;
    state.authMode = "login";
    state.authInfo = "Cuenta creada. Revisa tu correo para confirmar, luego inicia sesión aquí.";
    return render();
  }

  state.profile = await ensureProfile(data.session);
  go("dashboard");
}

}

/* Archivar = borrado lógico. Oculta el expediente de la lista pero conserva TODO
   (evaluaciones, fotos, contratos, historial) y se puede restaurar. No hay borrado
   físico: las fotos en Storage quedarían huérfanas y los contratos lo impedirían. */
async function openExpedienteMenu(e){
  const archivado = !!e.archivado_at;
  const opciones = archivado
    ? [{v:"abrir", label:"Abrir"}, {v:"restaurar", label:"↩︎ Restaurar a activos"}]
    : [{v:"abrir", label:"Abrir"}, {v:"renombrar", label:"Cambiar nombre"}, {v:"archivar", label:"🗄 Archivar (quitar de la lista)"}];
  const chosen = await askChoice(e.nombre_expediente, opciones, o=>o.label);
  if(!chosen) return;
  if(chosen.v==="abrir"){ go("expediente", {currentExpediente: e}); return; }
  if(!navigator.onLine){ showError("Esta acción necesita conexión."); return; }
  if(chosen.v==="renombrar"){
    const nuevo = await askText("Cambiar nombre", "Nuevo nombre", e.nombre_expediente||"");
    if(!nuevo || !nuevo.trim()) return;
    const { error } = await sb.from("expedientes").update({nombre_expediente: nuevo.trim()}).eq("id", e.id);
    if(error){ showError("No se pudo cambiar el nombre: " + error.message); return; }
  }
  if(chosen.v==="archivar"){
    const ok = await askChoice(`¿Archivar "${e.nombre_expediente}"? Deja de aparecer en tu lista, pero no se borra nada: sus check-ups, fotos y contratos se conservan y lo puedes restaurar cuando quieras.`,
      [{v:"si", label:"Sí, archivar"}, {v:"no", label:"Cancelar"}], o=>o.label);
    if(!ok || ok.v!=="si") return;
    const { error } = await sb.from("expedientes").update({archivado_at: new Date().toISOString(), archivado_por: state.profile?.id || null}).eq("id", e.id);
    if(error){ showError("No se pudo archivar: " + error.message); return; }
  }
  if(chosen.v==="restaurar"){
    const { error } = await sb.from("expedientes").update({archivado_at: null, archivado_por: null}).eq("id", e.id);
    if(error){ showError("No se pudo restaurar: " + error.message); return; }
  }
  renderDashboard();
}

    {v:"eliminar", label:"🗑 Eliminar"},
  ];
  const chosen = await askChoice(ev.fecha_visita||"(sin fecha)", opciones, o=>o.label);
  if(!chosen) return;
  if(chosen.v==="abrir"){
    const esSeg = ev.tipo_visita==="seguimiento";
    const importada = ev.importado==="true";
    if(esSeg) go("seguimiento-visita", {currentEvaluacion:{id:ev.id}});
    else if(importada) go("diagnostico-evaluacion", {currentEvaluacion:{id:ev.id, expediente_id:ev.expediente_id, fecha_visita:ev.fecha_visita, nivel_checkup:ev.nivel_checkup, estatus:ev.estatus, tipo_visita:ev.tipo_visita}});
    else go("resumen-evaluacion", {currentEvaluacion:{id:ev.id}});
    return;
  }
  if(chosen.v==="fecha"){
    const nueva = await askText("Fecha de visita", "AAAA-MM-DD", ev.fecha_visita||"");
    if(!nueva) return;
    const { error } = await sb.from("evaluaciones").update({fecha_visita: nueva}).eq("id", ev.id);
    if(error){ showError("No se pudo actualizar la fecha: " + error.message); return; }
    onChange();
  }
  if(chosen.v==="eliminar"){
    const confirmado = await askChoice(
      "¿Eliminar esta evaluación? Se borran también sus respuestas, hallazgos, fotos y PDF generado -- no se puede deshacer.",
      [{v:"si", label:"Sí, eliminar"}, {v:"no", label:"Cancelar"}], o=>o.label);
    if(!confirmado || confirmado.v!=="si") return;
    const { error } = await sb.from("evaluaciones").delete().eq("id", ev.id);
    if(error){
      const msg = /evaluacion_base_id|foreign key/i.test(error.message)
        ? "No se puede eliminar: tiene una visita de seguimiento ligada a ella. Elimina primero esa visita de seguimiento."
        : "No se pudo eliminar: " + error.message;
      showError(msg);
      return;
    }
    onChange();
  }
}

/* ------------------------------- Panel del expediente -------------------------------
   Tres pestañas: REGULATORIO (COFEPRIS / STPS / Protección Civil, cada uno con sus
   propias evaluaciones), CLÍNICA (procesos internos: procesos, finanzas, fiscalidad,
   escalabilidad -- Fase 4/5, todavía no construidos) y PATRIMONIO (árbol financiero
   del médico -- fases posteriores). Contratos y servicios quedan abajo, siempre visibles.
   Las evaluaciones se clasifican por evaluaciones.area_id (lo calcula el trigger del
   servidor); si viene vacío (creada sin señal y aún sin sincronizar) se usa el
   servicio contratado como respaldo. Nada se recalcula ni se mueve en la base de datos. */
let EXP_TAB = "regulatorio";
const EXP_OPEN = {};
const REG_AREAS = [
  {codigo:"cofepris", nombre:"COFEPRIS", icon:"⚕️", sub:"Regulación sanitaria"},
  {codigo:"stps", nombre:"STPS", icon:"🦺", sub:"Seguridad y obligaciones laborales"},
  {codigo:"proteccion_civil", nombre:"Protección Civil", icon:"🧯", sub:"Programa interno / carta de corresponsabilidad"},
];
const SERV_TO_AREA = {cofepris_checkup:"cofepris", stps_checkup:"stps", proteccion_civil_checkup:"proteccion_civil"};
const CLINICA_MODS = [
  {nombre:"Procesos", sub:"Operación interna, flujos, roles y controles", fase:"Fase 4"},
  {nombre:"Finanzas", sub:"Ingresos, costos, márgenes, flujo de efectivo", fase:"Fase 4"},
  {nombre:"Fiscalidad", sub:"Régimen, cumplimiento y eficiencia fiscal", fase:"Fase 4"},
  {nombre:"Escalabilidad", sub:"Capacidad, crecimiento y expansión", fase:"Fase 5"},
];
const PATRIMONIO_MODS = [
  {nombre:"Árbol financiero familiar", sub:"Mapa del médico: familia, clínica, activos y relaciones", fase:"Fase 6"},
  {nombre:"Protección", sub:"Seguros de vida, gastos médicos, responsabilidad civil", fase:"Fase 10"},
  {nombre:"Inversiones y liquidez", sub:"Activos, liquidez y portafolio", fase:"Fase 10"},
  {nombre:"Sucesión", sub:"Continuidad familiar y patrimonial", fase:"Fase 10"},
];

async function renderExpediente(){
  const exp = state.currentExpediente;
  $app.innerHTML = `
    <div class="topbar">
      <div class="topbar-row">
        <button class="back-btn" id="btn-back">←</button>
        <div style="flex:1"><p class="brand">EXPEDIENTE</p><h1 style="font-size:18px">${esc(exp.nombre_expediente||"")}</h1></div>
      </div>
    </div>
    <div class="content" id="exp-content"><div class="center-screen"><div class="spinner"></div></div></div>
  `;
  document.getElementById("btn-back").onclick = () => go("dashboard");

  await ensureCatalogs();

  const [serviciosRes, evalsRes] = await Promise.all([
    cachedRead("exp:"+exp.id+":servicios", ()=>sb.from("servicios_contratados").select("id, estatus, servicio:servicios_catalogo(nombre,codigo)").eq("expediente_id", exp.id)),
    cachedRead("exp:"+exp.id+":evaluaciones_v2", ()=>sb.from("evaluaciones").select("id, expediente_id, estatus, fecha_visita, nivel_checkup, tipo_visita, evaluacion_base_id, servicio_contratado_id, area:areas(codigo), importado:facts->>importado_v3").eq("expediente_id", exp.id)),
  ]);

  const c = document.getElementById("exp-content");
  const err = serviciosRes.error || evalsRes.error;
  if(err){ c.innerHTML = `<div class="err">Error al cargar el expediente: ${esc(err.message)}</div>`; return; }
  const fromCache = serviciosRes.fromCache || evalsRes.fromCache;
  const expRow = await getExpedienteRow(exp.id);
  if(expRow){ Object.assign(exp, expRow); state.currentExpediente = exp; const h1 = document.querySelector(".topbar h1"); if(h1) h1.textContent = exp.nombre_expediente||""; }
  const dEst = exp.datos_establecimiento || {};
  const servicios = (serviciosRes.data||[]);
  const servArea = {};
  servicios.forEach(s=>{ servArea[s.id] = SERV_TO_AREA[s.servicio?.codigo] || null; });
  const evals = (evalsRes.data||[]).slice().sort((a,b)=>(b.fecha_visita||"").localeCompare(a.fecha_visita||""));
  const areaOf = ev => ev.area?.codigo || servArea[ev.servicio_contratado_id] || null;
  const porArea = {cofepris:[], stps:[], proteccion_civil:[], otras:[]};
  evals.forEach(ev=>{ const a = areaOf(ev); (porArea[a] || porArea.otras).push(ev); });

  const tabBtn = (k, label) => `<button class="exp-tab ${EXP_TAB===k?"active":""}" data-tab="${k}">${label}</button>`;
  c.innerHTML = `
    ${fromCache ? `<div class="empty-note" style="margin-bottom:14px">📴 Mostrando datos guardados en este dispositivo (sin conexión) — puede no reflejar cambios hechos desde otro lugar.</div>` : ""}
    ${datosEstCompletos(dEst)
      ? `<div class="card" id="est-card" style="cursor:pointer;padding:12px 14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div style="min-width:0"><div class="area-name" style="font-size:15px">${esc(dEst.nombreComercial)}</div><div class="area-sub">${esc([dEst.municipio, dEst.estado].filter(Boolean).join(", "))}${dEst.responsableSanitario?" · Resp. "+esc(dEst.responsableSanitario):""}</div></div>${esAdmin()?`<span class="muted small">Editar ›</span>`:""}</div></div>`
      : `<div class="card" id="est-card" style="cursor:pointer;border-color:var(--gold-500);background:var(--gold-100)"><b>⚠️ Completa los datos del establecimiento</b><div class="muted small" style="margin-top:4px">Domicilio, estado, responsable sanitario… Se usan en todos los check-ups y en el PDF.</div></div>`}
    <div class="exp-tabs">${tabBtn("regulatorio","Regulatorio")}${tabBtn("clinica","Clínica")}${tabBtn("patrimonio","Patrimonio")}</div>
    <div id="exp-tab-body"></div>
    <div class="card" style="margin-top:22px">
      <div class="section-title">Servicios contratados</div>
      <div id="servicios-list"></div>
      <div class="section-title" style="margin-top:18px">Contratación</div>
      <p class="muted small" style="margin:0 0 10px">Contrato firmado por cada check-up o servicio, cuando aplique -- algunos clientes pagan en efectivo.</p>
      <div id="contratos-list"></div>
      <label class="btn btn-ghost" id="btn-add-contrato" style="margin-top:10px;display:block;text-align:center;cursor:pointer">
        + Subir contrato
        <input type="file" id="input-contrato" accept="image/*,application/pdf" style="display:none">
      </label>
    </div>
  `;
  document.getElementById("est-card").onclick = () => { if(esAdmin()) go("exp-datos", {currentExpediente: exp}); };
  c.querySelectorAll(".exp-tab").forEach(b=> b.onclick = () => { EXP_TAB = b.dataset.tab; renderExpediente(); });
  if(!esAdmin()){
    EXP_TAB = "regulatorio";
    c.querySelector(".exp-tabs").style.display = "none";
    const cs = document.getElementById("servicios-list"); if(cs) cs.closest(".card").style.display = "none";
    state.misAreas = await misAreasEnExpediente(exp.id).catch(()=>new Set());
  } else {
    const slot = document.createElement("div"); c.appendChild(slot); renderEquipoAsignado(slot, exp).catch(()=>{});
  }

  // Avance de visitas de seguimiento (cuántas correcciones ya están verificadas)
  const segIds = evals.filter(e=>e.tipo_visita==="seguimiento").map(e=>e.id);
  const avance = {};
  if(EXP_TAB==="regulatorio" && segIds.length){
    const segRes = await cachedRead("exp:"+exp.id+":seg_avance", ()=>sb.from("hallazgos").select("evaluacion_id,estatus_accion,hallazgo_previo_id").in("evaluacion_id", segIds));
    (segRes.data||[]).filter(h=>h.hallazgo_previo_id).forEach(h=>{
      const a = (avance[h.evaluacion_id] = avance[h.evaluacion_id] || {ok:0,total:0});
      a.total++; if(h.estatus_accion==="verificado"||h.estatus_accion==="corregido") a.ok++;
    });
  }

  const body = document.getElementById("exp-tab-body");
  if(EXP_TAB==="regulatorio") renderTabRegulatorio(body, exp, porArea, avance);
  else if(EXP_TAB==="clinica") await renderTabClinica(body, exp);
  else body.innerHTML = renderModulosProximos("Patrimonio del médico", "Del negocio a la familia: protección, inversiones y continuidad.", PATRIMONIO_MODS);

  const sList = document.getElementById("servicios-list");
  sList.innerHTML = servicios.length ? "" : `<div class="empty-note">Sin servicios contratados todavía.</div>`;
  const DEP_TAG = {cofepris_checkup:"COFEPRIS", stps_checkup:"STPS", proteccion_civil_checkup:"Protección Civil"};
  servicios.forEach(s=>{
    const row = document.createElement("div");
    row.className = "small-row";
    const tag = DEP_TAG[s.servicio?.codigo];
    row.innerHTML = `<span>${tag?`<span class="dep-tag">${esc(tag)}</span> `:""}${esc(s.servicio?.nombre||"")}</span><span class="muted">${esc(s.estatus)}</span>`;
    sList.appendChild(row);
  });

  const cList = document.getElementById("contratos-list");
  renderContratosList(cList, exp.id, servicios);
  document.getElementById("input-contrato").addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    e.target.value = "";
    if(!file) return;
    if(!navigator.onLine){ showError("Subir un contrato necesita conexión. Puedes intentarlo de nuevo cuando tengas señal."); return; }
    let servicioId = null;
    if(servicios.length === 1){
      servicioId = servicios[0].id;
    } else if(servicios.length > 1){
      const opts = [{id:null, label:"Sin servicio específico"}, ...servicios.map(s=>({id:s.id, label:s.servicio?.nombre||"(servicio)"}))];
      const chosen = await askChoice("¿A qué servicio corresponde este contrato?", opts, o=>o.label);
      servicioId = chosen ? chosen.id : null;
    }
    try{
      await uploadContrato(exp.id, file, servicioId);
      renderContratosList(cList, exp.id, servicios);
    }catch(err){ showError("No se pudo subir el contrato: " + (err&&err.message?err.message:err)); }
  });
}


/* ------------------------- Índice de la carpeta de cumplimiento -------------------------
   PDF por expediente: todos los DOCUMENTOS que le aplican (sacados de los criterios de su última
   evaluación de COFEPRIS, STPS y Protección Civil), con estatus, vigencia, sección de la carpeta
   física y nombre del archivo en la carpeta digital. Los hallazgos corregidos/verificados en
   seguimientos cuentan como "Lo tiene". */
const CARPETA_DOC_RE = /(aviso|licencia|permiso|t[ií]tulo|c[ée]dula|contrato|manifiesto|registro|bit[aá]cora|comprobante|constancia|programa|manual|expediente|consentimiento|recetario|certific|acta|dictamen|archivo|documenta|p[oó]liza|plan |reglamento|estudio|dict[aá]men|capacitaci)/i;
const CARPETA_EXCLUYE_RE = /^(congruencia|publicidad sin|publicidad de profesionales|no se ingieren)/i;
function carpetaVigencia(txt){
  const t = (txt||"").toLowerCase();
  if(/365 d[ií]as|una vez al a[nñ]o|anual/.test(t)) return "Renovar cada año";
  const m = t.match(/cada (\d+) meses/); if(m) return `Cada ${m[1]} meses`;
  const a = t.match(/(\d+) a[nñ]os/); if(a) return `Conservar ${a[1]} años`;
  if(/vigente|vigencia/.test(t)) return "Mantener vigente";
  return "Permanente / mantener actualizado";
}
function carpetaSlug(t, n){ return (t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9 ]+/g," ").trim().split(/\s+/).slice(0, n||6).join("-"); }
async function generarIndiceCarpeta(exp, evalsPorArea){
  if(!window.jspdf){ showError("El generador de PDF no cargó (requiere conexión a internet la primera vez)."); return; }
  if(!navigator.onLine){ showError("Generar el índice necesita conexión para reunir las evaluaciones."); return; }
  const {jsPDF} = window.jspdf;
  const datosEst = await getDatosEst(exp.id);
  const DEP_LABEL = {cofepris:"COFEPRIS", stps:"STPS", proteccion_civil:"Protección Civil"};
  const secciones = []; // {titulo, docs:[]}
  const todasEvIds = Object.values(evalsPorArea).flat().map(e=>e.id);
  let corregidos = new Set();
  if(todasEvIds.length){
    const { data: hs } = await sb.from("hallazgos").select("criterio_id,estatus_accion").in("evaluacion_id", todasEvIds).in("estatus_accion", ["corregido","verificado"]);
    corregidos = new Set((hs||[]).map(h=>h.criterio_id).filter(Boolean));
  }
  let fechaBase = null;
  for(const dep of ["cofepris","stps","proteccion_civil"]){
    const base = (evalsPorArea[dep]||[]).filter(e=>e.tipo_visita!=="seguimiento").sort((a,b)=>(b.fecha_visita||"").localeCompare(a.fecha_visita||""))[0];
    if(!base) continue;
    if(!fechaBase || (base.fecha_visita||"") > fechaBase) fechaBase = base.fecha_visita;
    const [snapR, respR] = await Promise.all([
      sb.from("evaluacion_criterios_snapshot").select("criterio_id,modulo,requisito,descripcion,evidencia_esperada").eq("evaluacion_id", base.id),
      sb.from("respuestas_criterio").select("criterio_id,estatus").eq("evaluacion_id", base.id),
    ]);
    const resp = {}; (respR.data||[]).forEach(r=>{ resp[r.criterio_id] = r.estatus; });
    const porModulo = {};
    (snapR.data||[]).forEach(c=>{
      if(!CARPETA_DOC_RE.test(c.requisito) || CARPETA_EXCLUYE_RE.test(c.requisito.trim())) return;
      const st = resp[c.criterio_id];
      if(st==="no_aplica") return;
      let estatus = st==="cumple" ? "Lo tiene" : st==="parcial" ? "Incompleto" : st==="no_cumple" ? "Falta" : "Por verificar";
      if(estatus!=="Lo tiene" && corregidos.has(c.criterio_id)) estatus = "Lo tiene (corregido)";
      const txt = c.requisito + " " + (c.descripcion||"");
      (porModulo[c.modulo] = porModulo[c.modulo] || []).push({doc:c.requisito, estatus, vigencia:carpetaVigencia(txt), vista:/a la vista|visible/i.test(txt)});
    });
    Object.keys(porModulo).sort().forEach(m=> secciones.push({titulo: m, dep: DEP_LABEL[dep], docs: porModulo[m]}));
  }
  if(!secciones.length){ showError("Este expediente aún no tiene evaluaciones regulatorias con criterios contestados."); return; }

  const doc = new jsPDF({unit:"pt", format:"letter"});
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
  const margin = 48, maxW = pageW - margin*2;
  let y = margin;
  const NAVY=[17,17,17], INK=[17,17,17], SOFT=[90,90,90];
  const ST_COLOR = {"Lo tiene":[46,125,79], "Lo tiene (corregido)":[46,125,79], "Incompleto":[184,134,11], "Falta":[179,38,30], "Por verificar":[125,125,125]};
  const checkBreak = need=>{ if(y+need > pageH-margin){ doc.addPage(); y=margin; } };
  const body = (t,o)=>{ o=o||{}; doc.setFont("helvetica",o.bold?"bold":"normal"); doc.setFontSize(o.size||10.5); doc.setTextColor(...(o.color||INK));
    doc.splitTextToSize(String(t||""), maxW-(o.indent||0)).forEach(line=>{ checkBreak(o.lh||14); doc.text(line, margin+(o.indent||0), y); y+=o.lh||14; }); };
  const heading = (t)=>{ checkBreak(40); doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(...NAVY); doc.text(t, margin, y); y+=18; };
  const hoy = new Date().toISOString().slice(0,10);
  const clinica = datosEst.nombreComercial || exp.nombre_expediente || "Establecimiento";

  drawPortadaPdf(doc, {titulo:"Índice de la carpeta de cumplimiento", subtitulo:"Documentos regulatorios del establecimiento", cliente:clinica,
    detalle:`Con base en el check-up del ${fechaBase||"—"} · Actualizado al ${hoy}`, detalle2:[datosEst.domicilio, datosEst.municipio, datosEst.estado].filter(Boolean).join(", ")});

  doc.setFillColor(...NAVY); doc.rect(0,0,pageW,110,"F");
  try{ doc.addImage(LOGO_MARK_B64, "PNG", pageW-margin-40, 14, 44, 44); }catch(e){}
  doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.setTextColor(255,255,255); doc.text("Carpeta de cumplimiento", margin, 52);
  doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(220,220,220); doc.text(clinica, margin, 74);
  doc.setFontSize(10); doc.setTextColor(200,200,200); doc.text("Elaborado por: Saúl Cruz Flores | Elementos Financieros", margin, 92);
  y = 138;
  datosEstLineas(datosEst).forEach(l=>body(l, {size:9.5, color:SOFT, lh:13}));
  y += 6;
  body("Este índice ordena los documentos que el establecimiento debe tener y conservar. Úselo para armar dos carpetas con la misma estructura:", {size:10.5});
  y += 2;
  ["Carpeta física: un separador por sección, en el orden y con los códigos de este índice.","Carpeta digital: una carpeta por sección y cada documento escaneado con el nombre de archivo indicado.","Revisión mensual: actualizar estatus y vigencias; tenerla lista para una verificación presencial o documental."].forEach(t=>{
    const l = doc.setFont("helvetica","normal").setFontSize(10).splitTextToSize(t, maxW-16); checkBreak(l.length*13+3);
    doc.setFillColor(...NAVY); doc.circle(margin+4, y-3.5, 2, "F"); doc.setTextColor(...INK); l.forEach(x=>{ doc.text(x, margin+14, y); y+=13; }); y+=2;
  });
  y += 8;
  // Resumen
  const todos = secciones.flatMap(s=>s.docs);
  const cuenta = k => todos.filter(d=>d.estatus===k || (k==="Lo tiene" && d.estatus==="Lo tiene (corregido)")).length;
  const cards = [["Lo tiene", cuenta("Lo tiene")], ["Incompleto", cuenta("Incompleto")], ["Falta", cuenta("Falta")], ["Por verificar", cuenta("Por verificar")]];
  const cw = (maxW - 30)/4;
  checkBreak(64);
  cards.forEach(([k,n],i)=>{ const x = margin + i*(cw+10);
    doc.setFillColor(245,245,245); doc.roundedRect(x, y, cw, 52, 6, 6, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(20); doc.setTextColor(...ST_COLOR[k]); doc.text(String(n), x+cw/2, y+26, {align:"center"});
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...SOFT); doc.text(k, x+cw/2, y+42, {align:"center"}); });
  y += 70;
  // A la vista
  const vista = todos.filter(d=>d.vista);
  if(vista.length){
    heading("Documentos que deben estar a la vista del público");
    vista.forEach(d=> body("• " + d.doc, {size:10, lh:13}));
    y += 8;
  }
  // Secciones
  heading(`Índice de documentos (${todos.length})`);
  secciones.forEach((s, si)=>{
    checkBreak(56);
    doc.setFillColor(...NAVY); doc.roundedRect(margin, y-12, maxW, 22, 4, 4, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(255,255,255);
    doc.text(`Sección ${si+1} · ${s.titulo}`, margin+10, y+3);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(200,200,200); doc.text(s.dep, pageW-margin-10, y+3, {align:"right"});
    y += 24;
    s.docs.forEach((d, di)=>{
      const code = `${si+1}.${di+1}`;
      const archivo = `${String(si+1).padStart(2,"0")}-${String(di+1).padStart(2,"0")}_${carpetaSlug(d.doc)}.pdf`;
      const pillW = 96;
      const dl = doc.setFont("helvetica","bold").setFontSize(10).splitTextToSize(d.doc, maxW - 36 - pillW - 8);
      const h = dl.length*13 + 16;
      checkBreak(h + 6);
      doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...NAVY); doc.text(code, margin, y);
      doc.setTextColor(...INK); dl.forEach((t,i)=>doc.text(t, margin+36, y+i*13));
      doc.setFillColor(...ST_COLOR[d.estatus]); doc.roundedRect(pageW-margin-pillW, y-10, pillW, 15, 7.5, 7.5, "F");
      doc.setFontSize(8.5); doc.setTextColor(255,255,255); doc.text(d.estatus, pageW-margin-pillW/2, y, {align:"center"});
      y += dl.length*13;
      doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...SOFT);
      doc.text(`${d.vigencia}  ·  Archivo: ${archivo}`, margin+36, y);
      y += 7; doc.setDrawColor(232,232,228); doc.line(margin, y, pageW-margin, y); y += 13;
    });
    y += 6;
  });
  // Estructura digital
  heading("Estructura de la carpeta digital");
  body(`Carpeta principal: Cumplimiento_${carpetaSlug(clinica,4)}`, {bold:true, size:10});
  secciones.forEach((s,si)=> body(`   ${String(si+1).padStart(2,"0")}_${carpetaSlug(s.titulo,5)}`, {size:10, lh:13}));
  body("Guardarla en una nube de la clínica (no en el celular personal de alguien), con acceso restringido y respaldo.", {size:9.5, color:SOFT, lh:13});
  y += 10;
  // Control de revisiones
  heading("Control de revisiones");
  checkBreak(30);
  const cols = [["Fecha", 90], ["Revisó", 150], ["Observaciones", maxW-240]];
  let x = margin; doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(...SOFT);
  cols.forEach(([t,w])=>{ doc.text(t, x+4, y); x+=w; }); y += 6;
  for(let i=0;i<8;i++){ checkBreak(22); doc.setDrawColor(200,200,195); doc.rect(margin, y, maxW, 20); let xx = margin; cols.slice(0,-1).forEach(([,w])=>{ xx+=w; doc.line(xx, y, xx, y+20); }); y += 20; }
  y += 14;
  body("Índice preventivo elaborado con base en los criterios regulatorios aplicables al establecimiento. No sustituye una visita de verificación ni una resolución de la autoridad.", {size:8.5, color:SOFT, lh:11});

  const fileName = `CARPETA-CUMPLIMIENTO-${carpetaSlug(clinica,5)}-${hoy}.pdf`;
  const blob = doc.output("blob");
  try{
    const file = new File([blob], fileName, {type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:fileName}); return; }
  }catch(shareErr){ console.warn("Share falló, uso descarga directa:", shareErr); }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=fileName; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
}

async function generarIndiceCarpetaDep(ev){
  if(!window.jspdf){ showError("El generador de PDF no cargó (requiere conexión a internet la primera vez)."); return; }
  if(!navigator.onLine){ showError("Generar el índice necesita conexión."); return; }
  const {jsPDF} = window.jspdf;
  const [snapR, respR, segR] = await Promise.all([
    sb.from("evaluacion_criterios_snapshot").select("criterio_id").eq("evaluacion_id", ev.id),
    sb.from("respuestas_criterio").select("criterio_id,estatus").eq("evaluacion_id", ev.id),
    sb.from("evaluaciones").select("id").eq("evaluacion_base_id", ev.id),
  ]);
  const enSnap = new Set((snapR.data||[]).map(x=>x.criterio_id));
  const ids = [...enSnap];
  // Universo que le correspondería en un check-up completo (mismo giro y servicios): lo que no se
  // revisó en este nivel se muestra como "No revisado en este nivel", sin captura adicional.
  let enCompleto = new Set();
  try{
    if(ev.nivel_checkup && ev.nivel_checkup!=="completo"){
      const { data: evRow } = await sb.from("evaluaciones").select("facts,area_id").eq("id", ev.id).single();
      if(evRow && evRow.area_id){
        const { data: uni } = await sb.rpc("calcular_criterios_aplicables", {p_facts: evRow.facts||{}, p_nivel:"completo", p_area_id: evRow.area_id});
        enCompleto = new Set((uni||[]).map(u=>u.criterio_id));
      }
    }
  }catch(e){ console.warn("No se pudo calcular el universo completo:", e); }
  const dep = ids.some(i=>i.startsWith("pc-")) ? "proteccion_civil" : ids.some(i=>i.startsWith("stps-")) ? "stps" : "cofepris";
  const conf = CARPETAS_DEP[dep];
  const resp = {}; (respR.data||[]).forEach(r=>{ resp[r.criterio_id] = r.estatus; });
  const evIds = [ev.id, ...((segR.data||[]).map(x=>x.id))];
  const { data: hs } = await sb.from("hallazgos").select("criterio_id,estatus_accion").in("evaluacion_id", evIds).in("estatus_accion", ["corregido","verificado"]);
  const corregidos = new Set((hs||[]).map(h=>h.criterio_id).filter(Boolean));
  const ORDEN = {"Falta":0, "Incompleto":1, "Por verificar":2, "Lo tiene":3, "No revisado en este nivel":4};
  const carpetas = conf.carpetas.map(cp=>({...cp, docs: cp.items.map(it=>{
    const aplican = (it.ids||[]).filter(i=>enSnap.has(i));
    if(!aplican.length && !it.siempre){
      if((it.ids||[]).some(i=>enCompleto.has(i))) return {doc:it.t, estatus:"No revisado en este nivel", vigencia:it.v||"", nota:it.n||"", rec:!!it.rec};
      return null;
    }
    const naTodos = aplican.length && aplican.every(i=>resp[i]==="no_aplica");
    if(naTodos) return null;
    let estatus;
    if(!aplican.length) estatus = it.rec ? "Recomendado" : "Por verificar";
    else {
      const sts = aplican.filter(i=>resp[i]!=="no_aplica").map(i=>{
        const s = resp[i]; let e = s==="cumple" ? "Lo tiene" : s==="parcial" ? "Incompleto" : s==="no_cumple" ? "Falta" : "Por verificar";
        if(e!=="Lo tiene" && corregidos.has(i)) e = "Lo tiene";
        return e; });
      estatus = sts.sort((a,b)=>ORDEN[a]-ORDEN[b])[0] || "Por verificar";
      if(estatus==="Lo tiene" && aplican.some(i=>resp[i]!=="cumple" && corregidos.has(i))) estatus = "Lo tiene (corregido)";
    }
    return {doc:it.t, estatus, vigencia:it.v||"", nota:it.n||"", rec:!!it.rec};
  }).filter(Boolean)})).filter(cp=>cp.docs.length);

  const datosEst = await getDatosEst(ev.expediente_id);
  const clinica = datosEst.nombreComercial || state.currentExpediente?.nombre_expediente || "Establecimiento";
  const doc = new jsPDF({unit:"pt", format:"letter"});
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight(), margin = 48, maxW = pageW - margin*2;
  let y = margin;

  const checkBreak = need=>{ if(y+need > pageH-margin){ doc.addPage(); y=margin; } };
  const body = (t,o)=>{ o=o||{}; doc.setFont("helvetica",o.bold?"bold":"normal"); doc.setFontSize(o.size||10.5); doc.setTextColor(...(o.color||INK));
    doc.splitTextToSize(String(t||""), maxW-(o.indent||0)).forEach(l=>{ checkBreak(o.lh||14); doc.text(l, margin+(o.indent||0), y); y+=o.lh||14; }); };
  const hoy = new Date().toISOString().slice(0,10);

  drawPortadaPdf(doc, {titulo:`Carpetas de cumplimiento · ${conf.label}`, subtitulo:"Lo que debe tener listo para una visita de verificación", cliente:clinica,
    detalle:`Con base en el check-up del ${ev.fecha_visita||"—"} · Actualizado al ${hoy}`, detalle2:[datosEst.domicilio, datosEst.municipio, datosEst.estado].filter(Boolean).join(", ")});
  doc.setFillColor(...NAVY); doc.rect(0,0,pageW,110,"F");
  try{ doc.addImage(LOGO_MARK_B64, "PNG", pageW-margin-40, 14, 44, 44); }catch(e){}
  doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.setTextColor(255,255,255); doc.text(`Carpetas de cumplimiento · ${conf.label}`, margin, 52);
  doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(220,220,220); doc.text(clinica, margin, 74);
  doc.setFontSize(10); doc.setTextColor(200,200,200); doc.text("Elaborado por: Saúl Cruz Flores | Elementos Financieros", margin, 92);
  y = 138;
  body(`Tenga en físico ${carpetas.length} carpeta${carpetas.length===1?"":"s"} con este orden y una copia digital con la misma estructura. Así una visita de verificación presencial o documental de ${conf.label} se atiende en minutos.`, {size:10.5});
  y += 4;
  // resumen
  const todos = carpetas.flatMap(c=>c.docs);
  const cnt = k => todos.filter(d=>d.estatus===k || (k==="Lo tiene" && d.estatus==="Lo tiene (corregido)")).length;
  const nNoRev = cnt("No revisado en este nivel");
  const cards = [["Lo tiene",cnt("Lo tiene")],["Incompleto",cnt("Incompleto")],["Falta",cnt("Falta")],["Por verificar",cnt("Por verificar")],["Recomendado",cnt("Recomendado")]].concat(nNoRev?[["No revisado",nNoRev]]:[]);
  const cw = (maxW-8*(cards.length-1))/cards.length; checkBreak(62);
  cards.forEach(([k,n],i)=>{ const x = margin+i*(cw+8); doc.setFillColor(245,245,245); doc.roundedRect(x, y, cw, 50, 6, 6, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.setTextColor(...ST[k]); doc.text(String(n), x+cw/2, y+25, {align:"center"});
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...SOFT); doc.text(k, x+cw/2, y+40, {align:"center"}); });
  y += 66;
  // portadillas de carpetas
  doc.setFont("helvetica","bold"); doc.setFontSize(12.5); doc.setTextColor(...NAVY); doc.text("Sus carpetas físicas", margin, y); y += 16;
  carpetas.forEach((c,i)=> body(`Carpeta ${i+1} · ${c.t} (${c.docs.length} documentos)`, {size:10.5, lh:14}));
  y += 8;
  carpetas.forEach((c, ci)=>{
    checkBreak(70);
    doc.setFillColor(...NAVY); doc.roundedRect(margin, y-13, maxW, 26, 5, 5, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(255,255,255); doc.text(`Carpeta ${ci+1} · ${c.t}`, margin+12, y+4);
    y += 24; body(c.p, {size:9.5, color:SOFT, lh:12}); y += 6;
    c.docs.forEach((d, di)=>{
      const code = `${ci+1}.${di+1}`; const pillW = 92;
      const archivo = `${String(ci+1).padStart(2,"0")}-${String(di+1).padStart(2,"0")}_${carpetaSlug(d.doc)}.pdf`;
      const dl = doc.setFont("helvetica","bold").setFontSize(10).splitTextToSize(d.doc, maxW - 52 - pillW - 8);
      const nl = d.nota ? doc.setFont("helvetica","normal").setFontSize(8.5).splitTextToSize(d.nota, maxW-52) : [];
      checkBreak(dl.length*13 + nl.length*11 + 22);
      doc.setDrawColor(...NAVY); doc.setLineWidth(0.8); doc.rect(margin, y-9, 10, 10); doc.setLineWidth(1);
      doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...NAVY); doc.text(code, margin+16, y);
      doc.setTextColor(...INK); dl.forEach((t,i)=>doc.text(t, margin+52, y+i*13));
      doc.setFillColor(...ST[d.estatus]); doc.roundedRect(pageW-margin-pillW, y-10, pillW, 15, 7.5, 7.5, "F");
      doc.setFontSize(8); doc.setTextColor(255,255,255); doc.text(d.estatus==="No revisado en este nivel" ? "No revisado" : d.estatus, pageW-margin-pillW/2, y, {align:"center"});
      y += dl.length*13;
      doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...SOFT);
      doc.text(`${d.vigencia ? d.vigencia + "  ·  " : ""}Archivo: ${archivo}`, margin+52, y); y += 11;
      nl.forEach(t=>{ doc.text(t, margin+52, y); y+=11; });
      doc.setDrawColor(232,232,228); doc.line(margin, y-4, pageW-margin, y-4); y += 10;
    });
    y += 8;
  });
  checkBreak(80);
  doc.setFont("helvetica","bold"); doc.setFontSize(12.5); doc.setTextColor(...NAVY); doc.text("Carpeta digital", margin, y); y += 16;
  body(`Cumplimiento_${carpetaSlug(conf.label,2)}_${carpetaSlug(clinica,3)}`, {bold:true, size:10});
  carpetas.forEach((c,i)=> body(`   ${String(i+1).padStart(2,"0")}_${carpetaSlug(c.t,5)}`, {size:10, lh:13}));
  body("En una nube de la clínica (no en un celular personal), con acceso restringido y respaldo.", {size:9.5, color:SOFT, lh:12});
  y += 10;

  let x = margin; doc.setFontSize(9.5); doc.setTextColor(...SOFT); cols.forEach(([t,w])=>{ doc.text(t, x+4, y); x+=w; }); y += 6;

  y += 12;
  if(nNoRev) body(`No revisado en este nivel = documento que le corresponde por su giro y servicios, pero que no forma parte del check-up ${ev.nivel_checkup} que se realizó. Se recomienda revisarlo en un check-up completo.`, {size:8.5, color:SOFT, lh:11});

  const fileName = `CARPETAS-${carpetaSlug(conf.label,2)}-${carpetaSlug(clinica,4)}-${hoy}.pdf`;

  const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href=url; a.download=fileName; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 30000);
}

/* ------------------------------- Wizard STPS -------------------------------
   Más corto que el de COFEPRIS porque STPS no distingue "tipo de establecimiento"
   -- distingue qué hace el centro de trabajo (equipo, químicos, procedimientos). */
function startWizardEvalSTPS(expedienteId){
  state.wizard = {
    expedienteId, step: 1,
    servicios: [], usaMaquinaria: "no_determinado", manejaQuimicos: "no_determinado",
    nivelCheckup: "completo", // STPS no maneja niveles: el diagnóstico siempre es completo,
    // porque tus socios cotizan sobre él -- un diagnóstico parcial es más riesgoso, no más barato.
  };
  go("wizard-eval-stps");
}

function renderWizardEvalSTPS(){
  const w = state.wizard;
  const steps = ["Servicios y equipo","Maquinaria y químicos"];
  const idx = w.step;
  $app.innerHTML = `
    <div class="topbar">
      <div class="topbar-row">
        <button class="back-btn" id="btn-back">←</button>
        <div style="flex:1"><p class="brand">NUEVA EVALUACIÓN STPS</p><h1 style="font-size:17px">${steps[idx-1]}</h1></div>
        <div class="small muted" style="color:#BDBDBD">${idx}/2</div>
      </div>
      <div class="module-progress" style="margin-top:10px">
        ${steps.map((_,i)=>`<div class="dot ${i+1<idx?'done':''} ${i+1===idx?'current':''}"></div>`).join("")}
      </div>
    </div>
    <div class="content" id="wiz-content"></div>
    <div class="content" style="padding-top:0;display:flex;gap:10px">
      ${idx>1 ? `<button class="btn btn-ghost" id="btn-prev">Atrás</button>` : ""}

    </div>
  `;
  document.getElementById("btn-back").onclick = () => go("expediente", {currentExpediente:{id:w.expedienteId}});
  if(idx>1) document.getElementById("btn-prev").onclick = () => { w.step--; renderWizardEvalSTPS(); };
  document.getElementById("btn-next").onclick = onWizardEvalSTPSNext;

  const c = document.getElementById("wiz-content");
  if(idx===1) renderWizSTPSStep1(c,w);
  if(idx===2) renderWizSTPSStep2(c,w);
}

function renderWizSTPSStep1(c,w){
  // Mismo catálogo de servicios que COFEPRIS, sin el grupo Publicidad (no es un
  // factor STPS) -- así un procedimiento como láser activa su criterio STPS
  // correspondiente (NOM-013) con el mismo dato que ya captura COFEPRIS.
  c.innerHTML = `
    <div class="card">
      <p class="muted">¿Qué procedimientos o servicios realiza el centro de trabajo?</p>
      ${SERVICIOS_CATALOG.filter(g=>g.group!=="Publicidad").map(g=>`
        <div class="group-title">${g.group}</div>
        <div class="chip-grid">${g.items.map(s=>`<div class="chip ${w.servicios.includes(s)?'selected':''}" data-s="${s}">${s}</div>`).join("")}</div>
      `).join("")}
    </div>
  `;
  c.querySelectorAll(".chip").forEach(chip=>{
    chip.onclick = () => {
      const s = chip.dataset.s; const i = w.servicios.indexOf(s);
      if(i>-1) w.servicios.splice(i,1); else w.servicios.push(s);
      chip.classList.toggle("selected");
    };
  });
}

function renderWizSTPSStep2(c,w){
  c.innerHTML = `
    <div class="card">
      <p class="muted">Si no lo sabes con certeza ahora, marca "No determinado" — el criterio correspondiente se mostrará igual, marcado para revisión, en vez de desaparecer.</p>
      <label>¿Usa maquinaria o equipo con partes en movimiento?</label>
      <div class="chip-grid" id="tri-maq">
        ${[["si","Sí"],["no","No"],["no_determinado","No determinado"]].map(([v,l])=>`<div class="chip ${w.usaMaquinaria===v?'selected':''}" data-v="${v}">${l}</div>`).join("")}
      </div>
      <label style="margin-top:18px">¿Maneja o almacena sustancias químicas?</label>
      <div class="chip-grid" id="tri-quim">
        ${[["si","Sí"],["no","No"],["no_determinado","No determinado"]].map(([v,l])=>`<div class="chip ${w.manejaQuimicos===v?'selected':''}" data-v="${v}">${l}</div>`).join("")}
      </div>
    </div>
  `;
  c.querySelectorAll("#tri-maq .chip").forEach(ch=>ch.onclick=()=>{ w.usaMaquinaria=ch.dataset.v; renderWizSTPSStep2(c,w); });
  c.querySelectorAll("#tri-quim .chip").forEach(ch=>ch.onclick=()=>{ w.manejaQuimicos=ch.dataset.v; renderWizSTPSStep2(c,w); });

async function onWizardEvalSTPSNext(){
  const w = state.wizard;
  if(w.step===2){
    await finishWizardEvalSTPS();
    return;
  }
  w.step++; renderWizardEvalSTPS();
}

async function finishWizardEvalSTPS(){
  const w = state.wizard;
  const btn = document.getElementById("btn-next");
  if(btn){ btn.disabled = true; btn.textContent = "Creando evaluación..."; }

  const facts = { servicios: w.servicios, usaMaquinaria: w.usaMaquinaria, manejaQuimicos: w.manejaQuimicos };

  // Resolver servicio_contratado stps_checkup -- mismo patrón offline-safe que COFEPRIS.
  let stpsScId = null;
  if(navigator.onLine){
    const { data: sc, error: scErr } = await sb.from("servicios_contratados")
      .select("id, servicio:servicios_catalogo(codigo)").eq("expediente_id", w.expedienteId);
    if(scErr){ showError("Error al leer servicios contratados: " + scErr.message); return; }
    const existing = (sc||[]).find(s => s.servicio?.codigo === "stps_checkup");
    if(existing){ stpsScId = existing.id; }
    else {
      const { data: servicio, error: e1 } = await sb.from("servicios_catalogo").select("id").eq("codigo","stps_checkup").single();
      if(e1){ showError("No se encontró el servicio STPS en el catálogo: " + e1.message); return; }
      stpsScId = newId();
      await persistEntity("servicios_contratados", stpsScId, "CREATE",
        { expediente_id: w.expedienteId, servicio_id: servicio.id, nivel: w.nivelCheckup, estatus: "activo" });
    }
    await idbPut(STORE_KV, {key:"stpsSc:"+w.expedienteId, value:stpsScId});
  } else {
    const cached = await idbGet(STORE_KV, "stpsSc:"+w.expedienteId);
    stpsScId = cached && cached.value;
    if(!stpsScId){
      showError("Necesitas conexión al menos una vez para crear la primera evaluación STPS de este expediente. Ya con eso, las siguientes funcionan sin señal.");
      if(btn){ btn.disabled=false; btn.textContent="Calcular aplicabilidad"; }
      return;
    }
  }

  const evaluacionId = newId();
  const evaluacion = {
    id: evaluacionId, expediente_id: w.expedienteId, servicio_contratado_id: stpsScId,
    tipo_establecimiento: null, servicios_prestados: facts.servicios, facts: facts,
    nivel_checkup: w.nivelCheckup, fecha_visita: new Date().toISOString().slice(0,10), evaluador_id: state.profile.id,
    estatus: "en_proceso", area_id: null,
  };
  const evRes = await persistEntity("evaluaciones", evaluacionId, "CREATE", evaluacion);
  if(evRes.error){ showError("No se pudo crear la evaluación: " + evRes.error.message); return; }

  if(navigator.onLine && !evRes.queued){
    const { error: snapErr } = await sb.rpc("crear_snapshot_evaluacion", { p_evaluacion_id: evaluacionId });
    if(snapErr){ showError("La evaluación se creó, pero no se pudo calcular su universo regulatorio: " + snapErr.message); return; }
    const { count: snapCount, error: verifyErr } = await sb.from("evaluacion_criterios_snapshot")
      .select("id", {count:"exact", head:true}).eq("evaluacion_id", evaluacionId);
    if(verifyErr || !snapCount){
      showError("La evaluación se creó, pero el universo regulatorio quedó vacío o no se pudo verificar" + (verifyErr?(": "+verifyErr.message):"") + ". Revisa antes de continuar.");
      return;
    }
  } else {
    await queueOperation("rpc:crear_snapshot_evaluacion", evaluacionId, "CREATE", {p_evaluacion_id: evaluacionId});
  }

  state.wizard = null;
  go("resumen-evaluacion", {currentEvaluacion: evaluacion});
}

/* --------------------------- Wizard Protección Civil ---------------------------
   Protección Civil NO es una ley federal única como COFEPRIS -- son 32 leyes
   estatales, cada una con su propio umbral (confirmado: Tamaulipas usa 1,500 m²,
   CDMX usa 250 m² / 100 personas -- son números reales distintos, no una
   suposición). Por eso el wizard pregunta primero el estado: solo CDMX tiene
   criterios verificados hoy. Elegir otro estado no aplica CDMX por accidente --
   avisa claro que ese estado todavía no está cargado. Sin niveles, como STPS: el
   diagnóstico lo usa un gestor externo para armar la carpeta, no tú. */
const ESTADOS_MX = ["Ciudad de México","Aguascalientes","Baja California","Baja California Sur","Campeche","Chiapas","Chihuahua","Coahuila","Colima","Durango","Estado de México","Guanajuato","Guerrero","Hidalgo","Jalisco","Michoacán","Morelos","Nayarit","Nuevo León","Oaxaca","Puebla","Querétaro","Quintana Roo","San Luis Potosí","Sinaloa","Sonora","Tabasco","Tamaulipas","Tlaxcala","Veracruz","Yucatán","Zacatecas"];
const ESTADOS_PC_VERIFICADOS = ["Ciudad de México"]; // ir agregando conforme se verifique cada ley estatal

function startWizardEvalPC(expedienteId){
  state.wizard = { expedienteId, step: 1, estadoPC: (ESTADOS_MX.includes(state.currentExpediente?.datos_establecimiento?.estado) ? state.currentExpediente.datos_establecimiento.estado : "Ciudad de México"), excedeUmbralPC: "no_determinado", nivelCheckup: "completo" };

  const w = state.wizard;
  const verificado = ESTADOS_PC_VERIFICADOS.includes(w.estadoPC);
  $app.innerHTML = `
    <div class="topbar">
      <div class="topbar-row">

      </select>
      <div id="aviso-estado" style="margin-top:10px"></div>
      <div id="umbral-wrap"></div>
    </div>
  `;
  function paintUmbral(){
    const vOk = ESTADOS_PC_VERIFICADOS.includes(w.estadoPC);
    document.getElementById("aviso-estado").innerHTML = vOk ? "" :
      `<div class="empty-note">Protección Civil para ${esc(w.estadoPC)} todavía no está verificado en la plataforma -- avísale a Saúl para que lo cargue antes de usarlo aquí.</div>`;
    document.getElementById("umbral-wrap").innerHTML = vOk ? `
      <p class="muted" style="margin-top:14px">Según la Ley de Gestión Integral de Riesgos y Protección Civil de la CDMX, un establecimiento mercantil necesita Programa Interno completo si excede CUALQUIERA de estos dos límites. Si no excede ninguno, solo necesita Carta de Corresponsabilidad.</p>
      <label>¿El establecimiento tiene más de 250 m² construidos, o más de 100 personas de aforo?</label>
      <div class="chip-grid" id="tri-pc">
        ${[["si","Sí, excede alguno"],["no","No, está por debajo de los dos"],["no_determinado","No determinado"]].map(([v,l])=>`<div class="chip ${w.excedeUmbralPC===v?'selected':''}" data-v="${v}">${l}</div>`).join("")}
      </div>` : "";
    document.querySelectorAll("#tri-pc .chip").forEach(ch=>ch.onclick=()=>{
      w.excedeUmbralPC = ch.dataset.v;
      document.querySelectorAll("#tri-pc .chip").forEach(x=>x.classList.toggle("selected", x===ch));
    });
    document.getElementById("btn-next").disabled = !vOk;
  }
  document.getElementById("sel-estado-pc").addEventListener("change",(e)=>{ w.estadoPC = e.target.value; paintUmbral(); });
  paintUmbral();

async function finishWizardEvalPC(){

  const facts = { excedeUmbralPC: w.excedeUmbralPC, estado: [w.estadoPC] };

  if(evRes.error){ showError("No se pudo crear la evaluación: " + evRes.error.message); return; }

  if(navigator.onLine && !evRes.queued){
    const { error: snapErr } = await sb.rpc("crear_snapshot_evaluacion", { p_evaluacion_id: evaluacionId });
    if(snapErr){ showError("La evaluación se creó, pero no se pudo calcular su universo regulatorio: " + snapErr.message); return; }
    const { count: snapCount, error: verifyErr } = await sb.from("evaluacion_criterios_snapshot")
      .select("id", {count:"exact", head:true}).eq("evaluacion_id", evaluacionId);
    if(verifyErr || !snapCount){
      showError("La evaluación se creó, pero el universo regulatorio quedó vacío o no se pudo verificar" + (verifyErr?(": "+verifyErr.message):"") + ". Revisa antes de continuar.");
      return;
    }
  } else {
    await queueOperation("rpc:crear_snapshot_evaluacion", evaluacionId, "CREATE", {p_evaluacion_id: evaluacionId});
  }

  state.wizard = null;
  go("resumen-evaluacion", {currentEvaluacion: evaluacion});
}
