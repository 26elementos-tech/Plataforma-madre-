<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Elementos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Plataforma Madre | Elementos Financieros</title>
<style>
:root{
  /* Identidad "family office" -- ivory/navy/dorado, casi sin sombra, esquinas
     casi rectas. Lo único que se deja levantar del fondo es lo crítico, en
     fc2-badge/fc2-tag y en el PDF, que quedan intactos a propósito. */
  --navy-950:#0B1E32; --navy-900:#0F2A43; --navy-800:#17395A; --navy-700:#204a72;
  --navy-100:#E7EDF3; --gold-600:#8C6A1E; --gold-500:#B8935A; --gold-100:#F1E7D2;
  --bg:#FAF8F3; --paper:#FDFBF6; --ink:#1C2430; --ink-soft:#6B6456; --line:#DDD6C4;
  --bad:#8C221B; --bad-bg:#F8E3E1; --ok:#2E7D4F; --ok-bg:#E7F3EC;
  --radius:3px; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,.serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;font-weight:500;color:var(--navy-900)}
#app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.topbar{background:var(--navy-900);color:#fff;padding:18px 18px 16px;position:sticky;top:env(safe-area-inset-top);z-index:20}
.topbar-row{position:relative;z-index:1}
.topbar .brand{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-500);margin:0 0 2px}
.topbar h1{color:#fff;font-size:20px;margin:0;line-height:1.25}
.topbar .sub{color:#C7D2DC;font-size:13px;margin-top:3px}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back-btn{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:8px;padding:8px 11px;font-size:14px;cursor:pointer}
.content{flex:1;padding:18px 16px 32px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.muted{color:var(--ink-soft);font-size:14px}
label{display:block;font-size:13px;color:var(--ink-soft);margin:14px 0 5px}
label:first-of-type{margin-top:0}
input[type=text],input[type=email],input[type=password],select{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);
}
.btn{padding:13px 16px;border-radius:8px;font-size:15.5px;font-family:inherit;border:none;cursor:pointer;text-align:center}
.btn-primary{background:var(--navy-900);color:#fff;width:100%}
.btn-primary:disabled{background:#AEB8C1}
.btn-ghost{background:#fff;color:var(--navy-900);border:1px solid var(--line);width:100%}
.btn-link{background:none;border:none;color:var(--navy-800);font-size:14px;text-decoration:underline;cursor:pointer;padding:10px 0}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.ok-msg{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.hub-card{display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:none;border-bottom:0.5px solid var(--line);border-radius:0;padding:16px 2px;cursor:pointer;margin-bottom:0}
.hub-card:first-child{border-top:0.5px solid var(--line)}
.hub-card .hc-name{font-weight:500;color:var(--navy-900);font-size:16px;font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif}
.hub-card .hc-sub{font-size:11.5px;letter-spacing:.03em;color:var(--ink-soft);margin-top:3px}
.hub-card .hc-arrow{color:var(--ink-soft);font-size:15px}
.action-btn{display:flex;align-items:center;justify-content:space-between;background:var(--navy-900);color:#fff;border:none;border-radius:var(--radius);padding:15px 18px;font-size:15px;font-family:inherit;cursor:pointer;width:100%;margin-bottom:14px}
.empty-note{border:1px dashed var(--line);border-radius:var(--radius);padding:16px;color:var(--ink-soft);font-size:14px;text-align:center}
.pill{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:0;font-weight:500;background:none;color:var(--ink-soft)}
.dep-tag{display:inline-block;font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;background:var(--navy-100);color:var(--navy-800)}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);font-weight:500;margin:4px 0 8px}
.small-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.small-row:last-child{border-bottom:none}
.center-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,42,67,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal-sheet{background:var(--paper);border-radius:16px 16px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:85vh;overflow-y:auto}
.modal-sheet h3{margin:0 0 14px;font-size:17px}

.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--navy-900);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:9px 14px;font-size:13.5px;cursor:pointer;user-select:none}
.chip.selected{background:var(--navy-900);border-color:var(--navy-900);color:#fff}
.group-title{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);font-weight:500;margin:16px 0 6px}
.group-title:first-child{margin-top:0}
.level-option{border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:9px;cursor:pointer;background:#fff}
.level-option.selected{border-color:var(--navy-900);box-shadow:0 0 0 1.5px var(--navy-900) inset}
.level-option .lo-name{font-weight:600;color:var(--navy-900);font-size:15px}
.level-option .lo-desc{font-size:13px;color:var(--ink-soft);margin-top:2px}
.crit-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.crit-top{display:flex;justify-content:space-between;gap:8px}
.crit-req{font-weight:600;font-size:14.5px;line-height:1.3}
.crit-tag{font-size:10px;letter-spacing:.02em;border-radius:5px;padding:3px 7px;white-space:nowrap;font-weight:600;height:fit-content}
.tag-obligatorio{background:var(--bad-bg);color:var(--bad)}
.tag-condicionado{background:#FBF3DF;color:#B8860B}
.tag-revision{background:#E9F1F8;color:#2F6FA8}
.tag-buenapractica{background:var(--navy-100);color:var(--navy-800)}
.crit-meta{margin-top:7px;font-size:12px;color:var(--ink-soft)}
.module-progress{display:flex;gap:5px;padding:4px 0 2px}
.module-progress .dot{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.25)}
.module-progress .dot.done{background:var(--gold-500)}
.module-progress .dot.current{background:#fff}
.summary-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.summary-row:last-child{border-bottom:none}
.summary-row .k{color:var(--ink-soft)}
.summary-row .v{font-weight:600;color:var(--navy-900)}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.status-opt{border:1px solid var(--line);border-radius:8px;padding:8px 6px;font-size:11.5px;text-align:center;cursor:pointer;background:#fff;color:var(--ink);line-height:1.2}
.status-opt.sel-cumple{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.status-opt.sel-parcial{background:#FBF3DF;border-color:#B8860B;color:#B8860B}
.status-opt.sel-no_cumple{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.status-opt.sel-no_aplica{background:var(--navy-100);border-color:#8B96A0;color:var(--ink-soft)}
.status-opt.sel-pendiente{background:#E9F1F8;border-color:#2F6FA8;color:#2F6FA8}
.status-opt.sel-no_verificado{background:#EAEAEA;border-color:#3A3A3A;color:#3A3A3A}
.crit-note{width:100%;margin-top:8px;font-size:13px;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit}
.evid-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.evid-thumb{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#eee}
.evid-add{width:52px;height:52px;border:1.5px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-soft);cursor:pointer;background:#fbfbfa}
.evid-uploading{font-size:11px;color:var(--ink-soft)}
.gauge-wrap{display:flex;align-items:center;gap:18px}
.area-bar-row{margin-bottom:10px}
.area-bar-row .abr-top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}
.area-bar-track{height:8px;border-radius:4px;background:#EFF1F2;overflow:hidden}
.area-bar-fill{height:100%;border-radius:4px}
.finding-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px}
.finding-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mode-toggle{display:flex;gap:8px;margin-bottom:14px}
.mode-toggle .chip{flex:1;text-align:center}
.offline-bar{position:fixed;left:0;right:0;bottom:0;z-index:100;text-align:center;font-size:12.5px;padding:9px 14px;padding-bottom:calc(9px + env(safe-area-inset-bottom));color:#fff}
.offline-bar.off{background:#8A5A1E}
.offline-bar.syncing{background:var(--navy-800)}
.offline-bar.err{background:var(--bad);cursor:pointer}
.fc2{border-radius:var(--radius);padding:14px 15px;margin-bottom:12px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--line)}
.fc2.done{opacity:.68}
.fc2-top{display:flex;gap:12px;align-items:flex-start}
.fc2-badge{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.fc2-body{flex:1;min-width:0}
.fc2-tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:2px 9px;border-radius:20px;margin-bottom:6px}
.fc2-title{font-size:14.5px;font-weight:600;color:var(--navy-900);line-height:1.35;margin:0}
.fc2-title.done{text-decoration:line-through;text-decoration-color:var(--ink-soft);color:var(--ink-soft)}
.fc2-meta{font-size:12px;color:var(--ink-soft);margin-top:3px}
.fc2-action-row{display:flex;gap:10px;margin-top:10px;align-items:flex-start}
.fc2-photos{display:grid;grid-template-columns:repeat(2,26px);gap:4px;flex-shrink:0}
.fc2-photos img{width:26px;height:26px;border-radius:5px;object-fit:cover}
.fc2-photo-empty{width:56px;height:56px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:10px;text-align:center;flex-shrink:0;line-height:1.2}
.fc2-action-box{flex:1;min-width:0;background:var(--bg);border-radius:8px;padding:8px 10px}
.fc2-action-label{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.fc2-action-input{width:100%;border:none;background:transparent;font-size:13px;font-weight:600;color:var(--navy-900);resize:vertical;min-height:36px;font-family:inherit;padding:0}
.fc2-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.fc2-pill{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:20px;padding:4px 10px 4px 11px;font-size:11.5px;color:var(--ink-soft)}
.fc2-pill input,.fc2-pill select{border:none;background:transparent;font-size:11.5px;color:var(--ink);font-family:inherit;padding:0}
.fc2-pill input[type=text]{width:78px}
.fc2-pill input[type=date]{width:90px}
.fc2-pill-done{background:var(--ok-bg);color:var(--ok);font-weight:600}
.fc2-progress-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fc2-progress-track{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.fc2-progress-fill{height:100%;background:var(--ok)}
.inv-grid-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.inv-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--paper)}
.inv-card-icon{font-size:18px}
.inv-card-label{font-size:13px;font-weight:600;color:var(--navy-900);margin:6px 0 0}
.inv-card-count{font-size:12px;color:var(--ink-soft);margin:2px 0 0}
.hallazgos-box{border:1px dashed var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.ev-menu-btn{color:var(--ink-soft);font-weight:700;font-size:17px;line-height:1;border-radius:6px}
.ev-menu-btn:active{background:var(--line)}
.save-tick{font-size:11px;color:var(--ok);margin-top:4px;height:14px}
.exp-tabs{display:flex;gap:4px;background:var(--navy-100);border-radius:10px;padding:4px;margin-bottom:14px}
.exp-tab{flex:1;border:none;background:none;padding:10px 4px;border-radius:7px;font-size:14px;font-family:inherit;color:var(--navy-800);cursor:pointer}
.exp-tab.active{background:var(--navy-900);color:#fff;font-weight:600}
.area-card{padding:14px}
.area-head{display:flex;align-items:center;gap:12px;cursor:pointer}
.area-head.soon{cursor:default;padding:12px 0;border-bottom:1px solid var(--line);opacity:.85}
.area-head.soon:last-child{border-bottom:none}
.area-icon{width:40px;height:40px;border-radius:50%;background:var(--gold-100);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.area-name{font-family:Georgia,"Iowan Old Style",Palatino,serif;font-size:16.5px;color:var(--navy-900);font-weight:500}
.area-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.area-chev{color:var(--ink-soft);font-size:15px}
.area-body{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}

/* ------------------------------- Evidencia fotográfica (Etapa 4) -------------------------------
   Se genera original + optimizada + thumbnail en el dispositivo ANTES de subir, tal como
   quedó definido en el esquema (corrección #2 de Fase 1) -- el original nunca se comprime
   de forma destructiva, solo se redimensiona la copia optimizada/miniatura. */
function getImageDimensions(file){
  return new Promise((resolve)=>{
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = ()=>{ resolve({width:img.naturalWidth, height:img.naturalHeight}); URL.revokeObjectURL(url); };
    img.onerror = ()=>{ resolve({width:null,height:null}); URL.revokeObjectURL(url); };
    img.src = url;
  });
}
function compressImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let w=img.naturalWidth, h=img.naturalHeight;
      if(w>=h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const canvas = document.createElement("canvas"); canvas.width=w; canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>{ URL.revokeObjectURL(url); blob?resolve({blob,width:w,height:h}):reject(new Error("No se pudo comprimir")); }, "image/jpeg", quality);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("No se pudo leer la imagen")); };
    img.src = url;
  });
}
// Sube y procesa una evidencia YA con su UUID definitivo (evidenciaId, generado por el
// llamador con newId()). Se usa tanto en línea como al sincronizar un blob encolado --
// misma función, mismo resultado, sin importar cuándo corre.
async function uploadEvidenciaConId(evidenciaId, evaluacionId, parentField, parentId, file, fileName){
  const ext = ((fileName||file.name||"foto.jpg").split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"") || "jpg";
  // El primer segmento de la ruta DEBE ser evaluacion_id: la política de Storage
  // (evidencias_storage_acceso) usa storage.foldername(name)[1] para decidir acceso.
  const basePath = `${evaluacionId}/${evidenciaId}`;
  const dims = await getImageDimensions(file);
  const optimizada = await compressImage(file, 1280, 0.72);
  const thumb = await compressImage(file, 240, 0.6);

  const up1 = await sb.storage.from("evidencias").upload(`${basePath}/original.${ext}`, file, {contentType:file.type||"image/jpeg", upsert:true});
  if(up1.error) throw up1.error;
  const up2 = await sb.storage.from("evidencias").upload(`${basePath}/optimizada.jpg`, optimizada.blob, {contentType:"image/jpeg", upsert:true});
  const up3 = await sb.storage.from("evidencias").upload(`${basePath}/thumbnail.jpg`, thumb.blob, {contentType:"image/jpeg", upsert:true});

  const tipoFoto = await sb.from("tipos_evidencia").select("id").eq("codigo","foto").single();
  const { error: insErr } = await sb.from("evidencias").upsert({
    id: evidenciaId,
    tipo_evidencia_id: tipoFoto.data.id,
    storage_path_original: `${basePath}/original.${ext}`,
    storage_path_optimizada: up2.error ? null : `${basePath}/optimizada.jpg`,
    storage_path_thumbnail: up3.error ? null : `${basePath}/thumbnail.jpg`,
    formato: file.type || "image/jpeg",
    ancho_px: dims.width, alto_px: dims.height,
    tamano_bytes_original: file.size,
    tamano_bytes_optimizada: optimizada.blob.size,
    uploaded_by: state.profile.id,
    [parentField]: parentId,
  }, {onConflict:"id", ignoreDuplicates:true});
  if(insErr) throw insErr;
}

// Punto de entrada desde la UI: si hay señal, sube ya mismo con un id nuevo. Si no,
// guarda el archivo COMPLETO en IndexedDB (sin comprimir todavía -- eso pasa al
// sincronizar) y encola la subida como una operación dependiente de su padre.
async function uploadEvidencia(evaluacionId, parentField, parentId, file){
  const evidenciaId = newId();
  if(navigator.onLine){
    try{
      await uploadEvidenciaConId(evidenciaId, evaluacionId, parentField, parentId, file, file.name);
      return {ok:true, queued:false};
    }catch(err){
      if(!(err && err.message && /network|fetch|Failed to fetch/i.test(err.message))) throw err; // error real, no de red
      // si falló por red a media subida, cae al camino offline de abajo
    }
  }
  await idbPut(STORE_BLOBS, {id: evidenciaId, blob: file, fileName: file.name, fileType: file.type});
  await queueOperation("evidencias_blob", evidenciaId, "CREATE", {evaluacionId, parentField, parentId});
  updateOfflineBanner();
  return {ok:true, queued:true};
}

// Procesa una evidencia encolada como blob: lee el archivo de IndexedDB, sube/comprime
// igual que si fuera en línea, y borra el blob local solo si todo salió bien.
async function syncBlobEvidencia(entry){
  const stored = await idbGet(STORE_BLOBS, entry.entity_id);
  if(!stored) return true; // ya se sincronizó y se limpió el blob en un intento previo -- nada que hacer, no es error
  const file = stored.blob instanceof File ? stored.blob : new File([stored.blob], stored.fileName||"foto.jpg", {type:stored.fileType||"image/jpeg"});
  await uploadEvidenciaConId(entry.entity_id, entry.payload.evaluacionId, entry.payload.parentField, entry.payload.parentId, file, stored.fileName);
  await idbDeleteKey(STORE_BLOBS, entry.entity_id);
  return true;
}

// Widget reutilizable: miniaturas + botón "+" para agregar foto, para cualquier padre
// (hallazgo_id / coleccion_item_id / respuesta_criterio_id / registro_unico_id).
// También muestra las fotos tomadas offline que todavía no se han subido (con borde
// punteado), leyéndolas directo de IndexedDB -- así se ve de inmediato que se guardaron.
/* ------------------------------- Contratación -------------------------------
   Carpeta de contratos firmados por expediente, opcional -- algunos clientes
   pagan en efectivo sin contrato. Requiere conexión para subir (no entra a la
   cola offline: a diferencia de una foto en sitio, el contrato normalmente se
   sube con calma, no a media visita sin señal). */
async function uploadContrato(expedienteId, file, servicioContratadoId){
  const contratoId = newId();
  const ext = ((file.name||"contrato").split(".").pop()||"pdf").toLowerCase().replace(/[^a-z0-9]/g,"") || "pdf";
  const path = `${expedienteId}/${contratoId}.${ext}`;
  const up = await sb.storage.from("respaldos-manuales").upload(path, file, {contentType:file.type||"application/octet-stream", upsert:true});
  if(up.error) throw up.error;
  const { error: insErr } = await sb.from("contratos").insert({
    id: contratoId, expediente_id: expedienteId, servicio_contratado_id: servicioContratadoId||null,
    storage_path: path, nombre_archivo: file.name||"contrato", created_by: state.profile.id,
  });
  if(insErr) throw insErr;
  return contratoId;
}

async function openContratoDetalle(c, onChange){
  const { data: signed } = await sb.storage.from("respaldos-manuales").createSignedUrl(c.storage_path, 3600);
  const opciones = [
    signed ? {v:"abrir", label:"Abrir / descargar"} : null,
    {v:"editar", label:"Agregar fecha de firma y nota"},
    {v:"eliminar", label:"🗑 Eliminar"},
  ].filter(Boolean);
  const chosen = await askChoice(c.nombre_archivo, opciones, o=>o.label);
  if(!chosen) return;
  if(chosen.v==="abrir" && signed) window.open(signed.signedUrl, "_blank");
  if(chosen.v==="editar"){
    const fecha = await askText("Fecha de firma", "Fecha en que se firmó (opcional, AAAA-MM-DD)", c.fecha_firma||"AAAA-MM-DD");
    const nota = await askText("Nota", "Nota sobre este contrato (opcional)", c.nota||"Ej. renovación anual");
    await sb.from("contratos").update({fecha_firma: fecha||c.fecha_firma||null, nota: nota||c.nota||null}).eq("id", c.id);
    onChange();
  }
  if(chosen.v==="eliminar"){
    await sb.from("contratos").update({anulado_at: new Date().toISOString(), anulado_por: state.profile.id}).eq("id", c.id);
    onChange();
  }
}

async function renderEvidenceRow(container, evaluacionId, parentField, parentId){
  container.innerHTML = `<span class="evid-uploading">Cargando evidencia…</span>`;
  const [remoteRes, queueAll] = await Promise.all([
    sb.from("evidencias").select("id,storage_path_thumbnail,storage_path_optimizada,storage_path_original").eq(parentField, parentId).is("anulado_at", null),
    idbGetAllQueue(),
  ]);
  if(remoteRes.error && navigator.onLine){ container.innerHTML = `<span class="evid-uploading">No se pudo cargar evidencia: ${esc(remoteRes.error.message)}</span>`; return; }
  container.innerHTML = "";
  for(const item of (remoteRes.data||[])){
    const path = item.storage_path_thumbnail || item.storage_path_optimizada || item.storage_path_original;
    const { data: signed } = await sb.storage.from("evidencias").createSignedUrl(path, 3600);
    const img = document.createElement("img");
    img.className = "evid-thumb";
    img.src = signed ? signed.signedUrl : "";
    container.appendChild(img);
  }
  const pendientes = queueAll.filter(e=>e.entity==="evidencias_blob" && e.payload.parentField===parentField && e.payload.parentId===parentId && e.status!=="SYNCED");
  for(const p of pendientes){
    const stored = await idbGet(STORE_BLOBS, p.entity_id);
    if(!stored) continue;
    const img = document.createElement("img");
    img.className = "evid-thumb"; img.style.border = "2px dashed var(--gold-600)"; img.title = "Pendiente de sincronizar";
    img.src = URL.createObjectURL(stored.blob);
    container.appendChild(img);
  }
  const label = document.createElement("label");
  label.className = "evid-add";
  label.innerHTML = `＋<input type="file" accept="image/*" capture="environment" style="display:none">`;
  label.querySelector("input").addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    label.textContent = "…";
    try{
      await uploadEvidencia(evaluacionId, parentField, parentId, file);
      await renderEvidenceRow(container, evaluacionId, parentField, parentId);
    }catch(err){
      showError("No se pudo subir la foto: " + (err && err.message ? err.message : err));
      label.textContent = "＋";
    }
  });
  container.appendChild(label);
}

// Para respuestas_criterio: la fila puede no existir todavía si el criterio no se ha

async function ensureRespuestaId(evaluacionId, criterioId){
  const { data: existing } = await sb.from("respuestas_criterio").select("id")
    .eq("evaluacion_id", evaluacionId).eq("criterio_id", criterioId).maybeSingle();

  const { data: created, error } = await sb.from("respuestas_criterio")
    .insert({evaluacion_id: evaluacionId, criterio_id: criterioId}).select("id").single();
  if(error) throw error;
  return created.id;

      resolve({action:"flag", campos, observaciones});
    };
    if(existing){
      const evidContainer = sheet.querySelector("#evid-item-"+existing.id);
      renderEvidenceRow(evidContainer, evaluacionId, "coleccion_item_id", existing.id);
    }
    sheet.querySelector("#m-ok").onclick = () => {
      const campos = {};
      sheet.querySelectorAll("[data-f]").forEach(el=>{ campos[el.dataset.f] = el.value; });
      const observaciones = sheet.querySelector("[data-obs]").value;
      closeModal();
      resolve({action:"save", campos, observaciones});
    };
    const delBtn = sheet.querySelector("#m-del");
    if(delBtn) delBtn.onclick = () => { closeModal(); resolve({action:"delete"}); };
  });
}


/* 🚩 Marcar como hallazgo desde un registro del inventario (como en V3): abre el hallazgo
   con el área sugerida, el nombre del registro y copia sus fotos al hallazgo. */
const FLAG_AREA = {
  cofepris: {personal:"Personal y documentación profesional", documento:"Autorizaciones sanitarias", redes_perfil:"Publicidad sanitaria", equipo:"Equipamiento y dispositivos médicos", plagas:"Condiciones generales del establecimiento", limpieza:"Limpieza e higiene", agua:"Limpieza e higiene", publicidad_captura:"Publicidad sanitaria", mobiliario:"Condiciones generales del establecimiento", almacen:"Insumos y medicamentos", medicamento:"Insumos y medicamentos", insumo:"Insumos y medicamentos", procedimiento:"Expediente clínico"},
  stps: {personal:"Capacitación", documento:"Condiciones laborales", equipo:"Maquinaria y equipo", almacen:"Manejo de materiales"},
  proteccion_civil: {personal:"Brigadas de Protección Civil", documento:"Programa Interno de Protección Civil", equipo:"Prevención y protección contra incendios"},
};

/* ------------------------- Publicidad en redes: checklist -> hallazgo -------------------------
   Lo que sale "No" en el checklist se ofrece como hallazgo ya redactado (área Publicidad sanitaria).
   Interpretación prudente del Reglamento de la LGS en Materia de Publicidad (arts. 19, 63-65, 79). */
const REDES_FALLAS = [
  {k:"chk_cedula", bad:["No"], d:"No aparecen institución y cédula del médico en biografía o publicaciones", a:"Agregar a la biografía y a toda publicación promocional un pie con nombre del médico, institución que expidió el título y cédula profesional."},
  {k:"chk_permiso", bad:["No","En trámite"], d:"Publicidad de servicios sin permiso o aviso de publicidad ante COFEPRIS", a:"Tramitar el permiso (clínica) o aviso (médico) de publicidad y no pautar tratamientos hasta contar con él."},
  {k:"chk_congruencia", bad:["No"], d:"Se anuncian servicios que no corresponden a su aviso de funcionamiento o a lo observado", a:"Retirar de redes los servicios que no correspondan al aviso de funcionamiento o a los recursos reales de la clínica."},
  {k:"chk_cedula_post", bad:["No"], d:"Publicación sin nombre del médico, institución y cédula", a:"Agregar el pie con nombre del médico, institución y cédula a toda publicación promocional."},
  {k:"chk_promesas", bad:["No"], d:"Promesas de resultado no comprobables", a:"Reescribir sin promesas: limitarse a resultados reales y comprobables."},
  {k:"chk_terapeutico", bad:["No"], d:"Se atribuyen propiedades médicas a un servicio estético", a:"Quitar las palabras curar, prevenir o tratar en servicios de embellecimiento."},
  {k:"chk_marcas", bad:["No"], d:"Uso de nombres comerciales de medicamentos o venta por redes", a:"Quitar nombres comerciales de medicamentos y no ofrecerlos en venta por redes."},
  {k:"chk_riesgos", bad:["No"], d:"No se mencionan riesgos ni contraindicaciones", a:"Agregar la leyenda de riesgos y contraindicaciones."},
  {k:"chk_antesdespues", bad:["Sí, sin respaldo o sin consentimiento"], d:"Antes y después sin respaldo o sin consentimiento del paciente", a:"Usar solo antes y después reales, sin edición y con consentimiento por escrito del paciente."},
  {k:"chk_influencer", bad:["Sí, no cumple"], d:"Contenido de influencer o testimonio que no cumple las reglas", a:"Aplicar las mismas reglas a influencers y aprobar sus textos antes de publicar."},
];
async function ofrecerHallazgoRedes(evaluacionId, codigo, campos, objeto, parentField, parentId){
  const fallas = REDES_FALLAS.filter(f=>f.bad.includes(campos[f.k]));
  if(!fallas.length) return false;
  const c = await askChoice(`Se detectaron ${fallas.length} punto(s) que no cumplen en esta revisión de redes. ¿Crear hallazgo?`, [{v:1,label:"Sí, crear hallazgo"},{v:0,label:"Ahora no"}], o=>o.label);
  if(!c || !c.v) return false;
  await flagComoHallazgo(evaluacionId, codigo, objeto, fallas.map(f=>f.d).join("; ")+".", parentField, parentId, {accion: fallas.map(f=>f.a).join(" "), categoria:"Publicidad sanitaria"});
  return true;
}

async function flagComoHallazgo(evaluacionId, codigo, objeto, descripcion, parentField, parentId, extra){
  extra = extra || {};
  const area = extra.categoria || (FLAG_AREA[state.currentDep||"cofepris"]||{})[codigo] || (FLAG_AREA.cofepris[codigo]||"");
  const res = await openHallazgoLibreForm(null, {categoria: area, objeto, descripcion, accion: extra.accion, conFotos: !!parentId});
  if(!(res && res.action==="save")){ renderResumenEvaluacion(); return; }
  const hid = newId();
  const r = await persistEntity("hallazgos", hid, "CREATE", {...res.campos, evaluacion_id: evaluacionId, origen:"libre", clasificacion_id: await getClasifSinClasificar(), created_by: state.profile.id});
  if(r.ok && !r.queued && parentId){
    try{
      const { data: evs } = await sb.from("evidencias").select("*").eq(parentField, parentId).is("anulado_at", null);
      for(const e of (evs||[])){
        const copia = {id:newId(), evaluacion_id:e.evaluacion_id, hallazgo_id:hid, tipo_evidencia_id:e.tipo_evidencia_id,
          storage_path_original:e.storage_path_original, storage_path_optimizada:e.storage_path_optimizada, storage_path_thumbnail:e.storage_path_thumbnail,
          formato:e.formato, ancho_px:e.ancho_px, alto_px:e.alto_px, tamano_bytes_original:e.tamano_bytes_original, tamano_bytes_optimizada:e.tamano_bytes_optimizada,
          descripcion:e.descripcion, fecha:e.fecha, uploaded_by: state.profile.id};
        const ins = await sb.from("evidencias").insert(copia);
        if(ins.error) console.warn("No se copió una foto:", ins.error.message);
      }
    }catch(err){ console.warn("No se pudieron copiar las fotos:", err); }
  }
  renderResumenEvaluacion();
}

async function openColeccionList(evaluacionId, codigo){
  const schema = COLLECTION_SCHEMAS[codigo];
  const ids = await ensureTipoIds();
  const tipoId = ids["c:"+codigo];
  const { data: itemsRaw, error, fromCache } = await cachedRead("ev:"+evaluacionId+":coll:"+codigo,
    ()=>sb.from("colecciones_items").select("*").eq("evaluacion_id", evaluacionId).eq("tipo_id", tipoId).order("created_at"));
  if(error){ showError("No se pudo cargar: " + error.message); return; }
  const items = itemsRaw || [];
  const itemsHtml = items.map(it=>`<div class="small-row" data-item="${it.id}" style="cursor:pointer"><span>${esc(it.campos?.[schema.titleField]||"(sin nombre)")}</span><span class="muted">›</span></div>`).join("")
    || `<p class="muted small" style="padding:10px 0">Sin ${schema.singular}s registrados todavía.</p>`;
  const sheet = openModal(`
    <h3>${schema.icon} ${esc(schema.label)}</h3>
    ${fromCache ? `<p class="muted small">📴 Lista guardada localmente -- puede no incluir cambios hechos en otro dispositivo.</p>` : ""}
    <div id="coll-items">${itemsHtml}</div>
    <button class="btn btn-primary" id="m-add" style="width:100%;margin-top:14px">+ Agregar ${esc(schema.singular)}</button>
  `);
  sheet.querySelectorAll("[data-item]").forEach(row=>{
    row.onclick = async () => {
      const item = items.find(i=>i.id===row.dataset.item);
      closeModal();
      const res = await openItemForm(evaluacionId, schema, item);
      if(res && res.action==="save"){
        await persistEntity("colecciones_items", item.id, "UPDATE", {campos:res.campos, observaciones:res.observaciones});
        await patchCache("ev:"+evaluacionId+":coll:"+codigo, (list)=>(list||[]).map(x=>x.id===item.id?{...x,campos:res.campos,observaciones:res.observaciones}:x));
        if(codigo==="publicidad_captura" && await ofrecerHallazgoRedes(evaluacionId, codigo, res.campos, "Publicación en "+(res.campos.canal||"redes"), "coleccion_item_id", item.id)) return;
      } else if(res && res.action==="delete"){
        await persistEntity("colecciones_items", item.id, "DELETE", {});
        await patchCache("ev:"+evaluacionId+":coll:"+codigo, (list)=>(list||[]).filter(x=>x.id!==item.id));
        await patchCache("ev:"+evaluacionId+":coll_counts", (rows)=>{
          const arr=[...(rows||[])]; const i=arr.findIndex(r=>r.tipo_id===tipoId); if(i>-1) arr.splice(i,1); return arr;
        });
      }
      if(res && res.action==="flag"){
        await persistEntity("colecciones_items", item.id, "UPDATE", {campos:res.campos, observaciones:res.observaciones});
        await patchCache("ev:"+evaluacionId+":coll:"+codigo, (list)=>(list||[]).map(x=>x.id===item.id?{...x,campos:res.campos,observaciones:res.observaciones}:x));
        const titulo = res.campos?.[schema.titleField] || schema.singular;
        const detalle = [res.observaciones].filter(Boolean).join(" ");
        await flagComoHallazgo(evaluacionId, codigo, titulo, detalle ? titulo + ": " + detalle : "", "coleccion_item_id", item.id);
        return;
      }
      if(res) openColeccionList(evaluacionId, codigo);
    };
  });
  sheet.querySelector("#m-add").onclick = async () => {
    closeModal();
    const res = await openItemForm(evaluacionId, schema, null);
    if(res && res.action==="save"){
      const newItemId = newId();
      await persistEntity("colecciones_items", newItemId, "CREATE", {evaluacion_id:evaluacionId, tipo_id:tipoId, campos:res.campos, observaciones:res.observaciones});
      await patchCache("ev:"+evaluacionId+":coll:"+codigo, (list)=>[...(list||[]), {id:newItemId, evaluacion_id:evaluacionId, tipo_id:tipoId, campos:res.campos, observaciones:res.observaciones, created_at:new Date().toISOString()}]);
      await patchCache("ev:"+evaluacionId+":coll_counts", (rows)=>[...(rows||[]), {tipo_id:tipoId}]);
      if(codigo==="publicidad_captura" && await ofrecerHallazgoRedes(evaluacionId, codigo, res.campos, "Publicación en "+(res.campos.canal||"redes"), "coleccion_item_id", newItemId)) return;
    }
    openColeccionList(evaluacionId, codigo);
  };
}

async function openRegistroUnico(evaluacionId, codigo){
  const schema = SINGLE_SCHEMAS[codigo];
  const ids = await ensureTipoIds();
  const tipoId = ids["r:"+codigo];
  const { data: existing, error } = await cachedRead("ev:"+evaluacionId+":reg:"+codigo,
    ()=>sb.from("registros_unicos").select("*").eq("evaluacion_id", evaluacionId).eq("tipo_id", tipoId).maybeSingle());
  if(error){ showError("No se pudo cargar: " + error.message); return; }
  const fieldsHtml = camposPorNivel(schema.fields).map(f=>{
    const val = (existing && existing.campos && existing.campos[f.key]) || "";
    if(f.type==="select") return `<label>${esc(f.label)}</label><select data-f="${f.key}"><option value="">Selecciona</option>${f.options.map(o=>`<option value="${esc(o)}" ${val===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    return f.type==="textarea"
      ? `<label>${esc(f.label)}</label><textarea data-f="${f.key}">${esc(val)}</textarea>`
      : `<label>${esc(f.label)}</label><input type="text" data-f="${f.key}" value="${esc(val)}">`;
  }).join("");
  const sheet = openModal(`
    <h3>${schema.icon} ${esc(schema.label)}</h3>${fieldsHtml}
    ${existing ? `<label>Evidencia fotográfica</label><div class="evid-row" id="evid-su-${existing.id}"></div>` : `<p class="muted small" style="margin-top:10px">Guarda primero para poder agregar fotos.</p>`}
    <button class="btn btn-primary" id="m-ok" style="width:100%;margin-top:16px">Guardar</button>
    ${existing ? `<button class="btn btn-flag" id="m-flag">🚩 Marcar como hallazgo</button>` : ""}
  `);
  if(existing) renderEvidenceRow(sheet.querySelector("#evid-su-"+existing.id), evaluacionId, "registro_unico_id", existing.id);
  const flagSu = sheet.querySelector("#m-flag");
  if(flagSu) flagSu.onclick = async () => {
    const campos = {};
    sheet.querySelectorAll("[data-f]").forEach(el=>{ campos[el.dataset.f]=el.value; });
    closeModal();
    await persistEntity("registros_unicos", existing.id, "UPDATE", {campos});
    await patchCache("ev:"+evaluacionId+":reg:"+codigo, (cur)=>({...(cur||existing), campos}));
    await flagComoHallazgo(evaluacionId, codigo, schema.label, "", "registro_unico_id", existing.id);
  };
  sheet.querySelector("#m-ok").onclick = async () => {
    const campos = {};
    sheet.querySelectorAll("[data-f]").forEach(el=>{ campos[el.dataset.f]=el.value; });
    closeModal();
    let regId = existing?.id;
    if(existing){
      await persistEntity("registros_unicos", existing.id, "UPDATE", {campos});
      await patchCache("ev:"+evaluacionId+":reg:"+codigo, (cur)=>({...(cur||existing), campos}));
    } else {
      const newRegId = newId(); regId = newRegId;
      await persistEntity("registros_unicos", newRegId, "CREATE", {evaluacion_id:evaluacionId, tipo_id:tipoId, campos});
      await patchCache("ev:"+evaluacionId+":reg:"+codigo, ()=>({id:newRegId, evaluacion_id:evaluacionId, tipo_id:tipoId, campos}));
      await patchCache("ev:"+evaluacionId+":single_flags", (rows)=>[...(rows||[]), {tipo_id:tipoId}]);
    }
    if(codigo==="redes_perfil" && await ofrecerHallazgoRedes(evaluacionId, codigo, campos, "Perfil de redes sociales", "registro_unico_id", regId)) return;
    if(state.screen==="resumen-evaluacion") renderResumenEvaluacion();
  };
}

/* --------------------------- Motor de riesgo (Etapa 5) ---------------------------
   Mismo modelo cualitativo y explicable de V3: nunca una puntuación que pretenda
   determinar legalidad. Los hallazgos se derivan de las respuestas ya capturadas
   (estatus distinto de cumple/no_aplica) -- no hay tabla de "hallazgos" separada
   todavía en esta plataforma, así que se calculan a partir de respuestas_criterio. */
const STATUS_TEXT = {cumple:"cumple", parcial:"cumple parcialmente", no_cumple:"no cumple",
  no_aplica:"no aplica", pendiente:"pendiente de evidencia", no_verificado:"no se pudo verificar"};

// mientras solo existan estas familias; si se agregan más áreas con criterios reales,
// esto necesita volverse una columna/join real en vez de adivinar por el id.
function detectDependencia(criterioIds){
  if((criterioIds||[]).some(id=>id.startsWith("pc-"))) return {codigo:"proteccion_civil", label:"PROTECCIÓN CIVIL", pdfTitle:"Check-up Regulatorio Protección Civil", screenTitle:"Check-up Protección Civil", tieneEtiquetaEspecialista:true};
  if((criterioIds||[]).some(id=>id.startsWith("stps-"))) return {codigo:"stps", label:"STPS", pdfTitle:"Check-up Regulatorio STPS", screenTitle:"Check-up STPS", tieneEtiquetaEspecialista:true};
  return {codigo:"cofepris", label:"COFEPRIS", pdfTitle:"Check-up Regulatorio COFEPRIS", screenTitle:"Check-up COFEPRIS", tieneEtiquetaEspecialista:false};

function computeCriterioRisk(criterio, estatus, incierto){
  if(incierto) return {impacto:null, probabilidad:null, prioridad:"POR_DETERMINAR",
    explicacion:"Aplicabilidad no determinada — se requiere confirmar en sitio."};
  const impactoBase = {obligatorio:3, condicionado:2, revision:1, buena_practica:1}[criterio.aplicabilidad] || 1;
  const impacto = Math.min(4, impactoBase + (estatus==="no_cumple"?1:0));
  const probabilidad = estatus==="no_cumple"?3 : estatus==="parcial"?2 : estatus==="pendiente"?2 : 1;
  const score = impacto*probabilidad;
  const prioridad = score>=9?"CRITICA":score>=6?"ALTA":score>=3?"MEDIA":"BAJA";
  return {impacto, probabilidad, score, prioridad,
    explicacion:`Impacto ${impacto}/4 (criterio ${criterio.aplicabilidad}${estatus==="no_cumple"?", no cumple":""}) × probabilidad ${probabilidad}/4 (estatus: ${STATUS_TEXT[estatus]}) → ${score}.`};
}

function sugerirAccion(criterio){
  return criterio.accion || `Regularizar conforme al fundamento citado (${criterio.fundamento_legal||"ver criterio"}). Evidencia esperada: ${criterio.evidencia_esperada||"la indicada en el criterio"}.`;
}

let _clasifCache = null;
async function getClasifSinClasificar(){
  const c = await ensureClasificaciones();
  return c["sin_clasificar"];
}

// Hallazgo manual (origen='libre'): mismo modelo de riesgo que uno regulatorio, pero
// sin criterio_id -- el usuario da impacto/probabilidad directo, la prioridad se
// calcula igual que para los regulatorios, y NO se convierte en obligación normativa
// (fundamento es un campo libre, opcional; si no hay, no se inventa uno).
function computeManualPrioridad(impacto, probabilidad){
  const score = (impacto||1) * (probabilidad||1);
  return score>=9 ? "CRITICA" : score>=6 ? "ALTA" : score>=3 ? "MEDIA" : "BAJA";
}

async function renderHallazgosLibresList(evaluacionId){
  const cont = document.getElementById("hallazgos-libres-list");
  if(!cont) return;
  const { data, error } = await cachedRead("ev:"+evaluacionId+":hallazgos_libres", ()=>sb.from("hallazgos").select("*").eq("evaluacion_id", evaluacionId).eq("origen","libre").order("created_at",{ascending:false}));
  if(error){ cont.innerHTML = `<div class="err small">${esc(error.message)}</div>`; return; }
  if(!data || data.length===0){ cont.innerHTML = `<div class="empty-note">Sin hallazgos libres todavía.</div>`; return; }
  cont.innerHTML = "";
  data.forEach(h=>{
    const row = document.createElement("div");
    row.className = "small-row"; row.style.cursor="pointer";
    row.innerHTML = `<span>${esc(h.descripcion.slice(0,50))}${h.descripcion.length>50?"…":""}</span><span class="muted">${esc(PRIORITY_LABEL[h.prioridad?.toUpperCase()]||h.prioridad||"")}</span>`;
    row.onclick = async () => {
      const res = await openHallazgoLibreForm(h);
      if(res && res.action==="save"){ await persistEntity("hallazgos", h.id, "UPDATE", res.campos); renderResumenEvaluacion(); }
      else if(res && res.action==="delete"){ await sb.from("hallazgos").delete().eq("id",h.id); renderResumenEvaluacion(); }
    };
    cont.appendChild(row);
  });
}


/* Hallazgo de visita guiado: eliges el área y el motivo, y la descripción, la acción y la

const HL_AREAS = ["Autorizaciones sanitarias","Personal y documentación profesional","Equipamiento y dispositivos médicos","Insumos y medicamentos","RPBI","Expediente clínico","Publicidad sanitaria","Condiciones generales del establecimiento","Limpieza e higiene","Protección civil","Seguridad del personal"];

  {m:"Falta documento o comprobante", d:"no cuenta con el documento o comprobante correspondiente", a:"Obtener el documento y conservarlo disponible para la autoridad.", i:3, p:3},
  {m:"Dañado o en mal estado", d:"está dañado o en mal estado", a:"Reparar o sustituir antes de seguir usándolo.", i:3, p:3},

  {m:"Limpieza deficiente", d:"presenta limpieza deficiente", a:"Corregir la limpieza y definir una rutina con responsable y registro.", i:3, p:3},

];
function openHallazgoLibreForm(existing, prefill){
  prefill = prefill || {};
  return new Promise((resolve)=>{
    const impactoVal = existing?.impacto || 2, probVal = existing?.probabilidad || 2;
    const sheet = openModal(`
      <h3>${existing?"Editar":"Nuevo"} hallazgo de visita</h3>
      <label>1. Área</label>
      <div class="chip-grid" id="hl-area">${HL_AREAS.map(a=>`<div class="chip ${existing?.categoria===a?'selected':''}" data-a="${esc(a)}">${esc(a)}</div>`).join("")}</div>

      <label>2. ¿Qué o dónde? (equipo, documento, espacio)</label>
      <input type="text" id="hl-objeto" value="${esc(prefill.objeto||"")}" placeholder="Ej. Láser diodo, cabina 2, botiquín">
      ${prefill.conFotos ? `<p class="muted small" style="margin:6px 0 0">📷 Las fotos de este registro se copian al hallazgo al guardar.</p>` : ""}
      ${existing ? "" : `<label>3. Motivo</label>
      <div class="chip-grid" id="hl-motivo">${HL_MOTIVOS.map((x,i)=>`<div class="chip" data-i="${i}">${esc(x.m)}</div>`).join("")}</div>
      <p class="muted small" style="margin:6px 0 0">Al elegir el motivo se llenan solos la descripción, la acción y la prioridad. Puedes editarlos.</p>`}
      <label>Descripción</label>
      <textarea data-f="descripcion" placeholder='Ej. "El extintor está bloqueado por mobiliario"'>${esc(existing?.descripcion||prefill.descripcion||"")}</textarea>
      <label>Ubicación</label>
      <input type="text" data-f="ubicacion" value="${esc(existing?.ubicacion||"")}" placeholder="Ej. Pasillo, cabina 2">
      <label>Impacto (1-4)</label>
      <div class="chip-grid" id="hl-impacto">${[1,2,3,4].map(n=>`<div class="chip ${impactoVal===n?'selected':''}" data-n="${n}">${n}</div>`).join("")}</div>
      <label>Probabilidad (1-4)</label>
      <div class="chip-grid" id="hl-prob">${[1,2,3,4].map(n=>`<div class="chip ${probVal===n?'selected':''}" data-n="${n}">${n}</div>`).join("")}</div>
      <label>Fundamento legal (opcional -- solo si de verdad existe uno)</label>

async function ensureClasificaciones(){
  if(_clasifCache) return _clasifCache;
  const { data } = await sb.from("clasificaciones_hallazgo").select("id,codigo");
  _clasifCache = {}; (data||[]).forEach(c=>_clasifCache[c.codigo]=c.id);
  return _clasifCache;
}

// Persiste cada hallazgo calculado como una fila real en `hallazgos` (antes solo se
// calculaba al vuelo) -- así responsable/fecha objetivo/estatus de corrección quedan
// guardados para cuando Saúl regrese a reevaluar solo lo que salió mal.
// Offline-safe: NO hace una lectura de red por hallazgo. Recibe el mapa de hallazgos
// regulatorios YA cargado una sola vez (por criterio_id) y solo escribe si hace falta,
// a través de persistEntity() -- así funciona igual con o sin señal.
async function ensureHallazgoRow(evaluacionId, f, hallazgosByCriterio){
  const clasif = await ensureClasificaciones();
  const clasifId = f.risk.prioridad==="POR_DETERMINAR" ? clasif["revision"] : clasif[f.criterio.aplicabilidad];
  const prioridadDb = f.risk.prioridad.toLowerCase(); // enum en BD va en minúsculas
  const existing = hallazgosByCriterio[f.criterio.id];
  if(existing){
    const cambios = {
      descripcion: f.criterio.requisito, fundamento: f.criterio.fundamento_legal,
      clasificacion_id: clasifId, impacto: f.risk.impacto, probabilidad: f.risk.probabilidad,
      prioridad: prioridadDb,
    };
    // No se pisa accion/responsable/fecha/estatus si el evaluador ya los editó. Pero si
    // el "Qué hacer" guardado sigue siendo el texto genérico viejo (nunca lo tocaste),
    // sí se refresca con la sugerencia homologada actual -- así una evaluación abierta
    // hace tiempo no se queda pegada al texto anterior para siempre.
    if((existing.accion||"").startsWith("Regularizar conforme al fundamento citado") && f.criterio.accion){
      cambios.accion = f.criterio.accion;
    }
    const upd = await persistEntity("hallazgos", existing.id, "UPDATE", cambios);
    if(upd.error) throw new Error(`No se pudo actualizar el hallazgo de "${f.criterio.requisito}": ${upd.error.message||upd.error}`);
    return {...existing, ...cambios};
  }
  const newHallazgoId = newId();
  const created = {
    id: newHallazgoId, evaluacion_id: evaluacionId, origen: "regulatorio", criterio_id: f.criterio.id,
    descripcion: f.criterio.requisito, fundamento: f.criterio.fundamento_legal,
    clasificacion_id: clasifId, impacto: f.risk.impacto, probabilidad: f.risk.probabilidad,
    prioridad: prioridadDb, accion: sugerirAccion(f.criterio), created_by: state.profile.id,
  };
  const ins = await persistEntity("hallazgos", newHallazgoId, "CREATE", created);
  if(ins.error) throw new Error(`No se pudo guardar el hallazgo de "${f.criterio.requisito}": ${ins.error.message||ins.error}`);
  return created;
}

function computeDiagnostico(activos, respuestas, manualHallazgos){
  manualHallazgos = manualHallazgos || [];
  const findings = [];
  let contestados = 0;
  activos.forEach(cr=>{
    const r = respuestas[cr.id];
    if(!r || !r.estatus) return;
    contestados++;
    if(r.estatus==="cumple" || r.estatus==="no_aplica") return;
    const risk = computeCriterioRisk(cr, r.estatus, cr.runtimeUncertain);
    findings.push({origen:"regulatorio", criterio:cr, estatus:r.estatus, nota:r.nota, risk});
  });

  // Hallazgos libres (origen='libre'): mismo universo de riesgo/plan de acción que los
  // regulatorios, sin convertirse en obligación normativa -- fundamento solo si el
  // usuario lo dio, prioridad calculada igual (impacto x probabilidad).
  manualHallazgos.forEach(h=>{
    const prioridad = computeManualPrioridad(h.impacto, h.probabilidad);
    findings.push({
      origen:"libre",
      criterio: {id:h.id, modulo: h.categoria||"Hallazgos de visita", requisito: h.descripcion, fundamento_legal: h.fundamento||null},
      estatus: null, nota: null, hallazgo: h,
      risk: {impacto:h.impacto, probabilidad:h.probabilidad, prioridad,
        explicacion:`Hallazgo de visita — impacto ${h.impacto}/4 × probabilidad ${h.probabilidad}/4 → ${(h.impacto||0)*(h.probabilidad||0)}.`},
    });
  });

  findings.sort((a,b)=> (PRIORITY_POINTS[b.risk.prioridad]||0) - (PRIORITY_POINTS[a.risk.prioridad]||0)
    || ["CRITICA","ALTA","MEDIA","BAJA","POR_DETERMINAR"].indexOf(a.risk.prioridad) - ["CRITICA","ALTA","MEDIA","BAJA","POR_DETERMINAR"].indexOf(b.risk.prioridad));

  const raw = findings.reduce((s,f)=>s+(PRIORITY_POINTS[f.risk.prioridad]||0), 0);
  const max = (contestados + manualHallazgos.length)*10;
  const percent = max>0 ? Math.round(100*raw/max) : null;
  const band = percent===null ? {label:"Sin datos suficientes", color:"#8B96A0"}
    : percent>=71 ? {label:"Crítico", color:"#B3261E"}
    : percent>=41 ? {label:"Alto", color:"#B8860B"}
    : percent>=16 ? {label:"Moderado", color:"#C9A227"}
    : {label:"Bajo", color:"#2E7D4F"};

  const porArea = {};
  activos.forEach(cr=>{
    const r = respuestas[cr.id];
    if(!r || !r.estatus) return;
    porArea[cr.modulo] = porArea[cr.modulo] || {raw:0, denom:0};
    porArea[cr.modulo].denom++;
  });
  manualHallazgos.forEach(h=>{
    const mod = h.categoria || "Hallazgos de visita";
    porArea[mod] = porArea[mod] || {raw:0, denom:0};
    porArea[mod].denom++;
  });
  findings.forEach(f=>{ porArea[f.criterio.modulo].raw += PRIORITY_POINTS[f.risk.prioridad]||0; });
  const areaRows = Object.keys(porArea).map(mod=>{
    const {raw:r2, denom:d2} = porArea[mod];
    const pct = d2>0 ? Math.round(100*r2/(d2*10)) : 0;
    const color = pct>=71?"#B3261E":pct>=41?"#B8860B":pct>=16?"#C9A227":"#2E7D4F";
    return {modulo:mod, percent:pct, color};
  }).sort((a,b)=>b.percent-a.percent);

  return {findings, contestados, percent, band, areaRows};
}

/* ------------------------------- Offline — Punto 1: IDs locales + idempotencia -------------------------------
   Toda entidad nueva (hallazgo, elemento de inventario, evidencia, evaluación) recibe su
   UUID definitivo en el dispositivo (crypto.randomUUID()) ANTES de cualquier llamada a
   Supabase. Ese mismo UUID es el id final tanto local como remoto -- nunca se sustituye.
   La cola es única, con estado por operación (PENDING/SYNCING/SYNCED/ERROR) y reintentos
   seguros. La idempotencia real la da Postgres (upsert con onConflict=id,
   ignoreDuplicates=true contra la PRIMARY KEY existente) -- no es solo lógica de JS: si
   la misma operación se reenvía, el propio servidor la reconoce como ya existente.
   Fotos: el archivo se guarda completo en IndexedDB si no hay señal, y se comprime/sube
   hasta que la evidencia (ya con su UUID) pueda sincronizarse.
   Fuera de este punto todavía: abrir un expediente nunca antes cargado sin conexión, y
   cerrar una evaluación sin señal -- quedan para el siguiente punto del diseño offline. */
function newId(){ return crypto.randomUUID(); }

const OFFLINE_DB = "plataforma_madre_offline", OFFLINE_DB_VERSION = 2;
const STORE_QUEUE = "queue", STORE_BLOBS = "blobs", STORE_KV = "kv";
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(OFFLINE_DB, OFFLINE_DB_VERSION);
    req.onupgradeneeded = (ev)=>{
      const db = req.result;
      if(db.objectStoreNames.contains("queue") && ev.oldVersion < 2){
        db.deleteObjectStore("queue"); // esquema anterior (Etapa 6), incompatible -- sin datos reales de cliente todavía
      }
      const qs = db.createObjectStore(STORE_QUEUE, {keyPath:"operation_id"});
      qs.createIndex("by_entity", ["entity","entity_id"], {unique:false});
      qs.createIndex("by_status", "status", {unique:false});
      if(!db.objectStoreNames.contains(STORE_BLOBS)) db.createObjectStore(STORE_BLOBS, {keyPath:"id"});
      if(!db.objectStoreNames.contains(STORE_KV)) db.createObjectStore(STORE_KV, {keyPath:"key"});
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
function idbTx(storeName, mode){
  return idbOpen().then(db=>db.transaction(storeName, mode).objectStore(storeName));
}
async function idbPut(storeName, value){
  const store = await idbTx(storeName, "readwrite");
  return new Promise((resolve,reject)=>{ const r=store.put(value); r.onsuccess=()=>resolve(value); r.onerror=()=>reject(r.error); });
}
async function idbGet(storeName, key){
  const store = await idbTx(storeName, "readonly");
  return new Promise((resolve,reject)=>{ const r=store.get(key); r.onsuccess=()=>resolve(r.result||null); r.onerror=()=>reject(r.error); });
}
async function idbDeleteKey(storeName, key){
  const store = await idbTx(storeName, "readwrite");
  return new Promise((resolve,reject)=>{ const r=store.delete(key); r.onsuccess=()=>resolve(); r.onerror=()=>reject(r.error); });
}
async function idbGetAllQueue(){
  const store = await idbTx(STORE_QUEUE, "readonly");
  return new Promise((resolve,reject)=>{ const r=store.getAll(); r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error); });
}
async function idbFindPendingByEntity(entity, entityId){
  const all = await idbGetAllQueue();
  return all.find(e=>e.entity===entity && e.entity_id===entityId && (e.status==="PENDING"||e.status==="ERROR") && e.operation_type!=="DELETE") || null;
}

/* --------- Punto 8: compactación segura de UPDATE repetidos sobre lo mismo aún no sincronizado --------- */
async function queueOperation(entity, entityId, operationType, payload){
  const existing = await idbFindPendingByEntity(entity, entityId);
  const now = new Date().toISOString();
  if(existing && operationType!=="DELETE"){
    // Ya hay una operación pendiente para esta misma entidad (CREATE o UPDATE): se
    // funde el payload nuevo sobre el existente y se manda UNA sola vez, con todos los
    // campos acumulados -- nunca se pierden cambios, nunca se duplica la operación.
    existing.payload = {...existing.payload, ...payload};
    existing.updated_at = now;
    existing.status = "PENDING"; existing.last_error = null;
    await idbPut(STORE_QUEUE, existing);
    return existing;
  }
  const entry = {
    operation_id: newId(), entity, entity_id: entityId, operation_type: operationType,
    payload, created_at: now, updated_at: now,
    status: "PENDING", retry_count: 0, last_error: null, last_attempt_at: null,
  };
  await idbPut(STORE_QUEUE, entry);
  return entry;
}

// Único punto de escritura para entidades con id propio (hallazgos, colecciones_items,
// registros_unicos, evaluaciones, evidencias). El id SIEMPRE llega ya generado por el
// llamador (newId()) -- esta función nunca inventa uno nuevo, nunca lo reemplaza.
async function persistEntity(entity, entityId, operationType, payload){
  if(navigator.onLine){
    try{
      let res;
      if(operationType==="CREATE") res = await sb.from(entity).upsert({...payload, id:entityId}, {onConflict:"id", ignoreDuplicates:true});
      else if(operationType==="UPDATE") res = await sb.from(entity).update(payload).eq("id", entityId);
      else res = await sb.from(entity).delete().eq("id", entityId); // DELETE ya es idempotente por sí solo
      if(res.error) throw res.error;
      return {ok:true};
    }catch(err){
      if(err && err.message && /network|fetch|Failed to fetch/i.test(err.message)){
        await queueOperation(entity, entityId, operationType, payload);
        updateOfflineBanner();
        return {ok:false, queued:true};
      }
      return {ok:false, error:err}; // error real (permisos, validación) -- no se encola, no se reintenta solo
    }
  } else {
    await queueOperation(entity, entityId, operationType, payload);
    updateOfflineBanner();
    return {ok:true, queued:true};
  }
}

// Compatibilidad con lo ya existente en respuestas_criterio (llave natural
// evaluacion_id+criterio_id, ya idempotente por su propio UNIQUE -- no necesita id de
// cliente) y con cualquier operación sin id propio (ej. update por eqCol/eqVal).
async function persist(table, method, payload, eqCol, eqVal, onConflict){
  if(navigator.onLine){
    try{
      let res;
      if(method==="upsert") res = await sb.from(table).upsert(payload, {onConflict});
      else if(method==="update") res = await sb.from(table).update(payload).eq(eqCol, eqVal);
      else res = await sb.from(table).insert(payload);
      if(res.error) throw res.error;
      return {ok:true, data:res.data};
    }catch(err){
      if(err && err.message && /network|fetch|Failed to fetch/i.test(err.message)){
        await queueOperation(table, (payload&&payload.id)||`${eqCol}:${eqVal}`, method==="upsert"?"CREATE":"UPDATE", payload);
        updateOfflineBanner();
        return {ok:false, queued:true};
      }
      return {ok:false, error:err};
    }
  } else {
    await queueOperation(table, (payload&&payload.id)||`${eqCol}:${eqVal}`, method==="upsert"?"CREATE":"UPDATE", payload);
    updateOfflineBanner();
    return {ok:true, queued:true};
  }
}

/* --------- Punto 7: orden de sincronización por dependencia, sin grafo explícito ---------
   Varias pasadas sobre la cola: una operación cuyo padre (evaluacion_id/hallazgo_id/etc.)
   todavía no existe en Supabase falla por FK y se reintenta en la SIGUIENTE pasada de
   este mismo flush -- así entidades hijas (evidencias) esperan a sus padres (hallazgos)
   sin necesitar saber de antemano el orden exacto. */
async function flushOfflineQueue(){
  const MAX_PASSES = 4, MAX_RETRIES_BEFORE_ERROR = 8;
  for(let pass=0; pass<MAX_PASSES; pass++){
    const pending = (await idbGetAllQueue()).filter(e=>e.status==="PENDING");
    if(!pending.length) break;
    let advancedThisPass = false;
    for(const entry of pending){
      entry.status = "SYNCING"; entry.last_attempt_at = new Date().toISOString();
      await idbPut(STORE_QUEUE, entry);
      try{
        let ok;
        if(entry.entity === "evidencias_blob"){ ok = await syncBlobEvidencia(entry); }
        else if(entry.entity === "rpc:crear_snapshot_evaluacion"){
          const { error } = await sb.rpc("crear_snapshot_evaluacion", entry.payload);
          if(error) throw error; // si la evaluación aún no existe en Supabase, falla y se reintenta en la siguiente pasada
          ok = true;
        }
        else {
          let res;
          if(entry.operation_type==="CREATE") res = await sb.from(entry.entity).upsert({...entry.payload, id:entry.entity_id}, {onConflict:"id", ignoreDuplicates:true});
          else if(entry.operation_type==="UPDATE") res = await sb.from(entry.entity).update(entry.payload).eq("id", entry.entity_id);
          else res = await sb.from(entry.entity).delete().eq("id", entry.entity_id);
          if(res.error) throw res.error;
          ok = true;
        }
        if(ok){ await idbDeleteKey(STORE_QUEUE, entry.operation_id); advancedThisPass = true; }
      }catch(err){
        entry.retry_count = (entry.retry_count||0) + 1;
        entry.last_error = (err && err.message) || String(err);
        entry.status = entry.retry_count >= MAX_RETRIES_BEFORE_ERROR ? "ERROR" : "PENDING";
        await idbPut(STORE_QUEUE, entry);
        // Un error de red detiene todo el flush (probablemente se volvió a caer la señal);
        // un error de FK/validación solo detiene ESA entrada, las demás siguen su pasada.
        if(err && err.message && /network|fetch|Failed to fetch/i.test(err.message)){
          updateOfflineBanner(); return;
        }
      }
    }
    if(!advancedThisPass) break; // nada avanzó en esta pasada -- reintentar más no ayuda ahora
  }
  updateOfflineBanner();
}

async function updateOfflineBanner(){
  let bar = document.getElementById("offline-banner");
  const all = await idbGetAllQueue();
  const pending = all.filter(e=>e.status==="PENDING"||e.status==="SYNCING").length;
  const errored = all.filter(e=>e.status==="ERROR").length;
  const offline = !navigator.onLine;
  if(!offline && pending===0 && errored===0){ if(bar) bar.remove(); return; }
  if(!bar){ bar = document.createElement("div"); bar.id = "offline-banner"; document.body.appendChild(bar); }
  bar.className = offline ? "offline-bar off" : (errored ? "offline-bar err" : "offline-bar syncing");
  bar.textContent = offline
    ? `Sin conexión — tus cambios se guardan en este dispositivo${pending?` (${pending} pendiente${pending>1?"s":""})`:""}`
    : errored ? `${errored} cambio${errored>1?"s":""} con error de sincronización — toca para ver`
    : `Sincronizando ${pending} cambio${pending>1?"s":""} pendiente${pending>1?"s":""}…`;
  bar.onclick = errored ? showSyncErrors : null;
}
async function showSyncErrors(){
  const all = await idbGetAllQueue();

/* --------- Lectura offline (siguiente punto del diseño) ---------
   Caché de lo último leído con éxito, por clave. Con señal: lee de Supabase y guarda
   copia. Sin señal (o si la red falla a medio camino): usa la copia guardada, si existe.
   Cubre expediente, evaluación (snapshot/respuestas/hallazgos) y catálogos pequeños --
   NO cubre colecciones/registros únicos todavía (alcance explícito de este punto). */
// Mantiene la caché consistente justo después de una escritura offline -- sin esto,
// agregar/editar/borrar algo sin señal seguiría mostrando la copia vieja hasta la
// siguiente vez que hubiera red para releer.
async function patchCache(cacheKey, mutatorFn){
  const existing = await idbGet(STORE_KV, "cache:"+cacheKey);
  const updated = mutatorFn(existing ? existing.value : null);
  await idbPut(STORE_KV, {key:"cache:"+cacheKey, value:updated, cachedAt: existing?existing.cachedAt:Date.now()});
}

async function cachedRead(cacheKey, queryFn){
  if(navigator.onLine){
    try{
      const result = await queryFn();
      if(!result.error){ await idbPut(STORE_KV, {key:"cache:"+cacheKey, value:result.data, cachedAt:Date.now()}); return result; }
      throw result.error;
    }catch(err){ /* cae a caché abajo, sea por red o por error real */ }
  }
  const cached = await idbGet(STORE_KV, "cache:"+cacheKey);
  if(cached) return {data:cached.value, error:null, fromCache:true, cachedAt:cached.cachedAt};
  return {data:null, error:{message:"Sin conexión y sin datos guardados en este dispositivo todavía para esto — necesitas abrirlo una vez con señal."}};
}

const $app = document.getElementById("app");

/* ------------------------- Retomar donde te quedaste -------------------------
   Si la app se cierra (el visor la descarga de memoria, se bloquea el teléfono), al volver
   a entrar ofrece regresar a la misma pantalla con lo que ya habías capturado del wizard.
   Se guarda en este dispositivo en cada cambio de pantalla, cada 3 segundos y al salir. */
const RESUME_KEY = "pm-retomar-v1";
const RESUME_LABEL = {"wizard-eval":"Nueva evaluación COFEPRIS","wizard-eval-stps":"Nueva evaluación STPS","wizard-eval-pc":"Nueva evaluación Protección Civil","op-wizard":"Check-up Operativo","op-resultado":"Resultado del Check-up Operativo","expediente":"Expediente"};
function saveResume(){
  try{
    if(["loading","login"].includes(state.screen)) return;
    if(state.screen==="dashboard"){ if(state._resumeAsked) localStorage.removeItem(RESUME_KEY); return; }
    const snap = {t:Date.now(), uid:state.session?.user?.id||null, screen:state.screen,
      currentExpediente: state.currentExpediente ? {id:state.currentExpediente.id, nombre_expediente:state.currentExpediente.nombre_expediente} : null,
      currentEvaluacion: state.currentEvaluacion || null, wizard: state.wizard || null, opEval: state.opEval || null,
      expTab: (typeof EXP_TAB!=="undefined") ? EXP_TAB : null};
    localStorage.setItem(RESUME_KEY, JSON.stringify(snap));
  }catch(e){ /* sin espacio o dato no serializable: no bloquea la app */ }
}
setInterval(saveResume, 3000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden"){ try{ document.activeElement && document.activeElement.blur && document.activeElement.blur(); }catch(e){} saveResume(); } });
window.addEventListener("pagehide", saveResume);
async function offerResume(){
  if(state._resumeAsked) return false; state._resumeAsked = true;
  let snap = null; try{ snap = JSON.parse(localStorage.getItem(RESUME_KEY)||"null"); }catch(e){}
  if(!snap || !snap.screen || Date.now()-snap.t > 24*3600*1000) return false;
  if(snap.uid && state.session?.user?.id && snap.uid !== state.session.user.id) return false;
  const label = (RESUME_LABEL[snap.screen] || "La pantalla donde estabas") + (snap.currentExpediente?.nombre_expediente ? ` · ${snap.currentExpediente.nombre_expediente}` : (snap.opEval?.expediente_nombre ? ` · ${snap.opEval.expediente_nombre}` : ""));
  const c = await askChoice(`¿Retomar donde te quedaste?\n${label}`, [{v:1,label:"Sí, retomar"},{v:0,label:"No, ir al inicio"}], o=>o.label);
  if(!c || !c.v){ localStorage.removeItem(RESUME_KEY); return false; }
  if(snap.expTab && typeof EXP_TAB!=="undefined") EXP_TAB = snap.expTab;
  go(snap.screen, {currentExpediente:snap.currentExpediente, currentEvaluacion:snap.currentEvaluacion, wizard:snap.wizard, opEval:snap.opEval});
  return true;
}

/* ------------------------- Modal genérico (reemplaza prompt/alert) -------------------------
   Quick Look (la vista previa de Archivos en iOS) no ejecuta prompt()/alert() de forma
   confiable -- por eso toda entrada de datos usa hojas modales propias, no diálogos nativos. */
function closeModal(){ const bd=document.getElementById("modal-backdrop"); if(bd) bd.remove(); }
function openModal(innerHtml){
  closeModal();
  const bd = document.createElement("div");
  bd.className = "modal-backdrop"; bd.id = "modal-backdrop";
  bd.innerHTML = `<div class="modal-sheet">${innerHtml}</div>`;
  bd.addEventListener("click",(e)=>{ if(e.target===bd) closeModal(); });
  document.body.appendChild(bd);
  return bd.querySelector(".modal-sheet");
}
function askText(title, label, placeholder){
  return new Promise((resolve)=>{
    const sheet = openModal(`
      <h3>${title}</h3>
      <label>${esc(label)}</label>
      <input type="text" id="m-input" placeholder="${esc(placeholder||"")}">
      <button class="btn btn-primary" id="m-ok" style="width:100%;margin-top:16px">Continuar</button>
    `);
    const input = sheet.querySelector("#m-input");
    setTimeout(()=>input.focus(), 50);
    const submit = () => { const v = input.value.trim(); closeModal(); resolve(v); };
    sheet.querySelector("#m-ok").onclick = submit;
    input.addEventListener("keydown",(e)=>{ if(e.key==="Enter") submit(); });
  });
}
function askChoice(title, options, labelFn){
  return new Promise((resolve)=>{
    const sheet = openModal(`
      <h3>${esc(title)}</h3>
      <div id="m-choices"></div>
      <button class="btn btn-ghost" id="m-cancel" style="margin-top:6px">Cancelar</button>
    `);
    const list = sheet.querySelector("#m-choices");
    options.forEach(opt=>{
      const b = document.createElement("button");
      b.className = "btn btn-ghost";
      b.style.cssText = "margin-bottom:8px;text-align:left;display:block;width:100%";
      b.textContent = labelFn(opt);
      b.onclick = ()=>{ closeModal(); resolve(opt); };
      list.appendChild(b);
    });
    sheet.querySelector("#m-cancel").onclick = ()=>{ closeModal(); resolve(null); };
  });
}
function showError(msg){
  const sheet = openModal(`<h3>No se pudo completar</h3><p class="muted">${esc(msg)}</p><button class="btn btn-primary" id="m-ok" style="width:100%;margin-top:10px">Entendido</button>`);
  sheet.querySelector("#m-ok").onclick = closeModal;
}

/* --------------------------- Sesión / AuthGuard --------------------------- */
/* El perfil se guarda en el teléfono: sin señal se usa la copia, y un error de red
   NUNCA dispara el flujo de "crear cuenta" (eso solo pasa si de verdad no existe). */
const PERFIL_KEY = "pm-perfil-v1";
function cachedProfile(userId){ try{ const p = JSON.parse(localStorage.getItem(PERFIL_KEY)||"null"); return (p && p.id===userId) ? p : null; }catch(e){ return null; } }
async function loadProfile(userId){
  let data = null, error = null;
  try{ ({ data, error } = await sb.from("profiles").select("*").eq("id", userId).maybeSingle()); }catch(e){ error = e; }
  if(error){ console.error("Error cargando profile:", error); return cachedProfile(userId) || undefined; }
  if(data){ try{ localStorage.setItem(PERFIL_KEY, JSON.stringify(data)); }catch(e){} }
  return data;
}
/* Sesión guardada por Supabase en este teléfono (para abrir sin señal aunque el token haya vencido). */
function storedAuthUser(){
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(/^sb-.*-auth-token$/.test(k)){ const v = JSON.parse(localStorage.getItem(k)||"null"); const u = v?.user || v?.currentSession?.user; if(u && u.id) return u; }
    }
  }catch(e){}
  return null;
}
function offlineSessionFallback(){
  if(navigator.onLine) return false;
  const u = storedAuthUser(); const p = u && cachedProfile(u.id);
  if(!u || !p) return false;
  state.session = {user:u, offline:true}; state.profile = p;
  return true;
}

// Crea la fila de perfil si hay sesion pero todavia no existe (pasa cuando el
// proyecto exige confirmar correo: signUp() no deja sesion activa de inmediato,
// asi que el perfil se crea aqui, la primera vez que hay sesion real).
let pendingSignupName = "";
async function ensureProfile(session){
  let profile = await loadProfile(session.user.id);
  if(profile) return profile;
  if(profile===undefined){ state.authError = navigator.onLine ? "No se pudo cargar tu perfil. Revisa tu conexión e intenta de nuevo." : "Sin conexión. Abre la app una vez con señal para dejarla lista sin conexión."; return null; }
  const nombre = pendingSignupName || (await askText("Bienvenido", "Para terminar de crear tu cuenta, escribe tu nombre completo", "Tu nombre")) || "Sin nombre";
  pendingSignupName = "";
  const { error: e1 } = await sb.from("profiles").insert({ id: session.user.id, nombre_completo: nombre, rol: "admin" });
  if(e1){
    const { error: e2 } = await sb.from("profiles").insert({ id: session.user.id, nombre_completo: nombre, rol: "especialista" });
    if(e2){ state.authError = "No se pudo crear tu perfil: " + e2.message; return null; }
  }
  return await loadProfile(session.user.id);
}

sb.auth.onAuthStateChange(async (event, session) => {
  state.session = session;
  if(session){
    state.profile = await ensureProfile(session);
    if(state.screen === "loading" || state.screen === "login"){
      go(state.profile ? "dashboard" : "login");
      if(state.profile) offerResume();
    } else {
      render();
    }
  } else {
    if(event!=="SIGNED_OUT" && offlineSessionFallback()){ if(state.screen==="loading"||state.screen==="login") go("dashboard"); return; }
    state.profile = null;
    go("login");
  }
});

async function initSession(){
  let data = {session:null};
  try{ ({ data } = await sb.auth.getSession()); }catch(e){ data = {session:null}; }
  if(!data.session && offlineSessionFallback()){ go("dashboard"); offerResume(); return; }
  if(data.session){
    state.session = data.session;
    state.profile = await ensureProfile(data.session);
    go(state.profile ? "dashboard" : "login");
    if(state.profile) offerResume();
  } else {
    go("login");
  }
}

/* ------------------------------- Router ------------------------------- */
async function render(){
  if(state.screen==="loading") return renderLoading();
  if(state.screen==="login") return renderLogin();
  if(state.screen==="dashboard") return renderDashboard();
  if(state.screen==="expediente") return renderExpediente();
  if(state.screen==="wizard-eval") return renderWizardEval();
  if(state.screen==="wizard-eval-stps") return renderWizardEvalSTPS();
  if(state.screen==="wizard-eval-pc") return renderWizardEvalPC();
  if(state.screen==="resumen-evaluacion") return renderResumenEvaluacion();
  if(state.screen==="diagnostico-evaluacion") return renderDiagnosticoEvaluacion();
  if(state.screen==="seguimiento-visita") return renderSeguimientoVisita();
  if(state.screen==="op-wizard") return renderOpWizard();
  if(state.screen==="exp-datos") return renderExpDatos();
  if(state.screen==="op-resultado") return renderOpResultado();
}

function renderLoading(){
  $app.innerHTML = `<div class="center-screen"><div class="spinner"></div></div>`;
}

function renderLogin(){
  const isSignup = state.authMode === "signup";
  $app.innerHTML = `
    <div class="topbar">
      <p class="brand">ELEMENTOS FINANCIEROS</p>
      <h1>Plataforma Madre</h1>
      <p class="sub">${isSignup ? "Crear cuenta" : "Iniciar sesión"}</p>
    </div>
    <div class="content">
      <div class="card">
        ${state.authError ? `<div class="err">${esc(state.authError)}</div>` : ""}
        ${state.authInfo ? `<div class="ok-msg">${esc(state.authInfo)}</div>` : ""}
        ${isSignup ? `<label>Nombre completo</label><input type="text" id="f-nombre" placeholder="Tu nombre">` : ""}
        <label>Correo</label>
        <input type="email" id="f-email" placeholder="tu@correo.com" autocomplete="email">
        <label>Contraseña</label>
        <input type="password" id="f-password" placeholder="••••••••" autocomplete="${isSignup?'new-password':'current-password'}">
        <button class="btn btn-primary" id="btn-submit" style="margin-top:18px">${isSignup ? "Crear cuenta" : "Entrar"}</button>
        <button class="btn-link" id="btn-toggle">${isSignup ? "Ya tengo cuenta — iniciar sesión" : "No tengo cuenta — crear una"}</button>
      </div>
      <div class="empty-note">Los datos de esta plataforma viven en Supabase — nada se guarda solo en este dispositivo.</div>
    </div>
  `;
  document.getElementById("btn-toggle").onclick = () => {
    state.authMode = isSignup ? "login" : "signup";
    state.authError = ""; state.authInfo = "";
    render();
  };
  document.getElementById("btn-submit").onclick = isSignup ? handleSignup : handleLogin;
}

async function handleLogin(){
  const email = document.getElementById("f-email").value.trim();
  const password = document.getElementById("f-password").value;
  if(!email || !password){ state.authError = "Correo y contraseña son obligatorios."; return render(); }
  const btn = document.getElementById("btn-submit"); btn.disabled = true; btn.textContent = "Entrando...";
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ state.authError = error.message; return render(); }
  // onAuthStateChange se encarga de cargar el perfil y navegar
}

async function handleSignup(){
  const nombre = document.getElementById("f-nombre").value.trim();
  const email = document.getElementById("f-email").value.trim();
  const password = document.getElementById("f-password").value;
  if(!nombre || !email || !password){ state.authError = "Todos los campos son obligatorios."; return render(); }
  if(password.length < 6){ state.authError = "La contraseña debe tener al menos 6 caracteres."; return render(); }
  const btn = document.getElementById("btn-submit"); btn.disabled = true; btn.textContent = "Creando cuenta...";
  state.authError = "";

  const { data, error } = await sb.auth.signUp({ email, password });
  if(error){ state.authError = error.message; return render(); }

  if(!data.session){
    // Confirmación de correo activada en el proyecto: no hay sesión todavía.
    // El perfil se creará solo, con este mismo nombre, en cuanto inicie sesión
    // por primera vez después de confirmar (ver ensureProfile).
    pendingSignupName = nombre;
    state.authMode = "login";
    state.authInfo = "Cuenta creada. Revisa tu correo para confirmar, luego inicia sesión aquí.";
    return render();
  }

  state.profile = await ensureProfile(data.session);
  go("dashboard");
}

async function handleLogout(){
  await sb.auth.signOut();
}

let DASH_VER_ARCHIVADOS = false;
let DASH_BUSQUEDA = "";
async function renderDashboard(){

    <div class="topbar topbar-home">
      <div class="topbar-row" style="justify-content:flex-end">
        <button class="back-btn" id="btn-logout">Salir</button>
      </div>
      <img class="home-badge" alt="Elementos Financieros" src="data:image/png;base64,${LOGO_MARK_B64}">
