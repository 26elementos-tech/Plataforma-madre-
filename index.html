function drawPortadaPdf(doc, {titulo, cliente, detalle, subtitulo, detalle2}){
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
  const NAVY=[15,42,67], GOLD=[184,147,90], SOFT=[107,100,86];
  doc.setFillColor(255,255,255); doc.rect(0,0,pageW,pageH,"F");
  const logoW = 210, logoH = logoW*995/800;
  try{ doc.addImage(LOGO_FULL_B64, "PNG", (pageW-logoW)/2, 96, logoW, logoH); }
  catch(err){ console.warn("No se pudo dibujar el logo de portada:", err); }
  let y = 96 + logoH + 52;
  doc.setDrawColor(...GOLD); doc.setLineWidth(0.8); doc.line(pageW/2-40, y, pageW/2+40, y); doc.setLineWidth(1);
  y += 38;
  doc.setFont("helvetica","bold"); doc.setFontSize(21); doc.setTextColor(...NAVY);
  doc.splitTextToSize(titulo||"", pageW-140).forEach(l=>{ doc.text(l, pageW/2, y, {align:"center"}); y+=26; });
  if(subtitulo){ doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(...SOFT); doc.text(subtitulo, pageW/2, y, {align:"center"}); y+=20; }
  y += 14;
  doc.setFont("helvetica","normal"); doc.setFontSize(15); doc.setTextColor(28,36,48);
  doc.splitTextToSize(cliente||"(sin nombre)", pageW-140).forEach(l=>{ doc.text(l, pageW/2, y, {align:"center"}); y+=20; });
  if(detalle){ doc.setFontSize(10.5); doc.setTextColor(...SOFT); doc.text(detalle, pageW/2, y+4, {align:"center"}); y+=18; }
  if(detalle2){ doc.setFontSize(10.5); doc.setTextColor(...SOFT); doc.splitTextToSize(detalle2, pageW-140).forEach(l=>{ doc.text(l, pageW/2, y+4, {align:"center"}); y+=14; }); }
  doc.setFillColor(...NAVY); doc.rect(0, pageH-64, pageW, 64, "F");
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(216,193,150);
  doc.text("Elaborado por: Saúl Flores | Elementos Financieros", pageW/2, pageH-38, {align:"center"});
  doc.setFontSize(8); doc.setTextColor(199,210,220);
  doc.text("Documento confidencial, preparado para uso exclusivo del cliente.", pageW/2, pageH-24, {align:"center"});
  doc.addPage();
}

async function generarPdfSeguimiento({ev, baseEv, items, modMap, prevMap, nombreExpediente}){
  if(!window.jspdf){ showError("El generador de PDF no cargó (requiere conexión a internet la primera vez)."); return; }
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:"pt", format:"letter"});
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
  const margin = 48, maxW = pageW - margin*2;
  let y = margin;
  const NAVY=[15,42,67], INK=[15,24,34], SOFT=[58,70,84];
  const hexToRgb = (hex)=>{ const n=parseInt(hex.replace("#",""),16); return [(n>>16)&255,(n>>8)&255,n&255]; };
  const checkBreak = (need)=>{ if(y+need > pageH-margin){ doc.addPage(); y=margin; } };
  const heading = (t,size)=>{ checkBreak(size+12); doc.setFont("helvetica","bold"); doc.setFontSize(size); doc.setTextColor(...NAVY); doc.text(t,margin,y); y+=size*0.9+8; doc.setTextColor(...INK); };
  const body = (t,o)=>{ o=o||{}; doc.setFont("helvetica",o.bold?"bold":"normal"); doc.setFontSize(o.size||11); doc.setTextColor(...(o.color||INK));
    doc.splitTextToSize(String(t||""), o.maxW||maxW).forEach(line=>{ checkBreak(o.lh||15); doc.text(line, margin+(o.indent||0), y); y+=o.lh||15; }); };
  const rule = ()=>{ checkBreak(10); doc.setDrawColor(220,220,215); doc.line(margin,y,pageW-margin,y); y+=12; };

  // Fotos: una por hallazgo (la primera), como en el diagnóstico
  const ids = items.map(h=>h.id);
  const evidByH = {};
  if(ids.length && navigator.onLine){
    const { data: evid } = await sb.from("evidencias").select("hallazgo_id,storage_path_optimizada,storage_path_thumbnail").in("hallazgo_id", ids).is("anulado_at", null);
    (evid||[]).forEach(e=>{ (evidByH[e.hallazgo_id]=evidByH[e.hallazgo_id]||[]).push(e); });
  }
  async function fotoDe(h){
    const e0 = (evidByH[h.id]||[])[0]; if(!e0) return null;
    try{
      const { data: signed } = await sb.storage.from("evidencias").createSignedUrl(e0.storage_path_optimizada || e0.storage_path_thumbnail, 300);
      if(!signed) return null;
      const blob = await (await fetch(signed.signedUrl)).blob();
      return await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(blob); });
    }catch(err){ return null; }
  }

  const seguidos = items.filter(h=>h.hallazgo_previo_id);
  const nuevos = items.filter(h=>!h.hallazgo_previo_id);
  const k = {verificado:0, en_proceso:0, pendiente:0};
  seguidos.forEach(h=>k[segResultOf(h)]++);
  const pct = seguidos.length ? Math.round(100*k.verificado/seguidos.length) : null;
  const pctColor = pct===null ? "#8B96A0" : pct>=80 ? "#2E7D4F" : pct>=40 ? "#B8860B" : "#B3261E";

  const datosEstSeg = await getDatosEst(ev.expediente_id);
  drawPortadaPdf(doc, {titulo:"Seguimiento del Check-up Regulatorio", cliente:nombreExpediente,
    detalle:`Visita de seguimiento: ${ev.fecha_visita||"—"}`, detalle2:[datosEstSeg.domicilio, datosEstSeg.municipio, datosEstSeg.estado].filter(Boolean).join(", ")});
  doc.setFillColor(...NAVY); doc.rect(0,0,pageW,110,"F");
  // Logo -- insignia blanca en la esquina del encabezado, mismo tratamiento que en la app
  try{
    doc.addImage(LOGO_MARK_B64, "PNG", pageW-margin-40, 14, 44, 44);
  }catch(logoErr){ console.warn("No se pudo dibujar el logo en el PDF:", logoErr); }
  doc.setFont("helvetica","bold"); doc.setFontSize(19); doc.setTextColor(255,255,255);
  doc.text("Seguimiento del Check-up Regulatorio", margin, 52);
  doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(230,230,225);
  doc.text(nombreExpediente||"(sin nombre)", margin, 74);
  doc.setFontSize(9.5); doc.setTextColor(216,193,150);
  doc.text("Elaborado por: Saúl Flores | Elementos Financieros", margin, 92);
  y = 135; doc.setTextColor(...INK);
  body(`Visita de seguimiento: ${ev.fecha_visita||"—"}${baseEv?`    Evaluación base: ${baseEv.fecha_visita||"—"}`:""}`, {size:10});
  y+=4; rule();

  checkBreak(80);
  doc.setFillColor(...hexToRgb(pctColor)); doc.circle(margin+30, y+28, 30, "F");
  doc.setFont("helvetica","bold"); doc.setFontSize(17); doc.setTextColor(255,255,255);
  doc.text(pct===null?"—":pct+"%", margin+30, y+34, {align:"center"});
  doc.setFontSize(13); doc.setTextColor(...NAVY);
  doc.text(`${k.verificado} de ${seguidos.length} correcciones verificadas`, margin+72, y+22);
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...SOFT);
  doc.text(`Corregido: ${k.verificado}   ·   Parcial: ${k.en_proceso}   ·   Sigue igual: ${k.pendiente}${nuevos.length?`   ·   Hallazgos nuevos: ${nuevos.length}`:""}`, margin+72, y+38);
  y += 78; // misma separación real que en el diagnóstico, contra el borde inferior del círculo
  body("Este seguimiento refleja lo observado durante la visita. No determina cumplimiento legal ni autorización sanitaria.", {size:10, color:SOFT});
  y+=6; rule();

  async function tarjeta(h, n){
    const r = h.hallazgo_previo_id ? segResultOf(h) : null;
    const colorHex = h.hallazgo_previo_id ? SEG_RESULT[r].color : "#2F6FA8";
    const prio = (h.prioridad||"").toUpperCase();
    const modulo = modMap[h.criterio_id] || h.categoria || "Hallazgo de visita";
    checkBreak(70);
    doc.setFillColor(...hexToRgb(colorHex)); doc.circle(margin+8, y+2, 8, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(255,255,255);
    doc.text(String(n), margin+8, y+4.5, {align:"center"});
    const textX = margin+22;
    doc.setFontSize(8); doc.setTextColor(...hexToRgb(colorHex));
    doc.text(`${r?SEG_RESULT[r].label.toUpperCase()+" · ":"NUEVO · "}${(PRIORITY_LABEL[prio]||"").toUpperCase()} · ${modulo}`.toUpperCase(), textX, y);
    y += 11;
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(...INK);
    doc.splitTextToSize(h.descripcion||"", maxW-22).forEach(line=>{ checkBreak(13); doc.text(line, textX, y); y+=12; });
    if(h.hallazgo_previo_id && prevMap[h.hallazgo_previo_id]==="corregido") body("El cliente reportó que ya lo había corregido.", {size:10.5, indent:22, color:SOFT});
    if(h.nota_seguimiento) body("Verificación: "+h.nota_seguimiento, {size:10, indent:22});
    y += 2;
    const foto = await fotoDe(h);
    const boxY = y; let photoW = 0;
    if(foto){ photoW = 60; checkBreak(48); try{ doc.addImage(foto, "JPEG", textX, boxY, photoW, 45); }catch(e){ photoW = 0; } }
    const boxX = textX + (photoW?photoW+8:0), boxW = maxW-22-(photoW?photoW+8:0);
    doc.setFont("helvetica","bold"); doc.setFontSize(9);
    const lines = doc.splitTextToSize(h.accion||"—", boxW-14);
    const boxH = Math.max(40, 22 + lines.length*11);
    doc.setFillColor(245,245,242); doc.rect(boxX, boxY, boxW, boxH, "F");
    doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(...SOFT); doc.text("QUÉ SE PIDIÓ", boxX+7, boxY+11);
    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...NAVY);
    lines.forEach((line,li)=>doc.text(line, boxX+7, boxY+22+li*11));
    y = boxY + Math.max(photoW?47:0, boxH) + 8;
    doc.setDrawColor(230,230,225); doc.line(margin, y, pageW-margin, y); y += 10; doc.setTextColor(...INK);
  }

  const pendientes = seguidos.filter(h=>segResultOf(h)!=="verificado");
  const corregidos = seguidos.filter(h=>segResultOf(h)==="verificado");
  let n = 1;
  heading(`Pendiente por corregir (${pendientes.length})`, 13);
  if(!pendientes.length) body("No quedan puntos pendientes de la evaluación base.");
  for(const h of pendientes){ await tarjeta(h, n++); }
  if(nuevos.length){ y+=4; heading(`Hallazgos nuevos (${nuevos.length})`, 13); for(const h of nuevos){ await tarjeta(h, n++); } }
  if(corregidos.length){
    y+=4; heading(`Corregido (${corregidos.length})`, 13);
    for(const h of corregidos){
      checkBreak(28);
      doc.setFillColor(...hexToRgb("#2E7D4F")); doc.circle(margin+8, y+2, 6, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(255,255,255); doc.text("OK", margin+8, y+4.3, {align:"center"});
      doc.setTextColor(...SOFT);
      body(h.descripcion, {size:10.5, indent:22, color:SOFT});
      if(h.nota_seguimiento) body("Verificación: "+h.nota_seguimiento, {size:10.5, indent:22, color:SOFT});
      y += 4;
    }
  }
  y+=6; rule();
  heading("Conclusión", 13);
  body(`El presente documento constituye un seguimiento de revisión realizado con base en lo observado durante la visita del ${ev.fecha_visita||"—"}. No sustituye una visita de verificación ni una resolución emitida por la autoridad sanitaria.`, {size:10});

  const nombreSeguro = (nombreExpediente||"expediente").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"");
  doc.save(`SEGUIMIENTO-${nombreSeguro}-${ev.fecha_visita||"visita"}.pdf`);
}

async function generarPdfDiagnostico(cache, mode){
  if(!window.jspdf){ showError("El generador de PDF no cargó (requiere conexión a internet la primera vez)."); return; }
  const {jsPDF} = window.jspdf;
  const {ev, diag, nombreExpediente} = cache;
  const datosEst = await getDatosEst(ev.expediente_id);
  const doc = new jsPDF({unit:"pt", format:"letter"});
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
  const margin = 48, maxW = pageW - margin*2;
  let y = margin;
  const NAVY=[15,42,67], INK=[15,24,34], SOFT=[58,70,84];

  function checkBreak(need){ if(y+need > pageH-margin){ doc.addPage(); y=margin; } }
  function heading(t,size){ checkBreak(size+12); doc.setFont("helvetica","bold"); doc.setFontSize(size); doc.setTextColor(...NAVY); doc.text(t,margin,y); y+=size*0.9+8; doc.setTextColor(...INK); }
  function body(t,opts){ opts=opts||{}; doc.setFont("helvetica",opts.bold?"bold":"normal"); doc.setFontSize(opts.size||11); doc.setTextColor(...(opts.color||INK));
    doc.splitTextToSize(String(t||""), opts.maxW||maxW).forEach(line=>{ checkBreak(opts.lh||15); doc.text(line, margin+(opts.indent||0), y); y+=opts.lh||15; }); }
  function rule(){ checkBreak(10); doc.setDrawColor(220,220,215); doc.line(margin,y,pageW-margin,y); y+=12; }
  function hexToRgb(hex){ const n=parseInt(hex.replace("#",""),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
  function gauge(cx,cyc,r,percent,color){ doc.setFillColor(...hexToRgb(color)); doc.circle(cx,cyc,r,"F");
    doc.setFont("helvetica","bold"); doc.setFontSize(r*0.6); doc.setTextColor(255,255,255);
    doc.text(percent===null?"—":percent+"%", cx, cyc+r*0.22, {align:"center"}); doc.setTextColor(...INK); }
  function bar(label,pct,color,w){ checkBreak(22); doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...INK);
    doc.text(label,margin,y); doc.setFont("helvetica","bold"); doc.text(pct+"%", margin+w, y, {align:"right"}); y+=5;
    doc.setFillColor(238,238,235); doc.rect(margin,y,w,7,"F"); doc.setFillColor(...hexToRgb(color)); doc.rect(margin,y,w*pct/100,7,"F"); y+=17; }

  { const depPortada = detectDependencia((diag.findings||[]).map(f=>f.criterio?.id||""));
    drawPortadaPdf(doc, {titulo:depPortada.pdfTitle, cliente:nombreExpediente,
      subtitulo: mode==="interno" ? "Registro interno del evaluador" : "Diagnóstico y plan de acción",
      detalle:`Fecha de visita: ${ev.fecha_visita||"—"}`, detalle2:[datosEst.domicilio, datosEst.municipio, datosEst.estado].filter(Boolean).join(", ")}); }
  doc.setFillColor(...NAVY); doc.rect(0,0,pageW,110,"F");
  // Logo -- insignia blanca en la esquina del encabezado, mismo tratamiento que en la app
  try{
    doc.addImage(LOGO_MARK_B64, "PNG", pageW-margin-40, 14, 44, 44);
  }catch(logoErr){ console.warn("No se pudo dibujar el logo en el PDF:", logoErr); }
  const dep = detectDependencia((diag.findings||[]).map(f=>f.criterio?.id||""));
  const esSTPS = dep.tieneEtiquetaEspecialista; // conservado: gatea el bloque de prioridad inmediata y la etiqueta Especialista/Interno, ahora válido para STPS y Protección Civil
  doc.setFont("helvetica","bold"); doc.setFontSize(19); doc.setTextColor(255,255,255);
  doc.text(dep.pdfTitle, margin, 52);
  doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(230,230,225);
  doc.text(nombreExpediente||"(sin nombre)", margin, 74);
  doc.setFontSize(9.5); doc.setTextColor(216,193,150);
  doc.text("Elaborado por: Saúl Flores | Elementos Financieros", margin, 92);
  y = 135; doc.setTextColor(...INK);
  body(`Fecha de visita: ${ev.fecha_visita||"—"}    Nivel: ${ev.nivel_checkup}`, {size:10});
  datosEstLineas(datosEst).forEach(l=> body(l, {size:10, color:SOFT, lh:14}));
  y+=4; rule();

  checkBreak(80);
  gauge(margin+30, y+28, 30, diag.percent, diag.band.color);
  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(...NAVY);
  doc.text(`Riesgo ${diag.band.label}`, margin+72, y+22);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...SOFT);
  doc.text("Indice de Riesgo Regulatorio", margin+72, y+35);
  y += 78; // separación real contra el borde inferior del círculo (radio 30)
  body("Este indice prioriza atencion y urgencia con base en lo observado durante la visita. No determina cumplimiento legal ni autorizacion sanitaria.", {size:10, color:SOFT});
  y+=6; rule();

  // Prioridad inmediata (solo STPS): índice corto de lo crítico, con quién lo resuelve --
  // así arma carpetas de inmediato sin leer las 20 tarjetas completas primero.
  if(esSTPS){
    const criticos = diag.findings.filter(f=>f.risk.prioridad==="CRITICA");
    if(criticos.length){
      heading("🚨 Prioridad inmediata", 13);
      body(`${criticos.length} punto(s) crítico(s) antes de cualquier trámite`, {size:10, color:SOFT});
      y+=4;
      criticos.forEach(f=>{
        checkBreak(26);
        doc.setDrawColor(...hexToRgb("#B3261E")); doc.setLineWidth(2.5);
        doc.line(margin, y-9, margin, y+3); doc.setLineWidth(1);
        doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(...INK);
        const reqLines = doc.splitTextToSize(f.criterio.requisito, maxW-100);
        doc.text(reqLines[0] + (reqLines.length>1?"…":""), margin+10, y-3);
        const esp = f.criterio.requiereEspecialista;
        const tagTxt = esp ? "ESPECIALISTA" : "INTERNO";
        const tagColor = esp ? "#185FA5" : "#3B6D11";
        doc.setFillColor(...hexToRgb(esp?"#E6F1FB":"#EAF3DE"));
        const tagW = doc.setFont("helvetica","bold").setFontSize(7.5).getTextWidth(tagTxt)+12;
        doc.rect(pageW-margin-tagW, y-11, tagW, 13, "F");
        doc.setTextColor(...hexToRgb(tagColor));
        doc.text(tagTxt, pageW-margin-tagW/2, y-2, {align:"center"});
        doc.setTextColor(...INK);
        y+=14;
      });
      y+=4; rule();
    }
  }

  if(diag.areaRows.length){
    heading("Riesgo por área", 13);
    diag.areaRows.forEach(a=>bar(a.modulo, a.percent, a.color, maxW));
    y+=4; rule();
  }

  // Cada hallazgo es su propia tarjeta numerada -- ya trae qué hacer, foto, responsable,
  // fecha y estatus juntos, para que se corrija punto por punto (nada de una lista plana
  // de texto corrido separada al final, que era justo el problema del diseño anterior).
  heading(`Puntos por corregir (${diag.findings.length})`, 13);
  if(diag.findings.length===0) body("No se identificaron hallazgos con lo contestado.");
  for(let i=0;i<diag.findings.length;i++){
    const f = diag.findings[i];
    const h = f.hallazgo || {};
    const estatusActual = h.estatus_accion || "pendiente";
    const doneF = estatusActual==="corregido" || estatusActual==="verificado";
    const colorHex = doneF ? "#2E7D4F" : (PRIORITY_COLOR[f.risk.prioridad] || PRIORITY_COLOR.MEDIA);
    checkBreak(64);
    // Franja de color a la izquierda + número/check en círculo
    const cardTop = y;
    doc.setFillColor(...hexToRgb(colorHex)); doc.circle(margin+8, y+2, 8, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(255,255,255);
    doc.text(doneF?"OK":String(i+1), margin+8, y+4.5, {align:"center"});
    doc.setTextColor(...INK);

    const textX = margin+22;
    doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(...hexToRgb(colorHex));
    doc.text(`${PRIORITY_LABEL[f.risk.prioridad]} · ${f.criterio.modulo}`.toUpperCase(), textX, y);
    if(esSTPS && f.origen==="regulatorio" && typeof f.criterio.requiereEspecialista==="boolean"){
      const esp = f.criterio.requiereEspecialista;
      const tagTxt = esp ? "ESPECIALISTA" : "INTERNO";
      doc.setFont("helvetica","bold"); doc.setFontSize(7.5);
      const tagW = doc.getTextWidth(tagTxt)+12;
      doc.setFillColor(...hexToRgb(esp?"#E6F1FB":"#EAF3DE"));
      doc.rect(pageW-margin-tagW, y-9, tagW, 13, "F");
      doc.setTextColor(...hexToRgb(esp?"#185FA5":"#3B6D11"));
      doc.text(tagTxt, pageW-margin-tagW/2, y, {align:"center"});
      doc.setTextColor(...hexToRgb(colorHex));
    }
    y += 11;
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(...(doneF?SOFT:INK));
    doc.splitTextToSize(f.criterio.requisito, maxW-22).forEach(line=>{ checkBreak(13); doc.text(line, textX, y); y+=12; });
    body(f.origen==="libre" ? "Hallazgo de visita" : `Estatus: ${STATUS_TEXT[f.estatus]}${f.nota?" — "+f.nota:""}`, {size:10.5, indent:22, color:SOFT});
    if(mode==="interno") body(`Fundamento: ${f.criterio.fundamento_legal||"—"}`, {size:10.5, indent:22, color:SOFT});
    y += 2;

    // Foto (si hay) + caja de "Qué hacer" lado a lado
    const boxY = y; let photoW = 0;
    if(f.evidencias && f.evidencias.length){
      const ev0 = f.evidencias[0];
      const path = ev0.storage_path_optimizada || ev0.storage_path_thumbnail;
      try{
        const { data: signed } = await sb.storage.from("evidencias").createSignedUrl(path, 300);
        if(signed){
          const resp = await fetch(signed.signedUrl); const blob = await resp.blob();
          const dataUrl = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(blob); });
          photoW = 60;
          checkBreak(48);
          doc.addImage(dataUrl, "JPEG", textX, boxY, photoW, 45);
        }
      }catch(imgErr){ console.warn("No se pudo incrustar evidencia:", imgErr); }
    }
    const boxX = textX + (photoW?photoW+8:0);
    const boxW = maxW-22-(photoW?photoW+8:0);
    const accionTxt = h.accion || sugerirAccion(f.criterio);
    const accionLines = doc.setFont("helvetica","bold").setFontSize(9).splitTextToSize(accionTxt, boxW-14);
    const boxH = Math.max(45, 22 + accionLines.length*11);
    doc.setFillColor(245,245,242); doc.rect(boxX, boxY, boxW, boxH, "F");
    doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(...SOFT);
    doc.text("QUÉ HACER", boxX+7, boxY+11);
    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...NAVY);
    accionLines.forEach((line,li)=>doc.text(line, boxX+7, boxY+22+li*11));
    y = boxY + Math.max(photoW?47:0, boxH) + 8;

    // Responsable / fecha / estatus como franja compacta, no una oración
    checkBreak(14);
    doc.setFillColor(240,240,236); doc.rect(textX, y-8, maxW-22, 14, "F");
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...SOFT);
    doc.text(`Responsable: ${h.responsable||"—"}     Fecha objetivo: ${h.fecha_objetivo||"—"}     Corrección: ${estatusActual.replace("_"," ")}`, textX+6, y+1);
    y += 14;
    doc.setDrawColor(230,230,225); doc.line(margin, y, pageW-margin, y); y += 10;
  }
  y+=4; rule();

  // ---------- Levantamiento de sitio: lo registrado en el inventario (equipos, personal, etc.) ----------
  try{
    const tipoIds = await ensureTipoIds();
    const [collR, regR] = await Promise.all([
      cachedRead("ev:"+ev.id+":coll_all", ()=>sb.from("colecciones_items").select("*").eq("evaluacion_id", ev.id).order("created_at")),
      cachedRead("ev:"+ev.id+":reg_all", ()=>sb.from("registros_unicos").select("*").eq("evaluacion_id", ev.id)),
    ]);
    const invItems = collR.data || [], invRegs = regR.data || [];
    if(invItems.length || invRegs.length){
      const fotoPorItem = {};
      if(navigator.onLine && invItems.length){
        try{
          const { data: evs } = await sb.from("evidencias").select("coleccion_item_id,storage_path_thumbnail,storage_path_optimizada").in("coleccion_item_id", invItems.map(x=>x.id)).is("anulado_at", null);
          (evs||[]).forEach(e=>{ if(!fotoPorItem[e.coleccion_item_id]) fotoPorItem[e.coleccion_item_id] = e; });
        }catch(e){}
      }
      const fotoData = async (e) => {
        try{
          const { data: signed } = await sb.storage.from("evidencias").createSignedUrl(e.storage_path_thumbnail || e.storage_path_optimizada, 300);
          if(!signed) return null;
          const blob = await (await fetch(signed.signedUrl)).blob();
          return await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(blob); });
        }catch(err){ return null; }
      };
      checkBreak(70);
      heading(`Levantamiento de sitio (${invItems.length + invRegs.length} registro${invItems.length+invRegs.length===1?"":"s"})`, 13);
      body("Lo que se registró durante la visita. Es el inventario de referencia para el seguimiento; los puntos por corregir están arriba.", {size:10, color:SOFT, lh:13});
      y += 6;
      for(const [codigo, schema] of Object.entries(COLLECTION_SCHEMAS)){
        const lista = invItems.filter(x=>x.tipo_id===tipoIds["c:"+codigo]);
        if(!lista.length) continue;
        checkBreak(40);
        doc.setFillColor(...NAVY); doc.rect(margin, y-11, maxW, 18, "F");
        doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(255,255,255);
        doc.text(`${schema.label} (${lista.length})`, margin+8, y+1);
        y += 20;
        for(const it of lista){
          const campos = it.campos || {};
          const titulo = campos[schema.titleField] || schema.singular || "(sin nombre)";
          const detalle = (schema.fields||[]).filter(f=>f.key!==schema.titleField && campos[f.key]).map(f=>`${f.label}: ${campos[f.key]}`).join(" · ");
          const foto = fotoPorItem[it.id] ? await fotoData(fotoPorItem[it.id]) : null;
          const tx = margin + (foto ? 58 : 0), tw = maxW - (foto ? 58 : 0);
          doc.setFont("helvetica","bold"); doc.setFontSize(10.5); const tl = doc.splitTextToSize(titulo, tw);
          doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
          const dl = detalle ? doc.splitTextToSize(detalle, tw) : [];
          const ol = it.observaciones ? doc.splitTextToSize("Obs.: " + it.observaciones, tw) : [];
          const h = Math.max(foto ? 40 : 0, tl.length*13 + (dl.length+ol.length)*12) + 8;
          checkBreak(h + 4);
          const y0 = y;
          if(foto){ try{ doc.addImage(foto, foto.startsWith("data:image/png") ? "PNG" : "JPEG", margin, y0-9, 50, 38); }catch(e){} }
          let yy = y0;
          doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(...INK); tl.forEach(t=>{ doc.text(t, tx, yy); yy+=13; });
          doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...SOFT); dl.forEach(t=>{ doc.text(t, tx, yy); yy+=12; }); ol.forEach(t=>{ doc.text(t, tx, yy); yy+=12; });
          y = Math.max(yy, y0 + (foto ? 34 : 0)) + 6;
          doc.setDrawColor(232,232,228); doc.line(margin, y-4, pageW-margin, y-4); y += 6;
        }
        y += 6;
      }
      for(const [codigo, schema] of Object.entries(SINGLE_SCHEMAS)){
        const reg = invRegs.find(x=>x.tipo_id===tipoIds["r:"+codigo]);
        if(!reg) continue;
        checkBreak(40);
        doc.setFillColor(...NAVY); doc.rect(margin, y-11, maxW, 18, "F");
        doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(255,255,255);
        doc.text(schema.label, margin+8, y+1);
        y += 20;
        const campos = reg.campos || {};
        const filas = (schema.fields||[]).filter(f=>campos[f.key]).map(f=>`${f.label}: ${campos[f.key]}`);
        if(!filas.length) body("Registrado sin detalle.", {size:9.5, color:SOFT, lh:12});
        filas.forEach(t=> body(t, {size:9.5, color:INK, lh:13}));
        y += 8;
      }
      y += 4; rule();
    }
  }catch(invErr){ console.warn("No se pudo agregar el levantamiento de sitio al PDF:", invErr); }

  heading("Conclusión", 13);
  body(`El presente documento constituye un diagnóstico de revisión realizado con base en la información, documentación y evidencia recabada durante la visita del ${ev.fecha_visita||"(fecha no registrada)"}. No sustituye una visita de verificación ni una resolución emitida por la autoridad sanitaria.`);

  const fileName = `CHECK-UP-REGULATORIO-${(nombreExpediente||"establecimiento").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-")}-${ev.fecha_visita||new Date().toISOString().slice(0,10)}.pdf`;
  const blob = doc.output("blob");
  try{
    const file = new File([blob], fileName, {type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:fileName});
      return;
    }
  }catch(shareErr){ console.warn("Share falló, uso descarga directa:", shareErr); }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=fileName; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
}

/* =====================================================================================
   FASE 4 · CLÍNICA · PROCESOS — Check-up Operativo (cuestionario op-v1)
   10 áreas, madurez 1-4 (Inexistente / Informal / Documentado / Medido).
   - Nivel del área = promedio de preguntas calificables (1 decimal); etiqueta = entero hacia abajo.
   - ⚑ Bandera crítica respondida en nivel 1 → el área se topa en 2 y entra a cuellos de botella.
   - "Dato" = solo captura, no suma. "No aplica" se excluye del promedio.
   - Cada respuesta se marca Declarado / Verificado.
   Tabla propia (evaluaciones_operativas); no toca el motor regulatorio.
   Borrador local en el dispositivo + guardado en Supabase al avanzar de área.
   ===================================================================================== */
const OP_VERSION = "op-v1";
const OP_NIVELES = ["Inexistente","Informal","Documentado","Medido"];
const OP_AREAS = [
 {id:"agenda", nombre:"Agenda y capacidad", objetivo:"Si la clínica controla su tiempo: cómo agenda, cuántas citas pierde y qué tan ocupada está.", preguntas:[
  {id:"1.1", t:"¿Cómo se agenda?", o:["Libreta o de memoria","WhatsApp o celular personal","Agenda digital compartida","Sistema con recordatorios y reportes"]},

const OP_PREG = {}; OP_AREAS.forEach(a=>a.preguntas.forEach(p=>{ OP_PREG[p.id] = {...p, area:a}; }));
const OP_COLOR = n => n===null ? "#8B96A0" : n<2 ? "#B3261E" : n<3 ? "#B8860B" : n<4 ? "#2E6DA4" : "#2E7D4F";

function opCalcular(respuestas){
  const areas = OP_AREAS.map(a=>{
    const calif = a.preguntas.filter(p=>!p.dato);
    const vals = []; const banderas = []; let pendientes = 0;
    calif.forEach(p=>{
      const r = respuestas[p.id];
      if(!r || (!r.na && !r.nivel)){ pendientes++; return; }
      if(r.na) return;
      vals.push(r.nivel);
      if(p.critica && r.nivel===1) banderas.push(p);
    });
    let prom = vals.length ? Math.round(10*vals.reduce((s,v)=>s+v,0)/vals.length)/10 : null;
    const topada = banderas.length>0 && prom!==null && prom>2;
    const nivel = prom===null ? null : (topada ? 2 : prom);
    return {area:a, promedio:prom, nivel, etiqueta: nivel===null ? "Sin datos" : OP_NIVELES[Math.max(0,Math.floor(nivel)-1)], banderas, topada, pendientes, respondidas:vals.length};
  });
  const conNivel = areas.filter(x=>x.nivel!==null);
  const global = conNivel.length ? Math.round(10*conNivel.reduce((s,x)=>s+x.nivel,0)/conNivel.length)/10 : null;
  const banderas = areas.flatMap(x=>x.banderas.map(p=>({p, area:x.area})));
  const masBajas = conNivel.slice().sort((a,b)=>a.nivel-b.nivel).slice(0,3);
  const pendientes = areas.reduce((s,x)=>s+x.pendientes,0);
  return {areas, global, etiquetaGlobal: global===null ? "Sin datos" : OP_NIVELES[Math.max(0,Math.floor(global)-1)], banderas, masBajas, pendientes};
}

/* ------------------------- Pestaña Clínica del expediente ------------------------- */
async function renderTabClinica(body, exp){
  body.innerHTML = `<p class="muted small" style="margin:2px 0 12px">Diagnóstico de cómo opera, gana y paga impuestos la clínica.</p>
    <div class="card area-card" id="op-card">
      <div class="area-head" style="cursor:default">
        <div class="area-icon">⚙️</div>
        <div style="flex:1;min-width:0"><div class="area-name">Procesos</div><div class="area-sub">Check-up Operativo · 10 áreas de madurez</div></div>
      </div>
      <div class="area-body"><div id="op-list"><div class="muted small">Cargando…</div></div>
        <button class="action-btn" id="btn-op-new" style="margin-top:10px;margin-bottom:0"><span>+ Nuevo Check-up Operativo</span><span>→</span></button>
      </div>
    </div>
    ${renderModulosProximos("Siguientes módulos", "En construcción dentro de la Fase 4 y 5.", CLINICA_MODS.filter(m=>m.nombre!=="Procesos"))}`;
  document.getElementById("btn-op-new").onclick = () => opIniciar(exp);
  const list = document.getElementById("op-list");
  let rows = [];
  if(navigator.onLine){
    const { data, error } = await sb.from("evaluaciones_operativas").select("id,fecha_visita,estatus,respuestas,updated_at").eq("expediente_id", exp.id).is("anulado_at", null).order("fecha_visita",{ascending:false});
    if(error){ list.innerHTML = `<div class="err">No se pudieron cargar: ${esc(error.message)}</div>`; return; }
    rows = data||[];
  }
  const draft = opLeerBorrador(exp.id);
  list.innerHTML = "";
  if(draft && !draft.id){
    const r = document.createElement("div"); r.className="small-row"; r.style.cursor="pointer";
    r.innerHTML = `<span>${esc(draft.fecha_visita)} · Borrador en este dispositivo</span><span class="muted">sin guardar ›</span>`;
    r.onclick = ()=>{ state.opEval = draft; go("op-wizard"); };
    list.appendChild(r);
  }
  if(!rows.length && !(draft && !draft.id)){ list.innerHTML = `<div class="empty-note">${navigator.onLine?"Sin check-ups operativos todavía.":"Sin conexión: solo se muestran borradores de este dispositivo."}</div>`; return; }
  rows.forEach(ev=>{
    const res = opCalcular(ev.respuestas||{});
    const r = document.createElement("div"); r.className="small-row"; r.style.cursor="pointer";
    r.innerHTML = `<span>${esc(ev.fecha_visita)} · ${ev.estatus==="completada"?"Completado":"En captura"}</span><span style="font-weight:600;color:${OP_COLOR(res.global)}">${res.global===null?"—":res.global.toFixed(1)+" · "+esc(res.etiquetaGlobal)}</span>`;
    r.onclick = ()=>{ state.opEval = {id:ev.id, expediente_id:exp.id, expediente_nombre:exp.nombre_expediente, fecha_visita:ev.fecha_visita, estatus:ev.estatus, respuestas:ev.respuestas||{}, areaIdx:0};
      go(ev.estatus==="completada" ? "op-resultado" : "op-wizard"); };
    list.appendChild(r);
  });
}

/* ------------------------- Borrador local ------------------------- */
function opKey(expId){ return "op-borrador:"+expId; }
function opLeerBorrador(expId){ try{ const s = localStorage.getItem(opKey(expId)); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function opGuardarBorrador(ev){ try{ localStorage.setItem(opKey(ev.expediente_id), JSON.stringify(ev)); }catch(e){} }
function opBorrarBorrador(expId){ try{ localStorage.removeItem(opKey(expId)); }catch(e){} }

async function opIniciar(exp){
  const prev = opLeerBorrador(exp.id);
  if(prev && !prev.id){
    const c = await askChoice("Hay un check-up operativo sin guardar en este dispositivo.", [{v:"seguir",label:"Continuar ese borrador"},{v:"nuevo",label:"Empezar uno nuevo (descarta el borrador)"}], o=>o.label);
    if(!c) return;
    if(c.v==="seguir"){ state.opEval = prev; go("op-wizard"); return; }
  }
  const hoy = new Date(); const f = hoy.getFullYear()+"-"+String(hoy.getMonth()+1).padStart(2,"0")+"-"+String(hoy.getDate()).padStart(2,"0");
  state.opEval = {id:null, expediente_id:exp.id, expediente_nombre:exp.nombre_expediente, fecha_visita:f, estatus:"borrador", respuestas:{}, areaIdx:0};
  opGuardarBorrador(state.opEval);
  go("op-wizard");
}

async function opGuardarServidor(ev, estatus){
  if(!navigator.onLine) return {ok:false, offline:true};
  const row = {expediente_id:ev.expediente_id, fecha_visita:ev.fecha_visita, respuestas:ev.respuestas, version_cuestionario:OP_VERSION, estatus: estatus||ev.estatus||"borrador"};
  if(row.estatus==="completada"){ const r = opCalcular(ev.respuestas);
    const an = opAnalizar(ev.respuestas); row.resultado = {global:r.global, proyectado90:an.globalProyectado, riesgo:an.riesgoGlobal, areas:an.areas.map(x=>({id:x.area.id, nivel:x.nivel, promedio:x.promedio, topada:x.topada, riesgo:x.riesgo, proyectado:x.proyectado})), banderas:r.banderas.map(b=>b.p.id)}; }
  let res;
  if(ev.id) res = await sb.from("evaluaciones_operativas").update(row).eq("id", ev.id).select("id").single();
  else res = await sb.from("evaluaciones_operativas").insert(row).select("id").single();
  if(res.error) return {ok:false, error:res.error};
  ev.id = res.data.id; ev.estatus = row.estatus;
  opBorrarBorrador(ev.expediente_id);
  return {ok:true};
}

const OP_IMP = {dinero:{label:"Dinero", w:3, color:"#B8860B"}, pacientes:{label:"Pacientes", w:2, color:"#2E6DA4"}, seguridad:{label:"Seguridad del paciente", w:3, color:"#B3261E"}, continuidad:{label:"Continuidad", w:3, color:"#5B4B8A"}};
const OP_RIESGO_COLOR = {"Crítico":"#B3261E","Alto":"#D2691E","Medio":"#B8860B","Bajo":"#2E7D4F","—":"#8B96A0"};
const OP_ECO = [
  {id:"venta", t:"Venta mensual promedio", u:"$"},
  {id:"ticket", t:"Ticket promedio por paciente", u:"$"},
  {id:"citas", t:"Citas agendadas al mes", u:"#"},
  {id:"faltas", t:"Inasistencias al mes", u:"#"},
  {id:"nuevos", t:"Pacientes nuevos al mes", u:"#"},
  {id:"publicidad", t:"Gasto mensual en publicidad", u:"$"},
];
const opMoney = n => "$" + Math.round(n).toLocaleString("es-MX");
const opNum = v => { const n = parseFloat(String(v||"").replace(/[^0-9.]/g,"")); return isFinite(n) && n>0 ? n : null; };

function opAnalizar(respuestas){
  const base = opCalcular(respuestas);
  // Riesgo por área
  base.areas.forEach(x=>{
    let score=0, max=0; const imp = {};
    x.area.preguntas.filter(p=>!p.dato).forEach(p=>{
      const r = respuestas[p.id]; if(!r || r.na || !r.nivel) return;
      const [cat] = OP_ACC[p.id]; const w = OP_IMP[cat].w;
      max += w*2;
      if(r.nivel<3){ score += w*(3-r.nivel); imp[cat]=(imp[cat]||0)+w*(3-r.nivel); }
    });
    const ratio = max ? score/max : null;
    x.riesgo = x.banderas.length ? "Crítico" : ratio===null ? "—" : ratio>=0.5 ? "Alto" : ratio>=0.2 ? "Medio" : "Bajo";
    const top = Object.entries(imp).sort((a,b)=>b[1]-a[1])[0];
    x.impacto = top ? OP_IMP[top[0]].label : "—";
  });
  // Plan 30-60-90
  const acciones = [];
  OP_AREAS.forEach(a=>a.preguntas.filter(p=>!p.dato).forEach(p=>{
    const r = respuestas[p.id]; if(!r || r.na || !r.nivel || r.nivel>=4) return;
    const [cat,h,a1,a2,a3] = OP_ACC[p.id];
    const texto = [a1,a2,a3][r.nivel-1];
    const horizonte = r.nivel===3 ? 90 : (p.critica ? 30 : h);
    const prioridad = (p.critica&&r.nivel===1?100:0) + (p.critica?20:0) + OP_IMP[cat].w*(4-r.nivel);
    acciones.push({p, area:a, nivel:r.nivel, cat, texto, horizonte, prioridad, mejora:r.nivel===3});
  }));
  acciones.sort((x,y)=>x.horizonte-y.horizonte || y.prioridad-x.prioridad);
  const plan = {30:acciones.filter(x=>x.horizonte===30), 60:acciones.filter(x=>x.horizonte===60), 90:acciones.filter(x=>x.horizonte===90)};
  // Proyección a 90 días: todo lo que está en 1-2 sube a Documentado (3)
  const proy = {};
  Object.entries(respuestas).forEach(([k,v])=>{ proy[k] = (v && v.nivel && v.nivel<3 && !v.na) ? {...v, nivel:3} : v; });
  const proyRes = opCalcular(proy);
  base.areas.forEach((x,i)=>{ x.proyectado = proyRes.areas[i].nivel; });
  base.globalProyectado = proyRes.global;
  base.acciones = acciones; base.plan = plan;
  const orden = ["Crítico","Alto","Medio","Bajo"];
  base.riesgoGlobal = orden.find(r=>base.areas.some(x=>x.riesgo===r)) || "—";
  base.conteoRiesgo = Object.fromEntries(orden.map(r=>[r, base.areas.filter(x=>x.riesgo===r).length]));
  // Impacto económico (ESTIMADO) — solo con datos capturados
  const e = respuestas.__eco || {}; const n = k => opNum(e[k]);
  const est = [];
  if(n("faltas") && n("ticket")) est.push({t:"Ingreso no realizado por inasistencias", v:`${opMoney(n("faltas")*n("ticket"))} al mes · ${opMoney(n("faltas")*n("ticket")*12)} al año`, s:"Inasistencias al mes × ticket promedio. Es el máximo expuesto; no todo es recuperable."});
  if(n("faltas") && n("citas")) est.push({t:"Tasa de inasistencia", v:`${Math.round(100*n("faltas")/n("citas"))}% de las citas`, s:"Inasistencias ÷ citas agendadas."});
  if(n("publicidad") && n("nuevos")) est.push({t:"Costo por paciente nuevo", v:opMoney(n("publicidad")/n("nuevos")), s:"Gasto en publicidad ÷ pacientes nuevos. Supone que todos los pacientes nuevos vienen de publicidad."});
  if(n("publicidad") && n("venta")) est.push({t:"Peso de la publicidad sobre la venta", v:`${(100*n("publicidad")/n("venta")).toFixed(1)}%`, s:"Gasto en publicidad ÷ venta mensual."});
  const cajaSinControl = ["4.1","4.2","4.3"].some(id=>respuestas[id]?.nivel===1);
  if(n("venta") && cajaSinControl) est.push({t:"Venta que pasa por caja sin control", v:`${opMoney(n("venta"))} al mes`, s:"Toda la venta mensual, porque hoy no hay corte, cruce de vouchers o separación de funciones. No es una pérdida: es el monto expuesto."});
  const dep = respuestas["10.1"]?.nivel;
  if(n("venta") && (dep===1 || dep===2)) est.push({t:"Ingreso en riesgo si el médico falta 2 semanas", v:opMoney(n("venta")*(dep===1?0.5:0.35)), s: dep===1 ? "Supuesto: 2 semanas ≈ 50% de la venta mensual y la clínica se detiene." : "Supuesto: 2 semanas ≈ 50% de la venta mensual; se mantiene cerca de 30% con servicios menores (35% en riesgo)."});
  base.economico = est; base.ecoCapturado = OP_ECO.some(f=>n(f.id));
  return base;
}

async function opGuardarYAvisar(ev){
  const r = await opGuardarServidor(ev);
  if(!r.ok){ opGuardarBorrador(ev); const n=document.getElementById("op-save-note"); if(n) n.textContent = r.offline ? "📴 Sin conexión: guardado en este dispositivo." : "No se pudo guardar en la nube; quedó en este dispositivo."; }
  return r;
}

          <div class="op-bar-row" data-i="${i}">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;margin-bottom:4px"><span>${i+1}. ${esc(x.area.nombre)}</span><span style="display:flex;gap:6px;align-items:center">${opBadge(x.riesgo, OP_RIESGO_COLOR[x.riesgo])}<b style="color:${OP_COLOR(x.nivel)}">${x.nivel===null?"—":x.nivel.toFixed(1)}</b></span></div>
            <div style="height:8px;background:#EEEEEA;border-radius:4px;position:relative"><div style="position:absolute;height:8px;width:${x.proyectado===null?0:Math.round(100*x.proyectado/4)}%;background:${OP_COLOR(x.proyectado)};opacity:.25;border-radius:4px"></div><div style="position:absolute;height:8px;width:${x.nivel===null?0:Math.round(100*x.nivel/4)}%;background:${OP_COLOR(x.nivel)};border-radius:4px"></div></div>
            <div class="muted small" style="margin-top:2px">Impacto principal: ${esc(x.impacto)}${x.proyectado!==null&&x.nivel!==null&&x.proyectado>x.nivel?` · a 90 días: ${x.proyectado.toFixed(1)}`:""}</div>
          </div>`).join("")}
        <p class="muted small" style="margin:8px 0 0">La barra tenue es la proyección a 90 días si se cumple el plan. Toca un área para editarla.</p>
      </div>
      <div class="card"><div class="section-title">Plan de acción</div>${planCard(30,"Primeros 30 días")}${planCard(60,"Días 31 a 60")}${planCard(90,"Días 61 a 90")}</div>
      <div class="card"><div class="section-title">Impacto económico · ESTIMADO</div>
        ${res.economico.length ? res.economico.map(x=>`<div class="small-row" style="display:block"><b>${esc(x.t)}:</b> ${esc(x.v)}<div class="muted small">${esc(x.s)}</div></div>`).join("") : `<div class="muted small">No se capturaron datos económicos. <a href="#" id="op-go-eco">Capturarlos</a></div>`}
      </div>
      <div id="op-save-note" class="muted small" style="text-align:center;margin:6px 0 10px"></div>
      ${ev.estatus!=="completada" ? `<button class="action-btn" id="op-complete"><span>✓ Marcar como completado</span><span>→</span></button>` : ""}
      <button class="action-btn" id="op-pdf" style="background:var(--navy-800)"><span>📄 Generar PDF</span><span>→</span></button>
      <button class="btn btn-ghost" id="op-edit" style="margin-top:4px">Editar respuestas</button>
    </div>`;
  document.getElementById("btn-back").onclick = () => go("expediente", {currentExpediente:{id:ev.expediente_id, nombre_expediente:ev.expediente_nombre}});
  document.querySelectorAll(".op-bar-row").forEach(r=> r.onclick = ()=>{ ev.areaIdx = +r.dataset.i; go("op-wizard"); });
  document.getElementById("op-edit").onclick = ()=>{ ev.areaIdx = 0; go("op-wizard"); };
  const ge = document.getElementById("op-go-eco"); if(ge) ge.onclick = (e)=>{ e.preventDefault(); ev.areaIdx = OP_AREAS.length; go("op-wizard"); };
  const bc = document.getElementById("op-complete");
  if(bc) bc.onclick = async ()=>{
    if(res.pendientes){ const c = await askChoice(`Faltan ${res.pendientes} pregunta(s). ¿Completar de todos modos?`, [{v:1,label:"Sí, completar"},{v:0,label:"Volver a capturar"}], o=>o.label); if(!c||!c.v) return; }
    const r = await opGuardarServidor(ev, "completada");
    if(!r.ok){ showError(r.offline ? "Completar necesita conexión. Tus respuestas están guardadas en este dispositivo." : "No se pudo guardar: "+(r.error?.message||"")); return; }
    go("op-resultado");
  };
  document.getElementById("op-pdf").onclick = async ()=>{
    try{ await generarPdfOperativo(ev, res); }catch(err){ showError("No se pudo generar el PDF: " + (err&&err.message?err.message:err)); }
  };
}

/* ------------------------- PDF ------------------------- */
async function generarPdfOperativo(ev, res){
  if(!window.jspdf){ showError("El generador de PDF no cargó (requiere conexión a internet la primera vez)."); return; }
  if(!res || !res.plan) res = opAnalizar(ev.respuestas);
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:"pt", format:"letter"});
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
  const margin = 48, maxW = pageW - margin*2;
  let y = margin;
  const NAVY=[15,42,67], INK=[15,24,34], SOFT=[58,70,84], RED=[179,38,30];
  const hex = h=>{ const n=parseInt(h.replace("#",""),16); return [(n>>16)&255,(n>>8)&255,n&255]; };
  const checkBreak = need=>{ if(y+need > pageH-margin){ doc.addPage(); y=margin; } };
  const heading = (t,size)=>{ checkBreak((size||14)+30); doc.setFont("helvetica","bold"); doc.setFontSize(size||14); doc.setTextColor(...NAVY); doc.text(t,margin,y); y+=(size||14)*0.9+10; doc.setTextColor(...INK); };
  const body = (t,o)=>{ o=o||{}; doc.setFont("helvetica",o.bold?"bold":"normal"); doc.setFontSize(o.size||11); doc.setTextColor(...(o.color||INK));
    doc.splitTextToSize(String(t||""), maxW-(o.indent||0)).forEach(line=>{ checkBreak(o.lh||15); doc.text(line, margin+(o.indent||0), y); y+=o.lh||15; }); };
  const rule = ()=>{ checkBreak(14); doc.setDrawColor(215,215,210); doc.line(margin,y,pageW-margin,y); y+=16; };
  const pill = (txt, color, xRight, yy, w)=>{ doc.setFont("helvetica","bold"); doc.setFontSize(9.5); const tw = w || doc.getTextWidth(txt)+16;
    doc.setFillColor(...hex(color)); doc.roundedRect(xRight-tw, yy-11, tw, 15, 7.5, 7.5, "F"); doc.setTextColor(255,255,255); doc.text(txt, xRight-tw/2, yy, {align:"center"}); return tw; };

  const datosEstOp = await getDatosEst(ev.expediente_id);
  drawPortadaPdf(doc, {titulo:"Check-up Operativo de la Clínica", subtitulo:"Diagnóstico, riesgos y plan de acción", cliente:ev.expediente_nombre, detalle:`Fecha de visita: ${ev.fecha_visita||"—"}`, detalle2:[datosEstOp.domicilio, datosEstOp.municipio, datosEstOp.estado].filter(Boolean).join(", ")});

  // ---------- Resumen ejecutivo ----------
  doc.setFillColor(...NAVY); doc.rect(0,0,pageW,110,"F");
  try{ doc.addImage(LOGO_MARK_B64, "PNG", pageW-margin-40, 14, 44, 44); }catch(e){}
  doc.setFont("helvetica","bold"); doc.setFontSize(19); doc.setTextColor(255,255,255); doc.text("Resumen ejecutivo", margin, 52);
  doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(230,230,225); doc.text(ev.expediente_nombre||"(sin nombre)", margin, 74);
  doc.setFontSize(10); doc.setTextColor(216,193,150); doc.text("Elaborado por: Saúl Flores | Elementos Financieros", margin, 92);
  y = 140;
  const card = (x, w, titulo, valor, color, sub)=>{
    doc.setFillColor(246,246,243); doc.roundedRect(x, y, w, 74, 6, 6, "F");
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...SOFT); doc.text(titulo, x+12, y+18);
    doc.setFont("helvetica","bold"); doc.setFontSize(22); doc.setTextColor(...hex(color)); doc.text(valor, x+12, y+46);
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...INK); doc.text(sub, x+12, y+63);
  };
  const cw = (maxW-20)/3;
  card(margin, cw, "MADUREZ ACTUAL", res.global===null?"—":res.global.toFixed(1), OP_COLOR(res.global), res.etiquetaGlobal);
  card(margin+cw+10, cw, "RIESGO GENERAL", res.riesgoGlobal, OP_RIESGO_COLOR[res.riesgoGlobal], `${res.banderas.length} control(es) crítico(s)`);
  card(margin+2*(cw+10), cw, "PROYECCIÓN 90 DÍAS", res.globalProyectado===null?"—":res.globalProyectado.toFixed(1), OP_COLOR(res.globalProyectado), "si se cumple el plan");
  y += 96;
  const peor = res.areas.filter(x=>x.nivel!==null).sort((a,b)=>a.nivel-b.nivel)[0];
  const resumen = `La clínica opera en nivel ${res.etiquetaGlobal.toLowerCase()} (${res.global===null?"—":res.global.toFixed(1)} de 4). ` +
    (res.banderas.length ? `Tiene ${res.banderas.length} control(es) crítico(s) inexistente(s), que son la prioridad de los primeros 30 días. ` : `No tiene controles críticos inexistentes. `) +
    (peor ? `El área más débil es ${peor.area.nombre} (${peor.nivel.toFixed(1)}). ` : "") +
    `El plan propone ${res.plan[30].length} acciones en 30 días, ${res.plan[60].length} en 60 y ${res.plan[90].length} en 90.`;
  body(resumen, {size:11.5, lh:16});
  y += 6;
  body("Este diagnóstico describe qué tan ordenada, medible e independiente del dueño es la operación, con base en lo observado y declarado en la visita. No es una auditoría contable ni fiscal.", {size:9.5, color:SOFT, lh:13});
  const lineasEstOp = datosEstLineas(datosEstOp); if(lineasEstOp.length){ y+=4; lineasEstOp.forEach(l=>body(l, {size:9.5, color:SOFT, lh:13})); }
  y += 8; rule();

  // ---------- Mapa de riesgo ----------
  heading("Madurez y riesgo por área");
  doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...SOFT);
  doc.text("ÁREA", margin, y); doc.text("IMPACTO PRINCIPAL", margin+250, y); doc.text("RIESGO", pageW-margin-120, y); doc.text("NIVEL", pageW-margin, y, {align:"right"});
  y += 8;
  res.areas.forEach((x,i)=>{
    checkBreak(34);
    doc.setDrawColor(230,230,226); doc.line(margin, y, pageW-margin, y); y += 16;
    doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(...INK);
    doc.text(doc.splitTextToSize(`${i+1}. ${x.area.nombre}`, 240)[0], margin, y);
    doc.setTextColor(...SOFT); doc.text(x.impacto, margin+250, y);
    pill(x.riesgo, OP_RIESGO_COLOR[x.riesgo], pageW-margin-60, y, 64);
    doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...hex(OP_COLOR(x.nivel)));
    doc.text(x.nivel===null?"—":x.nivel.toFixed(1), pageW-margin, y, {align:"right"});
    y += 4;
    const bw = 240;
    doc.setFillColor(234,234,230); doc.roundedRect(margin, y, bw, 5, 2.5, 2.5, "F");
    if(x.proyectado!==null){ doc.setFillColor(205,214,222); doc.roundedRect(margin, y, Math.max(5,bw*x.proyectado/4), 5, 2.5, 2.5, "F"); }
    if(x.nivel!==null){ doc.setFillColor(...hex(OP_COLOR(x.nivel))); doc.roundedRect(margin, y, Math.max(5,bw*x.nivel/4), 5, 2.5, 2.5, "F"); }
    y += 10;
  });
  y += 4;
  body("Barra de color: nivel actual. Barra gris: nivel esperado a 90 días si se cumple el plan. Riesgo Crítico = al menos un control crítico inexistente.", {size:9.5, color:SOFT, lh:13});

  // ---------- Prioridades + Plan ----------
  doc.addPage(); y = margin;
  if(res.banderas.length){
    heading("Controles críticos");
    const lines = res.banderas.map(b=>doc.setFont("helvetica","normal").setFontSize(10.5).splitTextToSize(`${b.p.t}  (${b.area.nombre})`, maxW-40));
    const boxH = 34 + lines.reduce((s,l)=>s+l.length*14+5,0);
    checkBreak(boxH+10);
    doc.setFillColor(253,236,234); doc.setDrawColor(...RED); doc.setLineWidth(1.2); doc.roundedRect(margin, y, maxW, boxH, 6, 6, "FD"); doc.setLineWidth(1);
    let yy = y+20;
    doc.setFont("helvetica","bold"); doc.setFontSize(11.5); doc.setTextColor(...RED);
    doc.text(`${res.banderas.length} control(es) que hoy no existen y exponen a la clínica`, margin+14, yy); yy+=18;
    doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(...INK);
    lines.forEach(l=>{ doc.setFillColor(...RED); doc.circle(margin+19, yy-3.5, 2.3, "F"); l.forEach(t=>{ doc.text(t, margin+30, yy); yy+=14; }); yy+=5; });
    y += boxH + 22;
  }
  heading("Plan de acción 30-60-90 días");
  body("Cada acción sale de una respuesta concreta de la visita y lleva a esa práctica al siguiente nivel.", {size:10, color:SOFT});
  y += 6;
  [[30,"Primeros 30 días","Controles críticos y fugas de dinero"],[60,"Días 31 a 60","Ordenar la operación"],[90,"Días 61 a 90","Crecer y depender menos del médico"]].forEach(([h,t,sub])=>{
    const l = res.plan[h];
    checkBreak(60);
    doc.setFillColor(...NAVY); doc.roundedRect(margin, y-4, maxW, 26, 5, 5, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(255,255,255); doc.text(`${t}`, margin+12, y+13);
    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(216,193,150); doc.text(`${sub} · ${l.length} acción(es)`, pageW-margin-12, y+13, {align:"right"});
    y += 40;
    if(!l.length){ body("Sin acciones en este periodo.", {size:10.5, color:SOFT}); y+=8; return; }
    l.forEach((x,k)=>{
      const tl = doc.setFont("helvetica","normal").setFontSize(11).splitTextToSize(x.texto, maxW-34);
      checkBreak(tl.length*15 + 22);
      doc.setFillColor(...hex(OP_IMP[x.cat].color)); doc.circle(margin+10, y-4, 9, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(255,255,255); doc.text(String(k+1), margin+10, y-0.5, {align:"center"});
      doc.setFont("helvetica", x.p.critica&&x.nivel===1 ? "bold" : "normal"); doc.setFontSize(11); doc.setTextColor(...INK);
      tl.forEach((t,j)=>{ doc.text(t, margin+28, y); y+=15; });
      doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...SOFT);
      doc.text(`${x.area.nombre} · ${OP_IMP[x.cat].label}${x.p.critica&&x.nivel===1?" · CONTROL CRÍTICO":""}${x.mejora?" · mejora":""}`, margin+28, y);
      y += 16;
    });
    y += 8;
  });
  checkBreak(30);
  body("Color del círculo = qué protege la acción: ámbar Dinero · azul Pacientes · rojo Seguridad del paciente · morado Continuidad.", {size:9.5, color:SOFT, lh:13});

  // ---------- Impacto económico ----------
  y += 10; rule();
  heading("Impacto económico (ESTIMADO)");
  if(res.economico.length){
    body("Cálculos hechos con los números que compartió la clínica. Son estimaciones, no resultados auditados; cada una muestra su supuesto.", {size:10, color:SOFT});
    y += 6;
    res.economico.forEach(x=>{
      const sl = doc.setFont("helvetica","normal").setFontSize(9.5).splitTextToSize(x.s, maxW-24);
      const h = 44 + sl.length*12;
      checkBreak(h+8);
      doc.setFillColor(246,246,243); doc.roundedRect(margin, y, maxW, h, 6, 6, "F");
      doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(...SOFT); doc.text(x.t, margin+12, y+17);
      doc.setFont("helvetica","bold"); doc.setFontSize(14); doc.setTextColor(...NAVY); doc.text(x.v, margin+12, y+35);
      doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...SOFT); sl.forEach((t,j)=>doc.text(t, margin+12, y+50+j*12));
      y += h + 8;
    });
  } else {
    body("No se capturaron datos económicos en esta visita, por lo que no se estima impacto en dinero. Con venta mensual, ticket promedio, citas, inasistencias, pacientes nuevos y gasto en publicidad, el reporte calcula cuánto está expuesto.", {size:10.5, color:SOFT});
  }

  // ---------- Detalle ----------
  doc.addPage(); y = margin;
  heading("Detalle por área");
  res.areas.forEach((x,i)=>{
    checkBreak(80);
    doc.setFillColor(...NAVY); doc.roundedRect(margin, y-4, maxW, 26, 5, 5, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(255,255,255); doc.text(`${i+1}. ${x.area.nombre}`, margin+12, y+13);
    doc.setFillColor(...hex(OP_COLOR(x.nivel))); doc.roundedRect(pageW-margin-110, y+1, 100, 16, 8, 8, "F");
    doc.setFontSize(10); doc.text(x.nivel===null?"Sin datos":`${x.nivel.toFixed(1)} · ${x.etiqueta}`, pageW-margin-60, y+12.5, {align:"center"});
    y += 36;
    body(x.area.objetivo, {size:10, color:SOFT, lh:13}); y += 6;
    x.area.preguntas.forEach(p=>{
      const r = ev.respuestas[p.id] || {};
      if(p.dato){ if(r.dato){ body(`${p.t}:`, {size:10.5, bold:true, color:SOFT}); body(r.dato, {size:10.5, indent:12}); y+=6; } return; }
      const qLines = doc.setFont("helvetica","bold").setFontSize(11).splitTextToSize(`${p.id}  ${p.t}`, maxW);
      const respTxt = r.na ? "No aplica" : r.nivel ? p.o[r.nivel-1] : "Sin responder";
      const aLines = doc.setFont("helvetica","normal").setFontSize(11).splitTextToSize(respTxt, maxW-28);
      const acc = (r.nivel && r.nivel<4 && !r.na) ? OP_ACC[p.id][1+r.nivel] : null;
      const sLines = acc ? doc.setFont("helvetica","normal").setFontSize(10.5).splitTextToSize("Siguiente paso: "+acc, maxW-28) : [];
      checkBreak(qLines.length*15 + aLines.length*15 + sLines.length*14 + 30);
      doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...INK);
      qLines.forEach(t=>{ doc.text(t, margin, y); y+=15; });
      y += 3;
      doc.setFillColor(...(r.na ? [139,150,160] : hex(OP_COLOR(r.nivel||null)))); doc.circle(margin+10, y-4, 9, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(255,255,255);
      doc.text(r.na ? "–" : r.nivel ? String(r.nivel) : "?", margin+10, y-0.5, {align:"center"});
      doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(...INK);
      aLines.forEach((t,k)=>{ doc.text(t, margin+28, y); if(k<aLines.length-1) y+=15; });
      y += 15;
      const tag = (r.nivel||r.na) ? (r.verificado ? "Verificado" : "Declarado") : "";
      doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...SOFT);
      if(tag) doc.text(tag, margin+28, y);
      if(p.critica && r.nivel===1){ const off = tag ? doc.getTextWidth(tag)+10 : 0; doc.setFont("helvetica","bold"); doc.setTextColor(...RED); doc.text("CONTROL CRÍTICO", margin+28+off, y); }
      y += 14;
      if(sLines.length){ doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(...NAVY); sLines.forEach(t=>{ doc.text(t, margin+28, y); y+=14; }); }
      if(r.nota) body(`Nota: ${r.nota}`, {size:10, indent:28, color:SOFT, lh:13});
      y += 9;
    });
    y += 10;
  });

  const fileName = `CHECK-UP-OPERATIVO-${(ev.expediente_nombre||"clinica").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-")}-${ev.fecha_visita||new Date().toISOString().slice(0,10)}.pdf`;
  const blob = doc.output("blob");
  try{
    const file = new File([blob], fileName, {type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:fileName}); return; }
  }catch(shareErr){ console.warn("Share falló, uso descarga directa:", shareErr); }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=fileName; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
}

window.addEventListener("unhandledrejection", (ev)=>{
  console.error("Unhandled:", ev.reason);
});
updateOfflineBanner();
if(navigator.onLine) flushOfflineQueue();
initSession().catch(err=>{
  console.error(err);
  $app.innerHTML = `<div class="content"><div class="err">Error al iniciar: ${esc(err.message||err)}</div></div>`;
});

if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW no registrado:", e)); });
}
