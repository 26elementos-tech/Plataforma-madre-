function drawPortadaPdf(doc, {titulo, cliente, detalle, subtitulo, detalle2}){
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
  const NAVY=[17,17,17], GOLD=[150,150,150], SOFT=[107,107,107];
  doc.setFillColor(255,255,255); doc.rect(0,0,pageW,pageH,"F");
  const logoW = 210, logoH = logoW*995/800;
  try{ doc.addImage(LOGO_FULL_B64, "PNG", (pageW-logoW)/2, 96, logoW, logoH); }
  catch(err){ console.warn("No se pudo dibujar el logo de portada:", err); }
  let y = 96 + logoH + 52;
  doc.setDrawColor(...GOLD); doc.setLineWidth(0.8); doc.line(pageW/2-40, y, pageW/2+40, y); doc.setLineWidth(1);
  y += 38;
  doc.setFont("helvetica","bold"); doc.setFontSize(21); doc.setTextColor(...NAVY);
  doc.splitTextToSize(titulo||"", pageW-140).forEach(l=>{ doc.text(l, pageW/2, y, {align:"center"}); y+=26; });
  if(subtitulo){ doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(...SOFT); doc.text(subtitulo, pageW/2, y, {align:"center"}); y+=20; }
  y += 14;
  doc.setFont("helvetica","normal"); doc.setFontSize(15); doc.setTextColor(17,17,17);
  doc.splitTextToSize(cliente||"(sin nombre)", pageW-140).forEach(l=>{ doc.text(l, pageW/2, y, {align:"center"}); y+=20; });
  if(detalle){ doc.setFontSize(10.5); doc.setTextColor(...SOFT); doc.text(detalle, pageW/2, y+4, {align:"center"}); y+=18; }
  if(detalle2){ doc.setFontSize(10.5); doc.setTextColor(...SOFT); doc.splitTextToSize(detalle2, pageW-140).forEach(l=>{ doc.text(l, pageW/2, y+4, {align:"center"}); y+=14; }); }
  doc.setFillColor(...NAVY); doc.rect(0, pageH-64, pageW, 64, "F");
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(200,200,200);
  doc.text("Elaborado por: Saúl Cruz Flores | Elementos Financieros", pageW/2, pageH-38, {align:"center"});
  doc.setFontSize(8); doc.setTextColor(170,170,170);
  doc.text("Documento confidencial, preparado para uso exclusivo del cliente.", pageW/2, pageH-24, {align:"center"});
  doc.addPage();
}

async function generarPdfSeguimiento({ev, baseEv, items, modMap, prevMap, nombreExpediente}){
  if(!window.jspdf){ showError("El generador de PDF no cargó (requiere conexión a internet la primera vez)."); return; }
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:"pt", format:"letter"});
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
  const margin = 48, maxW = pageW - margin*2;
  let y = margin;
  const NAVY=[17,17,17], INK=[17,17,17], SOFT=[90,90,90];
  const hexToRgb = (hex)=>{ const n=parseInt(hex.replace("#",""),16); return [(n>>16)&255,(n>>8)&255,n&255]; };
  const checkBreak = (need)=>{ if(y+need > pageH-margin){ doc.addPage(); y=margin; } };
  const heading = (t,size)=>{ checkBreak(size+12); doc.setFont("helvetica","bold"); doc.setFontSize(size); doc.setTextColor(...NAVY); doc.text(t,margin,y); y+=size*0.9+8; doc.setTextColor(...INK); };
  const body = (t,o)=>{ o=o||{}; doc.setFont("helvetica",o.bold?"bold":"normal"); doc.setFontSize(o.size||11); doc.setTextColor(...(o.color||INK));
    doc.splitTextToSize(String(t||""), o.maxW||maxW).forEach(line=>{ checkBreak(o.lh||15); doc.text(line, margin+(o.indent||0), y); y+=o.lh||15; }); };
  const rule = ()=>{ checkBreak(10); doc.setDrawColor(220,220,215); doc.line(margin,y,pageW-margin,y); y+=12; };

  // Fotos: una por hallazgo (la primera), como en el diagnóstico
  const ids = items.map(h=>h.id);
  const evidByH = {};
  if(ids.length && navigator.onLine){
    const { data: evid } = await sb.from("evidencias").select("hallazgo_id,storage_path_optimizada,storage_path_thumbnail").in("hallazgo_id", ids).is("anulado_at", null);
    (evid||[]).forEach(e=>{ (evidByH[e.hallazgo_id]=evidByH[e.hallazgo_id]||[]).push(e); });
  }
  async function fotoDe(h){
    const e0 = (evidByH[h.id]||[])[0]; if(!e0) return null;
    try{
      const { data: signed } = await sb.storage.from("evidencias").createSignedUrl(e0.storage_path_optimizada || e0.storage_path_thumbnail, 300);
      if(!signed) return null;
      const blob = await (await fetch(signed.signedUrl)).blob();
      return await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(blob); });
    }catch(err){ return null; }
  }

  const seguidos = items.filter(h=>h.hallazgo_previo_id);
  const nuevos = items.filter(h=>!h.hallazgo_previo_id);
  const k = {verificado:0, en_proceso:0, pendiente:0};
  seguidos.forEach(h=>k[segResultOf(h)]++);
  const pct = seguidos.length ? Math.round(100*k.verificado/seguidos.length) : null;
  const pctColor = pct===null ? "#8E8E8E" : pct>=80 ? "#2E7D4F" : pct>=40 ? "#B8860B" : "#B3261E";

  const datosEstSeg = await getDatosEst(ev.expediente_id);
  drawPortadaPdf(doc, {titulo:"Seguimiento del Check-up Regulatorio", cliente:nombreExpediente,
    detalle:`Visita de seguimiento: ${ev.fecha_visita||"—"}`, detalle2:[datosEstSeg.domicilio, datosEstSeg.municipio, datosEstSeg.estado].filter(Boolean).join(", ")});
  doc.setFillColor(...NAVY); doc.rect(0,0,pageW,110,"F");
  // Logo -- insignia blanca en la esquina del encabezado, mismo tratamiento que en la app
  try{
    doc.addImage(LOGO_MARK_B64, "PNG", pageW-margin-40, 14, 44, 44);
  }catch(logoErr){ console.warn("No se pudo dibujar el logo en el PDF:", logoErr); }
  doc.setFont("helvetica","bold"); doc.setFontSize(19); doc.setTextColor(255,255,255);
  doc.text("Seguimiento del Check-up Regulatorio", margin, 52);
  doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(220,220,220);
  doc.text(nombreExpediente||"(sin nombre)", margin, 74);
  doc.setFontSize(9.5); doc.setTextColor(200,200,200);
  doc.text("Elaborado por: Saúl Cruz Flores | Elementos Financieros", margin, 92);
  y = 135; doc.setTextColor(...INK);
  body(`Visita de seguimiento: ${ev.fecha_visita||"—"}${baseEv?`    Evaluación base: ${baseEv.fecha_visita||"—"}`:""}`, {size:10});
  y+=4; rule();

  checkBreak(80);
  doc.setFillColor(...hexToRgb(pctColor)); doc.circle(margin+30, y+28, 30, "F");
  doc.setFont("helvetica","bold"); doc.setFontSize(17); doc.setTextColor(255,255,255);
  doc.text(pct===null?"—":pct+"%", margin+30, y+34, {align:"center"});
  doc.setFontSize(13); doc.setTextColor(...NAVY);
  doc.text(`${k.verificado} de ${seguidos.length} correcciones verificadas`, margin+72, y+22);
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...SOFT);
  doc.text(`Corregido: ${k.verificado}   ·   Parcial: ${k.en_proceso}   ·   Sigue igual: ${k.pendiente}${nuevos.length?`   ·   Hallazgos nuevos: ${nuevos.length}`:""}`, margin+72, y+38);
  y += 78; // misma separación real que en el diagnóstico, contra el borde inferior del círculo
  body("Este seguimiento refleja lo observado durante la visita. No determina cumplimiento legal ni autorización sanitaria.", {size:10, color:SOFT});
  y+=6; rule();

  async function tarjeta(h, n){
    const r = h.hallazgo_previo_id ? segResultOf(h) : null;
    const colorHex = h.hallazgo_previo_id ? SEG_RESULT[r].color : "#2F6FA8";
    const prio = (h.prioridad||"").toUpperCase();
    const modulo = modMap[h.criterio_id] || h.categoria || "Hallazgo de visita";
    checkBreak(70);
    doc.setFillColor(...hexToRgb(colorHex)); doc.circle(margin+8, y+2, 8, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(255,255,255);
    doc.text(String(n), margin+8, y+4.5, {align:"center"});
    const textX = margin+22;
    doc.setFontSize(8); doc.setTextColor(...hexToRgb(colorHex));
    doc.text(`${r?SEG_RESULT[r].label.toUpperCase()+" · ":"NUEVO · "}${(PRIORITY_LABEL[prio]||"").toUpperCase()} · ${modulo}`.toUpperCase(), textX, y);
    y += 11;
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(...INK);
    doc.splitTextToSize(h.descripcion||"", maxW-22).forEach(line=>{ checkBreak(13); doc.text(line, textX, y); y+=12; });
    if(h.hallazgo_previo_id && prevMap[h.hallazgo_previo_id]==="corregido") body("El cliente reportó que ya lo había corregido.", {size:10.5, indent:22, color:SOFT});
    if(h.nota_seguimiento) body("Verificación: "+h.nota_seguimiento, {size:10, indent:22});
    y += 2;
    const foto = await fotoDe(h);
    const boxY = y; let photoW = 0;
    if(foto){ photoW = 60; checkBreak(48); try{ doc.addImage(foto, "JPEG", textX, boxY, photoW, 45); }catch(e){ photoW = 0; } }
    const boxX = textX + (photoW?photoW+8:0), boxW = maxW-22-(photoW?photoW+8:0);
    doc.setFont("helvetica","bold"); doc.setFontSize(9);
    const lines = doc.splitTextToSize(h.accion||"—", boxW-14);
    const boxH = Math.max(40, 22 + lines.length*11);
    doc.setFillColor(245,245,245); doc.rect(boxX, boxY, boxW, boxH, "F");
    doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(...SOFT); doc.text("QUÉ SE PIDIÓ", boxX+7, boxY+11);
    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...NAVY);
    lines.forEach((line,li)=>doc.text(line, boxX+7, boxY+22+li*11));
    y = boxY + Math.max(photoW?47:0, boxH) + 8;
    doc.setDrawColor(220,220,220); doc.line(margin, y, pageW-margin, y); y += 10; doc.setTextColor(...INK);
  }

  const pendientes = seguidos.filter(h=>segResultOf(h)!=="verificado");
  const corregidos = seguidos.filter(h=>segResultOf(h)==="verificado");
  let n = 1;
  heading(`Pendiente por corregir (${pendientes.length})`, 13);
  if(!pendientes.length) body("No quedan puntos pendientes de la evaluación base.");
  for(const h of pendientes){ await tarjeta(h, n++); }
  if(nuevos.length){ y+=4; heading(`Hallazgos nuevos (${nuevos.length})`, 13); for(const h of nuevos){ await tarjeta(h, n++); } }
  if(corregidos.length){
    y+=4; heading(`Corregido (${corregidos.length})`, 13);
    for(const h of corregidos){
      checkBreak(28);
      doc.setFillColor(...hexToRgb("#2E7D4F")); doc.circle(margin+8, y+2, 6, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(255,255,255); doc.text("OK", margin+8, y+4.3, {align:"center"});
      doc.setTextColor(...SOFT);
      body(h.descripcion, {size:10.5, indent:22, color:SOFT});
      if(h.nota_seguimiento) body("Verificación: "+h.nota_seguimiento, {size:10.5, indent:22, color:SOFT});
      y += 4;
    }
  }
  y+=6; rule();
  heading("Conclusión", 13);
  body(`El presente documento constituye un seguimiento de revisión realizado con base en lo observado durante la visita del ${ev.fecha_visita||"—"}. No sustituye una visita de verificación ni una resolución emitida por la autoridad sanitaria.`, {size:10});

  const nombreSeguro = (nombreExpediente||"expediente").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"");
  doc.save(`SEGUIMIENTO-${nombreSeguro}-${ev.fecha_visita||"visita"}.pdf`);
}

async function generarPdfDiagnostico(cache, mode){
  if(!window.jspdf){ showError("El generador de PDF no cargó (requiere conexión a internet la primera vez)."); return; }
  const {jsPDF} = window.jspdf;
  const {ev, diag, nombreExpediente} = cache;
  const datosEst = await getDatosEst(ev.expediente_id);
  let remota = esRemota(ev);
  if(!ev.facts){ try{ const r = await sb.from("evaluaciones").select("facts").eq("id", ev.id).single(); remota = !!(r.data && r.data.facts && r.data.facts.modalidad==="remota"); }catch(e){} }
  const AVISO_REMOTA = "Modalidad remota: la revisión documental se hizo con los documentos y fotografías compartidos por la clínica, y el recorrido fue guiado por videollamada. Lo que no se pudo observar con claridad se reporta como «no verificado»; este diagnóstico no sustituye una revisión presencial.";
  const doc = new jsPDF({unit:"pt", format:"letter"});
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
  const margin = 48, maxW = pageW - margin*2;
  let y = margin;
  const NAVY=[17,17,17], INK=[17,17,17], SOFT=[90,90,90];

  function checkBreak(need){ if(y+need > pageH-margin){ doc.addPage(); y=margin; } }
  function heading(t,size){ checkBreak(size+12); doc.setFont("helvetica","bold"); doc.setFontSize(size); doc.setTextColor(...NAVY); doc.text(t,margin,y); y+=size*0.9+8; doc.setTextColor(...INK); }
  function body(t,opts){ opts=opts||{}; doc.setFont("helvetica",opts.bold?"bold":"normal"); doc.setFontSize(opts.size||11); doc.setTextColor(...(opts.color||INK));
    doc.splitTextToSize(String(t||""), opts.maxW||maxW).forEach(line=>{ checkBreak(opts.lh||15); doc.text(line, margin+(opts.indent||0), y); y+=opts.lh||15; }); }
  function rule(){ checkBreak(10); doc.setDrawColor(220,220,215); doc.line(margin,y,pageW-margin,y); y+=12; }
  function hexToRgb(hex){ const n=parseInt(hex.replace("#",""),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
  function gauge(cx,cyc,r,percent,color){ doc.setFillColor(...hexToRgb(color)); doc.circle(cx,cyc,r,"F");
    doc.setFont("helvetica","bold"); doc.setFontSize(r*0.6); doc.setTextColor(255,255,255);
    doc.text(percent===null?"—":percent+"%", cx, cyc+r*0.22, {align:"center"}); doc.setTextColor(...INK); }
  function bar(label,pct,color,w){ checkBreak(22); doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...INK);
    doc.text(label,margin,y); doc.setFont("helvetica","bold"); doc.text(pct+"%", margin+w, y, {align:"right"}); y+=5;
    doc.setFillColor(238,238,238); doc.rect(margin,y,w,7,"F"); doc.setFillColor(...hexToRgb(color)); doc.rect(margin,y,w*pct/100,7,"F"); y+=17; }

  { const depPortada = detectDependencia((diag.findings||[]).map(f=>f.criterio?.id||""));
    drawPortadaPdf(doc, {titulo:depPortada.pdfTitle, cliente:datosEst.nombreComercial||nombreExpediente,
      subtitulo: mode==="interno" ? "Registro interno del evaluador" : (remota ? "Diagnóstico y plan de acción · Revisión remota" : "Diagnóstico y plan de acción"),
      detalle:`${remota?"Fecha de la videollamada":"Fecha de visita"}: ${fechaLarga(ev.fecha_visita)}`, detalle2:[datosEst.domicilio, datosEst.municipio, datosEst.estado].filter(Boolean).join(", ")}); }
  doc.setFillColor(...NAVY); doc.rect(0,0,pageW,110,"F");
  // Logo -- insignia blanca en la esquina del encabezado, mismo tratamiento que en la app
  try{
    doc.addImage(LOGO_MARK_B64, "PNG", pageW-margin-40, 14, 44, 44);
  }catch(logoErr){ console.warn("No se pudo dibujar el logo en el PDF:", logoErr); }
  const dep = detectDependencia((diag.findings||[]).map(f=>f.criterio?.id||""));
  const esSTPS = dep.tieneEtiquetaEspecialista; // conservado: gatea el bloque de prioridad inmediata y la etiqueta Especialista/Interno, ahora válido para STPS y Protección Civil
  doc.setFont("helvetica","bold"); doc.setFontSize(19); doc.setTextColor(255,255,255);
  doc.text(dep.pdfTitle, margin, 52);
  doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(220,220,220);
  doc.text(datosEst.nombreComercial||nombreExpediente||"(sin nombre)", margin, 74);
  doc.setFontSize(9.5); doc.setTextColor(200,200,200);
  doc.text("Elaborado por: Saúl Cruz Flores | Elementos Financieros", margin, 92);
  y = 135; doc.setTextColor(...INK);
  body(`Fecha de visita: ${fechaLarga(ev.fecha_visita)}    ${remota ? "Modalidad: remota (videollamada)" : "Nivel: "+ev.nivel_checkup}`, {size:10});
  if(remota) body(AVISO_REMOTA, {size:8.5, color:SOFT, lh:11});
  datosEstLineas(datosEst).forEach(l=> body(l, {size:10, color:SOFT, lh:14}));
  y+=4; rule();

  checkBreak(80);
  gauge(margin+30, y+28, 30, diag.cumplimiento, diag.band.color);
  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(...NAVY);
  doc.text(`Riesgo ${diag.band.label}`, margin+72, y+22);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...SOFT);
  doc.text(`Cumplimiento de lo revisado: ${diag.cumplimiento===null?"—":diag.cumplimiento+"%"} (${diag.nOkVisita} en orden, ${diag.findings.length} por corregir)`, margin+72, y+35);
  if(diag.nCrit){ doc.setFontSize(8.5); doc.setTextColor(179,38,30); doc.text(`${pl(diag.nCrit,"punto crítico","puntos críticos")}: ${diag.nCrit===1?"es el que puede":"son los que pueden"} causar una suspensión.`, margin+72, y+48); doc.setTextColor(...INK); }
  y += 78; // separación real contra el borde inferior del círculo (radio 30)
  body("El círculo es el porcentaje de lo revisado que está en orden (más alto es mejor). El nivel de riesgo lo marca la gravedad de lo que falta: un solo punto crítico pesa más que muchos puntos en orden. No determina cumplimiento legal ni autorización sanitaria.", {size:10, color:SOFT});
  y+=6; rule();

  // Prioridad inmediata (solo STPS): índice corto de lo crítico, con quién lo resuelve --
  // así arma carpetas de inmediato sin leer las 20 tarjetas completas primero.
  if(esSTPS){
    const criticos = diag.findings.filter(f=>f.risk.prioridad==="CRITICA");
    if(criticos.length){
      heading("🚨 Prioridad inmediata", 13);
      body(`${criticos.length} punto(s) crítico(s) antes de cualquier trámite`, {size:10, color:SOFT});
      y+=4;
      criticos.forEach(f=>{
        checkBreak(26);
        doc.setDrawColor(...hexToRgb("#B3261E")); doc.setLineWidth(2.5);
        doc.line(margin, y-9, margin, y+3); doc.setLineWidth(1);
        doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(...INK);
        const reqLines = doc.splitTextToSize(f.criterio.requisito, maxW-100);
        doc.text(reqLines[0] + (reqLines.length>1?"…":""), margin+10, y-3);
        const esp = f.criterio.requiereEspecialista;
        const tagTxt = esp ? "ESPECIALISTA" : "INTERNO";
        const tagColor = esp ? "#185FA5" : "#3B6D11";
        doc.setFillColor(...hexToRgb(esp?"#E6F1FB":"#EAF3DE"));
        const tagW = doc.setFont("helvetica","bold").setFontSize(7.5).getTextWidth(tagTxt)+12;
        doc.rect(pageW-margin-tagW, y-11, tagW, 13, "F");
        doc.setTextColor(...hexToRgb(tagColor));
        doc.text(tagTxt, pageW-margin-tagW/2, y-2, {align:"center"});
        doc.setTextColor(...INK);
        y+=14;
      });
      y+=4; rule();
    }
  }

  if(diag.areaRows.length){
    heading("Cumplimiento por área", 13);
    body("La barra es lo que está en orden; el color es el riesgo de lo que falta.", {size:9, color:SOFT, lh:12});
    diag.areaRows.forEach(a=>{
      const lab = a.modulo + (a.criticos?` (${pl(a.criticos,"crítico","críticos")})`:"");
      if(a.cumplimiento===null){
        checkBreak(22); doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...INK); doc.text(lab, margin, y);
        doc.setFont("helvetica","bold"); doc.setTextColor(...hexToRgb(a.color)); doc.text(`${a.hallazgos} por corregir`, margin+maxW, y, {align:"right"}); doc.setTextColor(...INK); y+=16;
      } else bar(lab, a.cumplimiento, a.color, maxW);
      if(a.baseTxt){ y-=6; body(`Incluye ${a.baseTxt}.`, {size:8, color:SOFT, lh:11}); y+=2; }
    });
    y+=4; rule();
  }

  // Cada hallazgo es su propia tarjeta numerada -- ya trae qué hacer, foto, responsable,
  // fecha y estatus juntos, para que se corrija punto por punto (nada de una lista plana
  // de texto corrido separada al final, que era justo el problema del diseño anterior).
  // Los hallazgos de la auditoría de expedientes se muestran como UN solo punto; el detalle va en su sección.
  const esAud = f => f.origen==="libre" && /^Expediente clínico:/.test((f.hallazgo&&f.hallazgo.descripcion) || f.criterio.requisito || "") && /(expedientes revisados|auditoría de expedientes)/.test((f.hallazgo&&f.hallazgo.descripcion) || f.criterio.requisito || "");
  const audF = diag.findings.filter(esAud);
  const ORD_P = {CRITICA:0, ALTA:1, MEDIA:2, BAJA:3, POR_DETERMINAR:4};
  let findingsPDF = diag.findings.filter(f=>!esAud(f));
  if(audF.length){
    const peor = audF.slice().sort((x,z)=>(ORD_P[x.risk.prioridad]??9)-(ORD_P[z.risk.prioridad]??9))[0];
    const nEl = audF.length===1 && /auditoría de expedientes/.test(audF[0].hallazgo?.descripcion||"") ? (audF[0].hallazgo.descripcion.match(/(\d+) elemento/)||[])[1] || "Varios" : audF.length;
    const sint = {...peor, criterio:{...peor.criterio, modulo:"Expediente clínico", requisito:`Expediente clínico: ${nEl} elemento(s) fallan en la auditoría de expedientes`},
      hallazgo:{...(peor.hallazgo||{}), accion:"Corregir los formatos y el llenado de los expedientes. El detalle de cada elemento, su fundamento y la guía de llenado están en la sección Auditoría de expedientes clínicos."}, evidencias:[]};
    const idx = diag.findings.indexOf(peor);
    const antes = diag.findings.slice(0, idx).filter(f=>!esAud(f)).length;
    findingsPDF.splice(antes, 0, sint);
  }
  if((diag.equipos||[]).length){
    heading(`Sus equipos (${diag.equipos.length})`, 13);
    body("Verde: en orden. Amarillo: pedir documento al proveedor. Rojo: requiere registro sanitario y no lo tiene.", {size:9, color:SOFT, lh:12});
    y += 2;
    diag.equipos.forEach(e=>{
      doc.setFont("helvetica","normal"); doc.setFontSize(9);
      const tl = doc.splitTextToSize(e.sem.txt, maxW-200);
      checkBreak(tl.length*11 + 8);
      doc.setFillColor(...hexToRgb(SEM_HEX[e.sem.color])); doc.circle(margin+5, y-3, 4, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(...INK);
      doc.text(doc.splitTextToSize(e.nombre, 170)[0], margin+16, y);
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...SOFT);
      tl.forEach((l,k)=>doc.text(l, margin+196, y + k*11));
      y += Math.max(1, tl.length)*11 + 5;
    });
    body("Base: Ley General de Salud arts. 262 y 376 y Acuerdo de listados de dispositivos médicos (DOF 07-07-2025). Los equipos estéticos no invasivos se respaldan con registro, oficio de COFEPRIS de no requerimiento del modelo o la finalidad estética declarada por el fabricante.", {size:8, color:SOFT, lh:10});
    y += 4; rule();
  }
  heading(`Puntos por corregir (${findingsPDF.length})`, 13);
  if(findingsPDF.length===0) body("No se identificaron hallazgos con lo contestado.");
  for(let i=0;i<findingsPDF.length;i++){
    const f = findingsPDF[i];
    const h = f.hallazgo || {};
    const estatusActual = h.estatus_accion || "pendiente";
    const doneF = estatusActual==="corregido" || estatusActual==="verificado";
    const colorHex = doneF ? "#2E7D4F" : (PRIORITY_COLOR[f.risk.prioridad] || PRIORITY_COLOR.MEDIA);
    checkBreak(64);
    // Franja de color a la izquierda + número/check en círculo
    const cardTop = y;
    doc.setFillColor(...hexToRgb(colorHex)); doc.circle(margin+8, y+2, 8, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(255,255,255);
    doc.text(doneF?"OK":String(i+1), margin+8, y+4.5, {align:"center"});
    doc.setTextColor(...INK);

    const textX = margin+22;
    doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(...hexToRgb(colorHex));
    doc.text(`${PRIORITY_LABEL[f.risk.prioridad]} · ${f.criterio.modulo}`.toUpperCase(), textX, y);
    if(esSTPS && f.origen==="regulatorio" && typeof f.criterio.requiereEspecialista==="boolean"){
      const esp = f.criterio.requiereEspecialista;
      const tagTxt = esp ? "ESPECIALISTA" : "INTERNO";
      doc.setFont("helvetica","bold"); doc.setFontSize(7.5);
      const tagW = doc.getTextWidth(tagTxt)+12;
      doc.setFillColor(...hexToRgb(esp?"#E6F1FB":"#EAF3DE"));
      doc.rect(pageW-margin-tagW, y-9, tagW, 13, "F");
      doc.setTextColor(...hexToRgb(esp?"#185FA5":"#3B6D11"));
      doc.text(tagTxt, pageW-margin-tagW/2, y, {align:"center"});
      doc.setTextColor(...hexToRgb(colorHex));
    }
    y += 11;
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(...(doneF?SOFT:INK));
    doc.splitTextToSize(f.criterio.requisito, maxW-22).forEach(line=>{ checkBreak(13); doc.text(line, textX, y); y+=12; });
    if(f.origen!=="libre") body(`Estatus: ${STATUS_TEXT[f.estatus]}${f.nota?" — "+f.nota:""}`, {size:10.5, indent:22, color:SOFT});
    { const tipo = tipoRequisitoTxt(f);
      if(tipo) body(tipo, {size:9, indent:22, color:NAVY, bold:true, lh:12});
      if(f.criterio.fundamento_legal) body(`Fundamento: ${f.criterio.fundamento_legal}`, {size:9, indent:22, color:SOFT, lh:12});
      else if(mode==="interno") body("Fundamento: — (sin capturar)", {size:9, indent:22, color:[179,38,30], lh:12}); }
    y += 2;

    // Foto (si hay) + caja de "Qué hacer" lado a lado
    const boxY = y; let photoW = 0;
    if(f.evidencias && f.evidencias.length){
      const ev0 = f.evidencias[0];
      const path = ev0.storage_path_optimizada || ev0.storage_path_thumbnail;
      try{
        const { data: signed } = await sb.storage.from("evidencias").createSignedUrl(path, 300);
        if(signed){
          const resp = await fetch(signed.signedUrl); const blob = await resp.blob();
          const dataUrl = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(blob); });
          photoW = 60;
          checkBreak(48);
          doc.addImage(dataUrl, "JPEG", textX, boxY, photoW, 45);
        }
      }catch(imgErr){ console.warn("No se pudo incrustar evidencia:", imgErr); }
    }
    const boxX = textX + (photoW?photoW+8:0);
    const boxW = maxW-22-(photoW?photoW+8:0);
    const accionTxt = h.accion || sugerirAccion(f.criterio);
    const accionLines = doc.setFont("helvetica","bold").setFontSize(9).splitTextToSize(accionTxt, boxW-14);
    const boxH = Math.max(45, 22 + accionLines.length*11);
    doc.setFillColor(245,245,245); doc.rect(boxX, boxY, boxW, boxH, "F");
    doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(...SOFT);
    doc.text("QUÉ HACER", boxX+7, boxY+11);
    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...NAVY);
    accionLines.forEach((line,li)=>doc.text(line, boxX+7, boxY+22+li*11));
    y = boxY + Math.max(photoW?47:0, boxH) + 8;

    // Responsable / fecha / estatus como franja compacta, no una oración
    checkBreak(14);
    doc.setFillColor(240,240,240); doc.rect(textX, y-8, maxW-22, 14, "F");
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...SOFT);
    doc.text(`Responsable: ${h.responsable||"—"}     Fecha objetivo: ${h.fecha_objetivo?fechaLarga(h.fecha_objetivo):"—"}     Corrección: ${estatusActual.replace("_"," ")}`, textX+6, y+1);
    y += 14;
    doc.setDrawColor(220,220,220); doc.line(margin, y, pageW-margin, y); y += 10;
  }
  y+=4; rule();

  // ---------- Análisis de la situación, en lenguaje claro para el médico ----------
  try{
    const pend = findingsPDF.filter(f=>!["corregido","verificado"].includes((f.hallazgo&&f.hallazgo.estatus_accion)||""));
    const cuenta = k => pend.filter(f=>f.risk.prioridad===k).length;
    const nC = cuenta("CRITICA"), nA = cuenta("ALTA"), nM = cuenta("MEDIA") + cuenta("BAJA");
    const corr = findingsPDF.length - pend.length;
    const areasTop = (diag.areaRows||[]).slice().sort((x,z)=>(z.criticos-x.criticos)||(z.percent-x.percent)).filter(x=>x.percent>=40 || x.criticos>0).slice(0,3);
    const sinRiesgo = (diag.areaRows||[]).filter(x=>!x.hallazgos).map(x=>x.modulo);
    checkBreak(120);
    heading("Análisis de la situación", 13);
    if(!findingsPDF.length){
      body(`Con lo revisado en la visita, su establecimiento no presenta puntos por corregir. Cumple ${diag.cumplimiento===null?"—":diag.cumplimiento+"%"} de lo revisado. Mantener la documentación vigente y las bitácoras al día es lo que sostiene este resultado en una verificación.`, {size:10.5, lh:15});
    } else {
      body(`Con lo revisado en la visita, su clínica cumple ${diag.cumplimiento===null?"—":diag.cumplimiento+"%"} de lo revisado, pero su nivel de riesgo es ${String(diag.band.label).toLowerCase()} por la gravedad de lo que falta. Tiene ${pl(pend.length,"punto pendiente","puntos pendientes")} por corregir: ${pl(nC,"crítico","críticos")}, ${nA} de prioridad alta y ${nM} de prioridad media o baja${corr?`, y ya corrigió ${corr}`:""}.`, {size:10.5, lh:15});
      y += 4;
      if(areasTop.length) body(`El riesgo se concentra en ${areasTop.map(x=>`${x.modulo} (${x.criticos ? x.criticos+" crítico"+(x.criticos===1?"":"s") : x.hallazgos+" por corregir"})`).join(", ").replace(/, ([^,]*)$/, " y $1")}. ${sinRiesgo.length?`En cambio, ${sinRiesgo.slice(0,3).join(", ").replace(/, ([^,]*)$/, " y $1")} ${sinRiesgo.length===1?"está":"están"} en orden.`:""}`, {size:10.5, lh:15});
      y += 4;
      const urg = pend.filter(f=>f.risk.prioridad==="CRITICA");
      if(urg.length){
        body("Lo más urgente:", {bold:true, size:10.5, lh:15});
        // En regulatorios se usa la nota del evaluador (dice qué pasó: "bichectomía sin licencia"), no el título genérico.

  // ---------- Auditoría de expedientes clínicos (si se hizo en la visita) ----------
  let siguientePaso = null;

      // Semáforo por expediente (solo cuentan los elementos obligatorios)

        y += 15;
      });
      body("Verde: completo. Amarillo: 1 o 2 faltas. Rojo: 3 o más.", {size:8.5, color:SOFT, lh:11});
      y += 6;
      const tarjeta = (x, gris) => {
        doc.setFont("helvetica","bold"); doc.setFontSize(10.5);
        const tl = doc.splitTextToSize(x.t, maxW-90);
        doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
        const pl = x.p ? doc.splitTextToSize("Cómo se corrige: " + x.p, maxW-20) : [];
        const hh = tl.length*13 + pl.length*12 + 22;
        checkBreak(hh + 6);
        doc.setFillColor(248,248,248); doc.rect(margin, y-11, maxW, hh, "F");
        doc.setFillColor(...(gris ? [140,140,140] : (x.fallan===x.evaluados ? [179,38,30] : [184,134,11]))); doc.rect(margin, y-11, 3, hh, "F");
        let yy = y;
        doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(...INK); tl.forEach(l=>{ doc.text(l, margin+10, yy); yy+=13; });
        doc.setTextColor(...(gris ? SOFT : [179,38,30])); doc.text(`Falta en ${x.fallan} de ${x.evaluados}`, pageW-margin-6, y, {align:"right"});
        doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...INK); pl.forEach(l=>{ doc.text(l, margin+10, yy); yy+=12; });
        doc.setFontSize(8); doc.setTextColor(...SOFT); doc.text(x.f, margin+10, yy+1);
        y += hh + 6;
      };
      const fallObl = fallanA.filter(x=>!x.rec), fallRec = fallanA.filter(x=>x.rec);

      y += 4;
      if(fallObl.length) fallObl.forEach(x=>tarjeta(x,false));
      else body("Ningún elemento obligatorio falta en la muestra revisada.", {size:10.5});
      if(fallRec.length){ y += 4; body("Recomendado (no es obligación legal)", {bold:true, size:11, color:NAVY}); y += 4; fallRec.forEach(x=>tarjeta(x,true)); }
      y += 8;
      body("Guía de llenado: lo que debe tener todo expediente de esta clínica", {bold:true, size:11.5, color:NAVY});
      body("Úsela como lista de revisión. Lo marcado como obligatorio lo exige la norma; lo recomendado protege a la clínica pero no es obligación.", {size:9.5, color:SOFT, lh:12});
      y += 4;
      [...new Set(itemsA.map(it=>it.grupo))].forEach(g=>{
        checkBreak(30);
        body(g, {bold:true, size:10.5, lh:15});
        if(g===EXPA_ITEMS.quirurgico.label) body("Aplica solo si el establecimiento cuenta con licencia sanitaria para actos quirúrgicos. Sin licencia, estos procedimientos no deben realizarse.", {size:8.5, color:[179,38,30], lh:11, indent:4});
        [["Obligatorio", itemsA.filter(it=>it.grupo===g && !it.rec)], ["Recomendado", itemsA.filter(it=>it.grupo===g && it.rec)]].forEach(([etq, lista])=>{
          if(!lista.length) return;
          body(etq.toUpperCase(), {bold:true, size:8, color: etq==="Obligatorio" ? [179,38,30] : SOFT, lh:11, indent:4});
          lista.forEach(it=>{
            body(`[  ]  ${it.t}`, {size:9.5, lh:12, indent:4});
            if(it.p) body(it.p, {size:8.5, lh:11, indent:22, color:SOFT});
          });
          y += 2;
        });
        y += 4;
      });
      body("Conservar cada expediente al menos 5 años desde el último acto médico (NOM-004, 5.4).", {size:9, color:SOFT, lh:12});
      if(fallanA.length){
        const pls = expaPlantillas({facts: evFacts.facts || {}});

        const CONT = {base:"historia clínica y nota de evolución conforme a la NOM-004", estetica:"consentimientos por procedimiento estético, bitácora de multidosis y autorización de uso de fotografías", dental:"historia clínica estomatológica con odontograma y periodontograma, y consentimientos conforme a la NOM-013", quirurgico:"notas pre y postoperatorias, valoración y registro anestésico, y consentimientos de cirugía y anestesia (para usarse una vez que se cuente con la licencia sanitaria quirúrgica)"};
        const contenido = pls.filter(x=>CONT[x]).map(x=>CONT[x]).join("; ");
        const txt = `Paquete de formatos de expediente clínico de Elementos Financieros para ${esp.join(", ")}: ${contenido}. Incluye versión física lista para imprimir y versión digital para llenar e imprimir, personalizadas con los datos de la clínica, y cada formato indica la norma que cumple. Con implementación opcional: capacitación del equipo en el llenado.`;
        const tl = doc.setFont("helvetica","normal").setFontSize(10).splitTextToSize(txt, maxW-28);
        const nota = doc.setFontSize(8.5).splitTextToSize("La versión digital no sustituye un expediente clínico electrónico: para operar sin papel se requiere un sistema con certificado SIRES.", maxW-28);
        const h = 30 + tl.length*13 + nota.length*11 + 8;

        checkBreak(h + 10); y += 8;

        doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...INK); tl.forEach((l,k)=>doc.text(l, margin+14, y+36+k*13));
        doc.setFontSize(8.5); doc.setTextColor(...SOFT); nota.forEach((l,k)=>doc.text(l, margin+14, y+36+tl.length*13+4+k*11));
        y += h + 10;
        };
      }
      y += 4; rule();
    }
  }catch(audErr){ console.warn("No se pudo agregar la auditoría de expedientes al PDF:", audErr); }

  heading("Conclusión", 13);
  body(`El presente documento constituye un diagnóstico de revisión realizado con base en la información, documentación y evidencia recabada durante la visita del ${ev.fecha_visita?fechaLarga(ev.fecha_visita):"(fecha no registrada)"}. No sustituye una visita de verificación ni una resolución emitida por la autoridad sanitaria.`);
  if(remota){ y += 4; body(AVISO_REMOTA, {size:10, color:SOFT}); }
  if(siguientePaso){ try{ y += 6; siguientePaso(); }catch(spErr){ console.warn(spErr); } }

  // ---------- Levantamiento de sitio: lo registrado en el inventario (equipos, personal, etc.) ----------
  try{
    const tipoIds = await ensureTipoIds();
    const [collR, regR] = await Promise.all([
      cachedRead("ev:"+ev.id+":coll_all", ()=>sb.from("colecciones_items").select("*").eq("evaluacion_id", ev.id).order("created_at")),
      cachedRead("ev:"+ev.id+":reg_all", ()=>sb.from("registros_unicos").select("*").eq("evaluacion_id", ev.id)),
    ]);
    const invItems = collR.data || [], invRegs = (regR.data || []).filter(r=>Object.entries(SINGLE_SCHEMAS).some(([cod])=>tipoIds["r:"+cod]===r.tipo_id));
    if(invItems.length || invRegs.length){
      const fotoPorItem = {};
      if(navigator.onLine && invItems.length){
        try{
          const { data: evs } = await sb.from("evidencias").select("coleccion_item_id,storage_path_thumbnail,storage_path_optimizada").in("coleccion_item_id", invItems.map(x=>x.id)).is("anulado_at", null);
          (evs||[]).forEach(e=>{ if(!fotoPorItem[e.coleccion_item_id]) fotoPorItem[e.coleccion_item_id] = e; });
        }catch(e){}
      }
      const fotoData = async (e) => {
        try{
          const { data: signed } = await sb.storage.from("evidencias").createSignedUrl(e.storage_path_thumbnail || e.storage_path_optimizada, 300);
          if(!signed) return null;
          const blob = await (await fetch(signed.signedUrl)).blob();
          return await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(blob); });
        }catch(err){ return null; }
      };
      checkBreak(70);
      doc.addPage(); y = margin;
      heading(`Anexo · Lo que se registró en la visita (${invItems.length + invRegs.length})`, 13);
      body("Inventario de referencia para el seguimiento. Los puntos por corregir están en el diagnóstico; aquí solo se documenta lo que se vio.", {size:10, color:SOFT, lh:13});
      y += 6;
      for(const [codigo, schema] of Object.entries(COLLECTION_SCHEMAS)){
        const lista = invItems.filter(x=>x.tipo_id===tipoIds["c:"+codigo]);
        if(!lista.length) continue;
        checkBreak(40);
        doc.setFillColor(...NAVY); doc.rect(margin, y-11, maxW, 18, "F");
        doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(255,255,255);
        doc.text(`${schema.label} (${lista.length})`, margin+8, y+1);
        y += 20;
        for(const it of lista){
          const campos = it.campos || {};
          const titulo = campos[schema.titleField] || schema.singular || "(sin nombre)";
          const filas = (schema.fields||[]).filter(f=>f.key!==schema.titleField && campos[f.key] && String(campos[f.key]).trim()).map(f=>[f.label, String(campos[f.key])]);
          const foto = fotoPorItem[it.id] ? await fotoData(fotoPorItem[it.id]) : null;
          const PW = 96, PH = 72;
          const tx = margin + 10 + (foto ? PW + 12 : 0), tw = pageW - margin - 10 - tx;
          doc.setFont("helvetica","bold"); doc.setFontSize(11); const tl = doc.splitTextToSize(titulo, tw);
          const lineas = [];
          doc.setFontSize(9);
          filas.forEach(([lab,val])=>{ doc.setFont("helvetica","normal"); doc.setFontSize(9); const vl = doc.splitTextToSize(val, tw-92); doc.setFont("helvetica","bold"); doc.setFontSize(8.5); const ll = doc.splitTextToSize(lab, 86); lineas.push([ll, vl]); });
          const obsL = it.observaciones ? (doc.setFont("helvetica","normal"), doc.setFontSize(9), doc.splitTextToSize(it.observaciones, maxW-34)) : [];
          const altoTexto = tl.length*14 + lineas.reduce((a,[ll,vl])=>a+Math.max(ll.length,vl.length)*11.5,0) + 4;
          const altoObs = obsL.length ? obsL.length*11.5 + 14 : 0;
          const hh = Math.max(foto ? PH + 8 : 0, altoTexto) + altoObs + 16;
          checkBreak(hh + 8);
          const y0 = y;
          doc.setDrawColor(220,220,220); doc.setFillColor(250,250,250); doc.roundedRect(margin, y0-12, maxW, hh, 6, 6, "FD");
          if(foto){ try{ doc.addImage(foto, foto.startsWith("data:image/png") ? "PNG" : "JPEG", margin+10, y0-4, PW, PH); }catch(e){} }
          let yy = y0+4;
          doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...NAVY); tl.forEach(t=>{ doc.text(t, tx, yy); yy+=14; });
          lineas.forEach(([ll,vl])=>{
            doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.setTextColor(...SOFT); ll.forEach((l,k)=>doc.text(l, tx, yy + k*11.5));
            doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...INK); vl.forEach((v,k)=>doc.text(v, tx+92, yy + k*11.5));
            yy += Math.max(ll.length, vl.length)*11.5;
          });
          let yb = Math.max(yy, y0 + (foto ? PH : 0)) + 4;
          if(obsL.length){
            doc.setFillColor(244,244,244); doc.rect(margin+10, yb-2, maxW-20, obsL.length*11.5+8, "F");

            doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...INK); obsL.forEach((o,k)=>doc.text(o, margin+80, yb+8+k*11.5));
          }
          y = y0 - 12 + hh + 14;
        }
        y += 6;
      }
      for(const [codigo, schema] of Object.entries(SINGLE_SCHEMAS)){
        const reg = invRegs.find(x=>x.tipo_id===tipoIds["r:"+codigo]);
        if(!reg) continue;
        checkBreak(40);
        doc.setFillColor(...NAVY); doc.rect(margin, y-11, maxW, 18, "F");
        doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(255,255,255);
        doc.text(schema.label, margin+8, y+1);
        y += 20;
        const campos = reg.campos || {};
        const filas = (schema.fields||[]).filter(f=>campos[f.key]).map(f=>`${f.label}: ${campos[f.key]}`);
        if(!filas.length) body("Registrado sin detalle.", {size:9.5, color:SOFT, lh:12});
        filas.forEach(t=> body(t, {size:9.5, color:INK, lh:13}));
        y += 8;
      }
      y += 4; rule();
    }
  }catch(invErr){ console.warn("No se pudo agregar el levantamiento de sitio al PDF:", invErr); }

  const fileName = `CHECK-UP-REGULATORIO-${(nombreExpediente||"establecimiento").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-")}-${ev.fecha_visita||new Date().toISOString().slice(0,10)}.pdf`;
  const blob = doc.output("blob");
  try{
    const file = new File([blob], fileName, {type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:fileName});
      return;
    }
  }catch(shareErr){ console.warn("Share falló, uso descarga directa:", shareErr); }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=fileName; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
}

const OP_PREG = {}; OP_AREAS.forEach(a=>a.preguntas.forEach(p=>{ OP_PREG[p.id] = {...p, area:a}; }));
const OP_COLOR = n => n===null ? "#8E8E8E" : n<2 ? "#B3261E" : n<3 ? "#B8860B" : n<4 ? "#2E6DA4" : "#2E7D4F";

function opCalcular(respuestas){
  const areas = OP_AREAS.map(a=>{
    const calif = a.preguntas.filter(p=>!p.dato);
    const vals = []; const banderas = []; let pendientes = 0;
    calif.forEach(p=>{
      const r = respuestas[p.id];
      if(!r || (!r.na && !r.nivel)){ pendientes++; return; }
      if(r.na) return;
      vals.push(r.nivel);
      if(p.critica && r.nivel===1) banderas.push(p);
    });
    let prom = vals.length ? Math.round(10*vals.reduce((s,v)=>s+v,0)/vals.length)/10 : null;
    const topada = banderas.length>0 && prom!==null && prom>2;
    const nivel = prom===null ? null : (topada ? 2 : prom);
    return {area:a, promedio:prom, nivel, etiqueta: nivel===null ? "Sin datos" : OP_NIVELES[Math.max(0,Math.floor(nivel)-1)], banderas, topada, pendientes, respondidas:vals.length};
  });
  const conNivel = areas.filter(x=>x.nivel!==null);
  const global = conNivel.length ? Math.round(10*conNivel.reduce((s,x)=>s+x.nivel,0)/conNivel.length)/10 : null;
  const banderas = areas.flatMap(x=>x.banderas.map(p=>({p, area:x.area})));
  const masBajas = conNivel.slice().sort((a,b)=>a.nivel-b.nivel).slice(0,3);
  const pendientes = areas.reduce((s,x)=>s+x.pendientes,0);
  return {areas, global, etiquetaGlobal: global===null ? "Sin datos" : OP_NIVELES[Math.max(0,Math.floor(global)-1)], banderas, masBajas, pendientes};
}

    if(error){ list.innerHTML = `<div class="err">No se pudieron cargar: ${esc(error.message)}</div>`; return; }
    rows = data||[];
  }
  const draft = opLeerBorrador(exp.id);
  list.innerHTML = "";
  if(draft && !draft.id){
    const r = document.createElement("div"); r.className="small-row"; r.style.cursor="pointer";
    r.innerHTML = `<span>${esc(draft.fecha_visita)} · Borrador en este dispositivo</span><span class="muted">sin guardar ›</span>`;
    r.onclick = ()=>{ state.opEval = draft; go("op-wizard"); };

  }
  if(!rows.length && !(draft && !draft.id)){ list.innerHTML = `<div class="empty-note">${navigator.onLine?"Sin check-ups operativos todavía.":"Sin conexión: solo se muestran borradores de este dispositivo."}</div>`; return; }
  rows.forEach(ev=>{
    const res = opCalcular(ev.respuestas||{});
    const r = document.createElement("div"); r.className="small-row"; r.style.cursor="pointer";
    r.innerHTML = `<span>${esc(ev.fecha_visita)} · ${ev.estatus==="completada"?"Completado":"En captura"}</span><span style="font-weight:600;color:${OP_COLOR(res.global)}">${res.global===null?"—":res.global.toFixed(1)+" · "+esc(res.etiquetaGlobal)}</span>`;
    r.onclick = ()=>{ state.opEval = {id:ev.id, expediente_id:exp.id, expediente_nombre:exp.nombre_expediente, fecha_visita:ev.fecha_visita, estatus:ev.estatus, respuestas:ev.respuestas||{}, areaIdx:0};
      go(ev.estatus==="completada" ? "op-resultado" : "op-wizard"); };
    list.appendChild(r);
  });
}

/* ------------------------- Borrador local ------------------------- */
function opKey(expId){ return "op-borrador:"+expId; }
function opLeerBorrador(expId){ try{ const s = localStorage.getItem(opKey(expId)); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function opGuardarBorrador(ev){ try{ localStorage.setItem(opKey(ev.expediente_id), JSON.stringify(ev)); }catch(e){} }
function opBorrarBorrador(expId){ try{ localStorage.removeItem(opKey(expId)); }catch(e){} }

async function opIniciar(exp){
  const prev = opLeerBorrador(exp.id);
  if(prev && !prev.id){
    const c = await askChoice("Hay un check-up operativo sin guardar en este dispositivo.", [{v:"seguir",label:"Continuar ese borrador"},{v:"nuevo",label:"Empezar uno nuevo (descarta el borrador)"}], o=>o.label);
    if(!c) return;
    if(c.v==="seguir"){ state.opEval = prev; go("op-wizard"); return; }
  }
  const hoy = new Date(); const f = hoy.getFullYear()+"-"+String(hoy.getMonth()+1).padStart(2,"0")+"-"+String(hoy.getDate()).padStart(2,"0");
  state.opEval = {id:null, expediente_id:exp.id, expediente_nombre:exp.nombre_expediente, fecha_visita:f, estatus:"borrador", respuestas:{}, areaIdx:0};
  opGuardarBorrador(state.opEval);
  go("op-wizard");
}

async function opGuardarServidor(ev, estatus){
  if(!navigator.onLine) return {ok:false, offline:true};
  const row = {expediente_id:ev.expediente_id, fecha_visita:ev.fecha_visita, respuestas:ev.respuestas, version_cuestionario:OP_VERSION, estatus: estatus||ev.estatus||"borrador"};
  if(row.estatus==="completada"){ const r = opCalcular(ev.respuestas);
    const an = opAnalizar(ev.respuestas); row.resultado = {global:r.global, proyectado90:an.globalProyectado, riesgo:an.riesgoGlobal, areas:an.areas.map(x=>({id:x.area.id, nivel:x.nivel, promedio:x.promedio, topada:x.topada, riesgo:x.riesgo, proyectado:x.proyectado})), banderas:r.banderas.map(b=>b.p.id)}; }
  let res;
  if(ev.id) res = await sb.from("evaluaciones_operativas").update(row).eq("id", ev.id).select("id").single();
  else res = await sb.from("evaluaciones_operativas").insert(row).select("id").single();
  if(res.error) return {ok:false, error:res.error};
  ev.id = res.data.id; ev.estatus = row.estatus;
  opBorrarBorrador(ev.expediente_id);
  return {ok:true};
}

const OP_IMP = {dinero:{label:"Dinero", w:3, color:"#B8860B"}, pacientes:{label:"Pacientes", w:2, color:"#2E6DA4"}, seguridad:{label:"Seguridad del paciente", w:3, color:"#B3261E"}, continuidad:{label:"Continuidad", w:3, color:"#5B4B8A"}};
const OP_RIESGO_COLOR = {"Crítico":"#B3261E","Alto":"#D2691E","Medio":"#B8860B","Bajo":"#2E7D4F","—":"#8E8E8E"};
const OP_ECO = [
  {id:"venta", t:"Venta mensual promedio", u:"$"},
  {id:"ticket", t:"Ticket promedio por paciente", u:"$"},
  {id:"citas", t:"Citas agendadas al mes", u:"#"},
  {id:"faltas", t:"Inasistencias al mes", u:"#"},
  {id:"nuevos", t:"Pacientes nuevos al mes", u:"#"},
  {id:"publicidad", t:"Gasto mensual en publicidad", u:"$"},
];
const opMoney = n => "$" + Math.round(n).toLocaleString("es-MX");
const opNum = v => { const n = parseFloat(String(v||"").replace(/[^0-9.]/g,"")); return isFinite(n) && n>0 ? n : null; };

function opAnalizar(respuestas){
  const base = opCalcular(respuestas);
  // Riesgo por área
  base.areas.forEach(x=>{
    let score=0, max=0; const imp = {};
    x.area.preguntas.filter(p=>!p.dato).forEach(p=>{
      const r = respuestas[p.id]; if(!r || r.na || !r.nivel) return;
      const [cat] = OP_ACC[p.id]; const w = OP_IMP[cat].w;
      max += w*2;
      if(r.nivel<3){ score += w*(3-r.nivel); imp[cat]=(imp[cat]||0)+w*(3-r.nivel); }
    });
    const ratio = max ? score/max : null;
    x.riesgo = x.banderas.length ? "Crítico" : ratio===null ? "—" : ratio>=0.5 ? "Alto" : ratio>=0.2 ? "Medio" : "Bajo";
    const top = Object.entries(imp).sort((a,b)=>b[1]-a[1])[0];
    x.impacto = top ? OP_IMP[top[0]].label : "—";
  });
  // Plan 30-60-90
  const acciones = [];
  OP_AREAS.forEach(a=>a.preguntas.filter(p=>!p.dato).forEach(p=>{
    const r = respuestas[p.id]; if(!r || r.na || !r.nivel || r.nivel>=4) return;
    const [cat,h,a1,a2,a3] = OP_ACC[p.id];
    const texto = [a1,a2,a3][r.nivel-1];
    const horizonte = r.nivel===3 ? 90 : (p.critica ? 30 : h);
    const prioridad = (p.critica&&r.nivel===1?100:0) + (p.critica?20:0) + OP_IMP[cat].w*(4-r.nivel);
    acciones.push({p, area:a, nivel:r.nivel, cat, texto, horizonte, prioridad, mejora:r.nivel===3});
  }));
  acciones.sort((x,y)=>x.horizonte-y.horizonte || y.prioridad-x.prioridad);
  const plan = {30:acciones.filter(x=>x.horizonte===30), 60:acciones.filter(x=>x.horizonte===60), 90:acciones.filter(x=>x.horizonte===90)};
  // Proyección a 90 días: todo lo que está en 1-2 sube a Documentado (3)
  const proy = {};
  Object.entries(respuestas).forEach(([k,v])=>{ proy[k] = (v && v.nivel && v.nivel<3 && !v.na) ? {...v, nivel:3} : v; });
  const proyRes = opCalcular(proy);
  base.areas.forEach((x,i)=>{ x.proyectado = proyRes.areas[i].nivel; });
  base.globalProyectado = proyRes.global;
  base.acciones = acciones; base.plan = plan;
  const orden = ["Crítico","Alto","Medio","Bajo"];
  base.riesgoGlobal = orden.find(r=>base.areas.some(x=>x.riesgo===r)) || "—";
  base.conteoRiesgo = Object.fromEntries(orden.map(r=>[r, base.areas.filter(x=>x.riesgo===r).length]));
  // Impacto económico (ESTIMADO) — solo con datos capturados
  const e = respuestas.__eco || {}; const n = k => opNum(e[k]);
  const est = [];
  if(n("faltas") && n("ticket")) est.push({t:"Ingreso no realizado por inasistencias", v:`${opMoney(n("faltas")*n("ticket"))} al mes · ${opMoney(n("faltas")*n("ticket")*12)} al año`, s:"Inasistencias al mes × ticket promedio. Es el máximo expuesto; no todo es recuperable."});
  if(n("faltas") && n("citas")) est.push({t:"Tasa de inasistencia", v:`${Math.round(100*n("faltas")/n("citas"))}% de las citas`, s:"Inasistencias ÷ citas agendadas."});
  if(n("publicidad") && n("nuevos")) est.push({t:"Costo por paciente nuevo", v:opMoney(n("publicidad")/n("nuevos")), s:"Gasto en publicidad ÷ pacientes nuevos. Supone que todos los pacientes nuevos vienen de publicidad."});
  if(n("publicidad") && n("venta")) est.push({t:"Peso de la publicidad sobre la venta", v:`${(100*n("publicidad")/n("venta")).toFixed(1)}%`, s:"Gasto en publicidad ÷ venta mensual."});
  const cajaSinControl = ["4.1","4.2","4.3"].some(id=>respuestas[id]?.nivel===1);
  if(n("venta") && cajaSinControl) est.push({t:"Venta que pasa por caja sin control", v:`${opMoney(n("venta"))} al mes`, s:"Toda la venta mensual, porque hoy no hay corte, cruce de vouchers o separación de funciones. No es una pérdida: es el monto expuesto."});
  const dep = respuestas["10.1"]?.nivel;
  if(n("venta") && (dep===1 || dep===2)) est.push({t:"Ingreso en riesgo si el médico falta 2 semanas", v:opMoney(n("venta")*(dep===1?0.5:0.35)), s: dep===1 ? "Supuesto: 2 semanas ≈ 50% de la venta mensual y la clínica se detiene." : "Supuesto: 2 semanas ≈ 50% de la venta mensual; se mantiene cerca de 30% con servicios menores (35% en riesgo)."});
  base.economico = est; base.ecoCapturado = OP_ECO.some(f=>n(f.id));
  return base;
}

/* ------------------------- Evaluación del equipo (módulo global del Check-up Operativo) -------------------------
   Configuración global; datos por expediente en respuestas.__equipo. No altera el cálculo de madurez.
   Distingue productividad (trabajo y uso de capacidad), contribución (aporte directo o indirecto) y
   rentabilidad (solo si hay ingresos atribuibles y costo). Nunca concluye "no rentable" sin datos. */
const EQ_TIPOS = {
  clinico:{label:"Atención a pacientes", unidad:"sesiones o servicios al mes", ind:["horas","unidades","duracion","precio","cumplimiento","calidad","autonomia","responsabilidades"]},
  ventas:{label:"Ventas y captación", unidad:"pacientes o ventas cerradas al mes", ind:["horas","unidades","ingresos","cumplimiento","calidad","autonomia","responsabilidades"]},
  operaciones:{label:"Operación y coordinación", unidad:"tareas o procesos a su cargo", ind:["horas","cumplimiento","calidad","autonomia","responsabilidades","duenoLiberado"]},
  administracion:{label:"Administración", unidad:"tareas al mes", ind:["horas","cumplimiento","calidad","autonomia","responsabilidades","duenoLiberado"]},
  marketing:{label:"Marketing y redes", unidad:"consultas o prospectos generados al mes", ind:["horas","unidades","cumplimiento","calidad","autonomia","responsabilidades"]},
  externo:{label:"Servicio externo (contador, consultor, etc.)", unidad:"entregables al mes", ind:["cumplimiento","calidad","responsabilidades"]},
};
const EQ_REL = ["Nómina","Honorarios","Comisión","Externo / proveedor","Familiar o socio","No definido"];
const EQ_ESC = ["—","Bajo","Regular","Bueno","Excelente"];
const EQ_FALTA_LBL = {horas:"horas disponibles por semana", unidades:"volumen de trabajo al mes", duracion:"duración promedio por sesión", precio:"ingreso promedio por sesión o servicio", ingresos:"ingresos atribuibles", cumplimiento:"cumplimiento de responsabilidades", calidad:"calidad del trabajo", autonomia:"nivel de autonomía", responsabilidades:"responsabilidades definidas", duenoLiberado:"tiempo del dueño que libera"};
const eqN = v => { const n = parseFloat(String(v??"").replace(/[^0-9.]/g,"")); return isFinite(n) && n>0 ? n : null; };
function eqCalcular(eq, eco){
  const cols = (eq && eq.colaboradores) || [];
  const venta = eco ? eqN(eco.venta) : null;
  const personas = cols.map(c=>{
    const t = EQ_TIPOS[c.tipo] || EQ_TIPOS.operaciones; const pago = eqN(c.pago);
    const falta = t.ind.filter(k=>{
      if(["cumplimiento","calidad","autonomia"].includes(k)) return !c[k];
      if(k==="responsabilidades") return !(c.responsabilidades||"").trim();
      return eqN(c[k])===null;
    }).map(k=>EQ_FALTA_LBL[k]);
    if(pago===null) falta.unshift("costo mensual");
    const m = {};
    const horasMes = eqN(c.horas) ? eqN(c.horas)*4.33 : null;
    if(c.tipo==="clinico"){
      const u = eqN(c.unidades), d = eqN(c.duracion), pr = eqN(c.precio);
      if(u && d && horasMes) m.ocupacion = Math.min(999, Math.round(100*u*d/60/horasMes));
      if(u && pago) m.costoUnidad = pago/u;
      if(u && pr){ m.ingreso = u*pr; if(pago){ m.contribucion = m.ingreso - pago; m.ratio = m.ingreso/pago; } }
    } else if(c.tipo==="ventas"){
      const ing = eqN(c.ingresos); if(ing){ m.ingreso = ing; if(pago){ m.contribucion = ing - pago; m.ratio = ing/pago; } }
      if(eqN(c.unidades) && pago) m.costoUnidad = pago/eqN(c.unidades);
    } else if(c.tipo==="marketing"){
      if(eqN(c.unidades) && pago) m.costoUnidad = pago/eqN(c.unidades);
    }
    if(eqN(c.duenoLiberado)) m.duenoLiberado = eqN(c.duenoLiberado);
    let lectura;
    if(m.ratio!=null) lectura = m.ratio>=1 ? `Con los datos capturados, sus ingresos atribuibles cubren ${m.ratio.toFixed(1)} veces su costo (ESTIMADO).` : `Con los datos capturados, sus ingresos atribuibles no cubren su costo (ESTIMADO). Revisar precio, ocupación o esquema de pago antes de concluir.`;
    else if(["clinico","ventas"].includes(c.tipo)) lectura = "Datos insuficientes para estimar rentabilidad.";
    else lectura = "Su aporte es indirecto: se evalúa por cumplimiento, calidad, autonomía y tiempo que libera del dueño, no por ventas.";
    return {c, tipo:t, pago, falta, m, lectura};
  });
  const internos = personas.filter(p=>p.c.tipo!=="externo"), externos = personas.filter(p=>p.c.tipo==="externo");
  const costoInterno = internos.reduce((s,p)=>s+(p.pago||0),0), costoExterno = externos.reduce((s,p)=>s+(p.pago||0),0);
  const sinResp = personas.filter(p=>!(p.c.responsabilidades||"").trim());
  const conDueno = personas.filter(p=>(p.c.requiereDueno||"").trim());
  const sinVerificar = personas.filter(p=>p.pago!==null && !p.c.pagoVerificado);
  const acciones = [];
  if(sinResp.length) acciones.push(`Definir por escrito las responsabilidades de: ${sinResp.map(p=>p.c.nombre).join(", ")}.`);
  const clinSinU = personas.filter(p=>p.c.tipo==="clinico" && !eqN(p.c.unidades));
  if(clinSinU.length) acciones.push(`Registrar en la agenda las sesiones realizadas por cada profesional (${clinSinU.map(p=>p.c.nombre).join(", ")}) para medir ocupación y aporte.`);
  if(conDueno.length) acciones.push(`Documentar y delegar actividades que hoy requieren al dueño: ${conDueno.map(p=>`${p.c.nombre} (${p.c.requiereDueno})`).join("; ")}.`);
  if(sinVerificar.length) acciones.push(`Verificar montos y naturaleza del pago de: ${sinVerificar.map(p=>p.c.nombre).join(", ")}.`);
  const bajos = personas.filter(p=>p.c.cumplimiento && +p.c.cumplimiento<=2);
  if(bajos.length) acciones.push(`Acordar metas y seguimiento con: ${bajos.map(p=>p.c.nombre).join(", ")} (cumplimiento bajo o regular).`);
  return {personas, costoInterno, costoExterno, pctVenta: venta && costoInterno ? Math.round(100*costoInterno/venta) : null, sinResp, conDueno, acciones,
    faltantes: personas.filter(p=>p.falta.length).map(p=>({nombre:p.c.nombre, falta:p.falta}))};
}

    </div>
    <div class="content">
      <p class="muted small" style="margin:0 0 6px">${esEco ? "Si el médico comparte estos números, el reporte incluye una estimación en dinero (marcada como ESTIMADO). Si no, déjalos en blanco." : esEquipo ? "Productividad, contribución y autonomía de cada persona según su función. No cambia el nivel de madurez; se integra al reporte." : esc(a.objetivo)}</p>
      ${hayPrev ? `<div class="chip-grid" style="margin:6px 0 10px"><span class="chip ${ev.soloFalta?"selected":""}" id="op-solofalta">Solo lo que falta</span><span class="chip" id="op-verlev">📋 Levantamiento previo</span></div>` : ""}
      ${ev.areaIdx===0 ? `<label class="small muted">Fecha de visita</label><input type="text" id="op-fecha" value="${esc(ev.fecha_visita)}" placeholder="AAAA-MM-DD" style="margin-bottom:12px">` : ""}
      <div id="op-qs"></div>
      <div id="op-save-note" class="muted small" style="text-align:center;margin:6px 0 10px"></div>
      <div style="display:flex;gap:10px">
        ${ev.areaIdx>0 ? `<button class="btn btn-ghost" id="op-prev" style="flex:1">← Anterior</button>` : ""}
        <button class="btn btn-primary" id="op-next" style="flex:2">${ev.areaIdx===total-1 ? "Ver resultado →" : "Siguiente →"}</button>
      </div>
      <button class="btn-link" id="op-jump" style="display:block;margin:14px auto 0">Ir a otra sección</button>
    </div>`;
  document.getElementById("btn-back").onclick = async () => { await opGuardarYAvisar(ev); go("expediente", {currentExpediente:{id:ev.expediente_id, nombre_expediente:ev.expediente_nombre}}); };
  const fecha = document.getElementById("op-fecha");
  if(fecha) fecha.addEventListener("change", ()=>{ ev.fecha_visita = fecha.value.trim()||ev.fecha_visita; opGuardarBorrador(ev); });
  const qs = document.getElementById("op-qs");
  const sf = document.getElementById("op-solofalta"); if(sf) sf.onclick = ()=>{ ev.soloFalta = !ev.soloFalta; opGuardarBorrador(ev); go("op-wizard"); };
  const vl = document.getElementById("op-verlev"); if(vl) vl.onclick = ()=> verLevantamiento(ev);
  const prevBox = (pv) => pv ? `<div style="margin:0 0 10px;padding:10px 12px;border-radius:10px;background:#F4F4F4;border-left:4px solid ${(PREV_LBL[pv.estado]||PREV_LBL.validar)[1]}"><div class="small" style="font-weight:600;color:${(PREV_LBL[pv.estado]||PREV_LBL.validar)[1]}">${(PREV_LBL[pv.estado]||PREV_LBL.validar)[0]}${pv.fuente?` · <span class="muted">${esc(pv.fuente)}</span>`:""}</div>${pv.previo?`<div class="small" style="margin-top:4px">Previo: ${esc(pv.previo)}</div>`:""}${pv.accion?`<div class="small muted" style="margin-top:2px">→ ${esc(pv.accion)}</div>`:""}</div>` : "";

  if(esEquipo){ renderEquipoStep(qs, ev); }
  else if(esEco){
    const eco = ev.respuestas.__eco || {};
    const card = document.createElement("div"); card.className="card";
    card.innerHTML = OP_ECO.map(f=>`${prevBox(PREV["eco_"+f.id])}<label class="small muted">${esc(f.t)}${f.u==="$"?" (MXN)":""}</label>
      <input type="text" inputmode="decimal" data-eco="${f.id}" value="${esc(eco[f.id]||"")}" placeholder="${f.u==="$"?"$":"número"}" style="margin-bottom:12px">`).join("");
    card.querySelectorAll("[data-eco]").forEach(inp=> inp.addEventListener("input", ()=>{
      ev.respuestas.__eco = {...(ev.respuestas.__eco||{}), [inp.dataset.eco]: inp.value.trim()}; opGuardarBorrador(ev); }));
    qs.appendChild(card);
  } else a.preguntas.forEach(p=>{
    const r = ev.respuestas[p.id] || {};
    const respondida = !!(r.nivel || r.na || (p.dato && (r.dato||"").trim()));
    if(ev.soloFalta && respondida) return;
    const pv = PREV[p.id];
    const card = document.createElement("div");
    card.className = "card"; card.style.padding = "14px";
    if(p.dato){
      card.innerHTML = `${prevBox(pv)}<div class="small muted" style="margin-bottom:4px">${p.id} · Dato (no suma al nivel)</div>
        <div style="font-weight:500;margin-bottom:8px">${esc(p.t)}</div>
        <textarea rows="2" style="width:100%;box-sizing:border-box;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px">${esc(r.dato||"")}</textarea>`;
      const ta = card.querySelector("textarea");
      ta.addEventListener("input", ()=>{ ev.respuestas[p.id] = {...(ev.respuestas[p.id]||{}), dato: ta.value}; opGuardarBorrador(ev); });
    } else {
      card.innerHTML = `${prevBox(pv)}<div class="small muted" style="margin-bottom:4px">${p.id}${p.critica?` · <span style="color:#B3261E;font-weight:600">⚑ Control crítico</span>`:""}</div>
        <div style="font-weight:500;margin-bottom:10px">${esc(p.t)}</div>
        <div class="op-opts"></div>
        <div class="chip-grid" style="margin-top:10px">
          <span class="chip op-ver ${r.verificado?"":"selected"}" data-v="0">Declarado</span>
          <span class="chip op-ver ${r.verificado?"selected":""}" data-v="1">Verificado</span>
          <span class="chip op-note-btn">${r.nota?"✎ Nota":"+ Nota"}</span>
        </div>
        <textarea class="op-nota" rows="2" placeholder="Lo que viste o te dijeron…" style="display:${r.nota?"block":"none"};width:100%;box-sizing:border-box;margin-top:8px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px">${esc(r.nota||"")}</textarea>`;
      const opts = card.querySelector(".op-opts");
      const pintarOpts = () => {
        const cur = ev.respuestas[p.id] || {};
        opts.innerHTML = "";
        p.o.forEach((txt,i)=>{
          const b = document.createElement("div");
          b.className = "op-opt" + (cur.nivel===i+1 && !cur.na ? " selected" : "");
          b.innerHTML = `<span class="op-lvl" style="background:${OP_COLOR(i+1)}">${i+1}</span><span>${esc(txt)}</span>`;
          b.onclick = ()=>{ ev.respuestas[p.id] = {...(ev.respuestas[p.id]||{}), nivel:i+1, na:false}; opGuardarBorrador(ev); pintarOpts(); };
          opts.appendChild(b);
        });
        const na = document.createElement("div");
        na.className = "op-opt" + (cur.na ? " selected" : "");
        na.innerHTML = `<span class="op-lvl" style="background:#8E8E8E">–</span><span>No aplica</span>`;
        na.onclick = ()=>{ ev.respuestas[p.id] = {...(ev.respuestas[p.id]||{}), na:true, nivel:null}; opGuardarBorrador(ev); pintarOpts(); };
        opts.appendChild(na);
      };
      pintarOpts();
      card.querySelectorAll(".op-ver").forEach(ch=> ch.onclick = ()=>{
        ev.respuestas[p.id] = {...(ev.respuestas[p.id]||{}), verificado: ch.dataset.v==="1"}; opGuardarBorrador(ev);
        card.querySelectorAll(".op-ver").forEach(x=>x.classList.toggle("selected", x===ch));
      });
      const nota = card.querySelector(".op-nota");
      card.querySelector(".op-note-btn").onclick = ()=>{ nota.style.display="block"; nota.focus(); };
      nota.addEventListener("input", ()=>{ ev.respuestas[p.id] = {...(ev.respuestas[p.id]||{}), nota: nota.value}; opGuardarBorrador(ev); });
    }
    qs.appendChild(card);
  });

  const prev = document.getElementById("op-prev");
  if(prev) prev.onclick = async ()=>{ ev.areaIdx--; opGuardarBorrador(ev); await opGuardarYAvisar(ev); go("op-wizard"); };
  document.getElementById("op-next").onclick = async ()=>{
    if(ev.areaIdx < total-1){ ev.areaIdx++; opGuardarBorrador(ev); await opGuardarYAvisar(ev); go("op-wizard"); }
    else { await opGuardarYAvisar(ev); go("op-resultado"); }
  };
  document.getElementById("op-jump").onclick = async ()=>{
    const res = opCalcular(ev.respuestas);
    const opciones = OP_AREAS.map((x,i)=>({i, label:`${i+1}. ${x.nombre}${res.areas[i].pendientes?` (faltan ${res.areas[i].pendientes})`:" ✓"}`}));
    opciones.push({i:totalAreas, label:`${totalAreas+1}. Evaluación del equipo`});
    opciones.push({i:totalAreas+1, label:`${total}. Datos económicos (opcional)`});
    const c = await askChoice("Ir a", opciones, o=>o.label);
    if(!c) return; ev.areaIdx = c.i; opGuardarBorrador(ev); go("op-wizard");
  };
}
async function opGuardarYAvisar(ev){
  const r = await opGuardarServidor(ev);
  if(!r.ok){ opGuardarBorrador(ev); const n=document.getElementById("op-save-note"); if(n) n.textContent = r.offline ? "📴 Sin conexión: guardado en este dispositivo." : "No se pudo guardar en la nube; quedó en este dispositivo."; }
  return r;
}

/* ------------------------- Resultado ------------------------- */
function opBadge(txt, color){ return `<span style="display:inline-block;font-size:11px;font-weight:600;color:#fff;background:${color};border-radius:10px;padding:2px 8px;white-space:nowrap">${esc(txt)}</span>`; }
function renderOpResultado(){
  const ev = state.opEval;
  if(!ev){ go("dashboard"); return; }
  const res = opAnalizar(ev.respuestas);
  const planCard = (h, titulo) => {
    const l = res.plan[h];
    return `<div style="margin-bottom:12px"><div style="font-weight:600;color:var(--navy-900);margin-bottom:4px">${titulo} · ${l.length} acción(es)</div>
      ${l.length ? l.slice(0,4).map(x=>`<div class="small-row" style="display:block;font-size:13.5px">${x.p.critica&&x.nivel===1?"⚑ ":""}${esc(x.texto)}<div class="muted small">${esc(x.area.nombre)} · ${esc(OP_IMP[x.cat].label)}</div></div>`).join("") + (l.length>4?`<div class="muted small">+ ${l.length-4} más en el PDF</div>`:"") : `<div class="muted small">Sin acciones.</div>`}</div>`;
  };
  $app.innerHTML = `
    <div class="topbar"><div class="topbar-row">
      <button class="back-btn" id="btn-back">←</button>
      <div style="flex:1"><p class="brand">CHECK-UP OPERATIVO · RESULTADO</p><h1 style="font-size:18px">${esc(ev.expediente_nombre||"")}</h1></div>
    </div></div>
    <div class="content">
      <div class="card" style="display:flex;align-items:center;gap:14px">
        <div style="width:64px;height:64px;border-radius:50%;background:${OP_COLOR(res.global)};color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0">${res.global===null?"—":res.global.toFixed(1)}</div>
        <div><div class="area-name">Madurez: ${esc(res.etiquetaGlobal)}</div>
        <div class="area-sub">Riesgo general ${opBadge(res.riesgoGlobal, OP_RIESGO_COLOR[res.riesgoGlobal])}</div>
        <div class="area-sub">Proyección a 90 días: <b>${res.globalProyectado===null?"—":res.globalProyectado.toFixed(1)}</b>${res.pendientes?` · <b style="color:#B3261E">${res.pendientes} sin responder</b>`:""}</div></div>
      </div>
      <div class="card">
        <div class="section-title">Madurez y riesgo por área</div>
        ${res.areas.map((x,i)=>`
          <div class="op-bar-row" data-i="${i}">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;margin-bottom:4px"><span>${i+1}. ${esc(x.area.nombre)}</span><span style="display:flex;gap:6px;align-items:center">${opBadge(x.riesgo, OP_RIESGO_COLOR[x.riesgo])}<b style="color:${OP_COLOR(x.nivel)}">${x.nivel===null?"—":x.nivel.toFixed(1)}</b></span></div>
            <div style="height:8px;background:#EEEEEA;border-radius:4px;position:relative"><div style="position:absolute;height:8px;width:${x.proyectado===null?0:Math.round(100*x.proyectado/4)}%;background:${OP_COLOR(x.proyectado)};opacity:.25;border-radius:4px"></div><div style="position:absolute;height:8px;width:${x.nivel===null?0:Math.round(100*x.nivel/4)}%;background:${OP_COLOR(x.nivel)};border-radius:4px"></div></div>
            <div class="muted small" style="margin-top:2px">Impacto principal: ${esc(x.impacto)}${x.proyectado!==null&&x.nivel!==null&&x.proyectado>x.nivel?` · a 90 días: ${x.proyectado.toFixed(1)}`:""}</div>
          </div>`).join("")}
        <p class="muted small" style="margin:8px 0 0">La barra tenue es la proyección a 90 días si se cumple el plan. Toca un área para editarla.</p>
      </div>
      <div class="card"><div class="section-title">Plan de acción</div>${planCard(30,"Primeros 30 días")}${planCard(60,"Días 31 a 60")}${planCard(90,"Días 61 a 90")}</div>
      <div class="card"><div class="section-title">Impacto económico · ESTIMADO</div>
        ${res.economico.length ? res.economico.map(x=>`<div class="small-row" style="display:block"><b>${esc(x.t)}:</b> ${esc(x.v)}<div class="muted small">${esc(x.s)}</div></div>`).join("") : `<div class="muted small">No se capturaron datos económicos. <a href="#" id="op-go-eco">Capturarlos</a></div>`}
      </div>
      ${(()=>{ const eq = ev.respuestas.__equipo; if(!eq || !(eq.colaboradores||[]).length) return `<div class="card"><div class="section-title">Evaluación del equipo</div><div class="muted small">Sin colaboradores registrados.</div><button class="btn btn-ghost" id="op-go-eq" style="margin-top:8px">Evaluar al equipo</button></div>`;
        const r = eqCalcular(eq, ev.respuestas.__eco);
        return `<div class="card"><div class="section-title">Evaluación del equipo (${eq.colaboradores.length})</div>
          <div class="small-row"><span>Costo del equipo interno</span><b>${opMoney(r.costoInterno)}</b></div>
          <div class="small-row"><span>Servicios externos</span><b>${opMoney(r.costoExterno)}</b></div>
          ${r.pctVenta!==null?`<div class="small-row"><span>Equipo / venta</span><b>${r.pctVenta}%</b></div>`:""}
          <div class="small-row"><span>Personas con datos faltantes</span><b>${r.faltantes.length}</b></div>
          ${r.acciones.slice(0,4).map(t=>`<div class="small-row" style="display:block;font-size:13.5px">${esc(t)}</div>`).join("")}
          <button class="btn btn-ghost" id="op-go-eq" style="margin-top:8px">Ver o editar evaluación</button></div>`; })()}
      ${(()=>{ const P = ev.respuestas.__previas; if(!P) return ""; const est = Object.entries(P).map(([k,v])=>{ const r = ev.respuestas[k]||{}; const resp = !!(r.nivel||r.na||(r.dato||"").trim()); return {k, e:v.estado, resp}; });
        const val = est.filter(x=>x.e==="validar" && !x.resp).length, res2 = est.filter(x=>x.e==="responder" && !x.resp).length;
        return `<div class="card"><div class="section-title">Levantamiento previo</div><div class="small-row"><span>Por validar</span><b style="color:#B8860B">${val}</b></div><div class="small-row"><span>Por responder</span><b style="color:#B3261E">${res2}</b></div>${(val+res2)?`<p class="muted small" style="margin:6px 0 0">Mientras haya pendientes, el diagnóstico es preliminar.</p>`:""}<button class="btn btn-ghost" id="op-go-lev" style="margin-top:8px">Ver levantamiento</button></div>`; })()}
      <div id="op-save-note" class="muted small" style="text-align:center;margin:6px 0 10px"></div>
      ${ev.estatus!=="completada" ? `<button class="action-btn" id="op-complete"><span>✓ Marcar como completado</span><span>→</span></button>` : ""}
      <button class="action-btn" id="op-pdf" style="background:var(--navy-800)"><span>📄 Generar PDF</span><span>→</span></button>
      <button class="btn btn-ghost" id="op-edit" style="margin-top:4px">Editar respuestas</button>
    </div>`;
  document.getElementById("btn-back").onclick = () => go("expediente", {currentExpediente:{id:ev.expediente_id, nombre_expediente:ev.expediente_nombre}});
  document.querySelectorAll(".op-bar-row").forEach(r=> r.onclick = ()=>{ ev.areaIdx = +r.dataset.i; go("op-wizard"); });
  document.getElementById("op-edit").onclick = ()=>{ ev.areaIdx = 0; go("op-wizard"); };
  const ge = document.getElementById("op-go-eco"); if(ge) ge.onclick = (e)=>{ e.preventDefault(); ev.areaIdx = OP_AREAS.length + 1; go("op-wizard"); };
  const ge2 = document.getElementById("op-go-eq"); if(ge2) ge2.onclick = ()=>{ ev.areaIdx = OP_AREAS.length; go("op-wizard"); };
  const gl = document.getElementById("op-go-lev"); if(gl) gl.onclick = ()=> verLevantamiento(ev);
  const bc = document.getElementById("op-complete");
  if(bc) bc.onclick = async ()=>{
    if(res.pendientes){ const c = await askChoice(`Faltan ${res.pendientes} pregunta(s). ¿Completar de todos modos?`, [{v:1,label:"Sí, completar"},{v:0,label:"Volver a capturar"}], o=>o.label); if(!c||!c.v) return; }
    const r = await opGuardarServidor(ev, "completada");
    if(!r.ok){ showError(r.offline ? "Completar necesita conexión. Tus respuestas están guardadas en este dispositivo." : "No se pudo guardar: "+(r.error?.message||"")); return; }
    go("op-resultado");
  };
  document.getElementById("op-pdf").onclick = async ()=>{
    try{ await generarPdfOperativo(ev, res); }catch(err){ showError("No se pudo generar el PDF: " + (err&&err.message?err.message:err)); }
  };
}

/* ------------------------- PDF ------------------------- */
async function generarPdfOperativo(ev, res){
  if(!window.jspdf){ showError("El generador de PDF no cargó (requiere conexión a internet la primera vez)."); return; }
  if(!res || !res.plan) res = opAnalizar(ev.respuestas);
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:"pt", format:"letter"});
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
  const margin = 48, maxW = pageW - margin*2;
  let y = margin;
  const NAVY=[17,17,17], INK=[17,17,17], SOFT=[90,90,90], RED=[179,38,30];
  const hex = h=>{ const n=parseInt(h.replace("#",""),16); return [(n>>16)&255,(n>>8)&255,n&255]; };
  const checkBreak = need=>{ if(y+need > pageH-margin){ doc.addPage(); y=margin; } };
  const heading = (t,size)=>{ checkBreak((size||14)+30); doc.setFont("helvetica","bold"); doc.setFontSize(size||14); doc.setTextColor(...NAVY); doc.text(t,margin,y); y+=(size||14)*0.9+10; doc.setTextColor(...INK); };
  const body = (t,o)=>{ o=o||{}; doc.setFont("helvetica",o.bold?"bold":"normal"); doc.setFontSize(o.size||11); doc.setTextColor(...(o.color||INK));
    doc.splitTextToSize(String(t||""), maxW-(o.indent||0)).forEach(line=>{ checkBreak(o.lh||15); doc.text(line, margin+(o.indent||0), y); y+=o.lh||15; }); };
  const rule = ()=>{ checkBreak(14); doc.setDrawColor(215,215,210); doc.line(margin,y,pageW-margin,y); y+=16; };
  const pill = (txt, color, xRight, yy, w)=>{ doc.setFont("helvetica","bold"); doc.setFontSize(9.5); const tw = w || doc.getTextWidth(txt)+16;
    doc.setFillColor(...hex(color)); doc.roundedRect(xRight-tw, yy-11, tw, 15, 7.5, 7.5, "F"); doc.setTextColor(255,255,255); doc.text(txt, xRight-tw/2, yy, {align:"center"}); return tw; };

  const datosEstOp = await getDatosEst(ev.expediente_id);
  drawPortadaPdf(doc, {titulo:"Check-up Operativo de la Clínica", subtitulo:"Diagnóstico, riesgos y plan de acción", cliente:ev.expediente_nombre, detalle:`Fecha de visita: ${ev.fecha_visita||"—"}`, detalle2:[datosEstOp.domicilio, datosEstOp.municipio, datosEstOp.estado].filter(Boolean).join(", ")});

  // ---------- Resumen ejecutivo ----------
  doc.setFillColor(...NAVY); doc.rect(0,0,pageW,110,"F");
  try{ doc.addImage(LOGO_MARK_B64, "PNG", pageW-margin-40, 14, 44, 44); }catch(e){}
  doc.setFont("helvetica","bold"); doc.setFontSize(19); doc.setTextColor(255,255,255); doc.text("Resumen ejecutivo", margin, 52);
  doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(220,220,220); doc.text(ev.expediente_nombre||"(sin nombre)", margin, 74);
  doc.setFontSize(10); doc.setTextColor(200,200,200); doc.text("Elaborado por: Saúl Cruz Flores | Elementos Financieros", margin, 92);
  y = 140;
  const card = (x, w, titulo, valor, color, sub)=>{
    doc.setFillColor(245,245,245); doc.roundedRect(x, y, w, 74, 6, 6, "F");
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...SOFT); doc.text(titulo, x+12, y+18);
    doc.setFont("helvetica","bold"); doc.setFontSize(22); doc.setTextColor(...hex(color)); doc.text(valor, x+12, y+46);
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...INK); doc.text(sub, x+12, y+63);
  };
  const cw = (maxW-20)/3;
  card(margin, cw, "MADUREZ ACTUAL", res.global===null?"—":res.global.toFixed(1), OP_COLOR(res.global), res.etiquetaGlobal);
  card(margin+cw+10, cw, "RIESGO GENERAL", res.riesgoGlobal, OP_RIESGO_COLOR[res.riesgoGlobal], `${res.banderas.length} control(es) crítico(s)`);
  card(margin+2*(cw+10), cw, "PROYECCIÓN 90 DÍAS", res.globalProyectado===null?"—":res.globalProyectado.toFixed(1), OP_COLOR(res.globalProyectado), "si se cumple el plan");
  y += 96;
  const peor = res.areas.filter(x=>x.nivel!==null).sort((a,b)=>a.nivel-b.nivel)[0];
  const resumen = `La clínica opera en nivel ${res.etiquetaGlobal.toLowerCase()} (${res.global===null?"—":res.global.toFixed(1)} de 4). ` +
    (res.banderas.length ? `Tiene ${res.banderas.length} control(es) crítico(s) inexistente(s), que son la prioridad de los primeros 30 días. ` : `No tiene controles críticos inexistentes. `) +
    (peor ? `El área más débil es ${peor.area.nombre} (${peor.nivel.toFixed(1)}). ` : "") +
    `El plan propone ${res.plan[30].length} acciones en 30 días, ${res.plan[60].length} en 60 y ${res.plan[90].length} en 90.`;
  body(resumen, {size:11.5, lh:16});
  y += 6;
  body("Este diagnóstico describe qué tan ordenada, medible e independiente del dueño es la operación, con base en lo observado y declarado en la visita. No es una auditoría contable ni fiscal.", {size:9.5, color:SOFT, lh:13});
  const lineasEstOp = datosEstLineas(datosEstOp); if(lineasEstOp.length){ y+=4; lineasEstOp.forEach(l=>body(l, {size:9.5, color:SOFT, lh:13})); }
  y += 8; rule();

  // ---------- Mapa de riesgo ----------
  heading("Madurez y riesgo por área");

  if(v===null||v===undefined||v==="") return null;
  let t = String(v).toLowerCase().replace(/,/g,"").trim();
  const mult = /\bmill(ó|o)n|\bmdp\b/.test(t) ? 1e6 : (/\bmil\b|\bk\b/.test(t) ? 1000 : 1);
  const nums = (t.match(/\d+(\.\d+)?/g)||[]).map(Number);
  if(!nums.length) return null;
  // Un rango ("80000 a 100000", "80-100 mil") se toma como su punto medio
  const n = (nums.length>=2 && /\d\s*(a|-|–|y|al)\s*\$?\d/.test(t)) ? (nums[0]+nums[1])/2 : nums[0];
  const r = n*mult; return isFinite(r) ? r : null;
};
