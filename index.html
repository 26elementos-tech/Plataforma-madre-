  // visita anterior a este mismo expediente): funciona online u offline por igual.
  // Caso raro (primera evaluación COFEPRIS de este expediente Y sin señal en este
  // momento): se necesita conexión una sola vez para crear ese contrato -- se avisa
  // claro en vez de fingir que se resolvió.
  let cofeprisScId = null;
  if(navigator.onLine){
    const { data: sc, error: scErr } = await sb.from("servicios_contratados")
      .select("id, servicio:servicios_catalogo(codigo)").eq("expediente_id", w.expedienteId);
    if(scErr){ showError("Error al leer servicios contratados: " + scErr.message); return; }
    const existing = (sc||[]).find(s => s.servicio?.codigo === "cofepris_checkup");
    if(existing){ cofeprisScId = existing.id; }
    else {
      const { data: servicio, error: e1 } = await sb.from("servicios_catalogo").select("id").eq("codigo","cofepris_checkup").single();
      if(e1){ showError("No se encontró el servicio COFEPRIS en el catálogo: " + e1.message); return; }
      cofeprisScId = newId();
      await persistEntity("servicios_contratados", cofeprisScId, "CREATE",
        { expediente_id: w.expedienteId, servicio_id: servicio.id, nivel: w.nivelCheckup, estatus: "activo" });
    }
    await idbPut(STORE_KV, {key:"cofeprisSc:"+w.expedienteId, value:cofeprisScId}); // persiste entre cierres de app (Test 8)
  } else {
    const cached = await idbGet(STORE_KV, "cofeprisSc:"+w.expedienteId);
    cofeprisScId = cached && cached.value;
    if(!cofeprisScId){
      showError("Necesitas conexión al menos una vez para crear la primera evaluación COFEPRIS de este expediente (falta registrar el servicio contratado). Ya con eso, las siguientes evaluaciones de este mismo expediente sí funcionan sin señal.");
      if(btn){ btn.disabled=false; btn.textContent="Calcular aplicabilidad"; }
      return;
    }
  }

  // 2) Crear la evaluación con ID local -- existe completa en el dispositivo antes de
  // tener respuesta de Supabase.
  const evaluacionId = newId();
  const evaluacion = {
    id: evaluacionId, expediente_id: w.expedienteId, servicio_contratado_id: cofeprisScId,
    tipo_establecimiento: w.tipoEstablecimiento, servicios_prestados: facts.servicios, facts: facts,
    nivel_checkup: w.nivelCheckup, fecha_visita: new Date().toISOString().slice(0,10), evaluador_id: state.profile.id,
    estatus: "en_proceso", area_id: null, // area_id la calcula el trigger server-side al sincronizar
  };
  const evRes = await persistEntity("evaluaciones", evaluacionId, "CREATE", evaluacion);
  if(evRes.error){ showError("No se pudo crear la evaluación: " + evRes.error.message); return; }

  // 3) Congelar el universo aplicable. Si hay señal, se hace ya mismo y se verifica.
  // Si no, se encola como operación dependiente -- se ejecuta en cuanto la evaluación
  // ya exista en Supabase (el mecanismo de reintento por pasadas la espera solo).
  if(navigator.onLine && !evRes.queued){
    const { error: snapErr } = await sb.rpc("crear_snapshot_evaluacion", { p_evaluacion_id: evaluacionId });
    if(snapErr){ showError("La evaluación se creó, pero no se pudo calcular su universo regulatorio: " + snapErr.message); return; }
    const { count: snapCount, error: verifyErr } = await sb.from("evaluacion_criterios_snapshot")
      .select("id", {count:"exact", head:true}).eq("evaluacion_id", evaluacionId);
    if(verifyErr || !snapCount){
      showError("La evaluación se creó, pero el universo regulatorio quedó vacío o no se pudo verificar" + (verifyErr?(": "+verifyErr.message):"") + ". Revisa antes de continuar.");
      return;
    }
  } else {
    await queueOperation("rpc:crear_snapshot_evaluacion", evaluacionId, "CREATE", {p_evaluacion_id: evaluacionId});
  }

  state.wizard = null;
  go("resumen-evaluacion", {currentEvaluacion: evaluacion});
}

/* ------------------------------- Resumen de aplicabilidad (Etapa 2) -------------------------------
   Muestra qué criterios aplican, agrupados por módulo. La captura de respuesta por
   respuesta (contestar cada criterio) es la Etapa 3 -- aquí solo se calcula y se ve. */
async function renderResumenEvaluacion(){
  let ev = state.currentEvaluacion;
  $app.innerHTML = `
    <div class="topbar">
      <div class="topbar-row">
        <button class="back-btn" id="btn-back">←</button>
        <div style="flex:1"><p class="brand">VISITA EN CURSO</p><h1 style="font-size:17px" id="visit-title">${esc(state.currentExpediente?.nombre_expediente||"Evaluación")}</h1></div>
      </div>
      <p class="sub" id="visit-sub">Toca cualquier sección en cualquier orden</p>
    </div>
    <div class="content" id="res-content" style="padding-bottom:96px"><div class="center-screen"><div class="spinner"></div></div></div>
  `;
  document.getElementById("btn-back").onclick = () => go("expediente", {currentExpediente:{id: ev.expediente_id || state.currentExpediente?.id}});

  // Si venimos de la lista (solo trae {id}), recargar la evaluación completa
  if(!ev.facts){
    const { data, error } = await cachedRead("ev:"+ev.id+":row", ()=>sb.from("evaluaciones").select("*").eq("id", ev.id).single());
    if(error){ document.getElementById("res-content").innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
    ev = data; state.currentEvaluacion = data;
  }
  document.getElementById("btn-back").onclick = () => go("expediente", {currentExpediente:{id: ev.expediente_id}});

  // Fuente única del universo: evaluacion_criterios_snapshot -- congelado al crear
  // la evaluación. NUNCA se recalcula contra criterios_regulatorios en vivo aquí.
  const [snapRes, respRes] = await Promise.all([
    cachedRead("ev:"+ev.id+":snapshot", ()=>sb.from("evaluacion_criterios_snapshot").select("*").eq("evaluacion_id", ev.id)),
    cachedRead("ev:"+ev.id+":respuestas", ()=>sb.from("respuestas_criterio").select("*").eq("evaluacion_id", ev.id)),
  ]);
  const dep = detectDependencia((snapRes.data||[]).map(r=>r.criterio_id));
  const esSTPS = dep.codigo==="stps"; // conservado: algunas pantallas más abajo todavía lo usan para el inventario de nivel
  const brandEl = document.querySelector(".topbar .brand");
  if(brandEl) brandEl.textContent = "VISITA EN CURSO · " + dep.label;
  state.currentDep = dep.codigo;
  getExpedienteRow(ev.expediente_id).then(row=>{ const t=document.getElementById("visit-title"); if(row && t) t.textContent = row.nombre_expediente; }).catch(()=>{});
  const subEl = document.getElementById("visit-sub"); if(subEl) subEl.textContent = `Nivel ${ev.nivel_checkup} · Toca cualquier sección en cualquier orden`;
  const c = document.getElementById("res-content");
  if(snapRes.error){ c.innerHTML = `<div class="err">${esc(snapRes.error.message)}</div>`; return; }
  const fromCacheRes = snapRes.fromCache || respRes.fromCache;
  const respuestas = {};
  (respRes.data||[]).forEach(r => { respuestas[r.criterio_id] = r; });

  const activos = (snapRes.data||[]).map(snapshotRowToCriterio);
  const grouped = {};
  activos.forEach(cr => { (grouped[cr.modulo] = grouped[cr.modulo]||[]).push(cr); });
  const contestados = activos.filter(cr => respuestas[cr.id] && respuestas[cr.id].estatus).length;

  // Publicidad (capturas) solo aplica si de verdad hay publicidad marcada en el wizard --
  // igual que el criterio regulatorio correspondiente, no le mostramos esto a quien no
  // tiene redes ni sitio.
  const hayPublicidad = (ev.facts?.publicidad || []).length > 0;
  const seccionesPorNivel = INVENTORY_SECTIONS.filter(sec => sec.depth.includes(ev.nivel_checkup) && sec.areas.includes(dep.codigo));
  const seccionesVisibles = seccionesPorNivel.filter(sec => !["publicidad_captura","redes_perfil"].includes(sec.codigo) || hayPublicidad);
  const seccionesOmitidasPorNivel = INVENTORY_SECTIONS.filter(sec => !sec.depth.includes(ev.nivel_checkup));
  const pctCriterios = activos.length ? Math.round(100*contestados/activos.length) : 0;

  c.innerHTML = `
    ${fromCacheRes ? `<div class="empty-note" style="margin-bottom:14px">📴 Trabajando sin conexión con la última copia guardada de esta evaluación.</div>` : ""}
    <div class="card">
      <div class="summary-row"><span class="k">Nivel</span><span class="v">${esc(ev.nivel_checkup)}</span></div>
      <div class="fc2-progress-row" style="margin-top:6px"><div class="fc2-progress-track"><div class="fc2-progress-fill" style="width:${pctCriterios}%" id="crit-progress-fill"></div></div><span class="muted small" id="contestados-count">${contestados} de ${activos.length}</span></div>
      <p class="muted small" style="margin:4px 0 0">${activos.length} criterios aplicables${dep.codigo!=="cofepris"?" para este centro de trabajo":" para este tipo de establecimiento"}</p>
    </div>
    <div class="card" style="padding:4px 16px" id="visit-hub"></div>
    <div class="hallazgos-box" id="hallazgos-anchor">
      <div class="section-title" style="margin-bottom:2px">🚩 Hallazgos de visita</div>
      <p class="muted small">Lo que ves en sitio y está mal. Usa la bandera 🚩 en cualquier momento, o "Marcar como hallazgo" dentro de cada registro del inventario.</p>
      <div id="hallazgos-libres-list"></div>
      <button class="btn btn-ghost" id="btn-add-hallazgo-libre" style="margin-top:10px">+ Agregar hallazgo</button>
    </div>
    <div id="crit-groups"></div>
  `;
  const scrollToCriterios = () => document.getElementById("crit-groups")?.scrollIntoView({behavior:"smooth", block:"start"});
  const nuevoHallazgo = async () => {
    const res = await openHallazgoLibreForm(null);
    if(res && res.action==="save"){
      await persistEntity("hallazgos", newId(), "CREATE", {...res.campos, evaluacion_id: ev.id, origen:"libre", clasificacion_id: await getClasifSinClasificar(), created_by: state.profile.id});
      renderResumenEvaluacion();
    }
  };
  document.getElementById("btn-add-hallazgo-libre").onclick = nuevoHallazgo;
  document.querySelectorAll(".fab-flag").forEach(x=>x.remove());
  const fab = document.createElement("button");
  fab.className = "fab-flag"; fab.title = "Nuevo hallazgo"; fab.textContent = "🚩";
  fab.onclick = nuevoHallazgo;
  document.body.appendChild(fab);
  renderHallazgosLibresList(ev.id);

  const hub = document.getElementById("visit-hub");
  const [collCounts, singleFlags, libresRes] = await Promise.all([
    cachedRead("ev:"+ev.id+":coll_counts", ()=>sb.from("colecciones_items").select("tipo_id").eq("evaluacion_id", ev.id)),
    cachedRead("ev:"+ev.id+":single_flags", ()=>sb.from("registros_unicos").select("tipo_id").eq("evaluacion_id", ev.id)),
    cachedRead("ev:"+ev.id+":hallazgos_libres", ()=>sb.from("hallazgos").select("id").eq("evaluacion_id", ev.id).eq("origen","libre")),
  ]);
  const ids = await ensureTipoIds();
  const collByTipo = {};
  (collCounts.data||[]).forEach(r=>{ collByTipo[r.tipo_id] = (collByTipo[r.tipo_id]||0)+1; });
  const singleSet = new Set((singleFlags.data||[]).map(r=>r.tipo_id));
  const hubRow = (icon, label, sub, onclick, attention) => {
    const row = document.createElement("div");
    row.className = "hub-card" + (attention ? " hub-attn" : "");
    row.innerHTML = `<div style="display:flex;align-items:center;gap:14px;min-width:0"><span style="font-size:24px;width:30px;text-align:center">${icon}</span><div style="min-width:0"><div class="hc-name">${esc(label)}</div><div class="hc-sub">${esc(sub)}</div></div></div><div class="hc-arrow">→</div>`;
    row.onclick = onclick;
    hub.appendChild(row);
  };
  hubRow("⚖️", "Evaluación regulatoria", `${contestados}/${activos.length} criterios registrados`, scrollToCriterios);
  seccionesVisibles.forEach(sec=>{
    if(sec.kind==="collection"){
      const schema = COLLECTION_SCHEMAS[sec.codigo]; const n = collByTipo[ids["c:"+sec.codigo]] || 0;
      hubRow(schema.icon, schema.label, `${n} registrado${n===1?"":"s"}`, () => openColeccionList(ev.id, sec.codigo));
    } else {
      const schema = SINGLE_SCHEMAS[sec.codigo]; const has = singleSet.has(ids["r:"+sec.codigo]);
      hubRow(schema.icon, schema.label, has?"Registrado":"Sin registrar", () => openRegistroUnico(ev.id, sec.codigo));
    }
  });
  const nRegHall = activos.filter(cr => respuestas[cr.id] && ["no_cumple","parcial","pendiente","no_verificado"].includes(respuestas[cr.id].estatus)).length;
  const nHall = nRegHall + (libresRes.data||[]).length;
  hubRow("🚩", "Hallazgos", `${nHall} hallazgo${nHall===1?"":"s"}`, () => document.getElementById("hallazgos-anchor")?.scrollIntoView({behavior:"smooth", block:"start"}), nHall>0);
  hubRow("🧾", "Diagnóstico / PDF", contestados ? "Ver diagnóstico y generar PDF" : "Generar cuando termines el levantamiento", () => go("diagnostico-evaluacion", {currentEvaluacion: ev}));
  const groupsEl = document.getElementById("crit-groups");
  if(activos.length===0){
    groupsEl.innerHTML = `<div class="empty-note">Ningún criterio de los 6 módulos validados aplica con estos datos.</div>`;
  }
  const STATUS_OPTS = [
    ["cumple","Cumple"], ["parcial","Parcial"], ["no_cumple","No cumple"],
    ["no_aplica","No aplica"], ["pendiente","Pendiente evidencia"], ["no_verificado","No se pudo verificar"],
  ];
  Object.keys(grouped).forEach(modulo=>{
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="section-title">${esc(modulo)} (${grouped[modulo].length})</div>`;
    grouped[modulo].forEach(cr=>{
      const tag = cr.runtimeUncertain ? APPL_TAG.revision : (APPL_TAG[cr.aplicabilidad]||APPL_TAG.revision);
      const resp = respuestas[cr.id] || {estatus:null, nota:""};
      const div = document.createElement("div");
      div.className = "crit-card";
      div.innerHTML = `
        <div class="crit-top">
          <div class="crit-req">${esc(cr.requisito)}</div>
          <div class="crit-tag ${tag.cls}">${tag.label}</div>
        </div>
        <div class="crit-meta"><b>Fundamento:</b> ${esc(cr.fundamento_legal||"—")}</div>
        ${cr.runtimeUncertain ? `<div class="crit-meta" style="color:#2F6FA8">Aplicabilidad no determinada — confirma en sitio.</div>` : ""}
        <div class="status-grid">
          ${STATUS_OPTS.map(([v,l])=>`<div class="status-opt ${resp.estatus===v?'sel-'+v:''}" data-crit="${cr.id}" data-v="${v}">${l}</div>`).join("")}
        </div>
        <textarea class="crit-note" placeholder="Nota del evaluador (opcional)" data-crit-note="${cr.id}">${esc(resp.nota||"")}</textarea>
        <div class="save-tick" id="tick-${cr.id}"></div>
        <div class="evid-row" id="evid-${cr.id}"></div>
      `;
      card.appendChild(div);
    });
    groupsEl.appendChild(card);
  });

  // Evidencia por criterio: si ya existe respuesta se usa su id directo; si no,
  // el widget la crea (sin estatus) en cuanto se sube la primera foto.
  activos.forEach(cr=>{
    const container = document.getElementById("evid-"+cr.id);
    if(!container) return;
    const respId = respuestas[cr.id] && respuestas[cr.id].id;
    if(respId){
      renderEvidenceRow(container, ev.id, "respuesta_criterio_id", respId);
    } else {
      container.innerHTML = `<label class="evid-add">＋<input type="file" accept="image/*" capture="environment" style="display:none"></label>`;
      container.querySelector("input").addEventListener("change", async (e)=>{
        const file = e.target.files[0]; if(!file) return;
        try{
          const newId = await ensureRespuestaId(ev.id, cr.id);
          respuestas[cr.id] = respuestas[cr.id] || {}; respuestas[cr.id].id = newId;
          await uploadEvidencia(ev.id, "respuesta_criterio_id", newId, file);
          await renderEvidenceRow(container, ev.id, "respuesta_criterio_id", newId);
        }catch(err){ showError("No se pudo subir la foto: " + (err&&err.message?err.message:err)); }
      });
    }
  });

  // Wiring: cada click/blur guarda directo en Supabase (upsert por evaluacion_id+criterio_id,
  // que ya tiene UNIQUE en el esquema) -- sin botón de "guardar" aparte, como en V3.
  const contestadosSet = new Set(Object.keys(respuestas).filter(k=>respuestas[k].estatus));
  function refreshContestadosCount(){
    const el = document.getElementById("contestados-count");
    if(el) el.textContent = `${contestadosSet.size} de ${activos.length}`;
  }
  groupsEl.querySelectorAll(".status-opt").forEach(opt=>{
    opt.onclick = async () => {
      const critId = opt.dataset.crit, v = opt.dataset.v;
      opt.closest(".status-grid").querySelectorAll(".status-opt").forEach(o=>o.className = o.className.replace(/\bsel-\w+\b/g,""));
      opt.classList.add("sel-"+v);
      contestadosSet.add(critId);
      refreshContestadosCount();
      await guardarRespuesta(ev.id, critId, {estatus:v});
    };
  });
  groupsEl.querySelectorAll("[data-crit-note]").forEach(ta=>{
    ta.addEventListener("blur", async ()=>{
      await guardarRespuesta(ev.id, ta.dataset.critNote, {nota: ta.value});
    });
  });
}

async function guardarRespuesta(evaluacionId, criterioId, campos){
  const tick = document.getElementById("tick-"+criterioId);
  const res = await persist("respuestas_criterio", "upsert",
    { evaluacion_id: evaluacionId, criterio_id: criterioId, ...campos }, null, null, "evaluacion_id,criterio_id");
  if(tick){
    tick.textContent = res.queued ? "Guardado localmente (sin señal)" : (res.error ? ("No se pudo guardar: "+res.error.message) : "Guardado");
    tick.style.color = res.queued ? "#8A5A1E" : (res.error ? "var(--bad)" : "var(--ok)");
    if(res.ok && !res.queued) setTimeout(()=>{ if(tick.textContent==="Guardado") tick.textContent=""; }, 1500);
  }
}

/* ------------------------------- Diagnóstico visual (Etapa 5) ------------------------------- */
async function renderDiagnosticoEvaluacion(){
  const ev = state.currentEvaluacion;
  const mode = state.diagMode || "cliente";
  $app.innerHTML = `
    <div class="topbar">
      <div class="topbar-row">
        <button class="back-btn" id="btn-back">←</button>
        <div style="flex:1"><p class="brand">DIAGNÓSTICO</p><h1 style="font-size:17px">Check-up COFEPRIS</h1></div>
      </div>
    </div>
    <div class="content" id="diag-content"><div class="center-screen"><div class="spinner"></div></div></div>
  `;
  document.getElementById("btn-back").onclick = () => go("resumen-evaluacion", {currentEvaluacion: ev});

  // Universo congelado en la evaluación: se lee del snapshot, nunca se recalcula.
  const [snapRes, respRes, expRes, manualRes] = await Promise.all([
    cachedRead("ev:"+ev.id+":snapshot", ()=>sb.from("evaluacion_criterios_snapshot").select("*").eq("evaluacion_id", ev.id)),
    cachedRead("ev:"+ev.id+":respuestas", ()=>sb.from("respuestas_criterio").select("*").eq("evaluacion_id", ev.id)),
    cachedRead("exp:"+ev.expediente_id+":nombre", ()=>sb.from("expedientes").select("nombre_expediente").eq("id", ev.expediente_id).single()),
    cachedRead("ev:"+ev.id+":hallazgos_todos", ()=>sb.from("hallazgos").select("*").eq("evaluacion_id", ev.id)),
  ]);
  const c = document.getElementById("diag-content");
  if(snapRes.error){ c.innerHTML = `<div class="err">${esc(snapRes.error.message)}</div>`; return; }
  const diagFromCache = snapRes.fromCache || respRes.fromCache || manualRes.fromCache;
  const respuestas = {}; (respRes.data||[]).forEach(r=>respuestas[r.criterio_id]=r);
  const activos = (snapRes.data||[]).map(snapshotRowToCriterio);
  const hallazgosByCriterio = {};
  const manualHallazgos = [];
  (manualRes.data||[]).forEach(h=>{ if(h.origen==="libre") manualHallazgos.push(h); else if(h.criterio_id) hallazgosByCriterio[h.criterio_id]=h; });
  const diag = computeDiagnostico(activos, respuestas, manualHallazgos);
  const h1El = document.querySelector(".topbar h1");
  const depDiag = detectDependencia(diag.findings.map(f=>f.criterio?.id||""));
  if(h1El && depDiag.codigo!=="cofepris") h1El.textContent = depDiag.screenTitle;

  // Evidencia fotográfica por hallazgo: se anexa aquí para que el diagnóstico (pantalla
  // y PDF) muestre y explique con la foto real, no solo con el fundamento y la nota.
  // Regulatorios cuelgan de respuesta_criterio_id; libres cuelgan de hallazgo_id directo.
  const respIds = diag.findings.filter(f=>f.origen==="regulatorio").map(f=>respuestas[f.criterio.id] && respuestas[f.criterio.id].id).filter(Boolean);
  const libreIds = diag.findings.filter(f=>f.origen==="libre").map(f=>f.hallazgo.id);
  const [evidResp, evidLibre] = await Promise.all([
    respIds.length ? sb.from("evidencias").select("respuesta_criterio_id,storage_path_optimizada,storage_path_thumbnail").in("respuesta_criterio_id", respIds).is("anulado_at", null) : {data:[]},
    libreIds.length ? sb.from("evidencias").select("hallazgo_id,storage_path_optimizada,storage_path_thumbnail").in("hallazgo_id", libreIds).is("anulado_at", null) : {data:[]},
  ]);
  const byResp = {}; (evidResp.data||[]).forEach(e=>{ (byResp[e.respuesta_criterio_id]=byResp[e.respuesta_criterio_id]||[]).push(e); });
  const byHallazgo = {}; (evidLibre.data||[]).forEach(e=>{ (byHallazgo[e.hallazgo_id]=byHallazgo[e.hallazgo_id]||[]).push(e); });
  diag.findings.forEach(f=>{
    if(f.origen==="libre"){ f.evidencias = byHallazgo[f.hallazgo.id] || []; }
    else { const rId = respuestas[f.criterio.id] && respuestas[f.criterio.id].id; f.evidencias = (rId && byResp[rId]) || []; }
  });

  // Persistir/actualizar la fila real de hallazgo por cada finding regulatorio
  // (idempotente). Los libres YA SON su propia fila real -- no se tocan aquí.
  // Si algo falla aquí, se muestra en pantalla en vez de dejar el círculo de carga
  // trabado para siempre sin ninguna pista de qué pasó.
  try{
    for(const f of diag.findings){
      if(f.origen==="libre"){ f.hallazgo = f.hallazgo; continue; }
      f.hallazgo = await ensureHallazgoRow(ev.id, f, hallazgosByCriterio);
    }
  }catch(hzErr){
    c.innerHTML = `<div class="err">No se pudo preparar el diagnóstico: ${esc(hzErr.message||String(hzErr))}</div>`;
    return;
  }

  state._diagCache = {ev, diag, nombreExpediente: expRes.data?.nombre_expediente||""};

  const gaugeSvg = drawGaugeSvg(diag.percent, diag.band.color, 96);

  c.innerHTML = `
    ${diagFromCache ? `<div class="empty-note" style="margin-bottom:14px">📴 Trabajando sin conexión con la última copia guardada.</div>` : ""}
    <div class="mode-toggle">
      <div class="chip ${mode==='cliente'?'selected':''}" id="mode-cliente">Reporte para cliente</div>
      <div class="chip ${mode==='interno'?'selected':''}" id="mode-interno">Registro interno</div>
    </div>
    <div class="card">
      <div class="gauge-wrap">
        ${gaugeSvg}
        <div>
          <div style="font-weight:700;color:var(--navy-900);font-size:17px">Riesgo ${esc(diag.band.label)}</div>
          <div class="muted small">Índice de Riesgo Regulatorio · ${diag.contestados} criterio(s) evaluado(s)</div>
        </div>
      </div>
      <p class="muted small" style="margin-top:10px;line-height:1.4">Este índice prioriza atención y urgencia con base en lo observado durante la visita. No determina cumplimiento legal ni autorización sanitaria.</p>
    </div>
    ${diag.areaRows.length ? `<div class="card"><div class="section-title">Riesgo por área</div>${diag.areaRows.map(a=>`
      <div class="area-bar-row">
        <div class="abr-top"><span>${esc(a.modulo)}</span><span style="font-weight:600">${a.percent}%</span></div>
        <div class="area-bar-track"><div class="area-bar-fill" style="width:${a.percent}%;background:${a.color}"></div></div>
      </div>`).join("")}</div>` : ""}
    <div class="card">
      <div class="section-title">Puntos por corregir ${diag.findings.length ? `(${diag.findings.length})` : ""}</div>
      ${diag.findings.length===0 ? `<p class="muted small">No se identificaron hallazgos con lo contestado hasta ahora.</p>` : (()=>{
        const doneCount = diag.findings.filter(f=>f.hallazgo && ["corregido","verificado"].includes(f.hallazgo.estatus_accion)).length;
        const pct = Math.round(100*doneCount/diag.findings.length);
        return `<div class="fc2-progress-row"><div class="fc2-progress-track"><div class="fc2-progress-fill" style="width:${pct}%"></div></div><span class="muted small">${doneCount} de ${diag.findings.length} corregidos</span></div>
        <p class="muted small" style="margin-bottom:4px">Ve punto por punto — cada tarjeta ya trae qué hacer, quién y para cuándo.</p>`;
      })()}
      <div id="findings-list"></div>
    </div>
    <button class="btn btn-primary" id="btn-pdf" style="margin-bottom:10px">Generar PDF</button>
    ${ev.nivel_checkup==="completo" ? `<button class="btn btn-ghost" id="btn-proto-mkt" style="margin-bottom:10px;border-width:2px;border-color:var(--gold-500)">📱 Protocolo de redes para marketing (PDF)</button>` : ""}
    ${ev.estatus!=="completado" ? `<button class="btn btn-ghost" id="btn-cerrar-eval" style="margin-bottom:20px">Cerrar evaluación</button>`
      : `<div class="empty-note" style="margin-bottom:20px">✅ Evaluación cerrada</div>`}
  `;
  const btnCerrar = document.getElementById("btn-cerrar-eval");
  if(btnCerrar) btnCerrar.onclick = async () => {
    btnCerrar.disabled = true; btnCerrar.textContent = "Cerrando...";
    const res = await persistEntity("evaluaciones", ev.id, "UPDATE", {estatus:"completado"});
    ev.estatus = "completado"; state.currentEvaluacion = ev;
    if(res.queued){ showError("Se cerrará en cuanto vuelva la conexión — ya quedó guardado en tu dispositivo."); }
    renderDiagnosticoEvaluacion();
  };
  document.getElementById("mode-cliente").onclick = () => { state.diagMode="cliente"; renderDiagnosticoEvaluacion(); };
  document.getElementById("mode-interno").onclick = () => { state.diagMode="interno"; renderDiagnosticoEvaluacion(); };

  const fList = document.getElementById("findings-list");
  diag.findings.forEach((f,idx)=>{
    const estatusActual = (f.hallazgo && f.hallazgo.estatus_accion) || "pendiente";
    const done = ["corregido","verificado"].includes(estatusActual);
    const color = PRIORITY_COLOR[f.risk.prioridad] || PRIORITY_COLOR.MEDIA;
    const div = document.createElement("div");
    div.className = "fc2" + (done?" done":"");
    div.style.borderLeftColor = color;
    div.innerHTML = `
      <div class="fc2-top">
        <div class="fc2-badge" style="background:${done?'var(--ok)':color}">${done?"✓":idx+1}</div>
        <div class="fc2-body">
          <span class="fc2-tag ${PRIORITY_CLS[f.risk.prioridad]}">${PRIORITY_LABEL[f.risk.prioridad]} · ${esc(f.criterio.modulo)}</span>
          <p class="fc2-title ${done?'done':''}">${esc(f.criterio.requisito)}</p>
          <div class="fc2-meta">${f.origen==="libre"?"Hallazgo de visita":"Estatus: "+STATUS_TEXT[f.estatus]}${f.nota?" — "+esc(f.nota):""}</div>
          ${mode==="interno" ? `<div class="fc2-meta"><b>Fundamento:</b> ${esc(f.criterio.fundamento_legal||"—")}</div>` : ""}
          <div class="fc2-action-row">
            <div class="fc2-photos" id="evid-find-${f.criterio.id}"></div>
            <div class="fc2-action-box">
              <div class="fc2-action-label">Qué hacer</div>
              <textarea class="fc2-action-input" data-hz-accion="${f.criterio.id}" rows="2">${esc((f.hallazgo&&f.hallazgo.accion)||sugerirAccion(f.criterio))}</textarea>
            </div>
          </div>
          <div class="fc2-pills">
            <label class="fc2-pill">👤<input type="text" data-hz-resp="${f.criterio.id}" value="${esc((f.hallazgo&&f.hallazgo.responsable)||"")}" placeholder="Responsable"></label>
            <label class="fc2-pill">📅<input type="date" data-hz-fecha="${f.criterio.id}" value="${esc((f.hallazgo&&f.hallazgo.fecha_objetivo)||"")}"></label>
            <label class="fc2-pill ${done?'fc2-pill-done':''}">✅<select data-hz-estatus="${f.criterio.id}">
              ${["pendiente","en_proceso","corregido","verificado"].map(s=>`<option value="${s}" ${estatusActual===s?"selected":""}>${s.replace("_"," ")}</option>`).join("")}
            </select></label>
          </div>
          <div class="save-tick" id="tick-hz-${f.criterio.id}"></div>
        </div>
      </div>
    `;
    fList.appendChild(div);
    const photoCont = div.querySelector(`#evid-find-${f.criterio.id}`);
    if(f.evidencias.length){
      f.evidencias.slice(0,4).forEach(async e=>{
        const path = e.storage_path_thumbnail || e.storage_path_optimizada;
        const { data: signed } = await sb.storage.from("evidencias").createSignedUrl(path, 3600);
        if(signed){ const img=document.createElement("img"); img.src=signed.signedUrl; photoCont.appendChild(img); }
      });
    } else {
      photoCont.innerHTML = `<div class="fc2-photo-empty">Sin foto</div>`;
    }
  });

  // Guardado de plan de acción: cada campo escribe directo en la fila real de
  // `hallazgos` (por eso f.hallazgo.id ya existe -- se creó arriba con ensureHallazgoRow).
  async function guardarHallazgoCampo(criterioId, campos){
    const f = diag.findings.find(x=>x.criterio.id===criterioId);
    if(!f || !f.hallazgo) return;
    const tick = document.getElementById("tick-hz-"+criterioId);
    const res = await persistEntity("hallazgos", f.hallazgo.id, "UPDATE", campos);
    Object.assign(f.hallazgo, campos);
    if(tick){
      tick.textContent = res.queued ? "Guardado localmente (sin señal)" : (res.error ? "No se pudo guardar" : "Guardado");
      tick.style.color = res.queued ? "#8A5A1E" : (res.error?"var(--bad)":"var(--ok)");
      if(res.ok && !res.queued) setTimeout(()=>{ if(tick.textContent==="Guardado") tick.textContent=""; }, 1500);
    }
  }
  fList.querySelectorAll("[data-hz-accion]").forEach(ta=>ta.addEventListener("blur", ()=>guardarHallazgoCampo(ta.dataset.hzAccion, {accion: ta.value})));
  fList.querySelectorAll("[data-hz-resp]").forEach(inp=>inp.addEventListener("blur", ()=>guardarHallazgoCampo(inp.dataset.hzResp, {responsable: inp.value})));
  fList.querySelectorAll("[data-hz-fecha]").forEach(inp=>inp.addEventListener("change", ()=>guardarHallazgoCampo(inp.dataset.hzFecha, {fecha_objetivo: inp.value||null})));
  fList.querySelectorAll("[data-hz-estatus]").forEach(sel=>sel.addEventListener("change", async ()=>{
    await guardarHallazgoCampo(sel.dataset.hzEstatus, {estatus_accion: sel.value});
    renderDiagnosticoEvaluacion(); // refleja de inmediato el tachado/check y la barra de progreso
  }));

  const bProto = document.getElementById("btn-proto-mkt");
  if(bProto) bProto.onclick = async (e)=>{
    const btn = e.target; btn.disabled=true; const t=btn.textContent; btn.textContent="Generando...";
    try{ await generarProtocoloMkt(ev); }catch(err){ showError("No se pudo generar el protocolo: " + (err&&err.message?err.message:err)); }
    btn.disabled=false; btn.textContent=t;
  };
  document.getElementById("btn-pdf").onclick = async (e)=>{
    const btn = e.target; btn.disabled=true; btn.textContent="Generando...";
    try{ await generarPdfDiagnostico(state._diagCache, mode); }
    catch(err){ showError("No se pudo generar el PDF: " + (err&&err.message?err.message:err)); }
    btn.disabled=false; btn.textContent="Generar PDF";
  };
}


/* ------------------------- Protocolo de publicación en redes (solo check-up completo) -------------------------
   Documento para el equipo de marketing, personalizado con los datos del médico y de la clínica y con
   lo encontrado en la revisión de redes. Es una guía preventiva basada en la Ley General de Salud y su
   Reglamento en Materia de Publicidad; no sustituye asesoría legal. */
const PROTO_FRASES = [
  ["Resultados garantizados", "Los resultados varían en cada paciente"],
  ["Rejuvenece 10 años / te quita la edad", "Ayuda a mejorar la apariencia de líneas de expresión"],
  ["Permanente / para siempre", "Duración aproximada según cada paciente; te lo explicamos en tu valoración"],
  ["Sin dolor / sin riesgos / 100% seguro", "Procedimiento mínimamente invasivo; conoce sus riesgos en tu valoración médica"],
  ["Cura el acné / elimina la celulitis / trata la flacidez", "Mejora la apariencia de la piel"],
  ["Previene el envejecimiento", "Cuida la apariencia de tu piel"],
  ["El mejor / el único / el #1", "Atención por médico con cédula profesional"],
  ["Botox 2x1 / Ácido hialurónico en oferta", "Tratamiento para líneas de expresión / Tratamiento de relleno, previa valoración médica"],
  ["Resultados inmediatos", "Algunos cambios se aprecian desde la primera sesión; varía en cada paciente"],
];
async function generarProtocoloMkt(ev){
  if(!window.jspdf){ showError("El generador de PDF no cargó (requiere conexión a internet la primera vez)."); return; }
  const {jsPDF} = window.jspdf;
  const datosEst = await getDatosEst(ev.expediente_id);
  const tipoIds = await ensureTipoIds();
  let perfil = {}, pubs = [];
  try{
    const r1 = await cachedRead("ev:"+ev.id+":reg:redes_perfil", ()=>sb.from("registros_unicos").select("*").eq("evaluacion_id", ev.id).eq("tipo_id", tipoIds["r:redes_perfil"]).maybeSingle());
    perfil = (r1.data && r1.data.campos) || {};
    const r2 = await cachedRead("ev:"+ev.id+":coll:publicidad_captura", ()=>sb.from("colecciones_items").select("*").eq("evaluacion_id", ev.id).eq("tipo_id", tipoIds["c:publicidad_captura"]).order("created_at"));
    pubs = r2.data || [];
  }catch(e){}
  const fallas = [];
  REDES_FALLAS.forEach(f=>{
    const n = (f.bad.includes(perfil[f.k]) ? 1 : 0) + pubs.filter(p=>f.bad.includes((p.campos||{})[f.k])).length;
    if(n) fallas.push({...f, n});
  });
  const clinica = datosEst.nombreComercial || "la clínica";
  const medico = perfil.medicoNombre || datosEst.responsableSanitario || "[Nombre del médico]";
  const inst = perfil.medicoInstitucion || "[Institución que expidió el título]";
  const ced = perfil.medicoCedula || datosEst.cedulaProfesional || "[Cédula profesional]";
  const esp = perfil.medicoEspecialidad ? `${perfil.medicoEspecialidad}${perfil.medicoCedulaEsp ? " · Céd. Esp. " + perfil.medicoCedulaEsp : ""}` : "";
  const pie = `${medico} · ${inst} · Céd. Prof. ${ced}${esp ? " · " + esp : ""}`;

  const doc = new jsPDF({unit:"pt", format:"letter"});
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
  const margin = 48, maxW = pageW - margin*2;
  let y = margin;
  const NAVY=[15,42,67], INK=[15,24,34], SOFT=[58,70,84], RED=[179,38,30], GREEN=[46,125,79];
  const checkBreak = need=>{ if(y+need > pageH-margin){ doc.addPage(); y=margin; } };
  const heading = (t)=>{ checkBreak(48); y+=6; doc.setFillColor(...NAVY); doc.roundedRect(margin, y-14, maxW, 24, 5, 5, "F"); doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(255,255,255); doc.text(t, margin+12, y+2); y+=24; doc.setTextColor(...INK); };
  const body = (t,o)=>{ o=o||{}; doc.setFont("helvetica",o.bold?"bold":"normal"); doc.setFontSize(o.size||11); doc.setTextColor(...(o.color||INK));
    doc.splitTextToSize(String(t||""), maxW-(o.indent||0)).forEach(line=>{ checkBreak(o.lh||15); doc.text(line, margin+(o.indent||0), y); y+=o.lh||15; }); };
  const bullet = (t, color)=>{ const lines = doc.setFont("helvetica","normal").setFontSize(10.5).splitTextToSize(t, maxW-18); checkBreak(lines.length*14+4);
    doc.setFillColor(...(color||NAVY)); doc.circle(margin+5, y-3.5, 2.3, "F"); doc.setTextColor(...INK); lines.forEach(l=>{ doc.text(l, margin+16, y); y+=14; }); y+=3; };

  drawPortadaPdf(doc, {titulo:"Protocolo de publicación en redes sociales", subtitulo:"Guía para el equipo de marketing", cliente:clinica,
    detalle:`Derivado del Check-up Regulatorio del ${ev.fecha_visita||"—"}`, detalle2:[datosEst.municipio, datosEst.estado].filter(Boolean).join(", ")});

  doc.setFillColor(...NAVY); doc.rect(0,0,pageW,110,"F");
  try{ doc.addImage(LOGO_MARK_B64, "PNG", pageW-margin-40, 14, 44, 44); }catch(e){}
  doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.setTextColor(255,255,255); doc.text("Protocolo de publicación en redes", margin, 52);
  doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(230,230,225); doc.text(clinica, margin, 74);
  doc.setFontSize(10); doc.setTextColor(216,193,150); doc.text("Elaborado por: Saúl Flores | Elementos Financieros", margin, 92);
  y = 140;
  body(`Este protocolo indica cómo publicar los servicios de ${clinica} en redes sociales cuidando la regulación sanitaria. Aplica a todo el contenido que promueva un tratamiento, servicio, precio, promoción o resultado, sin importar quién lo publique: la clínica, una agencia o una influencer.`, {size:11, lh:16});

  heading("1. Pie obligatorio en cada publicación promocional");
  body("Copiar y pegar al final del texto o dentro de la imagen de cada publicación que promueva un servicio, y también en la biografía:", {size:10.5});
  y+=4; checkBreak(48);
  const pl = doc.setFont("helvetica","bold").setFontSize(11).splitTextToSize(pie, maxW-24);
  doc.setFillColor(241,231,210); doc.roundedRect(margin, y-12, maxW, pl.length*15+16, 5, 5, "F");
  doc.setTextColor(...NAVY); pl.forEach(l=>{ doc.text(l, margin+12, y+2); y+=15; }); y+=14;
  if(pie.includes("[")) body("Completar los datos entre corchetes con la información del médico antes de usar el pie.", {size:9.5, color:RED});
  body("Fundamento: Reglamento de la Ley General de Salud en Materia de Publicidad, art. 19.", {size:9, color:SOFT});

  heading("2. Permiso o aviso de publicidad");
  const permiso = perfil.chk_permiso || "No verificado";
  body(`Estatus encontrado en la visita: ${permiso}${perfil.permisoNumero ? " · No. " + perfil.permisoNumero : ""}.`, {bold:true, size:10.5});
  bullet("La publicidad de la clínica y de sus tratamientos estéticos requiere permiso de COFEPRIS; el médico que se anuncia de forma individual presenta aviso.");
  bullet("Mientras no se cuente con el permiso o aviso, no pautar (pagar anuncios de) tratamientos ni contratar influencers para promoverlos.");
  bullet("Guardar copia del permiso o aviso y de cada publicación difundida por si la autoridad los solicita.");

  heading("3. Cómo hablar de los tratamientos: evitar y usar en su lugar");
  body("Los servicios estéticos solo pueden anunciar resultados reales y comprobables, y nunca atribuirse propiedades para curar, prevenir o tratar (arts. 63 y 64). Ejemplos:", {size:10.5});
  y+=4;
  const colW = (maxW-12)/2;
  checkBreak(24);
  doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...RED); doc.text("EVITAR", margin, y); doc.setTextColor(...GREEN); doc.text("USAR EN SU LUGAR", margin+colW+12, y); y+=8;
  PROTO_FRASES.forEach(([no, si])=>{
    const a = doc.setFont("helvetica","normal").setFontSize(10).splitTextToSize(no, colW), b = doc.splitTextToSize(si, colW);
    const h = Math.max(a.length, b.length)*13 + 10;
    checkBreak(h+2);
    doc.setDrawColor(230,230,226); doc.line(margin, y, pageW-margin, y); y+=13;
    doc.setTextColor(...RED); a.forEach((l,i)=>doc.text(l, margin, y+i*13));
    doc.setTextColor(...INK); b.forEach((l,i)=>doc.text(l, margin+colW+12, y+i*13));
    y += h-13;
  });
  y+=6;
  body("Los textos sugeridos son ejemplos de redacción prudente; cada afirmación debe poder respaldarse.", {size:9, color:SOFT});

  heading("4. Leyenda de riesgos");
  body("Incluir en las publicaciones de tratamientos una leyenda como la siguiente (art. 65):", {size:10.5});
  y+=2; body("«Todo procedimiento implica riesgos. Consulta contraindicaciones y efectos secundarios en tu valoración médica.»", {bold:true, size:10.5, color:NAVY});

  heading("5. Antes y después");
  bullet("Solo fotos reales de pacientes de la clínica, sin filtros ni edición, con la misma luz, ángulo y distancia.");
  bullet("Consentimiento por escrito del paciente para usar su imagen; si no autoriza su rostro, recortarlo.");
  bullet("Indicar número de sesiones y tiempo transcurrido, y que los resultados varían en cada paciente.");

  heading("6. Medicamentos y marcas");
  bullet("No usar nombres comerciales de medicamentos en publicaciones (por ejemplo Botox); hablar del tratamiento, no del producto.");
  bullet("No vender ni ofrecer medicamentos o productos de aplicación por redes sociales o mensajes.");

  heading("7. Influencers, testimonios y mensajes directos");
  bullet("El contenido de influencers y testimonios pagados cuenta como publicidad de la clínica: debe cumplir todo este protocolo.");
  bullet("Entregarles el texto aprobado (con el pie del punto 1) y revisar el contenido antes de que se publique.");
  bullet("Por mensaje directo o WhatsApp no se diagnostica ni se receta: se invita a una valoración médica.");

  if(fallas.length){
    heading("8. Lo que encontramos en su revisión");
    body(`En la revisión de ${pubs.length} publicación(es) y del perfil se detectó:`, {size:10.5});
    fallas.forEach(f=> bullet(`${f.d}${f.n>1 ? ` (${f.n} casos)` : ""}. Qué hacer: ${f.a}`, RED));
  }

  heading(fallas.length ? "9. Checklist antes de publicar" : "8. Checklist antes de publicar");
  ["¿Lleva el pie con nombre del médico, institución y cédula?","¿Evita promesas (garantizado, permanente, «años menos»)?","¿Evita decir que cura, previene o trata?","¿Evita nombres comerciales de medicamentos y venta por redes?","¿Incluye la leyenda de riesgos?","Si usa antes y después: ¿es real, sin edición y con consentimiento?","¿El servicio anunciado lo ofrece realmente la clínica?","¿Lo aprobó el médico o el responsable sanitario?"].forEach(t=>{
    const lines = doc.setFont("helvetica","normal").setFontSize(10.5).splitTextToSize(t, maxW-22); checkBreak(lines.length*14+4);
    doc.setDrawColor(...NAVY); doc.rect(margin, y-9, 10, 10); doc.setTextColor(...INK); lines.forEach(l=>{ doc.text(l, margin+18, y); y+=14; }); y+=3;
  });

  heading(fallas.length ? "10. Flujo de aprobación" : "9. Flujo de aprobación");
  bullet("Marketing redacta la publicación con este protocolo.");
  bullet("El médico o el responsable sanitario la revisa y aprueba.");
  bullet("Se publica y se guarda una captura con su fecha (archivo de publicidad).");

  y+=8; checkBreak(40);
  body("Guía preventiva elaborada con base en la Ley General de Salud y el Reglamento de la Ley General de Salud en Materia de Publicidad. No sustituye asesoría legal ni una resolución de la autoridad sanitaria.", {size:9, color:SOFT, lh:12});

  const fileName = `PROTOCOLO-REDES-${(clinica).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-")}.pdf`;
  const blob = doc.output("blob");
  try{
    const file = new File([blob], fileName, {type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:fileName}); return; }
  }catch(shareErr){ console.warn("Share falló, uso descarga directa:", shareErr); }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=fileName; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
}

function drawGaugeSvg(percent, color, size){
  const r = size/2 - 8, cx = size/2, cy = size/2, circ = 2*Math.PI*r;
  const pct = percent===null ? 0 : percent;
  const offset = circ * (1 - pct/100);
  const label = percent===null ? "—" : pct+"%";
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#EFF1F2" stroke-width="10"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="10"
      stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round"
      transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="${size*0.22}" font-weight="700" fill="var(--navy-900)" font-family="Georgia,serif">${label}</text>
  </svg>`;
}

/* ------------------------- Visita de seguimiento -------------------------
   Una visita de seguimiento es una evaluación más (tipo_visita='seguimiento') ligada a su
   evaluación base. Sus hallazgos son copias de lo que seguía sin verificarse (las crea la
   función SQL crear_visita_seguimiento). Crearla requiere conexión una vez; después, marcar
   resultados, notas y fotos usa la misma cola offline ya probada. */
const SEG_RESULT = {
  verificado:{label:"Corregido", icon:"✅", color:"#2E7D4F"},
  en_proceso:{label:"Parcial",   icon:"🟡", color:"#B8860B"},
  pendiente: {label:"Sigue igual", icon:"❌", color:"#B3261E"},
};
function segResultOf(h){ return h.estatus_accion==="corregido" ? "verificado" : (h.estatus_accion||"pendiente"); }

async function iniciarVisitaSeguimiento(exp, evals){
  if(!navigator.onLine){ showError("Para crear la visita de seguimiento necesitas conexión (solo esta vez). Ya creada, la puedes trabajar sin señal."); return; }
  const candidatas = (evals||[]).slice().sort((a,b)=>(b.fecha_visita||"").localeCompare(a.fecha_visita||""));
  if(!candidatas.length){ showError("Primero necesitas una evaluación de la cual dar seguimiento."); return; }
  const base = await askChoice("¿De cuál evaluación quieres dar seguimiento?", candidatas,
    e=>`${e.fecha_visita||"(sin fecha)"} · ${e.tipo_visita==="seguimiento"?"Seguimiento":"Evaluación inicial"}`);
  if(!base) return;
  const visitaId = newId();
  const { error } = await sb.rpc("crear_visita_seguimiento", {p_base_id: base.id, p_new_id: visitaId});
  if(error){ showError("No se pudo crear la visita de seguimiento: " + error.message); return; }
  const { data } = await sb.from("evaluaciones").select("*").eq("id", visitaId).single();
  go("seguimiento-visita", {currentEvaluacion: data || {id:visitaId, expediente_id:exp.id, tipo_visita:"seguimiento"}});
}

async function renderSeguimientoVisita(){
  let ev = state.currentEvaluacion;
  $app.innerHTML = `
    <div class="topbar"><div class="topbar-row">
      <button class="back-btn" id="btn-back">←</button>
      <div style="flex:1"><p class="brand">VISITA DE SEGUIMIENTO</p><h1 style="font-size:17px">Verificación de correcciones</h1></div>
    </div></div>
    <div class="content" id="seg-content"><div class="center-screen"><div class="spinner"></div></div></div>`;
  const c = document.getElementById("seg-content");
  if(!ev.tipo_visita){
    const r = await cachedRead("ev:"+ev.id+":row", ()=>sb.from("evaluaciones").select("*").eq("id", ev.id).single());
    if(r.error){ c.innerHTML = `<div class="err">${esc(r.error.message)}</div>`; return; }
    ev = r.data; state.currentEvaluacion = ev;
  }
  document.getElementById("btn-back").onclick = () => go("expediente", {currentExpediente:{id: ev.expediente_id}});

  const [hRes, expRes, baseRes] = await Promise.all([
    cachedRead("ev:"+ev.id+":hallazgos_todos", ()=>sb.from("hallazgos").select("*").eq("evaluacion_id", ev.id).order("created_at")),
    cachedRead("exp:"+ev.expediente_id+":nombre", ()=>sb.from("expedientes").select("nombre_expediente").eq("id", ev.expediente_id).single()),
    ev.evaluacion_base_id ? cachedRead("ev:"+ev.evaluacion_base_id+":row", ()=>sb.from("evaluaciones").select("*").eq("id", ev.evaluacion_base_id).single()) : Promise.resolve({data:null}),
  ]);
  if(hRes.error){ c.innerHTML = `<div class="err">${esc(hRes.error.message)}</div>`; return; }
  const items = hRes.data || [];
  const baseEv = baseRes.data || null;
  const nombreExpediente = (expRes.data && expRes.data.nombre_expediente) || "";
  const prevIds = items.map(h=>h.hallazgo_previo_id).filter(Boolean);
  const critIds = items.map(h=>h.criterio_id).filter(Boolean);
  const [prevRes, critRes] = await Promise.all([
    prevIds.length ? cachedRead("ev:"+ev.id+":prev", ()=>sb.from("hallazgos").select("id,estatus_accion").in("id", prevIds)) : Promise.resolve({data:[]}),
    critIds.length ? cachedRead("ev:"+ev.id+":modulos", ()=>sb.from("criterios_regulatorios").select("id,modulo").in("id", critIds)) : Promise.resolve({data:[]}),
  ]);
  const prevMap = {}; (prevRes.data||[]).forEach(p=>prevMap[p.id]=p.estatus_accion);
  const modMap = {};  (critRes.data||[]).forEach(cr=>modMap[cr.id]=cr.modulo);
  const fromCache = hRes.fromCache;

  const counts = () => {
    const k = {verificado:0, en_proceso:0, pendiente:0, nuevos:0, total:0};
    items.forEach(h=>{ if(h.hallazgo_previo_id){ k[segResultOf(h)]++; k.total++; } else k.nuevos++; });
    return k;
  };
  function refreshSummary(){
    const k = counts();
    const pct = k.total ? Math.round(100*k.verificado/k.total) : 0;
    document.getElementById("seg-summary").innerHTML = `
      <div class="section-title">Avance de correcciones</div>
      <div class="fc2-progress-row"><div class="fc2-progress-track"><div class="fc2-progress-fill" style="width:${pct}%"></div></div><span class="muted small">${k.verificado} de ${k.total}</span></div>
      <div class="summary-row"><span class="k">✅ Corregido</span><span class="v">${k.verificado}</span></div>
      <div class="summary-row"><span class="k">🟡 Parcial</span><span class="v">${k.en_proceso}</span></div>
      <div class="summary-row"><span class="k">❌ Sigue igual</span><span class="v">${k.pendiente}</span></div>
      ${k.nuevos ? `<div class="summary-row"><span class="k">🆕 Hallazgos nuevos</span><span class="v">${k.nuevos}</span></div>` : ""}
      ${baseEv ? `<p class="muted small" style="margin-top:8px">Se compara contra la visita del ${esc(baseEv.fecha_visita||"—")}.</p>` : ""}`;
  }
  function styleCard(h, div){
    const isNew = !h.hallazgo_previo_id, r = segResultOf(h);
    const col = isNew ? "#2F6FA8" : SEG_RESULT[r].color;
    div.style.borderLeftColor = col;
    div.classList.toggle("done", !isNew && r==="verificado");
    const badge = div.querySelector(".fc2-badge");
    badge.style.background = col; badge.textContent = isNew ? "★" : SEG_RESULT[r].icon;
    div.querySelectorAll("[data-res]").forEach(ch=>ch.classList.toggle("selected", ch.dataset.res===r));
  }
  async function saveField(h, campos){
    Object.assign(h, campos);
    await persistEntity("hallazgos", h.id, "UPDATE", campos);
    await patchCache("ev:"+ev.id+":hallazgos_todos", (list)=>(list||[]).map(x=>x.id===h.id?{...x,...campos}:x));
  }
  function buildCard(h, idx){
    const isNew = !h.hallazgo_previo_id;
    const prio = (h.prioridad||"").toUpperCase();
    const modulo = modMap[h.criterio_id] || h.categoria || "Hallazgo de visita";
    const div = document.createElement("div");
    div.className = "fc2";
    div.innerHTML = `
      <div class="fc2-top">
        <div class="fc2-badge">${idx+1}</div>
        <div class="fc2-body">
          <span class="fc2-tag ${PRIORITY_CLS[prio]||"tag-revision"}">${esc(PRIORITY_LABEL[prio]||"")} · ${esc(modulo)}${isNew?" · NUEVO":""}</span>
          <p class="fc2-title">${esc(h.descripcion)}</p>
          ${!isNew && prevMap[h.hallazgo_previo_id]==="corregido" ? `<div class="fc2-meta">El cliente reportó que ya lo corrigió — verifícalo en sitio.</div>` : ""}
          <div class="fc2-action-box" style="margin-top:8px">
            <div class="fc2-action-label">Qué se pidió</div>
            <div style="font-size:13px;font-weight:600;color:var(--navy-900)">${esc(h.accion||"—")}</div>
          </div>
          ${isNew ? "" : `<div class="chip-grid" style="margin-top:10px">
            ${["verificado","en_proceso","pendiente"].map(v=>`<div class="chip" data-res="${v}">${SEG_RESULT[v].icon} ${SEG_RESULT[v].label}</div>`).join("")}
          </div>`}
          <label style="margin-top:10px">Nota de la verificación</label>
          <textarea class="crit-note" data-nota rows="2" placeholder="Qué viste en sitio">${esc(h.nota_seguimiento||"")}</textarea>
          <div class="evid-row" data-evid></div>
        </div>
      </div>`;
    div.querySelectorAll("[data-res]").forEach(ch=>ch.onclick = async ()=>{ await saveField(h, {estatus_accion: ch.dataset.res}); styleCard(h, div); refreshSummary(); });
    div.querySelector("[data-nota]").addEventListener("change", (e)=>saveField(h, {nota_seguimiento: e.target.value || null}));
    renderEvidenceRow(div.querySelector("[data-evid]"), ev.id, "hallazgo_id", h.id);
    styleCard(h, div);
    return div;
  }
  function paint(){
    c.innerHTML = `
      ${fromCache ? `<div class="empty-note" style="margin-bottom:14px">📴 Trabajando sin conexión con la última copia guardada.</div>` : ""}
      <div class="card" id="seg-summary"></div>
      <div id="seg-list"></div>
      <button class="btn btn-ghost" id="btn-seg-add" style="margin-bottom:10px">+ Hallazgo nuevo (algo que no estaba antes)</button>
      <button class="btn btn-primary" id="btn-seg-pdf" style="margin-bottom:10px">Generar PDF de seguimiento</button>
      ${ev.estatus!=="completado" ? `<button class="btn btn-ghost" id="btn-seg-close" style="margin-bottom:20px">Cerrar visita</button>` : `<div class="empty-note" style="margin-bottom:20px">✅ Visita cerrada</div>`}`;
    refreshSummary();
    const list = document.getElementById("seg-list");
    if(!items.length) list.innerHTML = `<div class="empty-note">No había hallazgos pendientes de la evaluación base. Puedes agregar hallazgos nuevos.</div>`;
    items.forEach((h,i)=>list.appendChild(buildCard(h,i)));
    document.getElementById("btn-seg-add").onclick = async () => {
      const res = await openHallazgoLibreForm(null);
      if(!res || res.action!=="save") return;
      const hid = newId();
      const payload = {...res.campos, evaluacion_id: ev.id, origen:"libre", clasificacion_id: await getClasifSinClasificar(), created_by: state.profile.id};
      await persistEntity("hallazgos", hid, "CREATE", payload);
      items.push({...payload, id: hid});
      await patchCache("ev:"+ev.id+":hallazgos_todos", (l)=>[...(l||[]), {...payload, id: hid, created_at:new Date().toISOString()}]);
      paint();
    };
    document.getElementById("btn-seg-pdf").onclick = async (e)=>{
      const b = e.target; b.disabled = true; b.textContent = "Generando PDF…";
      try{ await generarPdfSeguimiento({ev, baseEv, items, modMap, prevMap, nombreExpediente}); }
      catch(err){ showError("No se pudo generar el PDF: " + (err&&err.message?err.message:err)); }
      b.disabled = false; b.textContent = "Generar PDF de seguimiento";
    };
    const closeBtn = document.getElementById("btn-seg-close");
    if(closeBtn) closeBtn.onclick = async ()=>{
      closeBtn.disabled = true; closeBtn.textContent = "Cerrando…";
      const r = await persistEntity("evaluaciones", ev.id, "UPDATE", {estatus:"completado"});
      ev.estatus = "completado"; state.currentEvaluacion = ev;
      if(r.queued) showError("Se cerrará en cuanto vuelva la conexión — ya quedó guardado en tu dispositivo.");
      paint();
    };
  }
  paint();
}
